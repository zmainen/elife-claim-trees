*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Top bar */
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.topbar-title{font-weight:600;font-size:14px}
.topbar-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt3)}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:3px;white-space:nowrap}
.chip-h{background:var(--haak-d);color:var(--haak)}
.chip-o{background:var(--oxa-d);color:var(--oxa)}
.chip-m{background:var(--mira-d);color:var(--mira)}
/* Format legend */
.fmtbar{background:var(--bg2);border-bottom:1px solid var(--bdr);display:grid;grid-template-columns:260px 1fr 1fr 1fr;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.fmtbar-blank{padding:7px 14px;border-right:1px solid var(--bdr)}
.fmtlabel{padding:7px 14px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--bdr)}
.fmtlabel:last-child{border-right:none}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.fl-h{color:var(--haak)}.fl-h .dot{background:var(--haak)}
.fl-o{color:var(--oxa)}.fl-o .dot{background:var(--oxa)}
.fl-m{color:var(--mira)}.fl-m .dot{background:var(--mira)}
/* Main layout */
.main{display:flex;flex:1;overflow:hidden;min-height:0}
/* Sidebar */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.search-wrap{padding:10px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.search{width:100%;background:var(--bg2);border:1px solid var(--bdr);border-radius:4px;padding:6px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--txt);outline:none}
.search:focus{border-color:var(--haak)}
.claim-list{overflow-y:auto;flex:1;padding:8px 0}
.role-group{}
.role-header{padding:8px 14px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);position:sticky;top:0;background:var(--bg);z-index:1}
.claim-item{padding:7px 14px;cursor:pointer;border-left:2px solid transparent;transition:background .1s,border-color .1s;border-bottom:1px solid transparent}
.claim-item:hover{background:var(--bg2)}
.claim-item.active{background:var(--haak-d);border-left-color:var(--haak)}
.claim-item-slug{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt3);margin-bottom:2px}
.claim-item-text{font-size:12px;color:var(--txt2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.claim-item.active .claim-item-slug,.claim-item.active .claim-item-text{color:var(--txt)}
/* Role badge */
.rbadge{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border-radius:2px;margin-right:4px}
.rb-hypothesis{background:var(--haak-d);color:var(--haak)}
.rb-prediction{background:#E8E0F8;color:#5840A0}
.rb-empirical{background:var(--oxa-d);color:var(--oxa)}
.rb-control{background:#E8F4D8;color:#3A7028}
.rb-interpretation{background:var(--mira-d);color:var(--mira)}
.rb-scope{background:var(--rbadge-u);color:var(--rbadge-uc)}
.rb-literature-context{background:var(--rbadge-u);color:var(--rbadge-uc)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .rb-prediction{background:#201840;color:#A090E0}}
:root[data-theme=dark] .rb-prediction{background:#201840;color:#A090E0}
/* Panel area */
.panels-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.claim-header{padding:12px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:var(--surf)}
.claim-header-slug{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt3);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.claim-header-text{font-size:13px;color:var(--txt);line-height:1.5;max-width:90ch}
.repro-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:3px}
.rb-v{background:var(--rbadge-v);color:var(--rbadge-vc)}
.rb-vp{background:var(--rbadge-p);color:var(--rbadge-pc)}
.rb-u{background:var(--rbadge-u);color:var(--rbadge-uc)}
/* Three columns */
.panels{display:grid;grid-template-columns:1fr 1fr 1fr;flex:1;overflow:hidden;min-height:0}
.panel{border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.panel:last-child{border-right:none}
.panel-body{overflow-y:auto;padding:14px;flex:1}
pre.code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.6;background:var(--code);border-radius:5px;padding:12px 14px;overflow-x:auto;white-space:pre;margin-bottom:10px}
.ck{color:var(--ck)}.cs{color:var(--cs)}.cv{color:var(--cv)}.cm{color:var(--cm)}.cx{color:var(--txt2)}
/* Annotations */
.anns{font-size:11.5px;color:var(--txt2)}
.ann{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr)}
.ann:last-child{border-bottom:none}
.ann-k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--txt3);min-width:80px;flex-shrink:0;padding-top:1px}
.ann-v{line-height:1.45}
.gap-tag{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;background:var(--gap-bg);color:var(--gap-c);padding:1px 5px;border-radius:2px;margin-left:4px;letter-spacing:.04em}
/* Empty state */
.empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--txt3);font-size:14px;flex-direction:column;gap:8px}
.empty-icon{font-size:32px;opacity:.5}
/* Gap summary */
.gap-bar{background:var(--gap-bg);border-top:1px solid var(--bdr);padding:8px 14px;font-size:11px;color:var(--gap-c);flex-shrink:0;display:none}
.gap-bar.show{display:block}
</style>

<script>
const CLAIMS = [
  {slug:"hypothesis-insula-tracks-interpersonal-guilt",uuid:"7a27dc0a-904f-485f-99ae-2b1ac54ca7c2",role:"hypothesis",epistemic:"hypothesis",panel:"hypothesis",method:"hypothesis stated in introduction and abstract",confidence:"N/A",doi:"10.7554/eLife.105391",dataset:null,
   claim:"Anterior insula is the neural substrate of interpersonal guilt: when a participant bears responsibility for a choice that yields a negative outcome for another person, anterior insula activity tracks the resulting responsibility-contingent affect. The region is recruited specifically by the conjunction of self-agency over the choice and harm to the partner, distinguishing guilt from generic empathy for partner loss and from regret about one's own loss.",
   short:"The anterior insula encodes responsibility-contingent interpersonal guilt.",
   edges:{entails:["prediction-behavioral-guilt-effect","prediction-insula-tracks-guilt"]},
   repro:[]},

   claim:"Momentary happiness in social decision contexts is governed by a computational rule in which partner reward prediction errors that arise from the participant's own choices (social_pRPEs) carry an independent, non-zero weight, distinct from the weight on partner RPEs that arise without participant agency.",
   short:"Happiness weights partner reward prediction errors by the subject's responsibility.",
   edges:{entails:["prediction-responsibility-model-wins-comparison","prediction-behavioral-guilt-effect"]},
   repro:[]},

  {slug:"hypothesis-sts-mentalizes-partner-state-under-responsibility",uuid:"01faee80-e511-4f08-9a93-225e869637ee",role:"hypothesis",epistemic:"hypothesis",panel:"hypothesis",method:"hypothesis stated in introduction and discussion",confidence:"N/A",doi:"10.7554/eLife.105391",dataset:null,
   claim:"Superior temporal sulcus (STS) represents the partner's affective experience specifically when the participant is responsible for the partner's outcome. The mentalizing computation is conditioned on agency: STS engages selectively when the participant's own choice produced the partner's outcome.",
   short:"STS tracks the partner's RPEs only when the subject is responsible for the outcome.",
   edges:{entails:["prediction-sts-tracks-partner-rpe-under-responsibility"]},
   repro:[]},

  {slug:"prediction-behavioral-guilt-effect",uuid:"68f77387-69ad-4b26-b766-7ed6a6c1658c",role:"prediction",epistemic:"prediction",panel:"prediction",method:"derived prediction",confidence:"strong",doi:"10.7554/eLife.105391",dataset:null,
   claim:"If interpersonal guilt is a real affective phenomenon contingent on responsibility, then happiness should drop more after negative partner outcomes in Social trials than in Partner trials — a positive interaction between partnerWon and subjDecided in a mixed-effects regression of happiness on outcomes and responsibility.",

  {slug:"prediction-insula-tracks-guilt",uuid:"a3c124db-5983-4f4a-81da-77aa7d917e7c",role:"prediction",epistemic:"prediction",panel:"prediction",method:"derived prediction",confidence:"strong",doi:"10.7554/eLife.105391",dataset:null,

   short:"Anterior insula BOLD elevated Social > Partner after negative partner outcomes.",
   edges:{"derived-from":["hypothesis-insula-tracks-interpersonal-guilt"]},

  {slug:"prediction-responsibility-model-wins-comparison",uuid:"6eb8393f-a95e-4360-91d9-442d08200190",role:"prediction",epistemic:"prediction",panel:"prediction",method:"derived prediction",confidence:"strong",doi:"10.7554/eLife.105391",dataset:null,

   edges:{"derived-from":["hypothesis-responsibility-weights-partner-rpes"]},

  {slug:"prediction-sts-tracks-partner-rpe-under-responsibility",uuid:"52a693d9-fa42-4b84-8e27-7c77ef16022f",role:"prediction",epistemic:"prediction",panel:"prediction",method:"derived prediction",confidence:"moderate",doi:"10.7554/eLife.105391",dataset:null,

  {slug:"responsibility-modulates-guilt-computational",uuid:"69cad10c-46f3-4f7e-8cec-3c9de1c629de",role:"empirical",epistemic:"moderate",panel:"fig3, table1",method:"computational model fitting (responsibility parameter)",confidence:"moderate",doi:"10.7554/eLife.105391",dataset:"openneuro:ds005588",
   claim:"A computational model incorporating responsibility-modulated happiness better accounts for the behavioral guilt effect than models without responsibility weighting, providing formal parameterization of the social decision-making component.",
   short:"Responsibility computational model outperforms all nested alternatives.",
   edges:{tests:["prediction-responsibility-model-wins-comparison"],confirms:["hypothesis-responsibility-weights-partner-rpes"],interprets:["social-prpe-weight-positive"],"enables-method":["sts-tracks-partner-reward-prediction-errors","ventral-striatum-tracks-computational-reward"]},

  {slug:"agency-reduces-happiness",uuid:"8edb5949-b433-496e-8d9f-1f10df952ddc",role:"empirical",epistemic:"strong",panel:"fig3 (text, no dedicated panel)",method:"linear mixed model on z-scored happiness ratings",confidence:"strong",doi:"10.7554/eLife.105391",dataset:"openneuro:ds005588",

  {slug:"solo-vs-social-choice-difference",uuid:"5198582f-237b-447c-810e-c9a4559f9cb6",role:"empirical",epistemic:"moderate",panel:"fig2a (Study 1 only; null in fig2d Study 2)",method:"mixed-effects regression",confidence:"moderate",doi:"10.7554/eLife.105391",dataset:"openneuro:ds005588",

// MIRA type mapping
const MIRA_TYPE = {hypothesis:"mira:Claim",prediction:"mira:Claim",empirical:"mira:Evidence",control:"mira:Evidence",interpretation:"mira:Claim","literature-context":"dg:SourceDocument",scope:"mira:Claim"};

const MIRA_EDGE = {

  // gaps:

};

let activeClaim = null;

function reproStatus(repro){
  if(!repro||!repro.length) return {badge:"rb-u",label:"—"};
  const s = repro[0].status;
  if(s==="verified") return {badge:"rb-v",label:"✓ Verified"};
  if(s==="verified:partial") return {badge:"rb-vp",label:"~ Partial"};
  return {badge:"rb-u",label:"Unverified"};
}

function esc(s){return s?s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):"";}

function buildHaaK(c){
  const lines = [];
  lines.push(`<span class="cx">---</span>`);
  lines.push(`<span class="ck">uuid</span><span class="cx">:</span> <span class="cv">${esc(c.uuid)}</span>`);
  lines.push(`<span class="ck">slug</span><span class="cx">:</span> <span class="cs">${esc(c.slug)}</span>`);
  lines.push(`<span class="ck">doi</span><span class="cx">:</span> <span class="cv">~</span>`);
  lines.push(`<span class="ck">claim-type</span><span class="cx">:</span> <span class="cv">${esc(c.role==="control"?"empirical":c.role)}</span>`);
  lines.push(`<span class="ck">role</span><span class="cx">:</span>       <span class="cv">${esc(c.role)}</span>`);
  lines.push(`<span class="ck">epistemic</span><span class="cx">:</span>  <span class="cv">${esc(c.epistemic)}</span>`);
  lines.push(``);
  lines.push(`<span class="ck">claim</span><span class="cx">: ></span>`);
  // wrap claim text
  const words = c.claim.split(' ');
  let line='  '; const maxw=60;
  for(const w of words){
    if(line.length+w.length>maxw){lines.push(`<span class="cs">${esc(line.trimEnd())}</span>`);line='  '+w+' ';}
    else{line+=w+' ';}
  }
  if(line.trim()) lines.push(`<span class="cs">${esc(line.trimEnd())}</span>`);
  lines.push(``);
  // edges
  for(const [et,targets] of Object.entries(c.edges||{})){
    if(!targets||!targets.length) continue;
    lines.push(`<span class="ck">${esc(et)}</span><span class="cx">:</span>`);
    for(const t of targets) lines.push(`<span class="cx">  -</span> <span class="cs">${esc(t)}</span>`);
  }
  lines.push(``);
  lines.push(`<span class="ck">assertions</span><span class="cx">:</span>`);
  lines.push(`<span class="cx">  -</span> <span class="ck">paper-slug</span><span class="cx">:</span> <span class="cs">gadeke-2026-guilt-insula</span>`);
  lines.push(`    <span class="ck">doi</span><span class="cx">:</span>        <span class="cv">${esc(c.doi||"~")}</span>`);
  if(c.panel) lines.push(`    <span class="ck">panel</span><span class="cx">:</span>      <span class="cs">${esc(c.panel)}</span>`);
  lines.push(`    <span class="ck">method</span><span class="cx">:</span>     <span class="cs">${esc(c.method)}</span>`);
  lines.push(`    <span class="ck">confidence</span><span class="cx">:</span> <span class="cv">${esc(c.confidence)}</span>`);
  if(c.dataset) lines.push(`    <span class="ck">dataset</span><span class="cx">:</span>    <span class="cs">${esc(c.dataset)}</span>`);
  lines.push(``);
  if(c.repro&&c.repro.length){
    lines.push(`<span class="ck">reproductions</span><span class="cx">:</span>`);
    for(const r of c.repro){
      lines.push(`<span class="cx">  -</span> <span class="ck">agent</span><span class="cx">:</span>  <span class="cs">mainen-z</span>`);
      lines.push(`    <span class="ck">date</span><span class="cx">:</span>   <span class="cv">2026-03-30</span>`);
      lines.push(`    <span class="ck">status</span><span class="cx">:</span> <span class="cv">${esc(r.status)}</span>`);
      if(r.notes) lines.push(`    <span class="ck">notes</span><span class="cx">: ></span>\n      <span class="cs">${esc(r.notes.substring(0,100))}…</span>`);
    }
  } else {
    lines.push(`<span class="ck">reproductions</span><span class="cx">:</span> <span class="cx">[]</span>`);
  }
  lines.push(`<span class="cx">---</span>`);
  return lines.join('\n');
}

function buildOXA(c){

    for(const t of targets){
      relations.push(`    <span class="cx">{</span>\n      <span class="ck">"xref"</span><span class="cx">:</span> <span class="cs">"${esc(t)}"</span><span class="cx">,</span>\n      <span class="ck">"relationType"</span><span class="cx">:</span> <span class="cs">"claimrel:${esc(et)}"</span>\n    <span class="cx">}</span>`);
    }
  }
  const lines = [];
  lines.push(`<span class="cx">{</span>`);
  lines.push(`  <span class="ck">"type"</span><span class="cx">:</span> <span class="cs">"Claim"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"identifier"</span><span class="cx">:</span> <span class="cs">"${esc(c.slug)}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"uuid"</span><span class="cx">:</span> <span class="cs">"${esc(c.uuid)}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"role"</span><span class="cx">:</span> <span class="cs">"${esc(c.role)}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"epistemicStrength"</span><span class="cx">:</span> <span class="cs">"${esc(c.epistemic)}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"children"</span><span class="cx">: [{</span>`);
  lines.push(`    <span class="ck">"type"</span><span class="cx">:</span> <span class="cs">"Text"</span><span class="cx">,</span>`);
  const ct = c.claim.length>120 ? c.claim.substring(0,120)+"…" : c.claim;
  lines.push(`    <span class="ck">"value"</span><span class="cx">:</span> <span class="cs">"${esc(ct)}"</span>`);
  lines.push(`  <span class="cx">}],</span>`);
  if(relations.length){
    lines.push(`  <span class="ck">"relations"</span><span class="cx">: [</span>`);
    lines.push(relations.join(',\n'));
    lines.push(`  <span class="cx">],</span>`);
  } else {
    lines.push(`  <span class="ck">"relations"</span><span class="cx">: [],</span>`);
  }
  lines.push(`  <span class="ck">"assertions"</span><span class="cx">: [{</span>`);
  lines.push(`    <span class="ck">"doi"</span><span class="cx">:</span> <span class="cs">"${esc(c.doi||"")}"</span><span class="cx">,</span>`);
  if(c.panel) lines.push(`    <span class="ck">"panel"</span><span class="cx">:</span> <span class="cs">"${esc(c.panel)}"</span><span class="cx">,</span>`);
  lines.push(`    <span class="ck">"method"</span><span class="cx">:</span> <span class="cs">"${esc(c.method)}"</span><span class="cx">,</span>`);
  lines.push(`    <span class="ck">"confidence"</span><span class="cx">:</span> <span class="cs">"${esc(c.confidence)}"</span>`);
  if(c.dataset) lines.push(`    <span class="cx">,</span><span class="ck">"dataset"</span><span class="cx">:</span> <span class="cs">"${esc(c.dataset)}"</span>`);
  lines.push(`  <span class="cx">}]</span>`);
  if(c.repro&&c.repro.length){
    lines.push(`<span class="cx">,</span>`);
    lines.push(`  <span class="ck">"reproductions"</span><span class="cx">: [{</span>`);
    lines.push(`    <span class="ck">"agent"</span><span class="cx">:</span> <span class="cs">"mainen-z"</span><span class="cx">,</span>`);
    lines.push(`    <span class="ck">"date"</span><span class="cx">:</span> <span class="cs">"2026-03-30"</span><span class="cx">,</span>`);
    lines.push(`    <span class="ck">"status"</span><span class="cx">:</span> <span class="cs">"${esc(c.repro[0].status)}"</span>`);
    lines.push(`  <span class="cx">}]</span>`);
  }
  lines.push(`<span class="cx">}</span>`);
  return lines.join('\n');
}

function buildMIRA(c){
  const mtype = MIRA_TYPE[c.role]||"mira:Claim";
  const mepis = (c.epistemic==="strong"||c.epistemic==="moderate"||c.epistemic==="weak") ? MIRA_EPISTEMIC[c.epistemic] : (MIRA_EPISTEMIC[c.role]||"mira:Claim");
  const lines = [];
  const gaps = [];
  const supports = [], opposes = [];
  for(const [et,targets] of Object.entries(c.edges||{})){
    if(!targets||!targets.length) continue;
    const mEdge = MIRA_EDGE[et];
    if(mEdge==="mira:supports") supports.push(...targets);
    else if(mEdge==="mira:opposes") opposes.push(...targets);
    else if(mEdge===null) gaps.push(et);
  }

  lines.push(`<span class="cx">{</span>`);
  lines.push(`  <span class="ck">"@context"</span><span class="cx">:</span>`);
  lines.push(`    <span class="cs">"https://mira.science/schema/context.jsonld"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"@type"</span><span class="cx">:</span> <span class="cs">"${mtype}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"@id"</span><span class="cx">:</span> <span class="cs">"urn:uuid:${esc(c.uuid)}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"schema:name"</span><span class="cx">:</span> <span class="cs">"${esc(c.slug)}"</span><span class="cx">,</span>`);
  const ct2 = c.claim.length>100 ? c.claim.substring(0,100)+"…":c.claim;
  lines.push(`  <span class="ck">"schema:description"</span><span class="cx">:</span>`);
  lines.push(`    <span class="cs">"${esc(ct2)}"</span><span class="cx">,</span>`);
  lines.push(`  <span class="ck">"mira:epistemicStatus"</span><span class="cx">:</span> <span class="cs">"${mepis}"</span>`);
  if(c.role==="hypothesis"||c.role==="prediction"){
    lines.push(`<span class="cx">,</span>`);
    lines.push(`  <span class="ck">"mira:addresses"</span><span class="cx">: {</span>`);
    lines.push(`    <span class="ck">"@type"</span><span class="cx">:</span> <span class="cs">"mira:Question"</span><span class="cx">,</span>`);
    lines.push(`    <span class="ck">"schema:description"</span><span class="cx">:</span>`);
    lines.push(`      <span class="cm">/* synthesized from claim text */</span>`);
    lines.push(`  <span class="cx">}</span>`);
  }
  if(supports.length){
    lines.push(`<span class="cx">,</span>`);
    if(supports.length===1){
      lines.push(`  <span class="ck">"mira:supports"</span><span class="cx">: {</span>`);
      lines.push(`    <span class="ck">"schema:name"</span><span class="cx">:</span> <span class="cs">"${esc(supports[0])}"</span>`);
      lines.push(`  <span class="cx">}</span>`);
    } else {
      lines.push(`  <span class="ck">"mira:supports"</span><span class="cx">: [</span>`);
      for(const s of supports) lines.push(`    <span class="cx">{</span><span class="ck">"schema:name"</span><span class="cx">:</span> <span class="cs">"${esc(s)}"</span><span class="cx">},</span>`);
      lines.push(`  <span class="cx">]</span>`);
    }
  }
  if(opposes.length){
    lines.push(`<span class="cx">,</span>`);
    lines.push(`  <span class="ck">"mira:opposes"</span><span class="cx">: {</span>`);
    lines.push(`    <span class="ck">"schema:name"</span><span class="cx">:</span> <span class="cs">"${esc(opposes[0])}"</span>`);
    lines.push(`  <span class="cx">}</span>`);
  }
  if(c.doi){
    lines.push(`<span class="cx">,</span>`);
    lines.push(`  <span class="ck">"dg:sourceDocument"</span><span class="cx">: {</span>`);
    lines.push(`    <span class="ck">"schema:identifier"</span><span class="cx">:</span> <span class="cs">"${esc(c.doi)}"</span>`);
    lines.push(`  <span class="cx">}</span>`);
  }
  if(c.dataset){
    lines.push(`<span class="cx">,</span>`);
    lines.push(`  <span class="ck">"mira:observationBase"</span><span class="cx">: {</span>`);
    lines.push(`    <span class="ck">"@type"</span><span class="cx">:</span> <span class="cs">"mira:Study"</span><span class="cx">,</span>`);
    lines.push(`    <span class="ck">"schema:identifier"</span><span class="cx">:</span> <span class="cs">"${esc(c.dataset)}"</span><span class="cx">,</span>`);
    lines.push(`    <span class="ck">"mira:follows"</span><span class="cx">: {</span>`);
    lines.push(`      <span class="ck">"@type"</span><span class="cx">:</span> <span class="cs">"mira:Protocol"</span><span class="cx">,</span>`);
    lines.push(`      <span class="ck">"schema:name"</span><span class="cx">:</span> <span class="cs">"${esc(c.method)}"</span>`);
    lines.push(`    <span class="cx">}</span>`);
    lines.push(`  <span class="cx">}</span>`);
  }
  if(gaps.length){
    lines.push(`<span class="cm">  // ⚠ gaps — no MIRA equivalent:</span>`);
    for(const g of gaps) lines.push(`<span class="cm">  //   ${esc(g)} → not representable in MIRA</span>`);
    if(c.repro&&c.repro.length) lines.push(`<span class="cm">  // ⚠ reproductions → dropped (no MIRA concept)</span>`);
  } else if(c.repro&&c.repro.length){
    lines.push(`<span class="cm">  // ⚠ reproductions → dropped (no MIRA concept)</span>`);
  }
  lines.push(`<span class="cx">}</span>`);
  return {code:lines.join('\n'), gaps};
}

function getHaaKAnnotations(c){
  const anns = [];
  const edgeTypes = Object.keys(c.edges||{});
  if(edgeTypes.length) anns.push({k:"edge types",v:`${edgeTypes.join(', ')} — CiTO-aligned; all ${edgeTypes.length} preserved in HaaK`});
  anns.push({k:"assertions",v:"One block per paper; preserves panel, analysis, dataset, confidence"});
  if(c.repro&&c.repro.length) anns.push({k:"reproductions",v:`${c.repro[0].status} — agent + date + notes; unique to HaaK`});
  else anns.push({k:"reproductions",v:"Empty (hypotheses/predictions are not directly reproducible)"});
  return anns;
}

function getOXAAnnotations(c){
  const anns = [];
  anns.push({k:"type: Claim",v:"OXA ClaimGraph RFC — drafted from HaaK's work; not yet in upstream OXA 0.2.x"});
  const edgeTypes = Object.keys(c.edges||{});
  if(edgeTypes.length) anns.push({k:"relations",v:`${edgeTypes.length} edge type(s) preserved as claimrel:* — lossless mapping`});
  anns.push({k:"children",v:"OXA convention: prose content is a typed child Text node, not a top-level string"});
  if(c.repro&&c.repro.length) anns.push({k:"reproductions",v:"Carried as first-class nodes — HaaK RFC extension to OXA, not standard OXA"});
  return anns;
}

function getMIRAAnnotations(c, gaps){
  const anns = [];
  const mtype = MIRA_TYPE[c.role]||"mira:Claim";
  anns.push({k:"@type",v:`${c.role} → ${mtype}${c.role==="hypothesis"?" (epistemic=Hypothesis)":c.role==="empirical"?" (epistemic=Claim)":""}`});
  if(c.role==="hypothesis"||c.role==="prediction") anns.push({k:"mira:addresses",v:"MIRA requires explicit mira:Question node — must be synthesized from hypothesis text; not present in HaaK",gap:true});
  if(gaps.length) anns.push({k:`${gaps.join(', ')}`,v:`No MIRA predicate for these edge types — the hypothesis→prediction→empirical argument chain is invisible in MIRA`,gap:true});
  const supports = [], opposes = [];
  for(const [et,targets] of Object.entries(c.edges||{})){
    if(!targets||!targets.length) continue;
    if(MIRA_EDGE[et]==="mira:supports") supports.push(et);
    if(MIRA_EDGE[et]==="mira:opposes") opposes.push(et);
  }
  if(supports.length>1) anns.push({k:"mira:supports",v:`${supports.join(' + ')} all collapse to mira:supports — semantic distinction lost`,gap:true});
  if(c.repro&&c.repro.length) anns.push({k:"reproductions",v:"No MIRA equivalent — reproduction records are dropped entirely",gap:true});
  return anns;
}

function renderSidebar(){
  const list = document.getElementById('claimList');
  const grouped = {};
  for(const c of CLAIMS){
    if(!grouped[c.role]) grouped[c.role]=[];
    grouped[c.role].push(c);
  }
  let html='';
  for(const role of ROLE_ORDER){
    if(!grouped[role]) continue;
    html+=`<div class="role-group" data-role="${role}">`;
    html+=`<div class="role-header">${ROLE_LABELS[role]||role} <span style="color:var(--txt3)">(${grouped[role].length})</span></div>`;
    for(const c of grouped[role]){
      html+=`<div class="claim-item" id="item-${c.slug}" onclick="selectClaim('${c.slug}')" data-search="${c.slug} ${c.short} ${c.claim}">`;
      html+=`<div class="claim-item-slug">${c.slug.substring(0,30)}${c.slug.length>30?"…":""}</div>`;
      html+=`<div class="claim-item-text">${esc(c.short)}</div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  list.innerHTML=html;
}

function selectClaim(slug){
  const c = CLAIMS.find(x=>x.slug===slug);
  if(!c) return;
  // update active
  document.querySelectorAll('.claim-item').forEach(el=>el.classList.remove('active'));
  const item = document.getElementById('item-'+slug);
  if(item){item.classList.add('active');item.scrollIntoView({block:'nearest'});}
  activeClaim = slug;
  // render header
  const rs = reproStatus(c.repro);
  const edgeCount = Object.values(c.edges||{}).flat().length;
  document.getElementById('claimHeader').innerHTML=`
    <div class="claim-header-slug">
      <span class="rbadge rb-${c.role}">${c.role}</span>
      ${c.slug}
      ${c.repro&&c.repro.length?`<span class="repro-badge ${rs.badge}">${rs.label}</span>`:''}
      ${c.panel&&c.panel!=="hypothesis"&&c.panel!=="prediction"&&c.panel!=="scope"?`<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--txt3)">${esc(c.panel)}</span>`:''}
    </div>
    <div class="claim-header-text">${esc(c.short)}</div>`;
  // render panels
  const haakCode = buildHaaK(c);
  const oxaCode = buildOXA(c);
  const {code:miraCode, gaps} = buildMIRA(c);
  const haakAnns = getHaaKAnnotations(c);
  const oxaAnns = getOXAAnnotations(c);
  const miraAnns = getMIRAAnnotations(c, gaps);
  function annHtml(anns){
    return `<div class="anns">${anns.map(a=>`<div class="ann"><span class="ann-k">${esc(a.k)}</span><span class="ann-v">${esc(a.v)}${a.gap?`<span class="gap-tag">gap</span>`:''}</span></div>`).join('')}</div>`;
  }
  document.getElementById('panelsGrid').innerHTML=`
    <div class="panel"><div class="panel-body">
      <pre class="code">${haakCode}</pre>${annHtml(haakAnns)}</div></div>
    <div class="panel"><div class="panel-body">
      <pre class="code">${oxaCode}</pre>${annHtml(oxaAnns)}</div></div>
    <div class="panel"><div class="panel-body">
      <pre class="code">${miraCode}</pre>${annHtml(miraAnns)}</div></div>`;
}

function filterClaims(q){
  const lq = q.toLowerCase().trim();
  document.querySelectorAll('.claim-item').forEach(el=>{
    const text = (el.dataset.search||'').toLowerCase();
    el.style.display = (!lq||text.includes(lq)) ? '' : 'none';
  });
  document.querySelectorAll('.role-group').forEach(g=>{
    const visible = [...g.querySelectorAll('.claim-item')].some(el=>el.style.display!=='none');
    g.style.display = visible ? '' : 'none';
  });
}

renderSidebar();
// auto-select first claim
if(CLAIMS.length) selectClaim(CLAIMS[0].slug);
</script>
