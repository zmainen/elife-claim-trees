<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Input -->
  <rect x="370" y="8" width="160" height="40" rx="20" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="450" y="33" text-anchor="middle" font-size="13" font-weight="500" fill="#374151">eLife DOI</text>

  <!-- Arrow: input → prepare -->
  <line x1="450" y1="48" x2="450" y2="72" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Prepare -->
  <rect x="340" y="74" width="220" height="42" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Step 1 — Prepare</text>
  <text x="450" y="109" text-anchor="middle" font-size="10" fill="#6b7280">PDF fetch, section slicing</text>

  <!-- Arrow: prepare → fan out -->
  <line x1="450" y1="116" x2="450" y2="140" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Fan-out lines -->
  <line x1="450" y1="140" x2="150" y2="140" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="450" y1="140" x2="750" y2="140" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="150" y1="140" x2="150" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="140" x2="450" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="140" x2="750" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Three agents -->
  <rect x="50" y="162" width="200" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Results-reader</text>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="#b45309">abstract + results prose</text>
  <text x="150" y="213" text-anchor="middle" font-size="9" fill="#9ca3af">Sonnet</text>

  <rect x="350" y="162" width="200" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Caption-reader</text>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#b45309">figure captions, panel by panel</text>
  <text x="450" y="213" text-anchor="middle" font-size="9" fill="#9ca3af">Sonnet</text>

  <rect x="650" y="162" width="200" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Structure-reader</text>
  <text x="750" y="200" text-anchor="middle" font-size="10" fill="#b45309">methods + supplements</text>
  <text x="750" y="213" text-anchor="middle" font-size="9" fill="#9ca3af">Sonnet</text>

  <!-- Fan-in lines -->
  <line x1="150" y1="222" x2="150" y2="248" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="450" y1="222" x2="450" y2="248" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="750" y1="222" x2="750" y2="248" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="150" y1="248" x2="750" y2="248" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="450" y1="248" x2="450" y2="268" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reconciler -->
  <rect x="310" y="270" width="280" height="48" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="293" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Step 4 — Reconciliation</text>
  <text x="450" y="308" text-anchor="middle" font-size="10" fill="#6b7280">semantic matching across three lists — Opus</text>

  <!-- Arrow: reconciler → reviewer -->
  <line x1="450" y1="318" x2="450" y2="346" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- External Reviewer (highlighted) -->
  <rect x="290" y="348" width="320" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="371" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Step 4.5 — External Reviewer</text>
  <text x="450" y="387" text-anchor="middle" font-size="10" fill="#b45309">recovers implicit hypotheses, predictions, controls — Opus</text>

  <!-- Arrow: reviewer → write -->
  <line x1="450" y1="403" x2="450" y2="431" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Write -->
  <rect x="340" y="433" width="220" height="42" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="454" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Steps 5-7 — Review + Write</text>
  <text x="450" y="468" text-anchor="middle" font-size="10" fill="#6b7280">human or auto gate, then write .md files</text>

  <!-- Arrow: write → output -->
  <line x1="450" y1="475" x2="450" y2="495" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="350" y="497" width="200" height="18" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="450" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">50-90 structured claim files</text>
</svg>
