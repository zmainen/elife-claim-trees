93, 95%CI [0.075-0.110]), confirming participants were sensitive to expected value in their choices.", "panel": "fig2a, fig2d", "panels": [["2", "A"], ["2", "D"]], "method": "mixed-effects regression", "dataset": "https://openneuro.org/datasets/ds005588", "analysis": "master_behavAnalysis.m", "check": {"paper": "β>0, p<0.05", "reproduced": "β=0.032, p=9.55e-68, n=2400", "date": null, "how": "the authors' deposited data"}, "out": [{"rel": "validates", "label": "Validates", "to": "responsibility-modulates-guilt-computational"}, {"rel": "validates", "label": "Validates", "to": "hypothesis-insula-tracks-interpersonal-guilt"}, {"rel": "rules-out", "label": "Rules out", "to": "alt-participants-insensitive-to-value"}], "in": [{"rel": "scopes", "label": "Qualified by", "from": "scope-two-study-design"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/lottery-choice-increases-with-ev/"}, {"slug": "partner-algorithm-deception-assumption", "uuid": "cb673152-8776-46c8-8f13-c95262c2138b", "number": "Sc1", "kind": "Caveat", "role": "scope", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "The partner was a computer program, not a real person, and participants were not told.", "short": "The \"partner\" was an EV-maximizing algorithm, not a real person. All social-comparison claims inherit this structural validity assumption.", "full": "The experiment partner's decisions were in fact made by an expected-value-maximizing algorithm (lottery chosen if EV_diff > 0), not by a real person, but participants were not informed of this; this deception is a structural assumption underlying all social comparison contrasts and the claim that participants felt interpersonal guilt toward a real partner.", "panel": "", "panels": [], "method": "code inspection (Decision task section, Methods)", "dataset": null, "analysis": null, "check": {"paper": null, "reproduced": null, "date": null, "how": "reading the Methods section"}, "out": [{"rel": "req eir partner (Social condition) than for themselves alone (Solo condition), replicating the association of these regions with social decision-making.", "full": "Three clusters — precuneus (d=0.79), left temporoparietal junction (TPJ; d=0.59), and medial prefrontal cortex (mPFC; d=0.54) — show greater BOLD response when participants decide for themselves and their partner (Social condition) than for themselves alone (Solo condition), replicating the association of these regions with social decision-making.", "panel": "fig4b", "panels": [["4", "B"]], "method": "fMRI mass-univariate GLM (SPM12), whole-brain cluster-corrected (p<0.05 FWE)", "dataset": "https://openneuro.org/datasets/ds005588", "analysis": "master_fMRI_showResults.m", "check": {"paper": "3 clusters: precuneus, left TPJ, mPFC", "reproduced": "758vox [0, -62, 38] T=5.72 · 216vox [-34, -58, 26] T=4.5 · 135vox [4, 52, 22] T=3.97", "date": "2026-09-11", "how": "the authors' deposited group statistical map"}, "out": [{"rel": "validates", "label": "Validates", "to": "insula-tracks-guilt-effect"}], "in": [{"rel": "scopes", "label": "Qualified by", "from": "partner-algorithm-deception-assumption"}, {"rel": "scopes", "label": "Qualified by", "from": "scope-two-study-design"}, {"rel": "validates", "label": "Validated by", "from": "ventral-striatum-tracks-risky-choices"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/precuneus-tpj-mpfc-social-decisions/"}, {"slug": "prediction-behavioral-guilt-effect", "uuid": "68f77387-69ad-4b26-b766-7ed6a6c1658c", "number": "H1.P1", "kind": "Prediction", "role": "prediction", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "Happiness should drop more after a partner's loss when the participant made the choice.", "short": "The guilt hypotheses predict a behavioral interaction: happiness should drop more after negative partner outcomes when the participant — rather than the partner — made the choice.", "full": "If interpersonal guilt is a real affective phenomenon contingent on responsibility, then in a within-subject lottery paradigm where the same partner outcomes occur under Social and Partner conditions, momentary happiness should drop more after negative partner outcomes in Social trials (participant chose) than in Partner trials (partner chose). This is operationalised as a positive interaction term between partnerWon (low partner outcome) and subjDecided (Social condition) in a mixed-effects regression of happiness on outcomes and responsibility.", "panel": "prediction", "panels": [], "method": "derived prediction", "dataset": null, "analysis": null, "check": null, "out": [{"rel": "derived-from", "label": "Follows from", "to": "hypothesis-insula-tracks-interpersonal-guilt"}, {"rel": "derived-from", "label": "Follows from", "to": "hypothesis-responsibility-weights-partner-rpes"}], "in": [{"rel": "tests", "label": "Tested by", "from": "guilt-reduces-happiness-after-partner-loss"}, {"rel": "entails", "label": "Predicted from", "from": "hypothesis-insula-tracks-interpersonal-guilt"}, {"rel": "entails", "label": "Predicted from", "from": "hypothesis-responsibility-weights-partner-rpes"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/prediction-behavioral-guilt-effect/"}, {"slug": "prediction-insula-tracks-guilt", "uuid": "a3c124db-5983-4f4a-81da-77aa7d917e7c", "number": "H1.P2", "kind": "Prediction", "role": "prediction", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "The anterior insula should be more active after a partner's loss when the participant chose.", "short": "The insula-as-guilt-substrate hypothesis predicts elevated anterior insula BOLD in Social vs Partner trials specifically after negative partner outcomes — the (condition × outcome) interaction in an a priori insula ROI.", "full": "If anterior insula encodes interpersonal guilt, then in the trial-level GLM, anterior insula BOLD should be elevated in the Social vs Partner contrast specifically after negative partner outcomes — i.e., the (condition × partner-outcome) interaction should yield a significant positive cluster in the anterior insula, detectable with small-volume FWE correction (SVC) over an a priori anterior-insula ROI derived from prior literature. The signal should not be present for the same contrast after positive partner outcomes (specificity).", "panel": "prediction", "panels": [], "method": "derived prediction", "dataset": null, "analysis": null, "check": null, "out": [{"rel": "derived-from", "label": "Follows from", "to": "hypothesis-insula-tracks-interpersonal-guilt"}], "in": [{"rel": "entails", "label": "Predicted from", "from": "hypothesis-insula-tracks-interpersonal-guilt"}, {"rel": "tests", "label": "Tested by", "from": "insula-tracks-guilt-effect"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/prediction-insula-tracks-guilt/"}, {"slug": "prediction-responsibility-model-wins-comparison", "uuid": "6eb8393f-a95e-4360-91d9-442d08200190", "number": "H2.P2", "kind": "Prediction", "role": "prediction", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "A happiness model that weighs partner surprises by responsibility should beat the alternatives.", "short": "The responsibility-weighting hypothesis predicts that a happiness model with a social_pRPE × responsibility interaction term outperforms nested alternatives, with a positive social_pRPE weight in both studies.", "full": "If happiness incorporates partner reward prediction errors with a responsibility-weighted rule, then a computational model of happiness that includes a social_pRPE regressor (partner RPE × subject-decided indicator) should fit participant happiness ratings better than nested alternatives that omit the responsibility interaction. Formally: the Responsibility model (and Responsibility Redux model) should achieve lower cross-validated error than baseline (own-reward-only) and additive social-utility models in both Study 1 and Study 2; and the fitted social_pRPE weight should be significantly greater than zero.", "panel": "prediction", "panels": [], "method": "derived prediction", "dataset": null, "analysis": null, "check": null, "out": [{"rel": "derived-from", "label": "Follows from", "to": "hypothesis-responsibility-weights-partner-rpes"}], "in": [{"rel": "entails", "label": "Predicted from", "from": "hypothesis-responsibility-weights-partner-rpes"}, {"rel": "tests", "label": "Tested by", "from": "responsibility-modulates-guilt-computational"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/prediction-responsibility-model-wins-comparison/"}, {"slug": "prediction-sts-tracks-partner-rpe-under-responsibility", "uuid": "52a693d9-fa42-4b84-8e27-7c77ef16022f", "number": "H3.P1", "kind": "Prediction", "role": "prediction", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "The superior temporal sulcus should track partner surprises only when the participant was responsible.", "short": "The mentalizing-under-responsibility hypothesis predicts that left STS tracks partner reward prediction errors specifically when the participant is responsible for the choice — a parametric modulator that is significant in Social but not in Partner trials.", "full": "If superior temporal sulcus represents the partner's affective experience selectively under responsibility, then in a model-based GLM with trial-by-trial partner RPE regressors split by who-chose, the parametric modulator for partner RPE in Social trials (subject-decided) should yield a significant cluster in left STS, while the parametric modulator for partner RPE in Partner trials (partner-decided) should not. This conditional engagement, rather than a main effect of partner RPE, is the diagnostic prediction.", "panel": "prediction", "panels": [], "method": "derived prediction", "dataset": null, "analysis": null, "check": null, "out": [{"rel": "derived-fro <script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const C = Object.fromEntries(D.claims.map(c => [c.slug, c]));
  const FIG = Object.fromEntries(D.figures.map(f => [f.id, f]));
  const RESULT_KINDS = new Set(['Finding', 'Check', 'Interpretation']);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const trimDot = s => s.replace(/[.]\s*$/, '');
  const plain = c => c.plain || c.short;
  const stDot = c => `<span class="st st-${c.status}">${esc(c.statusLabel)}</span>`;
  const letters = ls => ls.length ? ls.join(', ') : '';

  // ── figure order of the results, used everywhere a list of findings appears ──
  const results = D.claims.filter(c => RESULT_KINDS.has(c.kind));
  const figKey = c => c.panels.length ? [Number(c.panels[0][0]), c.panels[0][1] || 'ZZ'] : [99, 'ZZ'];
  results.sort((a, b) => { const ka = figKey(a), kb = figKey(b); return ka[0] - kb[0] || (ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0); });

  // ── paper ───────────────────────────────────────────────
  function figureHtml(f) {
    const first = f.caption.replace(/<[^>]+>/g, '').split(/(?<=\.)\s+(?=\()/)[0];
    const rows = f.claims.map(x => {
      const c = C[x.slug];
      const pl = x.letters.length ? `<span class="fp">${esc(letters(x.letters))}</span>` : `<span class="fp text">text</span>`;
      return `<button class="frow" data-open="${c.slug}">${pl}<span class="ft">${esc(trimDot(plain(c)))}</span>${stDot(c)}</button>`;
    }).join('');
    return `<figure class="fig" id="${f.id}" data-fig="${f.id}">
      <img src="${f.src}" alt="${esc(f.label)}: ${esc(f.title)}" loading="lazy">
      <figcaption><span class="fl">${esc(f.label)}.</span> ${esc(f.title)}
        <span class="cap-short"><button class="more" data-cap>Full caption</button></span>
        <div class="cap-full">${f.caption} <button class="more" data-cap>Less</button></div>
      </figcaption>
      ${f.claims.length ? `<div class="fig-claims"><div class="fig-claims-k">What this figure shows</div>${rows}</div>` : ''}
    </figure>`;
  }
  function sentenceHtml(r) {
    const t = esc(r.text).replace(/Figure\s+(\d+)([A-Z](?:[,–-]\s?[A-Z])*)?/g, (m, n) => `<a class="xref" href="#fig${n}">${m}</a>`);
    return r.claims.length ? `<span class="mk" data-claims="${r.claims.join(',')}" tabindex="0" role="button">${t}</span>` : t;
  }
  function blocksHtml(blocks, depth) {
    return blocks.map(b => {
      if (b.type === 'fig') return figureHtml(FIG[b.id]);
      if (b.type === 'sec') return sectionHtml(b.sec);
      if (b.sentences) return `<p>${b.sentences.map(sentenceHtml).join(' ')}</p>`;
      return `<p>${b.html}</p>`;
    }).join('');
  }
  function sectionHtml(s) {
    const tag = ['h2', 'h2', 'h3', 'h4', 'h5', 'h5'][s.depth] || 'h5';
    return `<${tag} id="${s.id}">${esc(s.title)}</${tag}>${blocksHtml(s.blocks, s.depth)}`;
  }
  function renderPaper() {
    const s = D.summary;
    const abstract = D.abstract.map(a => a.claims.length
      ? `<span class="mk" data-claims="${a.claims.join(',')}" tabindex="0" role="button">${esc(a.text)}</span>` : esc(a.text)).join(' ');
    const main = D.sections.filter(x => x.id !== 's4');
    const methods = D.sections.find(x => x.id === 's4');
    document.getElementById('view-paper').innerHTML = `
      <header class="mast">
        <p class="journal">eLife · ${esc(D.year)} · Research article</p>
        <h1 class="title">${esc(D.title)}</h1>
        <p class="authors">${esc(D.authors.join(', '))}</p>
        <p class="links"><a href="https://doi.org/${esc(D.doi)}" target="_blank" rel="noopener">doi ${esc(D.doi)}</a><a href="${esc(D.url)}" target="_blank" rel="noopener">Read at eLife</a><a href="${esc(D.github)}" target="_blank" rel="noopener">Code and data</a></p>
      </header>
      <section class="brief" aria-label="In brief">
        <div class="brief-head"><span class="k">In brief</span><span class="n">${D.counts.claims} claims · ${D.counts.rerun} re-run from the authors' data · written by a model, not yet checked by a person</span></div>
        <dl>
          <dt>They asked</dt><dd>${esc(s.hypotheses)}</dd>
          <dt>They found</dt><dd>${esc(s.claims)}</dd>
          <dt>It means</dt><dd>${esc(s.inferences)}</dd>
        </dl>
      </section>
      <p class="abstract-k">Abstract</p>
      <p>${abstract}</p>
      ${main.map(sectionHtml).join('')}
      ${methods ? `<details class="fold"><summary>Materials and methods</summary>${blocksHtml(methods.blocks, 1)}</details>` : ''}
    `;
  }

  // ── findings ───────────────────────────────────────────
  function renderFindings() {
    const groups = D.figures.map(f => {
      const rows = f.claims.map(x => {
        const c = C[x.slug];
        const pl = x.letters.length ? `<span class="fp">${esc(letters(x.letters))}</span>` : `<span class="fp text">text</span>`;
        return `<button class="frow" data-open="${c.slug}">${pl}<span class="ft">${esc(trimDot(plain(c)))}</span>${stDot(c)}</button>`;
      }).join('');
      return `<div class="dg">
        <div><img src="${f.src}" alt="${esc(f.label)}" data-goto="${f.id}" loading="lazy"><p class="dg-k"><b>${esc(f.label)}</b>${esc(f.title)}</p></div>
        <div>${rows || `<p class="empty">Sets up the task. No result is claimed from this figure.</p>`}</div>
      </div>`;
    }).join('');
    document.getElementById('view-findings').innerHTML = `
      <h1>What the paper found, figure by figure</h1>
      <p class="lede">Each line is one result the paper claims, in the authors' own terms, with the panel it comes from and whether we could reproduce it from their deposited data. Click a line for the detail.</p>
      ${groups}`;
  }

  // ── argument ───────────────────────────────────────────
  function renderArgument() {
    const hyps = D.claims.filter(c => c.kind === 'Hypothesis');
    const alts = D.claims.filter(c => c.kind === 'Alternative ruled out');
    const caveats = D.claims.filter(c => c.kind === 'Caveat');
    const testRow = t => `<li><button data-open="${t.slug}">${esc(trimDot(plain(t)))}</button>${stDot(t)}</li>`;
    const hypHtml = (h, i) => {
      const preds = h.out.filter(r => r.rel === 'entails').map(r => C[r.to]).filter(Boolean);
      const chain = preds.map(p => {
        const tests = p.in.filter(r => r.rel === 'tests').map(r => C[r.from]).filter(Boolean);
        return `<li><span class="lab">Predicts</span><div><button data-open="${p.slug}">${esc(trimDot(plain(p)))}</button>
          ${tests.length ? `<ul class="tests">${tests.map(testRow).join('')}</ul>` : ''}</div></li>`;
      }).join('');
      const conf = h.in.filter(r => r.rel === 'confirms' || r.rel === 'validates').map(r => C[r.from]).filter(Boolean);
      return `<section class="hyp">
        <p class="hyp-k">Question ${i + 1} of ${hyps.length}</p>
        <button class="hyp-q" data-open="${h.slug}">${esc(trimDot(plain(h)))}</button>
        <ul class="chain">${chain}
          ${conf.length ? `<li><span class="lab">Confirmed by</span><div>${conf.map(c => `<button data-open="${c.slug}">${esc(trimDot(plain(c)))}</button>`).join('')}</div></li>` : ''}
        </ul>
      </section>`;
    };
    const altHtml = a => {
      const by = a.in.filter(r => r.rel === 'rules-out').map(r => C[r.from]).filter(Boolean);
      return `<div class="alt">
        <button class="a1" data-open="${a.slug}"><s>${esc(trimDot(plain(a)))}</s></button>
        <div class="a2">${by.length ? 'Ruled out by ' + by.map(c => `<button data-open="${c.slug}">${esc(trimDot(plain(c)))}</button>`).join(' and ') : 'Named by the paper, not tested directly'}</div>
      </div>`;
    };
    document.getElementById('view-argument').innerHTML = `
      <h1>How the argument fits together</h1>
      <p class="lede">The paper asks ${hyps.length} questions. Each question makes a prediction, and each prediction is tested by one or more results. Below that: the explanations the authors considered and ruled out, and what every result depends on.</p>
      ${hyps.map(hypHtml).join('')}
      <h2>Explanations the paper rules out</h2>
      <p class="sub">A result means little until the obvious rival explanations are eliminated. The authors named ${alts.length}.</p>
      ${alts.map(altHtml).join('')}
      <h2>What every result assumes</h2>
      <p class="sub">Two features of the study qualify all of the findings above.</p>
      ${caveats.map(c => `<div class="alt"><button class="a1" data-open="${c.slug}">${esc(trimDot(plain(c)))}</button></div>`).join('')}
      <p class="more">This is the plain reading of the claim graph. The full graph, with all 14 relation types and every claim's record, is on the current site: <a href="https://zmainen.github.io/elife-claim-trees/papers/${D.slug}/?view=graph" target="_blank" rel="noopener">open the graph ↗</a></p>`;
  }

  // ── rail: the list at rest, and the card ───────────────
  const rail = document.getElementById('rail');
  const stack = [];
  function renderRailList() {
    const byFig = new Map();
    results.forEach(c => { const k = c.panels.length ? 'Figure ' + c.panels[0][0] : 'In the text'; if (!byFig.has(k)) byFig.set(k, []); byFig.get(k).push(c); });
    const groups = [...byFig].map(([k, cs]) => `<div class="rg"><div class="rg-k"><span>${esc(k)}</span></div>
      ${cs.map(c => `<button class="rrow" data-open="${c.slug}" data-slug="${c.slug}">${stDot(c)}<span class="rt">${esc(trimDot(plain(c)))}</span></button>`).join('')}</div>`).join('');
    rail.innerHTML = `<div class="rest">
      <p class="rail-k">What this paper shows <span class="n">${results.length} results</span></p>
      <p class="rail-note">Underlined sentences and figure panels carry a claim. Click one, or a line below.</p>
      ${groups}</div>`;
    rail.classList.remove('open');
    markActive(null);
    updateNear();
  }
  const REL_ORDER = ['Tests', 'Confirms', 'Supports', 'Validates', 'Rules out', 'Relies on', 'Follows from', 'Leads to the prediction', 'Interprets', 'Contrasts with', 'Applies to', 'Makes possible', 'Predicts', 'Refutes',
    'Tested by', 'Confirmed by', 'Supported by', 'Validated by', 'Relied on by', 'Basis for', 'Predicted from', 'Interpreted by', 'Ruled out by', 'Qualified by', 'Refuted by'];
  function relHtml(c) {
    const seen = new Set(), m = new Map();
    const all = [...c.out.map(r => ({ label: r.label, slug: r.to })), ...c.in.map(r => ({ label: r.label, slug: r.from }))]
      .sort((a, b) => REL_ORDER.indexOf(a.label) - REL_ORDER.indexOf(b.label));
    all.forEach(r => { const t = C[r.slug]; if (!t || seen.has(r.slug)) return; seen.add(r.slug); if (!m.has(r.label)) m.set(r.label, []); m.get(r.label).push(t); });
    return [...m].map(([label, cs]) => `<li><span class="rl">${esc(label)}</span><div>${cs.map(t => `<button data-open="${t.slug}">${esc(trimDot(plain(t)))}${stDot(t)}</button>`).join('')}</div></li>`).join('');
  }
  function checkHtml(c) {
    if (c.status === 'na') return '';
    const k = c.check || {};
    let lead;
    if (c.status === 'matches') lead = `We re-ran this from ${k.how || "the authors' deposited data"}${k.date ? ' on ' + k.date : ''} and got the same result.`;
    else if (c.status === 'partly') lead = `We re-ran this from ${k.how || "the authors' deposited data"}${k.date ? ' on ' + k.date : ''}. The direction reproduces; the numbers differ, most likely because a different subset of the data was deposited.`;
    else if (c.status === 'differs') lead = `We re-ran this and got a different result.`;
    else if (c.status === 'blocked') lead = `We could not re-run this. ${k.how === 'reading the Methods section' ? 'It was confirmed by reading the Methods section.' : 'The analysis needs software or data we do not have.'}`;
    else lead = `We have not tried to re-run this yet.`;
    const cmp = (k.paper || k.reproduced) ? `<dl class="cmp"><dt>Paper says</dt><dd>${esc(k.paper || '—')}</dd><dt>Our re-run</dt><dd>${esc(k.reproduced || '—')}</dd></dl>` : '';
    return `<div class="cblk"><p class="cblk-k">Does it hold up?</p><span class="verdict st-${c.status}">${esc(c.statusLabel)}</span><p>${esc(lead)}</p>${cmp}</div>`;
  }
  function renderCard(slug) {
    const c = C[slug];
    const fig = c.panels.length ? 'fig' + c.panels[0][0] : null;
    const where = [];
    if (fig && FIG[fig]) where.push(`<button data-goto="${fig}">${esc(FIG[fig].label)}${c.panels[0][1] ? ' ' + esc(c.panels.filter(p => p[0] === c.panels[0][0]).map(p => p[1]).filter(Boolean).join(', ')) : ''}</button>`);
    if (document.querySelector(`.mk[data-claims~="${slug}"], .mk[data-claims*="${slug}"]`)) where.push(`<button data-goto-text="${slug}">In the text</button>`);
    const method = c.method ? `<div class="cblk"><p class="cblk-k">How it was measured</p><p>${esc(c.method)}</p></div>` : '';
    const rels = relHtml(c);
    rail.innerHTML = `<div class="card">
      <div class="card-nav"><button data-back>← ${stack.length > 1 ? 'Back' : 'All results'}</button><button data-close aria-label="Close">Close</button></div>
      <p class="kind">${esc(c.kind)}</p>
      <p class="cshort">${esc(plain(c))}</p>
      ${c.plain ? `<p class="cwords">${esc(c.full)}</p>` : ''}
      ${where.length ? `<p class="cwhere"><span>Where:</span>${where.join('')}</p>` : ''}
      ${checkHtml(c)}
      ${method}
      ${rels ? `<div class="cblk"><p class="cblk-k">How it connects</p><ul class="rel">${rels}</ul></div>` : ''}
      <div class="cfoot"><span>Extracted by a language model, not yet checked by a person</span><a href="${esc(c.url)}" target="_blank" rel="noopener">Full record ↗</a></div>
    </div>`;
    rail.classList.add('open');
    rail.scrollTop = 0;
    markActive(slug);
  }
  function openClaim(slug, push = true) {
    if (!C[slug]) return;
    if (push) stack.push(slug);
    renderCard(slug);
  }
  function back() { stack.pop(); if (stack.length) renderCard(stack[stack.length - 1]); else renderRailList(); }
  function markActive(slug) {
    document.querySelectorAll('.mk.active, .frow.active').forEach(el => el.classList.remove('active'));
    if (!slug) return;
    document.querySelectorAll('.mk').forEach(el => { if (el.dataset.claims.split(',').includes(slug)) el.classList.add('active'); });
    document.querySelectorAll(`.frow[data-open="${slug}"]`).forEach(el => el.classList.add('active'));
  }

  // ── modes ─────────────────────────────────────────────
  function setMode(m) {
    document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + m));
    window.scrollTo({ top: 0, behavior: 'auto' });
    try { localStorage.setItem('reader-mode', m); } catch (e) {}
  }
  function gotoFig(id) {
    setMode('paper');
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function gotoText(slug) {
    setMode('paper');
    const el = [...document.querySelectorAll('.mk')].find(e => e.dataset.claims.split(',').includes(slug));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ── scroll spy: which findings are on screen ──────────
  const near = new Set();
  function updateNear() {
    document.querySelectorAll('.rrow[data-slug]').forEach(r => r.classList.toggle('near', near.has(r.dataset.slug)));
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const slugs = e.target.dataset.claims ? e.target.dataset.claims.split(',') : (FIG[e.target.dataset.fig] || { claims: [] }).claims.map(x => x.slug);
      slugs.forEach(s => e.isIntersecting ? near.add(s) : near.delete(s));
    });
    updateNear();
  }, { rootMargin: '-10% 0px -40% 0px' });

  // ── events ────────────────────────────────────────────
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-open], [data-goto], [data-goto-text], [data-back], [data-close], [data-cap], .mk, .mode');
    if (!t) return;
    if (t.classList.contains('mode')) return setMode(t.dataset.mode);
    if (t.hasAttribute('data-cap')) { t.closest('figcaption').classList.toggle('open'); return; }
    if (t.hasAttribute('data-back')) return back();
    if (t.hasAttribute('data-close')) { stack.length = 0; return renderRailList(); }
    if (t.hasAttribute('data-goto')) return gotoFig(t.dataset.goto);
    if (t.hasAttribute('data-goto-text')) return gotoText(t.dataset.gotoText);
    if (t.hasAttribute('data-open')) return openClaim(t.dataset.open);
    if (t.classList.contains('mk')) {
      const slugs = t.dataset.claims.split(',');
      // one sentence can carry a prediction and the finding that tests it: prefer the finding
      const pick = slugs.map(s => C[s]).sort((a, b) => (RESULT_KINDS.has(b.kind) ? 1 : 0) - (RESULT_KINDS.has(a.kind) ? 1 : 0))[0];
      openClaim(pick.slug);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('mk')) e.target.click();
    if (e.key === 'Escape' && stack.length) { stack.length = 0; renderRailList(); }
  });

  // ── boot ──────────────────────────────────────────────
  document.getElementById('crumb-paper').textContent = D.authors[0].split(' ').pop() + ' ' + D.year;
  renderPaper(); renderFindings(); renderArgument(); renderRailList();
  document.querySelectorAll('.mk, figure.fig').forEach(el => io.observe(el));
  let m = 'paper';
  try { m = localStorage.getItem('reader-mode') || 'paper'; } catch (e) {}
  if (m !== 'paper') setMode(m);
})();
</script>
