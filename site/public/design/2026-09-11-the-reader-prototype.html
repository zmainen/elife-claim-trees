<title>Reading Gädeke 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:#fdfdfb; --surface:#f5f5f2; --surface-2:#ecedea; --ink:#1c1e1f; --ink-2:#4b5054; --ink-3:#7a8085;
    --rule:#e3e5e2; --rule-firm:#c9ccc8;
    --claim:#0f6e7a; --claim-ink:#0b5660; --claim-wash:rgba(15,110,122,.09); --claim-wash-2:rgba(15,110,122,.17); --claim-line:rgba(15,110,122,.55);
    --ok:#2f7d4f; --ok-bg:#e6f1ea; --warn:#a86f12; --warn-bg:#f6ecd8; --bad:#a83a2b; --bad-bg:#f6e3df; --none:#8d9297; --none-bg:#eef0ee;
    --shadow:0 10px 30px rgba(20,30,32,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#141617; --surface:#1b1e20; --surface-2:#23272a; --ink:#e6e8e6; --ink-2:#b4b9b8; --ink-3:#828887;
      --rule:#2c3134; --rule-firm:#454b4f;
      --claim:#6cc3cd; --claim-ink:#8fd3db; --claim-wash:rgba(108,195,205,.12); --claim-wash-2:rgba(108,195,205,.22); --claim-line:rgba(108,195,205,.6);
      --ok:#74bf92; --ok-bg:#1c2c22; --warn:#d8ab52; --warn-bg:#2e2618; --bad:#e08b74; --bad-bg:#2f1e19; --none:#7f8588; --none-bg:#22262a;
      --shadow:0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --ground:#141617; --surface:#1b1e20; --surface-2:#23272a; --ink:#e6e8e6; --ink-2:#b4b9b8; --ink-3:#828887;
    --rule:#2c3134; --rule-firm:#454b4f;
    --claim:#6cc3cd; --claim-ink:#8fd3db; --claim-wash:rgba(108,195,205,.12); --claim-wash-2:rgba(108,195,205,.22); --claim-line:rgba(108,195,205,.6);
    --ok:#74bf92; --ok-bg:#1c2c22; --warn:#d8ab52; --warn-bg:#2e2618; --bad:#e08b74; --bad-bg:#2f1e19; --none:#7f8588; --none-bg:#22262a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } * { transition:none !important; } }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:"Source Sans 3", system-ui, sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--claim); outline-offset:2px; border-radius:2px; }

  /* ── top bar ─────────────────────────────────────────── */
  .top { position:sticky; top:0; z-index:30; background:var(--ground); border-bottom:1px solid var(--rule); }
  .top-in { max-width:1180px; margin:0 auto; padding:0 28px; height:52px; display:flex; align-items:center; gap:28px; }
  .brand { font-weight:600; font-size:14px; letter-spacing:.01em; text-decoration:none; }
  .crumb { color:var(--ink-3); font-size:13.5px; text-decoration:none; }
  .crumb:hover { color:var(--ink); }
  .modes { margin-left:auto; display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:6px; }
  .mode { padding:5px 13px; border-radius:4px; font-size:13.5px; font-weight:500; color:var(--ink-2); }
  .mode[aria-pressed="true"] { background:var(--ground); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .mode:hover:not([aria-pressed="true"]) { color:var(--ink); }

  /* ── page grid ───────────────────────────────────────── */
  .page { max-width:1180px; margin:0 auto; padding:0 28px 120px; display:grid; grid-template-columns:minmax(0,1fr) 312px; gap:0 56px; align-items:start; }
  .col { min-width:0; }
  .view { display:none; }
  .view.on { display:block; }

  /* ── the paper ───────────────────────────────────────── */
  .paper { font-family:"Source Serif 4", Georgia, "Times New Roman", serif; font-size:17.5px; line-height:1.6; max-width:68ch; }
  .paper p { margin:0 0 1.05em; }
  .paper sup, .paper sub { font-size:.72em; line-height:0; }
  .paper .cite { color:var(--ink-2); }
  .paper .xref { color:var(--ink-2); text-decoration:none; border-bottom:1px solid var(--rule-firm); }
  .paper .xref:hover { color:var(--ink); border-color:var(--ink-3); }
  .paper .math { font-family:"IBM Plex Mono", monospace; font-size:.85em; }
  .mast { padding:56px 0 28px; }
  .journal { font-family:"Source Sans 3", sans-serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin:0 0 20px; }
  h1.title { font-size:clamp(1.65rem, 3.2vw, 2.15rem); font-weight:600; line-height:1.18; letter-spacing:-.012em; margin:0 0 16px; text-wrap:balance; }
  .authors { font-size:16px; color:var(--ink-2); margin:0 0 10px; }
  .links { font-family:"Source Sans 3", sans-serif; font-size:13px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:6px 18px; margin:0; }
  .links a { color:var(--ink-3); text-decoration:none; border-bottom:1px solid var(--rule-firm); }
  .links a:hover { color:var(--ink); }

  .brief { font-family:"Source Sans 3", sans-serif; font-size:15px; line-height:1.55; border-top:1px solid var(--rule-firm); border-bottom:1px solid var(--rule); padding:22px 0 10px; margin:12px 0 40px; }
  .brief-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:14px; }
  .brief-head .k { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--claim); font-weight:600; }
  .brief-head .n { font-size:12.5px; color:var(--ink-3); }
  .brief dl { margin:0; display:grid; grid-template-columns:7.5em 1fr; gap:0 18px; }
  .brief dt { color:var(--ink-3); font-size:13px; font-weight:500; padding-top:2px; }
  .brief dd { margin:0 0 12px; color:var(--ink-2); }
  .brief dd b { color:var(--ink); font-weight:600; }

  .paper h2 { font-size:23px; font-weight:600; letter-spacing:-.01em; margin:48px 0 14px; }
  .paper h3 { font-family:"Source Sans 3", sans-serif; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:34px 0 10px; }
  .paper h4 { font-size:18px; font-weight:600; margin:26px 0 8px; }
  .paper h5 { font-size:17px; font-weight:600; font-style:italic; margin:20px 0 6px; }
  .paper h2 + h3 { margin-top:6px; }
  .abstract-k { font-family:"Source Sans 3", sans-serif; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:0 0 10px; }
  details.fold { margin:36px 0 0; border-top:1px solid var(--rule); padding-top:10px; }
  details.fold > summary { list-style:none; cursor:pointer; font-family:"Source Sans 3", sans-serif; font-size:13.5px; color:var(--ink-3); display:flex; align-items:center; gap:8px; padding:6px 0; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:""; width:6px; height:6px; border-right:1.5px solid var(--ink-3); border-bottom:1.5px solid var(--ink-3); transform:rotate(-45deg); transition:transform .15s; }
  details.fold[open] > summary::before { transform:rotate(45deg); }
  details.fold > summary:hover { color:var(--ink); }

  /* a sentence that carries a claim */
  .mk { text-decoration:underline; text-decoration-color:var(--claim-line); text-decoration-thickness:1.5px; text-underline-offset:4px; cursor:pointer; border-radius:2px; transition:background .12s; }
  .mk:hover { background:var(--claim-wash); }
  .mk.active { background:var(--claim-wash-2); text-decoration-color:var(--claim); }

  /* figure */
  figure.fig { margin:30px 0 34px; scroll-margin-top:72px; }
  figure.fig img { display:block; width:100%; height:auto; border:1px solid var(--rule); background:#fff; }
  figure.fig figcaption { font-family:"Source Sans 3", sans-serif; font-size:14px; line-height:1.5; color:var(--ink-2); margin-top:12px; }
  figure.fig figcaption .fl { font-weight:600; color:var(--ink); }
  figure.fig figcaption .more { color:var(--ink-3); margin-left:6px; font-size:13px; }
  figure.fig figcaption .more:hover { color:var(--ink); text-decoration:underline; }
  figure.fig figcaption .cap-full { display:none; margin-top:6px; }
  figure.fig figcaption.open .cap-full { display:block; }
  figure.fig figcaption.open .cap-short { display:none; }
  .fig-claims { margin-top:14px; border-top:1px solid var(--rule); }
  .fig-claims-k { font-family:"Source Sans 3", sans-serif; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--claim); font-weight:600; padding:12px 0 6px; }
  .frow { display:grid; grid-template-columns:3.4em 1fr auto; gap:0 12px; align-items:baseline; width:100%; text-align:left; padding:7px 0; border-bottom:1px solid var(--rule); font-family:"Source Sans 3", sans-serif; font-size:14.5px; line-height:1.4; color:var(--ink); }
  .frow:last-child { border-bottom:0; }
  .frow:hover .ft, .frow.active .ft { color:var(--claim-ink); }
  .frow.active { background:var(--claim-wash); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:3px; }
  .fp { font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-3); letter-spacing:.04em; }
  .fp.text { font-family:"Source Sans 3", sans-serif; font-style:italic; font-size:12.5px; letter-spacing:0; }

  /* status marks */
  .st { display:inline-flex; align-items:center; gap:6px; font-family:"Source Sans 3", sans-serif; font-size:12.5px; white-space:nowrap; color:var(--ink-3); }
  .st::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--none); flex:none; }
  .st-matches::before { background:var(--ok); } .st-matches { color:var(--ok); }
  .st-partly::before { background:var(--warn); } .st-partly { color:var(--warn); }
  .st-differs::before { background:var(--bad); } .st-differs { color:var(--bad); }
  .st-blocked::before, .st-none::before { background:transparent; border:1.5px solid var(--none); }
  .st-na { display:none; }
  .frow .st, .rrow .st { font-size:0; }  /* dot only in compact rows */
  .frow .st::before, .rrow .st::before { margin:0; }

  /* ── rail ────────────────────────────────────────────── */
  .rail { position:sticky; top:52px; max-height:calc(100vh - 52px); overflow:auto; padding:40px 0 40px 0; font-size:14px; }
  .rail-k { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--claim); font-weight:600; margin:0 0 4px; display:flex; justify-content:space-between; align-items:baseline; }
  .rail-k .n { color:var(--ink-3); font-weight:500; letter-spacing:0; text-transform:none; font-size:12.5px; }
  .rail-note { color:var(--ink-3); font-size:12.5px; line-height:1.45; margin:0 0 16px; }
  .rail-note a { color:var(--ink-3); }
  .rg { margin:14px 0 0; }
  .rg-k { font-size:12px; color:var(--ink-3); font-weight:500; padding-bottom:4px; border-bottom:1px solid var(--rule); margin-bottom:2px; display:flex; justify-content:space-between; }
  .rrow { display:grid; grid-template-columns:auto 1fr; gap:0 9px; align-items:baseline; width:100%; text-align:left; padding:6px 6px 6px 0; border-radius:3px; color:var(--ink-2); font-size:13.5px; line-height:1.38; }
  .rrow:hover { color:var(--ink); background:var(--claim-wash); padding-left:6px; }
  .rrow.near { color:var(--ink); }
  .rrow.near .rt::before { content:""; display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--claim); margin:0 6px 3px -10px; }
  .rrow .st { grid-column:1; }
  .rrow .rt { grid-column:2; }

  /* claim card */
  .card { animation:in .18s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .card-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:13px; color:var(--ink-3); }
  .card-nav button { color:var(--ink-3); display:inline-flex; align-items:center; gap:6px; }
  .card-nav button:hover { color:var(--ink); }
  .kind { display:inline-flex; align-items:center; gap:8px; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--claim); margin-bottom:10px; }
  .kind .st { text-transform:none; letter-spacing:0; font-weight:500; }
  .kind .st.st-blocked, .kind .st.st-none { color:var(--ink-3); }
  .cshort { font-family:"Source Serif 4", Georgia, serif; font-size:18.5px; line-height:1.4; font-weight:600; color:var(--ink); margin:0 0 16px; text-wrap:pretty; }
  .cwhere { font-size:13.5px; color:var(--ink-2); margin:0 0 18px; display:flex; flex-wrap:wrap; gap:6px 14px; }
  .cwhere button { color:var(--claim-ink); font-weight:500; border-bottom:1px solid var(--claim-line); }
  .cwhere button:hover { border-color:var(--claim); }
  .cblk { border-top:1px solid var(--rule); padding:12px 0; }
  .cblk-k { font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:0 0 6px; }
  .cblk p { margin:0 0 6px; color:var(--ink-2); font-size:13.5px; line-height:1.5; }
  .cblk p:last-child { margin-bottom:0; }
  .verdict { display:inline-block; font-weight:600; font-size:13px; padding:2px 8px; border-radius:3px; margin:0 0 8px; }
  .verdict.st-matches { background:var(--ok-bg); color:var(--ok); }
  .verdict.st-partly { background:var(--warn-bg); color:var(--warn); }
  .verdict.st-differs { background:var(--bad-bg); color:var(--bad); }
  .verdict.st-none, .verdict.st-blocked { background:var(--none-bg); color:var(--ink-2); }
  .cmp { display:grid; grid-template-columns:6.5em 1fr; gap:3px 10px; font-size:13px; margin-top:6px; }
  .cmp dt { color:var(--ink-3); } .cmp dd { margin:0; font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink); word-break:break-word; }
  .rel { margin:6px 0 0; padding:0; list-style:none; }
  .rel li { display:grid; grid-template-columns:auto 1fr; gap:0 8px; align-items:baseline; padding:5px 0; border-top:1px solid var(--rule); font-size:13.5px; line-height:1.4; }
  .rel li:first-child { border-top:0; }
  .rel .rl { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; white-space:nowrap; padding-top:2px; }
  .rel button { text-align:left; color:var(--ink-2); display:block; padding:2px 0; }
  .rel button:hover { color:var(--claim-ink); }
  .rel button .st { margin-left:6px; font-size:0; }
  .cfoot { border-top:1px solid var(--rule); padding-top:12px; font-size:13px; color:var(--ink-3); display:flex; justify-content:space-between; gap:12px; }
  .cfoot a { color:var(--ink-3); }
  .cfoot a:hover { color:var(--ink); }
  .cwords { font-family:"Source Serif 4", Georgia, serif; font-size:14px; line-height:1.5; color:var(--ink-2); margin:-6px 0 16px; padding-left:12px; border-left:2px solid var(--rule-firm); }

  /* ── findings view ───────────────────────────────────── */
  .digest { max-width:68ch; padding-top:56px; }
  .digest h1, .arg h1 { font-family:"Source Serif 4", Georgia, serif; font-size:30px; font-weight:600; letter-spacing:-.012em; margin:0 0 8px; line-height:1.15; text-wrap:balance; }
  .lede { color:var(--ink-2); font-size:16px; max-width:60ch; margin:0 0 36px; line-height:1.55; }
  .dg { display:grid; grid-template-columns:150px 1fr; gap:0 26px; padding:22px 0; border-top:1px solid var(--rule); }
  .dg:last-child { border-bottom:1px solid var(--rule); }
  .dg img { width:100%; height:auto; border:1px solid var(--rule); background:#fff; display:block; cursor:pointer; }
  .dg-k { font-size:12px; color:var(--ink-3); margin:8px 0 0; }
  .dg-k b { color:var(--ink); font-weight:600; display:block; font-size:13px; }
  .dg .frow { font-size:15px; }
  .dg .frow .st { font-size:12.5px; }
  .dg .frow .st::before { margin-right:6px; }
  .dg .empty { font-size:13.5px; color:var(--ink-3); font-style:italic; padding:6px 0; }

  /* ── argument view ───────────────────────────────────── */
  .arg { max-width:68ch; padding-top:56px; }
  .hyp { border-top:2px solid var(--ink); padding:18px 0 22px; margin-bottom:8px; }
  .hyp-k { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--claim); font-weight:600; margin:0 0 8px; }
  .hyp-q { font-family:"Source Serif 4", Georgia, serif; font-size:20px; font-weight:600; line-height:1.35; margin:0 0 14px; text-align:left; text-wrap:pretty; }
  .hyp-q:hover { color:var(--claim-ink); }
  .chain { margin:0; padding:0; list-style:none; }
  .chain > li { display:grid; grid-template-columns:8.2em 1fr; gap:0 14px; padding:9px 0; border-top:1px solid var(--rule); font-size:14.5px; line-height:1.45; }
  .chain .lab { font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding-top:3px; }
  .chain button { text-align:left; color:var(--ink-2); display:block; width:100%; }
  .chain button:hover { color:var(--claim-ink); }
  .chain .tests { margin:6px 0 0; padding:0; list-style:none; }
  .chain .tests li { display:flex; gap:10px; align-items:baseline; padding:4px 0 4px 0; }
  .chain .tests li::before { content:"↳"; color:var(--ink-3); flex:none; }
  .chain .tests .st { font-size:12.5px; margin-left:auto; }
  .chain .tests .st::before { margin-right:5px; }
  .chain .tests button { flex:1; }
  .arg h2 { font-family:"Source Serif 4", Georgia, serif; font-size:22px; font-weight:600; margin:44px 0 6px; }
  .arg .sub { color:var(--ink-2); font-size:14.5px; margin:0 0 14px; max-width:60ch; }
  .alt { display:grid; grid-template-columns:1fr; gap:0; border-top:1px solid var(--rule); padding:12px 0; }
  .alt button { text-align:left; }
  .alt .a1 { color:var(--ink-2); font-size:15px; line-height:1.45; }
  .alt .a1 s { text-decoration-color:var(--ink-3); text-decoration-thickness:1px; }
  .alt .a1:hover { color:var(--ink); }
  .alt .a2 { margin-top:5px; font-size:13.5px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:4px 6px; align-items:baseline; }
  .alt .a2 button { color:var(--claim-ink); border-bottom:1px solid var(--claim-line); }
  .arg .more { margin-top:44px; border-top:1px solid var(--rule); padding-top:14px; font-size:13.5px; color:var(--ink-3); }
  .arg .more a { color:var(--ink-3); }

  /* ── responsive ──────────────────────────────────────── */
  @media (max-width: 980px) {
    .page { grid-template-columns:minmax(0,1fr); }
    .rail { position:fixed; top:auto; bottom:0; left:0; right:0; max-height:72vh; background:var(--ground); border-top:1px solid var(--rule-firm); box-shadow:var(--shadow); padding:16px 20px 28px; transform:translateY(102%); transition:transform .2s ease-out; z-index:40; }
    .rail.open { transform:none; }
    .rail .rest { display:none; }
    .top-in { padding:0 18px; gap:16px; }
    .page { padding:0 18px 100px; }
    .crumb { display:none; }
    .mode { padding:5px 10px; font-size:13px; }
  }
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#" onclick="return false">Claims</a>
    <a class="crumb" href="#" onclick="return false">Papers</a>
    <a class="crumb" href="#" onclick="return false" id="crumb-paper"></a>
    <nav class="modes" aria-label="View">
      <button class="mode" data-mode="paper" aria-pressed="true">Paper</button>
      <button class="mode" data-mode="findings" aria-pressed="false">Findings</button>
      <button class="mode" data-mode="argument" aria-pressed="false">Argument</button>
    </nav>
  </div>
</header>

<div class="page">
  <div class="col">
    <article class="paper view on" id="view-paper"></article>
    <section class="digest view" id="view-findings"></section>
    <section class="arg view" id="view-argument"></section>
  </div>

<script id="data" type="application/json">{"slug": "gadeke-2026-guilt-insula", "title": "Contributions of insula and superior temporal sulcus to interpersonal guilt and responsibility in social decisions", "authors": ["Maria Gädeke", "Tom Eric Willems", "Omar Salah Ahmed", "Bernd Weber", "Rene Hurlemann", "Johannes Schultz"], "year": "2026", "doi": "10.7554/eLife.105391", "url": "https://elifesciences.org/articles/105391", "github": "https://github.com/BonnSocialNeuroscienceUnit/ResponsibilityExperiment", "keywords": ["social decision-making", "decisions under risk", "computational modelling", "neuroimaging"], "summary": {"hypotheses": "The paper tests whether anterior insula encodes interpersonal guilt as responsibility-contingent affect following self-caused partner harm, whether momentary happiness incorporates partner reward prediction errors with a responsibility-weighted rule, and whether superior temporal sulcus represents partner experiential state via partner RPEs conditional on participant responsibility.", "claims": "Across an fMRI study (N=40) and a behavioural replication (N=44), happiness decreases more following low partner outcomes when the participant rather than the partner made the choice; a computational model with a socially-weighted partner-RPE term outperforms alternatives, with the social_pRPE weight reliably positive in both studies. Left anterior insula BOLD is elevated in Social relative to Partner trials after negative partner outcomes (peak MNI [-28, 24, -4]), left STS tracks partner RPEs specifically under participant responsibility, and gPPI reveals condition-dependent insula–right IFG coupling.", "inferences": "The convergence of behavioral, computational, and neural evidence onto a single anatomical claim localizes interpersonal guilt to anterior insula and identifies STS as a mentalizing locus for partner-state tracking gated by agency, reframing social decision-making under risk as a responsibility-weighted affective computation rather than a pure reward comparison. The partner-algorithm deception is a structural caveat all social claims inherit."}, "abstract": [{"text": "This study investigated the neural mechanisms involved in feelings of interpersonal guilt and responsibility evoked by social decisions in humans.", "claims": [], "type": "motivation"}, {"text": "In two studies (one during fMRI), participants repeatedly chose between safe and risky monetary outcomes in social contexts.", "claims": [], "type": "methods"}, {"text": "Across conditions, each participant chose for both themselves and a partner (Social condition), or the partner chose for both themselves and the participant (Partner condition), or the participant chose just for themselves (Solo condition, control).", "claims": [], "type": "methods"}, {"text": "If the risky option was chosen in the Social or Partner condition, participant and partner could each receive either the high or the low outcome of a lottery with 50% probability, independently of each other.", "claims": [], "type": "methods"}, {"text": "Participants were shown the outcomes for themselves and for their partner on each trial and reported their momentary happiness every few trials.", "claims": [], "type": "methods"}, {"text": "As expected, participant happiness decreased following both low lottery outcomes for themselves and for the partner.", "claims": ["happiness-correlates-partner-reward"], "type": "claim"}, {"text": "Crucially, happiness decreases following low outcomes for the partner were larger when the participant rather than their partner had made the choice, which fits an operational definition of guilt.", "claims": ["prediction-behavioral-guilt-effect", "guilt-reduces-happiness-after-partner-loss"], "type": "claim"}, {"text": "This guilt effect was associated with BOLD signal increase in the left anterior insula.", "claims": ["prediction-insula-tracks-guilt", "insula-tracks-guilt-effect"], "type": "claim"}, {"text": "Connectivity between this region and the right inferior frontal gyrus varied depending on choice and experimental condition, suggesting that this part of prefrontal cortex is sensitive to guilt-related information during social choices.", "claims": ["insula-ifg-connectivity-guilt"], "type": "claim"}, {"text": "Variations in happiness were well explained by computational models based on participants’ and partners’ rewards and reward prediction errors.", "claims": ["prediction-responsibility-model-wins-comparison", "responsibility-modulates-guilt-computational", "social-prpe-weight-positive"], "type": "claim"}, {"text": "A model-based analysis revealed a left superior temporal sulcus cluster that tracked partner reward prediction errors that followed participant choices.", "claims": ["prediction-sts-tracks-partner-rpe-under-responsibility", "sts-tracks-partner-reward-prediction-errors"], "type": "claim"}, {"text": "Our findings identify neural mechanisms of guilt and social responsibility during social decisions under risk.", "claims": ["hypothesis-insula-tracks-interpersonal-guilt", "hypothesis-sts-mentalizes-partner-state-under-responsibility"], "type": "claim"}], "sections": [{"id": "s1", "title": "Introduction", "depth": 1, "blocks": [{"type": "p", "html": "Imagine that you go out to dinner with a friend and it is your turn to choose the restaurant. You can choose between two restaurants: one that you both know well, with very predictable food of good quality, and a new restaurant that neither you nor your friend has eaten in before. You decide to try the new one. Unfortunately, while your dish is nice, your friend’s turns out to be worse than the known restaurant’s dishes. How would you feel? Would you feel differently if it had been your friend’s turn to choose the restaurant? Being responsible for such suboptimal outcomes for others can induce a feeling of interpersonal guilt, formally described as a negative emotional response to harming someone with whom one has a positive social bond (<span class=\"cite\">Baumeister, 1998<\/span>; <span class=\"cite\">Baumeister et al., 1994<\/span>; <span class=\"cite\">Berndsen et al., 2004<\/span>; <span class=\"cite\">Tangney et al., 2007<\/span>; <span class=\"cite\">Zeelenberg and Breugelmans, 2008<\/span>). Guilt influences decisions (e.g., <span class=\"cite\">Charness and Dufwenberg, 2006<\/span>), and abnormal sensitivity to guilt is associated with severe social dysfunctions ranging from psychopathy to depression and anxiety, depending on whether sensitivity to guilt is, respectively, reduced or increased (<span class=\"cite\">Tangney et al., 2007<\/span>)."}, {"type": "p", "html": "Several brain regions have been associated with the feeling of guilt: the anterior insula (aIns) (<span class=\"cite\">Bastin et al., 2016<\/span>; <span class=\"cite\">Lamm and Singer, 2010<\/span>; <span class=\"cite\">Piretti et al., 2023<\/span>), the dorsal cingulate cortex (<span class=\"cite\">Bastin et al., 2016<\/span>; <span class=\"cite\">Gifuni et al., 2017<\/span>) and the left temporo-parietal junction (<span class=\"cite\">Bastin et al., 2016<\/span>; <span class=\"cite\">Piretti et al., 2023<\/span>), the ventromedial prefrontal cortex (<span class=\"cite\">Krajbich et al., 2009<\/span>), and with various other regions and networks involved depending on the method used to induce guilt (<span class=\"cite\">Bastin et al., 2016<\/span>; <span class=\"cite\">Gifuni et al., 2017<\/span>). However, we are interested in the mechanisms involved in a specific, as yet understudied aspect of guilt: the kind that can result from everyday choices that expose others to an uncertain outcome. To study this, we built on findings from experimental social decision-making tasks."}, {"type": "p", "html": "Several studies have used games from behavioural economics or perceptual tasks linked to punishment of a partner. For example, participants behaving in accord with an economic definition of guilt aversion during a trust game showed activation in insula, supplementary motor area, dorsolateral prefrontal cortex (dlPFC) and temporal parietal junction (<span class=\"cite\">Chang et al., 2011<\/span>). In another study, partners received painful stimuli when participants made errors during a difficult perception task. These errors evoked activations in the left aIns and dlPFC in the participants (<span class=\"cite\">Koban et al., 2013<\/span>). In a variation of this task, participants could decide to bear a proportion of their partner’s pain (<span class=\"cite\">Yu et al., 2014<\/span>). The level of pain taken, indicative of guilt, and activations in anterior middle cingulate cortex and aIns were higher when the pain followed errors made only by the participant rather than by both players. A multivariate reanalysis of these two datasets revealed a neural signature for guilt (<span class=\"cite\">Yu et al., 2020<\/span>), with key regions including the anterior medial cingulate cortex, insula, inferior frontal gyrus (IFG), inferior temporal cortex, thalamus, and cerebellum."}, {"type": "p", "html": "One recent study paired the aforementioned perception-and-pain paradigm with dictator game decisions that allowed the participant to compensate for the partner’s outcome (<span class=\"cite\">Gao et al., 2018<\/span>). The guilt context increased advantageous-inequity aversion and decreased disadvantageous-inequity aversion and affected the neural correlates of these inequities (respectively, mentalizing-related and emotion- and conflict-related regions). Finally, another study contrasted guilt and shame: confederates either experienced economic loss due to bad participant advice (participants experienced guilt), or experienced no loss when participants’ bad advice was correctly refused by the confederate (participants experienced shame) (<span class=\"cite\">Zhu et al., 2019<\/span>). Guilt relative to shame activated supramarginal gyrus and temporo-parietal junction as well as orbitofrontal cortex, ventrolateral, and dorsolateral prefrontal cortex. Multivariate analyses revealed that guilt could be distinguished from shame based on activation in ventral anterior cingulate cortex and dorsomedial prefrontal cortex."}, {"type": "p", "html": "One landmark study reported on the mechanisms involved in seeking or avoiding responsibility in decisions affecting a group of individuals, and reported involvement of medial prefrontal cortex, aIns and temporo-parietal junction (<span class=\"cite\">Edelson et al., 2018<\/span>). In this elegant study, participants could delegate their choice between a risky and a safe option to a group or decide themselves; in separate conditions, the choice affected payoff either only for the participant or for all group members. Interestingly, most participants displayed responsibility aversion, and this effect could not be explained by guilt, suggesting people associate a psychological cost with assuming responsibility for others’ outcomes. However, in many situations, one does not have the possibility to delegate a decision to others, and choosing a risky option in such a case may evoke guilt when the outcome for others is negative. The neural mechanisms underlying guilt evoked during such situations of social responsibility are still unknown. These questions are the subject of the present study. Similarly to Edelson et al.’s and more recent studies (<span class=\"cite\">Arioli et al., 2023<\/span>; <span class=\"cite\">Fareri et al., 2022<\/span>), our paradigm leveraged a risky choice task with social conditions."}, {"type": "p", "html": "In our experiment, participants were paired with a partner and played an ‘ice-breaker’ game that created a positive social bond between them, increasing the likelihood of feeling empathy and guilt for each other (<span class=\"cite\">Baumeister, 1998<\/span>; <span class=\"cite\">Julle-Danière et al., 2020<\/span>; <span class=\"cite\">Loewenstein et al., 1989<\/span>). Participants or their partner then chose between risky and safe monetary options in three conditions (<a class=\"xref\" href=\"#fig1\">Figure 1<\/a>). In the <i>Social<\/i> condition, the outcome of choices affected both participant and partner; participants were and felt responsible for these outcomes because they had agency over their decisions and knew that they could have chosen otherwise (<span class=\"cite\">Frith, 2014<\/span>). We contrasted this condition with similar choices made by a simple expected-value-maximizing algorithm posing for the partner (<i>Partner<\/i> condition), and participant choices only affecting the participant themselves (<i>Solo<\/i> condition, acting as control). Importantly, we assessed the emotional impact of the outcomes of these choices by monitoring participants’ happiness every two trials (<span class=\"cite\">Rutledge et al., 2014<\/span>; <span class=\"cite\">Rutledge et al., 2016<\/span>). This allowed us to fit computational models to happiness data and search for networks sensitive to reward prediction errors resulting from participant or partner choices. We ran two experiments, Study 1 outside the MRI scanner and Study 2 during fMRI, with separate groups of participants."}, {"type": "fig", "id": "fig1"}, {"type": "p", "html": "We analysed our behavioural data using several complementary methods: choices were modelled with mixed-effects regressions serving as manipulation checks; risk preferences expressed in choices were assessed using a comprehensive expected utility model as well as with a simpler, more robust ‘risk premium’ approach; and happiness data were fitted, in addition to the computational models, with several linear mixed models (LMMs) to assess the impact of both the participant’s and their partner’s rewards, the impact of agency and their interactions. Inspired by findings reported in previous neuroimaging of social emotions, we also used several methods to analyse our fMRI data, including conventional methods (both region-of-interest and mass univariate); mixed-effects regression models; computational model-based analyses (inspired by, e.g., <span class=\"cite\">Konovalov et al., 2021a<\/span>; <span class=\"cite\">Rutledge et al., 2014<\/span>); and functional connectivity (e.g., <span class=\"cite\">Edelson et al., 2018<\/span>; <span class=\"cite\">Konovalov et al., 2021a<\/span>). The behavioural modelling is thus complemented by neuroimaging analyses that offer insight about both the activity in regions associated with guilt as well as their place in a wider network, providing an in-depth comprehensive analysis of the mechanisms behind guilt evoked by social responsibility."}]}, {"id": "s2", "title": "Results", "depth": 1, "blocks": [{"type": "sec", "sec": {"id": "s2-1", "title": "Behaviour", "depth": 2, "blocks": [{"type": "sec", "sec": {"id": "s2-1-1", "title": "Overview", "depth": 3, "blocks": [{"type": "p", "html": "We first verified that participants’ choices were reasonable in the <i>Solo<\/i> and <i>Social<\/i> conditions, then assessed whether these choices and the risk preferences they revealed changed depending on whether participants chose just for themselves (<i>solo<\/i>) or for themselves and the interaction partner (<i>social<\/i>). Next, we assessed whether momentary happiness varied with decision outcomes and whether responsibility influenced this relationship. Lastly, we fitted computational models to the happiness data. While Study 1 (behaviour only) was run before Study 2 (fMRI), we will report the results of both studies together as their results were highly consistent.", "sentences": [{"text": "Next, we assessed whether momentary happiness varied with decision outcomes and whether responsibility influenced this relationship.", "claims": [], "gap": false}, {"text": "Lastly, we fitted computational models to the happiness data.", "claims": [], "gap": false}, {"text": "While Study 1 (behaviour only) was run before Study 2 (fMRI), we will report the results of both studies together as their results were highly consistent.", "claims": [], "gap": false}]}]}}, {"type": "sec", "sec": {"id": "s2-1-2", "title": "Choices: manipulation check", "depth": 3, "blocks": [{"type": "p", "html": "As expected, participants’ probability of choosing the risky option (lottery) increased with the difference between the expected value of the lottery and the value of the safe option (Study 1: <a class=\"xref\" href=\"#fig2\">Figure 2A<\/a>, <i>t<\/i>(4796) = 9.26, p < 3.1e<sup>–20<\/sup>, <i>β<\/i> = 0.074, 95% CI = [0.059 0.090]; Study 2: <a class=\"xref\" href=\"#fig2\">Figure 2D<\/a>, <i>t<\/i>(3829) <i>=<\/i> 10.62, p < 5.3e<sup>–26<\/sup>, <i>β<\/i> = 0.093, 95% CI = [0.075 0.110]; mixed-effects regressions, see Equation 1, detailed results are reported in Appendix 1—table 1). Participants chose the lottery more often in the <i>Solo<\/i> condition than in the <i>Social<\/i> condition in Study 1 (<i>t<\/i>(4796) = 2.54, p = 0.011, <i>β<\/i> = 0.164, 95% CI = [0.038 0.291]), but this difference was not found in Study 2 (<i>t<\/i>(3829) = 0.23, p = 0.82, <i>β<\/i> = 0.015, 95% CI = [–0.109 0.138]). There was no significant interaction between the difference in expected values and experimental conditions in either study (p > 0.52).", "sentences": [{"text": "As expected, participants’ probability of choosing the risky option (lottery) increased with the difference between the expected value of the lottery and the value of the safe option (Study 1: Figure 2A , t (4796) = 9.26, p < 3.1e –20 , β = 0.074, 95% CI = [0.059 0.090]; Study 2: Figure 2D , t (3829) = 10.62, p < 5.3e –26 , β = 0.093, 95% CI = [0.075 0.110]; mixed-effects regressions, see Equation 1 , detailed results are reported in Appendix 1—table 1 ).", "claims": ["lottery-choice-increases-with-ev"], "gap": false}, {"text": "Participants chose the lottery more often in the Solo condition than in the Social condition in Study 1 ( t (4796) = 2.54, p = 0.011, β = 0.164, 95% CI = [0.038 0.291]), but this difference was not found in Study 2 ( t (3829) = 0.23, p = 0.82, β = 0.015, 95% CI = [–0.109 0.138]).", "claims": ["solo-vs-social-choice-difference"], "gap": false}, {"text": "There was no significant interaction between the difference in expected values and experimental conditions in either study (p > 0.52).", "claims": [], "gap": true}]}, {"type": "fig", "id": "fig2"}]}}, {"type": "sec", "sec": {"id": "s2-1-3", "title": "Choices: risk preferences", "depth": 3, "blocks": [{"type": "p", "html": "To better assess whether people’s risk preferences varied between the <i>Solo<\/i> and the <i>Social<\/i> condition, we evaluated two additional measures. First, we calculated for each participant a ‘risk premium’, defined as the difference between the expected value of a lottery and its certainty equivalent (see Equation 2 in Methods; positive risk premiums indicate risk aversion). Second, we used an expected utility theory (EUT) approach to calculate a parameter <i>ρ<\/i> that describes a decision-maker’s risk attitude under the assumption of constant absolute risk aversion (see Equation 3 in Methods). We used two measures because fitting the EUT model, the more comprehensive measure that takes into account all choices of a participant, requires many trials to be fitted reliably, a condition that was not satisfied in many participants of both studies; in contrast, the risk premium’s single-point measure of risk aversion could be estimated in all participants. Risk premiums did not differ between <i>Social<\/i> and <i>Solo<\/i> conditions (Study 1: <a class=\"xref\" href=\"#fig2\">Figure 2B<\/a>, <i>t<\/i>(39) = 1.53, p = 0.134, Cohen’s <i>d<\/i> = 0.24, <i>BF<\/i><sub>10<\/sub> = 0.49; Study 2: <a class=\"xref\" href=\"#fig2\">Figure 2E<\/a>, <i>t<\/i>(43) = –0.21, p = 0.84, <i>d<\/i> = –0.03, <i>BF<\/i><sub>10<\/sub> = 0.17). Turning to the EUT approach, as differences in risk attitudes for gains and losses are well known (<span class=\"cite\">Kahneman and Tversky, 1979<\/span>), we first estimated <i>ρ<\/i> separately for gain and loss trials. As the number of these types of trials varied across participants, we only obtained reliable estimates for both types of trials in some participants (Study 1: 18 of 40; Study 2: 16 of 44). As <i>ρ<\/i> did not vary between gain and loss trials (Study 1: <i>t<\/i>(17) = 0.21, p = 0.84, <i>d<\/i> = 0.05; Study 2: <i>t<\/i>(15) = –0.61, p = 0.55, <i>d<\/i> = 0.15; paired <i>t<\/i>-test), we then pooled across gain and loss trials, then estimated and compared <i>ρ<\/i> for the <i>Solo<\/i> and <i>Social<\/i> conditions using paired <i>t<\/i>-tests. We found that participants were slightly more risk averse in the <i>Social<\/i> than in the <i>Solo<\/i> condition in Study 1 (<a class=\"xref\" href=\"#fig2\">Figure 2C<\/a>, <i>t<\/i>(39) = 2.27, p = 0.03, <i>d<\/i> = 0.36, <i>BF<\/i><sub>10<\/sub> = 1.69) but not in Study 2Study 2 (<a class=\"xref\" href=\"#fig2\">Figure 2F<\/a>, <i>t<\/i>(43) = 1.40, p = 0.17, <i>d<\/i> = 0.21, <i>BF<\/i><sub>10<\/sub> = 0.41). Risk premium and <i>ρ<\/i> were highly consistent with each other across participants in both conditions for both studies (Study 1: <i>Solo<\/i> condition: <i>F<\/i>(1,38) = 69.9, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.65; <i>Social<\/i> condition: <i>F<\/i>(1,38) = 42.0, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.55; Study 2: <i>Solo<\/i> condition: <i>F<\/i>(1,41) = 57.9, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.59; <i>Social<\/i> condition: <i>F<\/i>(1,41) = 74.2, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.64; these and all subsequent regressions are robust).", "sentences": [{"text": "To better assess whether people’s risk preferences varied between the Solo and the Social condition, we evaluated two additional measures.", "claims": [], "gap": false}, {"text": "First, we calculated for each participant a ‘risk premium’, defined as the difference between the expected value of a lottery and its certainty equivalent (see Equation 2 in Methods; positive risk premiums indicate risk aversion).", "claims": [], "gap": false}, {"text": "Second, we used an expected utility theory (EUT) approach to calculate a parameter ρ that describes a decision-maker’s risk attitude under the assumption of constant absolute risk aversion (see Equation 3 in Methods).", "claims": [], "gap": false}, {"text": "We used two measures because fitting the EUT model, the more comprehensive measure that takes into account all choices of a participant, requires many trials to be fitted reliably, a condition that was not satisfied in many participants of both studies; in contrast, the risk premium’s single-point measure of risk aversion could be estimated in all participants.", "claims": [], "gap": false}, {"text": "Risk premiums did not differ between Social and Solo conditions (Study 1: Figure 2B , t (39) = 1.53, p = 0.134, Cohen’s d = 0.24, BF 10 = 0.49; Study 2: Figure 2E , t (43) = –0.21, p = 0.84, d = –0.03, BF 10 = 0.17).", "claims": ["risk-premiums-null-social-solo"], "gap": false}, {"text": "Turning to the EUT approach, as differences in risk attitudes for gains and losses are well known ( Kahneman and Tversky, 1979 ), we first estimated ρ separately for gain and loss trials.", "claims": [], "gap": false}, {"text": "As the number of these types of trials varied across participants, we only obtained reliable estimates for both types of trials in some participants (Study 1: 18 of 40; Study 2: 16 of 44).", "claims": [], "gap": false}, {"text": "As ρ did not vary between gain and loss trials (Study 1: t (17) = 0.21, p = 0.84, d = 0.05; Study 2: t (15) = –0.61, p = 0.55, d = 0.15; paired t -test), we then pooled across gain and loss trials, then estimated and compared ρ for the Solo and Social conditions using paired t -tests.", "claims": ["risk-premiums-null-social-solo"], "gap": false}, {"text": "We found that participants were slightly more risk averse in the Social than in the Solo condition in Study 1 ( Figure 2C , t (39) = 2.27, p = 0.03, d = 0.36, BF 10 = 1.69) but not in Study 2Study 2 ( Figure 2F , t (43) = 1.40, p = 0.17, d = 0.21, BF 10 = 0.41).", "claims": [], "gap": true}, {"text": "Risk premium and ρ were highly consistent with each other across participants in both conditions for both studies (Study 1: Solo condition: F (1,38) = 69.9, p < 0.001, R 2 = 0.65; Social condition: F (1,38) = 42.0, p < 0.001, R 2 = 0.55; Study 2: Solo condition: F (1,41) = 57.9, p < 0.001, R 2 = 0.59; Social condition: F (1,41) = 74.2, p < 0.001, R 2 = 0.64; these and all subsequent regressions are robust).", "claims": ["guilt-effect-independent-of-own-outcome"], "gap": false}]}, {"type": "p", "html": "In sum, participants showed very similar risk preferences when making decisions affecting only themselves (<i>Solo<\/i> condition) or themselves and their partner (<i>Social<\/i> condition), with a tendency towards higher risk aversion in the <i>Social<\/i> condition in Study 1."}]}}, {"type": "sec", "sec": {"id": "s2-1-4", "title": "Momentary happiness: links to reward", "depth": 3, "blocks": [{"type": "p", "html": "Momentary happiness was assessed every two trials in a similar manner to previous studies by <span class=\"cite\">Rutledge et al., 2014<\/span>; <span class=\"cite\">Rutledge et al., 2016<\/span>. Across all trials, in both studies, participant momentary happiness correlated with rewards obtained in the current trial by the participant and by the partner (Correlations with participant reward, Study 1: <i>F<\/i>(1,3598) = 691.5, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.16; partner reward, Study 1: <i>F<\/i>(1,2426) = 128.6, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.05; participant reward, Study 2: <i>F<\/i>(1,2630) = 650.8, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.20; partner reward, Study 2: <i>F<\/i>(1,1735) = 111.8, p < 0.001, <i>R<\/i><sup>2<\/sup> = 0.06; <a class=\"xref\" href=\"#fig3\">Figure 3A, B, E, F<\/a>). Based on previous findings (<span class=\"cite\">Rutledge et al., 2016<\/span>), we reasoned that participants’ momentary happiness would be influenced not only by rewards obtained in the current trial, but also by expected rewards, reward prediction errors, rewards received in previous trials, and differences between rewards obtained by the participant and the partner. Crucial for our research question, we aimed to assess whether responsibility for these rewards, that is, taking into account whether the rewards occurred following choices made by the participant or the partner, would also influence variations in happiness.", "sentences": [{"text": "Across all trials, in both studies, participant momentary happiness correlated with rewards obtained in the current trial by the participant and by the partner (Correlations with participant reward, Study 1: F (1,3598) = 691.5, p < 0.001, R 2 = 0.16; partner reward, Study 1: F (1,2426) = 128.6, p < 0.001, R 2 = 0.05; participant reward, Study 2: F (1,2630) = 650.8, p < 0.001, R 2 = 0.20; partner reward, Study 2: F (1,1735) = 111.8, p < 0.001, R 2 = 0.06; Figure 3A, B, E, F ).", "claims": ["happiness-correlates-partner-reward"], "gap": false}, {"text": "Based on previous findings ( Rutledge et al., 2016 ), we reasoned that participants’ momentary happiness would be influenced not only by rewards obtained in the current trial, but also by expected rewards, reward prediction errors, rewards received in previous trials, and differences between rewards obtained by the participant and the partner.", "claims": [], "gap": false}, {"text": "Crucial for our research question, we aimed to assess whether responsibility for these rewards, that is, taking into account whether the rewards occurred following choices made by the participant or the partner, would also influence variations in happiness.", "claims": [], "gap": false}]}, {"type": "fig", "id": "fig3"}, {"type": "p", "html": "Following Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors arising from those expectations, we fitted computational models to each participant’s happiness data. In these models, certain rewards, the expected value of chosen lotteries, reward prediction errors and additional outcome parameters are modelled separately with influences that decay exponentially with time (see Methods for equations and details). We first fitted a ‘<i>Basic<\/i>’ model (Equation 4) containing regressors coding for certain reward, expected value of chosen lotteries and participant reward prediction errors to evaluate whether these fundamental reward variables explained variations in momentary happiness. This model explained the data reasonably well (see Table 1). Next, based on the notion that inequality between rewards received by the participant and the partner would influence happiness (e.g., <span class=\"cite\">Loewenstein et al., 1989<\/span>), we assessed the fit of an ‘<i>Inequality<\/i>’ model that included one term modelling the difference between the participant and partner outcomes (Equation 5). We also assessed the fit of <span class=\"cite\">Rutledge et al., 2016<\/span> ‘<i>Guilt-envy<\/i>’ model in which advantageous and disadvantageous inequality were modelled separately (Equation 6). Next, we tested a ‘<i>Responsibility<\/i>’ model in which separate terms represented the partner’s reward prediction errors resulting from choices made by the participant and by the partner (Equation 7). Finally, we optimized the Responsibility model by removing the regressor modelling partner reward prediction errors resulting from choices made by the partner, yielding a ‘<i>Responsibility Redux<\/i>’ model (Equation 8).", "sentences": [{"text": "Following Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors arising from those expectations, we fitted computational models to each participant’s happiness data.", "claims": [], "gap": false}, {"text": "In these models, certain rewards, the expected value of chosen lotteries, reward prediction errors and additional outcome parameters are modelled separately with influences that decay exponentially with time (see Methods for equations and details).", "claims": [], "gap": false}, {"text": "We first fitted a ‘ Basic ’ model ( Equation 4 ) containing regressors coding for certain reward, expected value of chosen lotteries and participant reward prediction errors to evaluate whether these fundamental reward variables explained variations in momentary happiness.", "claims": [], "gap": false}, {"text": "This model explained the data reasonably well (see Table 1 ).", "claims": ["responsibility-modulates-guilt-computational"], "gap": false}, {"text": "Next, based on the notion that inequality between rewards received by the participant and the partner would influence happiness (e.g., Loewenstein et al., 1989 ), we assessed the fit of an ‘ Inequality ’ model that included one term modelling the difference between the participant and partner outcomes ( Equation 5 ).", "claims": [], "gap": false}, {"text": "We also assessed the fit of Rutledge et al., 2016 ‘ Guilt-envy ’ model in which advantageous and disadvantageous inequality were modelled separately ( Equation 6 ).", "claims": [], "gap": false}, {"text": "Next, we tested a ‘ Responsibility ’ model in which separate terms represented the partner’s reward prediction errors resulting from choices made by the participant and by the partner ( Equation 7 ).", "claims": [], "gap": false}, {"text": "Finally, we optimized the Responsibility model by removing the regressor modelling partner reward prediction errors resulting from choices made by the partner, yielding a ‘ Responsibility Redux ’ model ( Equation 8 ).", "claims": [], "gap": false}]}, {"type": "p", "html": "All models explained variations in happiness reasonably well (Table 1). Overall, the <i>Responsibility<\/i> and <i>Responsibility Redux<\/i> (<a class=\"xref\" href=\"#fig3\">Figure 3C, G<\/a>) models explained the data best (highest <i>R<\/i><sup>2<\/sup>/adjusted <i>R<\/i><sup>2<\/sup> or lowest AIC/BIC); a likelihood ratio test (Equation 9) revealed that the <i>Responsibility<\/i> model fitted better than all the other models, including the <i>Responsibility Redux<\/i> model (Study 1: all LR ≥47.36, p < 0.0001; Study 2: all LR ≥77.83, p < 0.0001). We also compared the <i>R<\/i><sup>2<\/sup> and adjusted <i>R<\/i><sup>2<\/sup> values obtained for each participant and model using <i>t<\/i>-tests, for both studies (average values are reported in Table 1). The <i>Responsibility<\/i> model yielded higher <i>R<\/i><sup>2<\/sup> values than all the other models (Study 1: all <i>t<\/i> > 3.6, p < 0.007; Study 2: all <i>t<\/i> > 2.9, p < 0.034; Bonferroni-corrected <i>t<\/i>-tests) except for the <i>Guilt-envy<\/i> model in the data of Study 1 (<i>t<\/i> = 2.19, p = 0.17). The <i>Responsibility<\/i> and <i>Responsibility Redux<\/i> models yielded higher <i>adjusted R<\/i><sup>2<\/sup> than the <i>Basic<\/i> model (Study 1: all <i>t<\/i> > 3.6, p < 0.01; Study 2: all <i>t<\/i> > 3.6, p < 0.01). Weights for certain rewards, expected value of the lotteries, participant reward prediction errors and the forgetting factor <i>γ<\/i> were overall positive across participants, models and studies (Study 1: all <i>Z<\/i> > 5.4, p < 0.0001; Study 2: all <i>Z<\/i> > 4.9, p < 0.0001, Wilcoxon sign-rank tests were used because data were not normally distributed). Medians of the forgetting factor <i>γ<\/i> varied little across models, ranging from 0.39 to 0.44 in Study 1 and from 0.42 to 0.46 in Study 2, indicating stable influences of previous trials on happiness across models. Participants’ reward prediction errors (sRPE) influenced happiness more than partner’s reward prediction errors, whether the latter resulted from the participant or the partner’s choices (respectively, <i>social_pRPE<\/i> and <i>partner_pRPE<\/i>): weights for <i>sRPE<\/i> were higher than for <i>social_pRPE<\/i> or <i>partner_pRPE<\/i> (Study 1: all <i>Z<\/i> > 6.0, p < 0.001; Study 2: all <i>Z<\/i> > 3.7, p < 0.003). The stability of these estimated parameters was verified using a parameter recovery procedure (see Methods and <a class=\"xref\" href=\"#fig3s1\">Figure 3—figure supplement 1<\/a>). These results thus replicate the finding that outcomes of risky social decisions influence momentary happiness (<span class=\"cite\">Rutledge et al., 2016<\/span>). Crucially, we find here that the partner’s reward prediction errors (<i>social_pRPE<\/i> and <i>partner_pRPE<\/i>) contributed to explaining changes in participants’ momentary happiness: the <i>Responsibility<\/i> and <i>ResponsibilityRedux<\/i> models explained the data better than the models without these parameters (see Table 1). In particular, the partner’s reward prediction errors resulting from the participants’ decisions (<i>social_pRPE<\/i>), that is, those pRPE for which participants were responsible contributed to explaining our data (weights for <i>social_pRPE<\/i> were greater than 0: <i>Responsibility model<\/i>: Study 1: <i>Z<\/i> = 2.85, p = 0.004, Study 2: <i>Z<\/i> = 3.26, p = 0.001; <i>ResponsibilityRedux model<\/i>: Study 1: <i>Z<\/i> = 2.93, p = 0.003, Study 2: <i>Z<\/i> = 3.30, p = 0.001; weights for <i>social_pRPE<\/i> tended to be higher than weights for <i>partner_pRPE: Responsibility model<\/i>: Study 1: <i>Z<\/i> = 2.14, p = 0.033; Study 2: <i>Z<\/i> = 1.41, p = 0.16).", "sentences": [{"text": "All models explained variations in happiness reasonably well ( Table 1 ).", "claims": ["responsibility-modulates-guilt-computational"], "gap": false}, {"text": "Overall, the Responsibility and Responsibility Redux ( Figure 3C, G ) models explained the data best (highest R 2 /adjusted R 2 or lowest AIC/BIC); a likelihood ratio test ( Equation 9 ) revealed that the Responsibility model fitted better than all the other models, including the Responsibility Redux model (Study 1: all LR ≥47.36, p < 0.0001; Study 2: all LR ≥77.83, p < 0.0001).", "claims": ["agency-reduces-happiness"], "gap": false}, {"text": "We also compared the R 2 and adjusted R 2 values obtained for each participant and model using t -tests, for both studies (average values are reported in Table 1 ).", "claims": ["responsibility-modulates-guilt-computational"], "gap": false}, {"text": "The Responsibility model yielded higher R 2 values than all the other models (Study 1: all t > 3.6, p < 0.007; Study 2: all t > 2.9, p < 0.034; Bonferroni-corrected t -tests) except for the Guilt-envy model in the data of Study 1 ( t = 2.19, p = 0.17).", "claims": ["responsibility-modulates-guilt-computational"], "gap": false}, {"text": "The Responsibility and Responsibility Redux models yielded higher adjusted R 2 than the Basic model (Study 1: all t > 3.6, p < 0.01; Study 2: all t > 3.6, p < 0.01).", "claims": ["responsibility-modulates-guilt-computational"], "gap": false}, {"text": "Weights for certain rewards, expected value of the lotteries, participant reward prediction errors and the forgetting factor γ were overall positive across participants, models and studies (Study 1: all Z > 5.4, p < 0.0001; Study 2: all Z > 4.9, p < 0.0001, Wilcoxon sign-rank tests were used because data were not normally distributed).", "claims": ["agency-reduces-happiness"], "gap": false}, {"text": "Medians of the forgetting factor γ varied little across models, ranging from 0.39 to 0.44 in Study 1 and from 0.42 to 0.46 in Study 2, indicating stable influences of previous trials on happiness across models.", "claims": [], "gap": false}, {"text": "Participants’ reward prediction errors (sRPE) influenced happiness more than partner’s reward prediction errors, whether the latter resulted from the participant or the partner’s choices (respectively, social_pRPE and partner_pRPE ): weights for sRPE were higher than for social_pRPE or partner_pRPE (Study 1: all Z > 6.0, p < 0.001; Study 2: all Z > 3.7, p < 0.003).", "claims": ["guilt-effect-independent-of-own-outcome"], "gap": false}, {"text": "The stability of these estimated parameters was verified using a parameter recovery procedure (see Methods and Figure 3—figure supplement 1 ).", "claims": [], "gap": false}, {"text": "These results thus replicate the finding that outcomes of risky social decisions influence momentary happiness ( Rutledge et al., 2016 ).", "claims": [], "gap": false}, {"text": "Crucially, we find here that the partner’s reward prediction errors ( social_pRPE and partner_pRPE ) contributed to explaining changes in participants’ momentary happiness: the Responsibility and ResponsibilityRedux models explained the data better than the models without these parameters (see Table 1 ).", "claims": ["responsibility-modulates-guilt-computational"], "gap": false}, {"text": "In particular, the partner’s reward prediction errors resulting from the participants’ decisions ( social_pRPE ), that is, those pRPE for which participants were responsible contributed to explaining our data (weights for social_pRPE were greater than 0: Responsibility model : Study 1: Z = 2.85, p = 0.004, Study 2: Z = 3.26, p = 0.001; ResponsibilityRedux model : Study 1: Z = 2.93, p = 0.003, Study 2: Z = 3.30, p = 0.001; weights for social_pRPE tended to be higher than weights for partner_pRPE: Responsibility model : Study 1: Z = 2.14, p = 0.033; Study 2: Z = 1.41, p = 0.16).", "claims": ["social-prpe-weight-positive"], "gap": false}]}]}}, {"type": "sec", "sec": {"id": "s2-1-5", "title": "Momentary happiness: effects of agency, responsibility, and guilt", "depth": 3, "blocks": [{"type": "p", "html": "Next, we assessed whether happiness varied depending on the participant’s agency (<i>Social + Solo<\/i> vs. <i>Partner<\/i>), and found happiness to be lower when the participant chose, independent of the outcome (Study 1: <i>t<\/i>(3600) = –3.92, p < 0.0001, <i>β<\/i> = –0.14, 95% CI = [−0.20 to 0.07]; Study 2: <i>t<\/i>(2870) = –6.07, p < 0.0001, <i>β<\/i> = –0.24, 95% CI = [−0.31 to 0.16]). This is interesting in itself and may reflect the drive behind responsibility aversion reported by Edelson et al.’s 2018 study: being assigned the role of the decider in a social setting may make people slightly unhappy, perhaps due to ‘weight of the responsibility’. To specifically search for a sign of interpersonal guilt, we analysed happiness values reported after outcomes of lottery choices in the <i>Social<\/i> and <i>Partner<\/i> conditions using conventional LMMs (Equation 10). Fitting several models revealed that lottery outcomes influenced happiness, and that the identity of the decision-maker played a role (Appendix 1—table 2). Crucially, the interaction between partner outcome and decision-maker was significant (Study 1: <i>t<\/i>(1180) = 3.52, p = 0.0004, <i>β<\/i> = 0.37, 95% CI = [0.16 0.58]; Study 2: <i>t<\/i>(937) = 2.85, p = 0.0045, <i>β<\/i> = 0.33, 95% CI = [0.10 0.56]). When the partner received the low lottery outcome, participant happiness was lower when they rather than the partner had chosen the lottery (<a class=\"xref\" href=\"#fig3\">Figure 3D, H<\/a>). When the partner received the low lottery outcome of a participant-chosen lottery, they would presumably feel let down because the participant could have chosen the better safe option. As participants knew this, they were likely to feel ‘simple guilt’ (<span class=\"cite\">Battigalli and Dufwenberg, 2007<\/span>). This behavioural effect (difference in happiness obtained when the partner received low lottery outcomes after participant rather than partner choices) is thus compatible with ‘simple guilt’, and we will thus refer to it as ‘guilt effect’. The ‘guilt effect’ occurred whether the participant received the high lottery outcome (Study 1: <i>t<\/i>(39) = –3.58, p < 0.001, <i>d<\/i> = 0.56, <i>BF<\/i><sub>10<\/sub> = 32; Study 2: <i>t<\/i>(43) = –2.68, p = 0.01, <i>d<\/i> = 0.4, <i>BF<\/i><sub>10<\/sub> = 3.8) or the low lottery outcome (Study 1: <i>t<\/i>(39) = –3.39, p = 0.002, <i>d<\/i> = 0.54, <i>BF<\/i><sub>10<\/sub> = 19; Study 2: <i>t<\/i>(43) = –3.58, p < 0.001, <i>d<\/i> = 0.54, <i>BF<\/i><sub>10<\/sub> = 33.5). In Study 2, we will compare individual ‘guilt effect’ values to individual guilt-related brain activation patterns (see end of the section on BOLD signal results). Responsibility for choices did not influence happiness following positive lottery outcomes for the partner (both studies, all |<i>t|<\/i> < 1.3, p > 0.2, <i>BF<\/i><sub>10<\/sub> < 0.2).", "sentences": [{"text": "Next, we assessed whether happiness varied depending on the participant’s agency ( Social + Solo vs. Partner ), and found happiness to be lower when the participant chose, independent of the outcome (Study 1: t (3600) = –3.92, p < 0.0001, β = –0.14, 95% CI = [−0.20 to 0.07]; Study 2: t (2870) = –6.07, p < 0.0001, β = –0.24, 95% CI = [−0.31 to 0.16]).", "claims": ["agency-reduces-happiness"], "gap": false}, {"text": "This is interesting in itself and may reflect the drive behind responsibility aversion reported by Edelson et al.’s 2018 study: being assigned the role of the decider in a social setting may make people slightly unhappy, perhaps due to ‘weight of the responsibility’.", "claims": [], "gap": false}, {"text": "To specifically search for a sign of interpersonal guilt, we analysed happiness values reported after outcomes of lottery choices in the Social and Partner conditions using conventional LMMs ( Equation 10 ).", "claims": [], "gap": false}, {"text": "Fitting several models revealed that lottery outcomes influenced happiness, and that the identity of the decision-maker played a role ( Appendix 1—table 2 ).", "claims": ["agency-reduces-happiness"], "gap": false}, {"text": "Crucially, the interaction between partner outcome and decision-maker was significant (Study 1: t (1180) = 3.52, p = 0.0004, β = 0.37, 95% CI = [0.16 0.58]; Study 2: t (937) = 2.85, p = 0.0045, β = 0.33, 95% CI = [0.10 0.56]).", "claims": ["guilt-reduces-happiness-after-partner-loss"], "gap": false}, {"text": "When the partner received the low lottery outcome, participant happiness was lower when they rather than the partner had chosen the lottery ( Figure 3D, H ).", "claims": ["guilt-effect-independent-of-own-outcome"], "gap": false}, {"text": "When the partner received the low lottery outcome of a participant-chosen lottery, they would presumably feel let down because the participant could have chosen the better safe option.", "claims": [], "gap": false}, {"text": "As participants knew this, they were likely to feel ‘simple guilt’ ( Battigalli and Dufwenberg, 2007 ).", "claims": [], "gap": false}, {"text": "This behavioural effect (difference in happiness obtained when the partner received low lottery outcomes after participant rather than partner choices) is thus compatible with ‘simple guilt’, and we will thus refer to it as ‘guilt effect’.", "claims": [], "gap": false}, {"text": "The ‘guilt effect’ occurred whether the participant received the high lottery outcome (Study 1: t (39) = –3.58, p < 0.001, d = 0.56, BF 10 = 32; Study 2: t (43) = –2.68, p = 0.01, d = 0.4, BF 10 = 3.8) or the low lottery outcome (Study 1: t (39) = –3.39, p = 0.002, d = 0.54, BF 10 = 19; Study 2: t (43) = –3.58, p < 0.001, d = 0.54, BF 10 = 33.5).", "claims": ["guilt-effect-independent-of-own-outcome"], "gap": false}, {"text": "In Study 2, we will compare individual ‘guilt effect’ values to individual guilt-related brain activation patterns (see end of the section on BOLD signal results).", "claims": [], "gap": false}, {"text": "Responsibility for choices did not influence happiness following positive lottery outcomes for the partner (both studies, all | t| < 1.3, p > 0.2, BF 10 < 0.2).", "claims": [], "gap": true}]}, {"type": "p", "html": "In sum, in both studies, we found evidence that participants’ happiness was influenced by the outcomes of choices for their partner, especially by outcomes resulting from participant decisions, that is, partner outcomes for which participants were responsible. Within these outcomes, participants felt worse following low lottery outcomes for the partner if those outcomes were consequences of their own choice rather than the partner’s, which we interpret as interpersonal guilt.", "sentences": [{"text": "In sum, in both studies, we found evidence that participants’ happiness was influenced by the outcomes of choices for their partner, especially by outcomes resulting from participant decisions, that is, partner outcomes for which participants were responsible.", "claims": [], "gap": false}, {"text": "Within these outcomes, participants felt worse following low lottery outcomes for the partner if those outcomes were consequences of their own choice rather than the partner’s, which we interpret as interpersonal guilt.", "claims": [], "gap": false}]}]}}]}}, {"type": "sec", "sec": {"id": "s2-2", "title": "BOLD signal", "depth": 2, "blocks": [{"type": "p", "html": "Next, we sought to uncover the neural mechanisms associated with our guilt effect and those involved in tracking consequences of participants’ decisions on their partner. We analysed the BOLD responses of brain regions engaged during decision-making and at the time of receiving the outcomes of the choice using conventional as well as computational model-based analyses, using the fMRI data collected in Study 2.", "sentences": [{"text": "Next, we sought to uncover the neural mechanisms associated with our guilt effect and those involved in tracking consequences of participants’ decisions on their partner.", "claims": [], "gap": false}]}, {"type": "sec", "sec": {"id": "s2-2-1", "title": "Brain regions engaged during social decision-making", "depth": 3, "blocks": [{"type": "p", "html": "Given that our task involved several conditions and successive trial components, we aimed to first replicate previous results related to the neural correlates of decisions under economic risk. We searched for brain regions engaged more when participants chose the risky instead of the safe option and found such responses in the bilateral ventral striatum (Cohen’s <i>d<\/i> = 0.72 and 0.85 in the left and right clusters, respectively; <a class=\"xref\" href=\"#fig4\">Figure 4A<\/a> and Appendix 1—table 3), which replicates previous findings (<span class=\"cite\">Cui et al., 2022<\/span>; <span class=\"cite\">Preuschoff et al., 2006<\/span>). Next, we aimed to identify the brain regions associated with social decision-making under risk and searched for regions more engaged during decisions in the <i>Social<\/i> condition compared to the <i>Solo<\/i> condition. Three significant clusters of voxels were identified (<a class=\"xref\" href=\"#fig4\">Figure 4B<\/a> and Appendix 1—table 3), in the precuneus (<i>d<\/i> = 0.79), the left temporo-parietal junction (TPJ; <i>d<\/i> = 0.59) and the medial prefrontal cortex (mPFC; <i>d<\/i> = 0.54). This also replicates previous findings associating this region with social decisions (e.g., <span class=\"cite\">Fareri et al., 2012<\/span>; <span class=\"cite\">Jung et al., 2013<\/span>; <span class=\"cite\">Nicolle et al., 2012<\/span>; <span class=\"cite\">Ogawa et al., 2018<\/span>; <span class=\"cite\">Piva et al., 2019<\/span>).", "sentences": [{"text": "We searched for brain regions engaged more when participants chose the risky instead of the safe option and found such responses in the bilateral ventral striatum (Cohen’s d = 0.72 and 0.85 in the left and right clusters, respectively; Figure 4A and Appendix 1—table 3 ), which replicates previous findings ( Cui et al., 2022 ; Preuschoff et al., 2006 ).", "claims": ["ventral-striatum-tracks-risky-choices"], "gap": false}, {"text": "Next, we aimed to identify the brain regions associated with social decision-making under risk and searched for regions more engaged during decisions in the Social condition compared to the Solo condition.", "claims": [], "gap": false}, {"text": "Three significant clusters of voxels were identified ( Figure 4B and Appendix 1—table 3 ), in the precuneus ( d = 0.79), the left temporo-parietal junction (TPJ; d = 0.59) and the medial prefrontal cortex (mPFC; d = 0.54).", "claims": ["precuneus-tpj-mpfc-social-decisions"], "gap": false}, {"text": "This also replicates previous findings associating this region with social decisions (e.g., Fareri et al., 2012 ; Jung et al., 2013 ; Nicolle et al., 2012 ; Ogawa et al., 2018 ; Piva et al., 2019 ).", "claims": [], "gap": false}]}, {"type": "fig", "id": "fig4"}, {"type": "p", "html": "To assess whether activations in these five regions were sensitive to the interaction between choice and condition using a sensitive method, we analysed the responses in all the voxels in these regions using LMMs. Our model included factors <i>Choice<\/i> (<i>Safe<\/i> or <i>Risky<\/i>), <i>Condition<\/i> (<i>Social<\/i>, <i>Partner<\/i> or <i>Solo<\/i>), <i>Run<\/i> (run one or two), and <i>ROI<\/i> (left and right ventral striatum, mPFC, precuneus, and TPJ), with all interactions. We also tested the same model without the factor <i>Run<\/i>, but this fitted less well (higher BIC) and was thus discarded. As all factors and interactions were significant (data not shown for sake of brevity), we applied the same models to each region separately (Appendix 1—table 4). All regions showed a significant interaction between <i>Condition<\/i> and <i>Choice<\/i>, prompting us to examine these responses in detail. As we were particularly interested in the response to <i>Risky<\/i> decisions, we subtracted from it the responses to <i>Safe<\/i> decisions (labelled as ‘(R–S)’ in <a class=\"xref\" href=\"#fig4\">Figure 4C<\/a>) and compared this difference between (1) <i>Social<\/i> and <i>Solo<\/i> conditions, and (2) between the <i>Social<\/i> and <i>Partner<\/i> conditions using LMMs. As above, we tested these models both with and without the factor <i>Run<\/i> and associated interaction, and we report the best-fitting model (see Appendix 1—table 5 and Appendix 1—table 6). Only the precuneus and TPJ showed positive differences in both comparisons (<a class=\"xref\" href=\"#fig4\">Figure 4C<\/a>), indicating that these regions were most active when participants chose the lottery in the <i>Social<\/i> condition, the critical situation in which participants assume responsibility over others.", "sentences": [{"text": "To assess whether activations in these five regions were sensitive to the interaction between choice and condition using a sensitive method, we analysed the responses in all the voxels in these regions using LMMs.", "claims": [], "gap": false}, {"text": "Our model included factors Choice ( Safe or Risky ), Condition ( Social , Partner or Solo ), Run (run one or two), and ROI (left and right ventral striatum, mPFC, precuneus, and TPJ), with all interactions.", "claims": [], "gap": false}, {"text": "We also tested the same model without the factor Run , but this fitted less well (higher BIC) and was thus discarded.", "claims": [], "gap": false}, {"text": "As all factors and interactions were significant (data not shown for sake of brevity), we applied the same models to each region separately ( Appendix 1—table 4 ).", "claims": [], "gap": false}, {"text": "All regions showed a significant interaction between Condition and Choice , prompting us to examine these responses in detail.", "claims": [], "gap": false}, {"text": "As we were particularly interested in the response to Risky decisions, we subtracted from it the responses to Safe decisions (labelled as ‘(R–S)’ in Figure 4C ) and compared this difference between (1) Social and Solo conditions, and (2) between the Social and Partner conditions using LMMs.", "claims": [], "gap": false}, {"text": "As above, we tested these models both with and without the factor Run and associated interaction, and we report the best-fitting model (see Appendix 1—table 5 and Appendix 1—table 6 ).", "claims": [], "gap": false}, {"text": "Only the precuneus and TPJ showed positive differences in both comparisons ( Figure 4C ), indicating that these regions were most active when participants chose the lottery in the Social condition, the critical situation in which participants assume responsibility over others.", "claims": [], "gap": true}]}]}}, {"type": "sec", "sec": {"id": "s2-2-2", "title": "Brain regions engaged during receipt of outcomes", "depth": 3, "blocks": [{"type": "p", "html": "Next, we focused on responses during choice outcomes. A cluster of voxels more active during receipt of lottery outcomes than outcomes of safe choices was identified in the bilateral anterior insula, dorsal mPFC (dmPFC), right superior temporal sulcus (STS), bilateral ventral striatum, right dorsolateral prefrontal cortex, and bilateral inferior parietal lobe (<a class=\"xref\" href=\"#fig4\">Figure 4D<\/a>; for details including effect sizes, see Appendix 1—table 7). Except for the STS, all these regions have been previously associated with processing of risk and/or ambiguity (<span class=\"cite\">Wu et al., 2021<\/span>).", "sentences": [{"text": "Next, we focused on responses during choice outcomes.", "claims": [], "gap": false}, {"text": "A cluster of voxels more active during receipt of lottery outcomes than outcomes of safe choices was identified in the bilateral anterior insula, dorsal mPFC (dmPFC), right superior temporal sulcus (STS), bilateral ventral striatum, right dorsolateral prefrontal cortex, and bilateral inferior parietal lobe ( Figure 4D ; for details including effect sizes, see Appendix 1—table 7 ).", "claims": [], "gap": true}, {"text": "Except for the STS, all these regions have been previously associated with processing of risk and/or ambiguity ( Wu et al., 2021 ).", "claims": [], "gap": false}]}, {"type": "p", "html": "In our definition, guilt occurs due to responsibility for low lottery outcomes for the partner. To search for regions involved in this situation, we again analysed voxel responses using LMMs. Our first model included factors <i>Lottery outcome<\/i> (<i>High<\/i> or <i>Low<\/i>), <i>Condition<\/i> (<i>Social<\/i> or <i>Partner<\/i>), <i>Run<\/i> (run one or two), and <i>ROI<\/i> (left and right ventral striatum, left and right insula, left and right parietal cortex, dmPFC, right prefrontal, and right middle temporal regions), with all interactions. We also tested the same model without the factor <i>Run<\/i>, which fitted less well and was discarded. As in the analysis of responses to decisions above, all factors and interactions were significant (data not shown for sake of brevity), and we applied the same models to each region separately (Appendix 1—table 8). To identify regions likely to be involved in the guilt effect, we selected those satisfying two conditions: higher activity in the <i>Social<\/i> compared to the <i>Partner<\/i> condition, and a significant <i>Social:LowOutcome<\/i> interaction. This procedure revealed the insulae (<a class=\"xref\" href=\"#fig4\">Figure 4E<\/a>) and the right middle temporal cortex (trend significant <i>Social<\/i> vs. <i>Partner<\/i> difference in the latter region). To test if these regions responded more to <i>LowOutcomes<\/i> in the <i>Social<\/i> condition, we ran additional models on the responses to <i>Low lottery outcomes<\/i> only (labelled as ‘(L) Social > Partner’ in <a class=\"xref\" href=\"#fig4\">Figure 4E<\/a>), and on this response minus the response to <i>High lottery outcomes<\/i> (labelled as ‘(L–H) Social > Partner’ in <a class=\"xref\" href=\"#fig4\">Figure 4E<\/a>); and indeed, the insulae showed the sought-after effect (see Appendix 1—table 9, Appendix 1—table 10, and <a class=\"xref\" href=\"#fig4\">Figure 4E<\/a>). Thus, activation in our insula ROIs increased in situations during which participants experienced guilt for low outcomes impacting their partner, compared to similar outcomes resulting from the partner’s choices.", "sentences": [{"text": "In our definition, guilt occurs due to responsibility for low lottery outcomes for the partner.", "claims": [], "gap": false}, {"text": "To search for regions involved in this situation, we again analysed voxel responses using LMMs.", "claims": [], "gap": false}, {"text": "Our first model included factors Lottery outcome ( High or Low ), Condition ( Social or Partner ), Run (run one or two), and ROI (left and right ventral striatum, left and right insula, left and right parietal cortex, dmPFC, right prefrontal, and right middle temporal regions), with all interactions.", "claims": [], "gap": false}, {"text": "We also tested the same model without the factor Run , which fitted less well and was discarded.", "claims": [], "gap": false}, {"text": "As in the analysis of responses to decisions above, all factors and interactions were significant (data not shown for sake of brevity), and we applied the same models to each region separately ( Appendix 1—table 8 ).", "claims": [], "gap": false}, {"text": "To identify regions likely to be involved in the guilt effect, we selected those satisfying two conditions: higher activity in the Social compared to the Partner condition, and a significant Social:LowOutcome interaction.", "claims": [], "gap": false}, {"text": "This procedure revealed the insulae ( Figure 4E ) and the right middle temporal cortex (trend significant Social vs. Partner difference in the latter region).", "claims": ["insula-tracks-guilt-effect"], "gap": false}, {"text": "To test if these regions responded more to LowOutcomes in the Social condition, we ran additional models on the responses to Low lottery outcomes only (labelled as ‘(L) Social > Partner’ in Figure 4E ), and on this response minus the response to High lottery outcomes (labelled as ‘(L–H) Social > Partner’ in Figure 4E
