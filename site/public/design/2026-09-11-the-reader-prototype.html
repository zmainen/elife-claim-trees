); and indeed, the insulae showed the sought-after effect (see Appendix 1—table 9 , Appendix 1—table 10 , and Figure 4E ).", "claims": ["insula-tracks-guilt-effect"], "gap": false}, {"text": "Thus, activation in our insula ROIs increased in situations during which participants experienced guilt for low outcomes impacting their partner, compared to similar outcomes resulting from the partner’s choices.", "claims": [], "gap": false}]}, {"type": "p", "html": "To attempt to confirm these results with a classic fine-grained mass-univariate voxel-wise analysis, we searched, within regions responding more to outcomes of risky compared to safe choices, for higher responses to low lottery outcomes for the partner following participant choices compared to the same outcomes resulting from partner choices. We found a weak response in a small cluster within the left anterior insula (peak <i>T<\/i> = 3.95, <i>d<\/i> = 0.59, 22 voxels, peak intensity at [–28 24 –4]; <a class=\"xref\" href=\"#fig4\">Figure 4F<\/a>). Given the documented association between anterior insula and guilt (see Introduction), we proceeded to test whether this result survived correction for family-wise errors due to multiple comparisons restricted to the left anterior insula grey matter [defined anatomically and thus independently from our findings, as the anterior short gyrus, middle short gyrus, and anterior inferior cortex in an anatomical maximum probability map (<span class=\"cite\">Faillenot et al., 2017<\/span>)]. This correction resulted in a p value of 0.024. This result, although it is only a small effect in a small cluster, is consistent with the mixed model analysis reported earlier.", "sentences": [{"text": "To attempt to confirm these results with a classic fine-grained mass-univariate voxel-wise analysis, we searched, within regions responding more to outcomes of risky compared to safe choices, for higher responses to low lottery outcomes for the partner following participant choices compared to the same outcomes resulting from partner choices.", "claims": [], "gap": false}, {"text": "We found a weak response in a small cluster within the left anterior insula (peak T = 3.95, d = 0.59, 22 voxels, peak intensity at [–28 24 –4]; Figure 4F ).", "claims": ["precuneus-tpj-mpfc-social-decisions"], "gap": false}, {"text": "Given the documented association between anterior insula and guilt (see Introduction), we proceeded to test whether this result survived correction for family-wise errors due to multiple comparisons restricted to the left anterior insula grey matter [defined anatomically and thus independently from our findings, as the anterior short gyrus, middle short gyrus, and anterior inferior cortex in an anatomical maximum probability map ( Faillenot et al., 2017 )].", "claims": [], "gap": false}, {"text": "This correction resulted in a p value of 0.024. This result, although it is only a small effect in a small cluster, is consistent with the mixed model analysis reported earlier.", "claims": [], "gap": false}]}]}}, {"type": "sec", "sec": {"id": "s2-2-3", "title": "Neural correlates of responsibility for partner reward prediction errors revealed by computational model-based analysis", "depth": 3, "blocks": [{"type": "p", "html": "Next, we attempted to explain BOLD responses using predictions of the <i>‘Responsibility<\/i>’ computational model (see Behaviour/Computational modelling of happiness data, above). We used the model to create expected BOLD responses for each participant (see Methods) and as a manipulation check searched for responses in ventral striatum evoked by participant rewards (<span class=\"cite\">O’Doherty et al., 2004<\/span>; <span class=\"cite\">O’Doherty et al., 2007<\/span>). We found that activation in bilateral ventral striatum indeed increased with the amount of expected certain rewards and the expected values of chosen lotteries (left: p<i><sub>FWE<\/sub><\/i> = 0.002, <i>T<\/i> = 5.63, <i>d<\/i> = 0.75, <i>Z<\/i> = 5.41, 110 voxels, peak at MNI [–14 8 –8], right: p<i><sub>FWE<\/sub><\/i> = 0.005, <i>T<\/i> = 5.46, <i>d<\/i> = 0.70, <i>Z<\/i> = 5.26, 80 voxels, peak at MNI [10 10 −4], correction for multiple tests applied across the whole brain; <a class=\"xref\" href=\"#fig4\">Figure 4G<\/a>). We thus used this model to search for voxels responding more to partner reward prediction errors resulting from participant rather than partner choices, within the regions sensitive to outcomes of risky choices. We found this effect in one cluster within the left STS (p<i><sub>FWE<\/sub><\/i> = 0.022, <i>T<\/i> = 4.70, <i>d<\/i> = 0.53, <i>Z<\/i> = 4.57, 100 voxels, peak at MNI [−52 –32 0]; <a class=\"xref\" href=\"#fig4\">Figure 4H<\/a>). Responses to the computational-model-based regressors coding for partner reward prediction errors resulting from participant and from partner choices in this cluster are shown in <a class=\"xref\" href=\"#fig4\">Figure 4I<\/a>. This finding suggests that this region of the left STS tracks a partner’s unexpected outcomes less when they do not follow from the participant’s decisions.", "sentences": [{"text": "Next, we attempted to explain BOLD responses using predictions of the ‘Responsibility ’ computational model (see Behaviour/Computational modelling of happiness data, above).", "claims": [], "gap": false}, {"text": "We used the model to create expected BOLD responses for each participant (see Methods) and as a manipulation check searched for responses in ventral striatum evoked by participant rewards ( O’Doherty et al., 2004 ; O’Doherty et al., 2007 ).", "claims": [], "gap": false}, {"text": "We found that activation in bilateral ventral striatum indeed increased with the amount of expected certain rewards and the expected values of chosen lotteries (left: p FWE = 0.002, T = 5.63, d = 0.75, Z = 5.41, 110 voxels, peak at MNI [–14 8 –8], right: p FWE = 0.005, T = 5.46, d = 0.70, Z = 5.26, 80 voxels, peak at MNI [10 10 −4], correction for multiple tests applied across the whole brain; Figure 4G ).", "claims": ["ventral-striatum-tracks-computational-reward"], "gap": false}, {"text": "We thus used this model to search for voxels responding more to partner reward prediction errors resulting from participant rather than partner choices, within the regions sensitive to outcomes of risky choices.", "claims": [], "gap": false}, {"text": "We found this effect in one cluster within the left STS (p FWE = 0.022, T = 4.70, d = 0.53, Z = 4.57, 100 voxels, peak at MNI [−52 –32 0]; Figure 4H ).", "claims": ["sts-tracks-partner-reward-prediction-errors"], "gap": false}, {"text": "Responses to the computational-model-based regressors coding for partner reward prediction errors resulting from participant and from partner choices in this cluster are shown in Figure 4I .", "claims": [], "gap": false}, {"text": "This finding suggests that this region of the left STS tracks a partner’s unexpected outcomes less when they do not follow from the participant’s decisions.", "claims": [], "gap": false}]}]}}, {"type": "sec", "sec": {"id": "s2-2-4", "title": "Functional connectivity", "depth": 3, "blocks": [{"type": "p", "html": "Functional connectivity analyses have revealed differences in networks engaged by social and self-only choices (<span class=\"cite\">Jung et al., 2013<\/span>; <span class=\"cite\">Ogawa et al., 2018<\/span>), interactions between midbrain and anterior cingulate during compensation for guilt (<span class=\"cite\">Yu et al., 2014<\/span>), and links between insula connectivity and responsibility aversion (<span class=\"cite\">Edelson et al., 2018<\/span>). We hypothesized that connectivity with regions that showed guilt- and responsibility-related responses during the outcome phase (see previous paragraph) might change depending on whether participants made decisions for themselves only or for themselves and their partner, and depending on the type of choice (<i>Safe<\/i> or <i>Risky<\/i>). To this end, we used the left insula and left STS as seed regions for whole-brain seed-to-voxel psychophysiological interaction (PPI) analyses (see Methods), to search for connectivity changes, during the choice phase of the trial, as a function of <i>Condition<\/i> and <i>Choice<\/i> (i.e., voxels with a significant interaction to <i>Condition<\/i> by <i>Choice<\/i>). The first analysis revealed a cluster in the right IFG whose connectivity to the insula (the seed region) was highest when participants made <i>Risky<\/i> choices for themselves and <i>Safe<\/i> choices for both players (p<i><sub>FWE<\/sub><\/i> = 0.020, <i>T<\/i> = 4.34, <i>d<\/i> = 0.80, <i>Z<\/i> = 4.21, 115 voxels, peak at MNI [46 16 22]; <a class=\"xref\" href=\"#fig5\">Figure 5<\/a>). A smaller cluster in the left IFG showed the same effect but did not survive correction for multiple tests (p<i><sub>uncorrected<\/sub><\/i> = 0.001, <i>T<\/i> = 4.08, <i>Z<\/i> = 3.97, 38 voxels, peak at MNI [−38 –2 26]). The second analysis revealed a smaller cluster in the left IFG that did not survive corrections for multiple tests, where connectivity with the left STS (the seed region) showed the opposite pattern: connectivity was highest when participants made <i>Safe<\/i> choices for themselves and <i>Risky<\/i> choices for both players (p<i><sub>uncorrected<\/sub><\/i> = 0.001, <i>T<\/i> = 4.44, <i>Z<\/i> = 4.30, 35 voxels, peak at MNI [–48 14 6]; <a class=\"xref\" href=\"#fig5s1\">Figure 5—figure supplement 1<\/a>).", "sentences": [{"text": "Functional connectivity analyses have revealed differences in networks engaged by social and self-only choices ( Jung et al., 2013 ; Ogawa et al., 2018 ), interactions between midbrain and anterior cingulate during compensation for guilt ( Yu et al., 2014 ), and links between insula connectivity and responsibility aversion ( Edelson et al., 2018 ).", "claims": [], "gap": false}, {"text": "We hypothesized that connectivity with regions that showed guilt- and responsibility-related responses during the outcome phase (see previous paragraph) might change depending on whether participants made decisions for themselves only or for themselves and their partner, and depending on the type of choice ( Safe or Risky ).", "claims": [], "gap": false}, {"text": "To this end, we used the left insula and left STS as seed regions for whole-brain seed-to-voxel psychophysiological interaction (PPI) analyses (see Methods), to search for connectivity changes, during the choice phase of the trial, as a function of Condition and Choice (i.e., voxels with a significant interaction to Condition by Choice ).", "claims": [], "gap": false}, {"text": "The first analysis revealed a cluster in the right IFG whose connectivity to the insula (the seed region) was highest when participants made Risky choices for themselves and Safe choices for both players (p FWE = 0.020, T = 4.34, d = 0.80, Z = 4.21, 115 voxels, peak at MNI [46 16 22]; Figure 5 ).", "claims": ["insula-ifg-connectivity-guilt"], "gap": false}, {"text": "A smaller cluster in the left IFG showed the same effect but did not survive correction for multiple tests (p uncorrected = 0.001, T = 4.08, Z = 3.97, 38 voxels, peak at MNI [−38 –2 26]).", "claims": [], "gap": true}, {"text": "The second analysis revealed a smaller cluster in the left IFG that did not survive corrections for multiple tests, where connectivity with the left STS (the seed region) showed the opposite pattern: connectivity was highest when participants made Safe choices for themselves and Risky choices for both players (p uncorrected = 0.001, T = 4.44, Z = 4.30, 35 voxels, peak at MNI [–48 14 6]; Figure 5—figure supplement 1 ).", "claims": [], "gap": true}]}, {"type": "fig", "id": "fig5"}]}}, {"type": "sec", "sec": {"id": "s2-2-5", "title": "Comparison with multivariate neural guilt signature (Yu et al., 2020)", "depth": 3, "blocks": [{"type": "p", "html": "A recent study by Yu and colleagues re-analysed the results of two previous neuroimaging studies of guilt and obtained a neural multivariate guilt-related brain signature (GRBS) (<span class=\"cite\">Yu et al., 2020<\/span>). As the GRBS and code to compare neural responses to it is freely available at GitHub (<span class=\"cite\">Wager, 2019<\/span>), we compared this brain signature to the neural responses obtained in our task (response to low partner outcomes resulting from participant vs. partner responses). The dot products between individual responses and the GRBS varied between –40.1 and 36.7, but overall these values were positive (mean = 5.22; median = 6.97; sign test: p = 0.017; <i>Cliff’s Delta<\/i> = 0.4 = medium effect size; data are not normally distributed). We assessed whether inter-individual differences in these dot product values correlated with the behavioural guilt responses, but did not find a significant association [<i>Spearman’s Rho<\/i> = –0.058, p = 0.725].", "sentences": [{"text": "A recent study by Yu and colleagues re-analysed the results of two previous neuroimaging studies of guilt and obtained a neural multivariate guilt-related brain signature (GRBS) ( Yu et al., 2020 ).", "claims": [], "gap": false}, {"text": "As the GRBS and code to compare neural responses to it is freely available at GitHub ( Wager, 2019 ), we compared this brain signature to the neural responses obtained in our task (response to low partner outcomes resulting from participant vs. partner responses).", "claims": [], "gap": false}, {"text": "The dot products between individual responses and the GRBS varied between –40.1 and 36.7, but overall these values were positive (mean = 5.22; median = 6.97; sign test: p = 0.017; Cliff’s Delta = 0.4 = medium effect size; data are not normally distributed).", "claims": ["insula-guilt-replicates-yu-koban-signature"], "gap": false}, {"text": "We assessed whether inter-individual differences in these dot product values correlated with the behavioural guilt responses, but did not find a significant association [ Spearman’s Rho = –0.058, p = 0.725].", "claims": ["guilt-signature-no-individual-difference"], "gap": false}]}]}}]}}]}, {"id": "s3", "title": "Discussion", "depth": 1, "blocks": [{"type": "p", "html": "We report findings from an experiment on social responsibility and guilt in risky economic decisions, and their neural correlates. Being responsible for choosing a lottery that yielded a low outcome for a partner made our participants feel worse than witnessing the same outcome resulting from their partner’s choice, which we interpret as interpersonal guilt; although we note that we have not asked participants specifically about which emotion they felt in these situations. Activation in the left anterior insula (aIns) reflected this effect, replicating previous associations between this region and feelings of guilt. Whole-brain activation patterns also resembled a neurometric marker of guilt (<span class=\"cite\">Yu et al., 2020<\/span>). Connectivity between aIns and the right IFG varied depending on whether participants chose the risky or safe option and whether only the participant or both themselves and the partner were affected by the outcome of this choice, suggesting that this part of prefrontal cortex is sensitive to guilt-related information during social choices. Computational models explained trial-by-trial variations in momentary happiness during the task; the best-fitting model differentiated between partner reward prediction errors resulting from participant and partner choices, indicating that the impact of outcomes for the partner on participants’ happiness varied depending on who chose. This confirms the importance of responsibility in determining the emotional consequences of risky social choices. fMRI analyses based on this computational model identified a left STS region responding more to partner reward prediction errors resulting from participant rather than partner choices. This suggests a critical role of the STS in monitoring the consequences of one’s risky decisions on others, an essential social cognitive function. A last analysis showed that connectivity between this STS region and the right IFG varied depending on condition and choice, suggesting that the information processed in the STS is relayed to the IFG during social decisions. Our findings add to current understanding of the neural mechanisms underlying responsibility for, and guilt evoked by, the outcomes on others of social decisions under economic risk."}, {"type": "p", "html": "We used several approaches to compare choices made for self only or for both participant and partner. Participants made slightly more risk-seeking choices when deciding for themselves than for both themselves and the partner in Study 1, but this difference disappeared in Study 2. The <i>ρ<\/i> parameter on which this finding in Study 1 is based could only be estimated in a minority of participants due to a relatively low number of trials, which suggests that this finding may not be very reliable. The simpler and more robust method (evaluation of a risk premium) showed no difference in risk aversion across conditions in either study. Overall, we believe that we do not have strong evidence of differences in risk preferences across conditions. Our findings are not unexpected given previous work. At least two studies reported that being responsible for somebody else’s payoffs increases risk aversion (<span class=\"cite\">Fareri et al., 2022<\/span>; <span class=\"cite\">Pahlke et al., 2015<\/span>). However, participants in a recent neuroimaging study were more loss averse when choosing for themselves rather than known other people (<span class=\"cite\">Arioli et al., 2023<\/span>). Indeed, recent large meta-analyses comparing risky choices for oneself vs. for others report either no difference in risk preferences (<span class=\"cite\">Batteux et al., 2019<\/span>) or a small shift towards more risky decisions for others (<span class=\"cite\">Polman and Wu, 2020<\/span>), with large variations across studies. Personal closeness to the others for which we decide seems to reduce differences in risk preferences (<span class=\"cite\">Fareri et al., 2022<\/span>; <span class=\"cite\">Zhang et al., 2017<\/span>), as does making decisions for self before making decisions for others (<span class=\"cite\">Ifcher and Zarghamee, 2020<\/span>). In our study, decisions never only affected the partner, which most likely ‘watered down’ any differences in risk attitude in decisions for oneself vs. for someone else. We also created a friendly prosocial environment in which people felt closer to each other than two strangers would (see Experiment Partner in Methods), and interleaved decisions for self only vs. for self and other. Similar risk preferences in decisions for self vs. self and other are thus unsurprising. The fact that participants made similarly risky decisions for themselves or for both during the fMRI study was to our advantage, because it made the neural signals evoked in these situations more comparable."}, {"type": "p", "html": "Anterior insula (aIns) response, particularly in the left hemisphere, was highest when partners received low lottery outcomes resulting from participants’ risky choices. This replicates a large body of evidence associating aIns with feelings of guilt evoked during social decisions (see Introduction). Because we have neither asked our participants specifically what they felt in these situations, nor specifically whether they experienced guilt, we cannot exclude the possibility that they have instead or in addition felt empathy for their partner, a feeling of failure or bad luck, or some other emotion. The aIns region has also been associated with empathy for negative emotions such as disgust (<span class=\"cite\">Wicker et al., 2003<\/span>) or pain (<span class=\"cite\">Gu et al., 2012<\/span>; <span class=\"cite\">Lamm et al., 2011<\/span>), with affective empathy during charitable giving (<span class=\"cite\">Tusche et al., 2016<\/span>), and more generally with emotion awareness (<span class=\"cite\">Bird et al., 2010<\/span>; <span class=\"cite\">Gu et al., 2013<\/span>). These functions might be supported by interoception (<span class=\"cite\">Craig, 2002<\/span>): posterior insula is thought to receive interoceptive information from the body and to pass it on to the anterior insula for integration with sensory, emotional, cognitive, and motivational signals from other regions (<span class=\"cite\">Bid Craig, 2009<\/span>; <span class=\"cite\">Rogers-Carter and Christianson, 2019<\/span>). This integration would allow one to represent one’s own, as well as estimates of other people’s, feelings and bodily states and allow error-based learning based on these (<span class=\"cite\">Lamm and Singer, 2010<\/span>; <span class=\"cite\">Rogers-Carter and Christianson, 2019<\/span>; <span class=\"cite\">Singer et al., 2009<\/span>). Our finding of changing functional connectivity between aIns and prefrontal cortex as a function of decision taken and experimental condition during choice may reflect changing emotional information transfer between these structures depending on choice and social context. How we feel when we witness our decisions’ consequences on others is an important signal to consider when attempting to make good social decisions. Unsurprisingly, lesions of aIns are associated with reduced altruistic attitudes (<span class=\"cite\">Chau et al., 2018<\/span>), individuals with higher levels of psychopathic traits show reduced modulation of aIns response to anticipated guilt (<span class=\"cite\">Seara-Cardoso et al., 2016<\/span>), and show reduced guilt aversion (<span class=\"cite\">Gong et al., 2019<\/span>)."}, {"type": "p", "html": "Deciding for both self and partner rather than just for oneself evoked increased activations in precuneus, left TPJ, and dmPFC, areas classically associated with social cognition (<span class=\"cite\">Frith and Frith, 2006<\/span>; <span class=\"cite\">Schurz et al., 2014<\/span>; <span class=\"cite\">Van Overwalle, 2009<\/span>), and also with feelings of guilt (for meta-analyses, see <span class=\"cite\">Gifuni et al., 2017<\/span>; <span class=\"cite\">Piretti et al., 2023<\/span>). This replicates previous findings of engagement of dmPFC, STS, and/or TPJ when making decisions involving others (<span class=\"cite\">Jung et al., 2013<\/span>; <span class=\"cite\">Nicolle et al., 2012<\/span>; <span class=\"cite\">Ogawa et al., 2018<\/span>; <span class=\"cite\">Piva et al., 2019<\/span>). Interestingly, our computational model-based analysis revealed a cluster of voxels in the left STS that responded positively to partner prediction errors, but only when these resulted from decisions made by the participant instead of the partner. This is congruent with associations between STS and cognitive perspective taking during charitable giving (<span class=\"cite\">Tusche et al., 2016<\/span>), representation of other people’s interests during altruistic choice (<span class=\"cite\">Hutcherson et al., 2015<\/span>), or more generally with mentalizing computations during strategic social choice (<span class=\"cite\">Carter et al., 2012<\/span>; <span class=\"cite\">Hampton et al., 2008<\/span>; <span class=\"cite\">Hill et al., 2017<\/span>). The features of our experimental design (direct contrast of similar decisions made by the participant and partner; independent lottery outcomes for self and other; quantification of the consequences of decisions through variations of momentary happiness) allowed us to identify this very specific neural signal indicative of a neural sensitivity to the consequences of one’s own actions on others, whether positive or negative. A neural signal coding partner reward prediction errors resulting from one’s decisions seems essential to guide social decisions and as a basis for empathic concern for the people influenced by our actions. Anecdotally, we found a weak functional connection between this left STS cluster and left aIns that varied as a function of choice and experimental condition; this is interesting because connections between a region in the left TPJ and aIns have been shown to vary depending on people’s tendency to seek or avoid responsibility for others (<span class=\"cite\">Edelson et al., 2018<\/span>). Given the roles of the left STS/TPJ and aIns in guilt and social decisions, it is not surprising to find information exchanges between these structures. More experiments investigating specific computations in which these regions are involved (as in, e.g., <span class=\"cite\">Charpentier and O’Doherty, 2018<\/span>; <span class=\"cite\">Konovalov et al., 2021a<\/span>; <span class=\"cite\">Konovalov and Ruff, 2021b<\/span>) are likely to help understand the neural mechanisms by which guilt and responsibility influence social decision-making."}, {"type": "p", "html": "There are several limitations to our study. The first limitation is that the partner’s decisions were in fact taken by an algorithm. This was not communicated to the participants and was thus a case of deception, which is inadmissible in behavioural economics. To our defence, this study was planned as a social neuroscience study and was executed before we had taken into account the practices of behavioural economists. However, this approach did have the advantage of eliminating potentially complex iterative reciprocal influences of decisions and outcomes between the players, which would have led to much more complicated emotional states and decisions that would have been difficult to understand and model. Thus, from an analytical point of view, our approach might have actually allowed a cleaner comparison between decisions and outcomes than if the partner had really made the decisions. The fact that partner outcomes also influenced participants’ momentary happiness demonstrates that participants were not emotionally detached from the consequences of their actions on their partner. This finding is, of course, essential for the validity of our results and suggests that the effects could get stronger with more direct interactions. Therefore, although we will abstain from using deceptive practices when pursuing this research, we believe our findings to be valid."}, {"type": "p", "html": "Another limitation is that we have not asked participants to specifically name emotions as they proceeded through the experiment. As a result, we cannot ascertain whether people experienced guilt, shame, regret, disappointment or another specific emotion during the experiment. However, asking about specific emotions is itself associated with several drawbacks: emotion labels might have coloured participants’ spontaneous emotional state; participant responses might be influenced by social desirability; thinking about which emotion best characterizes one’s mental state takes time and distracts from the decision task; and the list of emotions to choose from is necessarily limited. In any case, the precise naming of emotions was not the aim of our study; instead, we relied on a definition of guilt from psychological game theory (<span class=\"cite\">Battigalli and Dufwenberg, 2007<\/span>). Indeed, previous work on social emotions recommends ‘study the experiential phenomenology of emotions instead of mere emotion labels’, because ‘as a psychological explanation of human behaviour, the phenomenological experience of an emotion is much more important than the label attached to this experience’ (<span class=\"cite\">Zeelenberg and Breugelmans, 2008<\/span>). The ‘neurometrics’ analysis of our guilt-related activation maps showed a significant similarity to a published guilt-related brain signature (<span class=\"cite\">Yu et al., 2020<\/span>). We thus believe that our participants did experience guilt when their choices led to low outcomes for their partner."}, {"type": "p", "html": "Several open questions remain at the end of this study. As discussed above, asking participants directly about which emotions they have felt during the different stages of this task would allow us to link subjective experience with our analytical measures. Testing more participants would allow us to assess the impact of inter-individual variations in personality traits on the experience as well as the behavioural and neural correlates of guilt and responsibility. Using more trials in the experiment would allow separate modelling of risk preferences in gain and loss trials in each experimental condition using expected utility models, and could allow testing whether changes in momentary happiness affect subsequent choices. Varying partner identities (friends, stranger, and artificial agent) could reveal the impact of social discounting on guilt and responsibility. Functional connectivity analyses could also be performed for the data obtained in the feedback part of the paradigm. In sum, we believe that this experimental approach lends itself very well to the study of several aspects of social emotions."}]}, {"id": "s4", "title": "Materials and methods", "depth": 1, "blocks": [{"type": "sec", "sec": {"id": "s4-1", "title": "Participants", "depth": 2, "blocks": [{"type": "p", "html": "Forty healthy participants (14 male, mean age 26.1, range 22–31) participated in Study 1 (behaviour only study), and 44 healthy participants (19 male, mean (SD) age = 30.6 (6.5), range 23–50) participated in Study 2 (fMRI study). All participants provided written informed consent. Participants were recruited from the local population through advertisements on online blackboards at the University of Bonn and on local community websites, and through flyers posted in libraries, university cafeterias and sports facilities. The number of participants recruited in Study 2 corresponds to the sample size estimated using G*Power 3.1 software (<span class=\"cite\">Faul et al., 2007<\/span>) for a two-way <i>t<\/i>-test assessing the difference between two means (matched pairs) based on the results of Study 1 (Cohen’s <i>d<\/i> = 0.56), with alpha error = 0.05 and power (1 − beta) = 0.95, the required sample size was 44. The fMRI data from four participants in Study 2 were excluded from the fMRI data analysis because of excessive head motion (>3 mm or >3°)."}]}}, {"type": "sec", "sec": {"id": "s4-2", "title": "Experimental procedure", "depth": 2, "blocks": [{"type": "p", "html": "The design of the experiment was inspired by previous studies investigating how risky choices and their consequences influence momentary happiness (<span class=\"cite\">Rutledge et al., 2014<\/span>; <span class=\"cite\">Rutledge et al., 2016<\/span>). It was implemented in MATLAB (Version R2016b; RRID:SCR_001622; The MathWorks, Inc, Natick, MA) using the Psychtoolbox extensions (RRID:SCR_002881)."}]}}, {"type": "sec", "sec": {"id": "s4-3", "title": "Experiment partner", "depth": 2, "blocks": [{"type": "p", "html": "Participants played with a friendly same-sex experiment partner (pairs of participants in Study 1, authors TW and MG in Study 2), whom they met before the scan for an introduction session. In this session lasting about 15 min, participants played an ice breaker game with their experiment partner, in which both participant and partner took turns in drawing one half of a simple picture while being blindfolded and following verbal instructions given by their game partner. Encouragements and other positive feedback were given by the partner throughout the task. This icebreaker game led to an agreeable social atmosphere and positive, non-competitive, sympathetic attitude between the participants and the partner. Results of a brief questionnaire indicate that this approach was successful: participants’ average ratings of their partners in terms of sympathy, cooperativity, honesty, openness and sociability were all above 8 on a scale of 1–10, in both studies (Appendix 1—table 11)."}]}}, {"type": "sec", "sec": {"id": "s4-4", "title": "Decision task", "depth": 2, "blocks": [{"type": "p", "html": "Following the icebreaker game, participants in Study 1 performed three sessions of a task in which they decided on each trial between a safe and a risky monetary option (<a class=\"xref\" href=\"#fig1\">Figure 1<\/a>). The risky monetary option was a lottery with two equiprobable outcomes (lottery). There were three kinds of trials: decisions by the participant only for themselves (<i>Solo<\/i> condition), decisions by the participant for themselves and the partner (<i>Social<\/i> condition), and decisions by the partner for both themselves and the participant (<i>Partner<\/i> condition). Importantly, when the risky option was selected in the <i>Social<\/i> or <i>Partner<\/i> condition, the lottery was played out independently for the participant and the partner, such that both could receive the higher (<i>HighOutcome<\/i>) or lower outcome (<i>LowOutcome<\/i>), independently from each other. In order to ascertain constant decisions by the partner, the partner’s decisions were simulated using a simple algorithm that always selected the option with the highest expected value; i.e., it selected the lottery if EV diff >0; <i>EVdiff<\/i> = (<i>high lottery outcome + low lottery outcome<\/i>)/2 – <i>safe outcome<\/i>. The amounts earned per trial were determined as in a previous study (<span class=\"cite\">Rutledge et al., 2014<\/span>), as follows. There were 20 mixed trials, 20 gain trials, and 20 loss trials per session. In the mixed trials, participants chose between a safe option of 0 € and a lottery consisting of a gain and a loss amount. Gain amounts were selected randomly out of the following: [15, 25, 40, 55, 75] cents. Loss options were determined by multiplying the gain amount with one randomly selected value out of the following: [-0.2, –0.34, −0.5, –0.64, −0.77, –0.89, −1, –1.1, −1.35, –2]. In gain trials, participants chose between a safe gain out of the following: [10, 15, 20, 25, 30] cents and a lottery with 0 € and a higher gain amount, calculated by multiplying the safe amount with one of the following values: [1.68, 1.82, 2, 2.22, 2.48, 2.8, 3.16, 3.6, 4.2, 5]. In loss trials, participants chose between a certain loss or a lottery with 0 € or a larger loss. Certain loss amounts were one of [–10, –15, −20,–25, –30] cents, and the larger loss amount of the lottery was a multiple of the certain loss amount and one of the following values: [1.68, 1.82, 2, 2.22, 2.48, 2.8, 3.16, 3.6, 4.2, 5]. The position of the safe and risky option on the screen (left or right) was determined randomly on every trial, and the different trial types (<i>Solo<\/i>, <i>Social<\/i>, or <i>Partner<\/i> condition; gain, loss and mixed trials) were presented in randomized order, with the constraint that there could not be more than two trials of the same condition in a row. Participants had unlimited time to choose between the safe or risky option. Decisions were displayed for 2 s and lottery outcomes for 2.5 s. Trials were separated in time by an inter-stimulus interval (ISI) of 1–2 s drawn randomly from a gamma distribution."}]}}, {"type": "sec", "sec": {"id": "s4-5", "title": "Momentary happiness", "depth": 2, "blocks": [{"type": "p", "html": "Every two trials, one ISI after the outcome of the previous trial, participants were asked ‘How happy are you right now?’. They could respond by selecting a value on a scale from ‘very happy’ (right) to ‘very unhappy’ (left) by moving a cursor with a button press. The start position of the cursor was the midpoint of the scale, and the scale had 100 selectable options. For analysis, happiness ratings were <i>Z<\/i>-scored to cancel out effects of different rating variabilities across participants."}]}}, {"type": "sec", "sec": {"id": "s4-6", "title": "Difference between studies 1 (behaviour only) and 2 (fMRI study)", "depth": 2, "blocks": [{"type": "p", "html": "In Study 2, participants performed two sessions of the experiment described above inside the fMRI scanner. All parameters were identical except that ISIs varied from 3 to 11 s (drawn randomly from a gamma distribution). In Study 2, instead of playing against another same-sex participant, participants played either against experimenter MG or TW depending on sex (participant and partner were always of same sex) who were outside the scanner."}]}}, {"type": "sec", "sec": {"id": "s4-7", "title": "Statistical analysis", "depth": 2, "blocks": [{"type": "sec", "sec": {"id": "s4-7-1", "title": "General information", "depth": 3, "blocks": [{"type": "p", "html": "Statistical analysis was performed using Matlab R2024A (RRID:SCR_001622) and the lme4 package (<span class=\"cite\">Bates et al., 2022<\/span>) (RRID:SCR_015654) in R (version 4.2.1, RRID:SCR_001905), and JASP (version 0.16.1, RRID:SCR_015823, JASP Team 2021). fMRI data were analysed using SPM12 software (RRID:SCR_007037; Wellcome Trust Centre for Neuroimaging, London, UK). All statistical tests were two-tailed. Bayes factors were calculated using default priors in JASP and express the probability of the data given <i>H<\/i><sub>1<\/sub> relative to <i>H<\/i><sub>0<\/sub> (BF<sub>10<\/sub>, values larger than one are in favour of H1). Effect sizes were calculated using standard approaches implemented in Matlab, including the Measures of Effect Size Toolbox (RRID:SCR_014703)."}]}}, {"type": "sec", "sec": {"id": "s4-7-2", "title": "Decisions", "depth": 3, "blocks": [{"type": "sec", "sec": {"id": "s4-7-2-1", "title": "Generalized linear mixed logistic regression", "depth": 4, "blocks": [{"type": "p", "html": "First, we assessed whether choices between the safe and risky options were reasonable and whether these choices varied between <i>Solo<\/i> and <i>Social<\/i> conditions. To do so, we modelled choices with a mixed-effects logistic regression with subject-specific random intercepts <i>u<\/i><sub>0<\/sub><i><sub>j<\/sub><\/i> ~ <i>N<\/i>(0,<i>δ<sub>u<\/sub><\/i><sup>2<\/sup>) and slopes [<i>u<\/i><sub>1<\/sub><i><sub>j<\/sub><\/i>, <i>u<\/i><sub>2<\/sub><i><sub>j<\/sub><\/i>] ~ <i>N<\/i>(0,<i>δ<sub>u<\/sub><\/i><sup>2<\/sup>) and residual <i>ε<sub>ij<\/sub><\/i> ~ <i>L<\/i>(0,1), assumed to follow the standard logistic distribution. In this regression model, the choice of the risky option (Chose risky: 1 = Yes, 0 = No) was entered as the dependent variable, and explanatory variables were the difference between the expected value of the lottery minus the value of the safe option [<i>EVdiff<\/i> = (<i>high lottery outcome + low lottery outcome<\/i>)/2 – <i>safe outcome<\/i>] and condition (<i>Cond<\/i>: 1 = <i>Solo<\/i>, 2 = <i>Social<\/i>; a categorical variable), as well as the interaction between them (<i>EVdiff × Cond<\/i>). All explanatory variables were mean-centred. The random slopes are designed to account for between-subject heterogeneity:<span class=\"math\">Chose riskyij=1ifβ0+(β1+u1j)∗EVdiffij+(β2+u2j)∗Condij+β3∗EVdiff×condij+u0j+εij>0,and Chose safeij=0otherwise.\\begin{document}$$\\displaystyle \\begin{array}{ll}Chose\\ risky_{ij} &=1\\, if\\, {\\beta_0}+(\\beta_1+u_{1j})^* EVdiff_{ij} + (\\beta_2+u_{2j})^* Cond_{ij} + {\\beta_3}^* EVdiff \\times cond_{ij} \\\\& \\qquad +u_{0j} + \\varepsilon_{ij} \\gt 0, {\\rm and}\\ Chose\\ safe_{ij} =0 \\, \\rm{otherwise}.\\end{array}$$\\end{document}<\/span>"}, {"type": "p", "html": "This gives rise to the regression equation:<span class=\"math\">(1)Chose riskyij=F(β0+(β1+u1j)∗EVdiffij+(β2+u2j)∗Condij+β3∗EVdiff×condij+uj)\\begin{document}$$\\displaystyle Chose\\ risky_{ij} =F(\\beta_0 + (\\beta_1+u_{1j})^* EVdiff_{ij} + (\\beta_2+u_{2j})^* Cond_{ij} + {\\beta_3}^* EVdiff \\times cond_{ij} +u_j)$$\\end{document}<\/span>"}, {"type": "p", "html": "where <i>F<\/i>(<i>x<\/i>) = 1/[1 + exp(−<i>x<\/i>)] is the cumulative distribution function of the standard logistic distribution. The subscript <i>j<\/i> indexes participants, while <i>i<\/i> indexes observations per participant. An observation corresponds to one choice (<i>Chose risky<\/i>: 1 = Yes, 0 = No)."}, {"type": "p", "html": "This model was estimated for Studies 1 and 2 separately, using the package <i>lme4<\/i> in R."}]}}, {"type": "sec", "sec": {"id": "s4-7-2-2", "title": "Estimating risk attitude 1: risk premium", "depth": 4, "blocks": [{"type": "p", "html": "Next, we estimated risk attitudes by calculating a <i>risk premium<\/i> for each participant and condition, defined as the difference between the expected value of a lottery and its certainty equivalent (positive values indicate risk aversion, negative values risk seeking). The certainty equivalent is the smallest amount an individual would be indifferent to spending on a lottery. We estimated the certainty equivalent of the lotteries by fitting to each participant’s decisions in each condition the logistic regression model with residual <i>ε<sub>ij<\/sub><\/i> ~ <i>L<\/i>(0,1), assumed to follow the standard logistic distribution:<span class=\"math\">(2)Chose riskyi=F(β0+β1 ∗EVdiffi)\\begin{document}$$\\displaystyle Chose\\ risky_i =F(\\beta_0 + \\beta_1\\ ^* EVdiff_i)$$\\end{document}<\/span>"}, {"type": "p", "html": "The <i>risk premium<\/i> for each condition was defined as the EVdiff value corresponding to 50% <i>risky<\/i> choices indicated by the fitted logistic regression model. In both studies, these <i>risk premium<\/i> values were compared between <i>Solo<\/i> and <i>Social<\/i> conditions using paired <i>t<\/i>-tests."}]}}, {"type": "sec", "sec": {"id": "s4-7-2-3", "title": "Estimating risk attitude 2: CARA model", "depth": 4, "blocks": [{"type": "p", "html": "Next, we estimated risk attitudes using expected utility theory. In this approach, an agent chooses between two options by comparing their expected utility values. Utility values reflect the agent’s subjective values or preferences for a set of choice options, revealed by the agent’s choices. Expected utility theory uses utility functions to describe the agents’ preferences, including that agent’s attitude towards risk. One simple model of risk aversion termed Constant Absolute Risk Aversion (CARA) assumes an exponential utility function:<span class=\"math\">U(x,ρ)=1−e(−ρx)\\begin{document}$$\\displaystyle U(x,\\rho)=1-\\mathtt{e} (-\\rho x)$$\\end{document}<\/span>"}, {"type": "p", "html": "where <i>x<\/i> is a monetary amount and <i>⍴<\/i> is a constant that represents the degree of risk preference. <i>U<\/i> has an upward slope for perceived gains, indicating higher utility for a larger amount received. For a risk-averse individual facing a choice in the domain of gains, <i>⍴<\/i> is positive and <i>U<\/i> is concave: a sure amount is preferred over a lottery with the same expected value. For a risk-seeking individual facing the same choices, <i>⍴<\/i> is negative."}, {"type": "p", "html": "Under CARA, the expected utility of a lottery is:<span class=\"math\">EUlottery=p∗U(x1,ρ)+(1−p)∗U(x2,ρ)\\begin{document}$$\\displaystyle EU_{lottery} =p ^* U(x_1,\\rho) + (1-p) ^* U(x_2,\\rho)$$\\end{document}<\/span>"}, {"type": "p", "html": "where <i>x<\/i><sub>1<\/sub> and <i>x<\/i><sub>2<\/sub> are the two possible outcomes of the lottery and <i>p<\/i> is the probability of obtaining outcome <i>x<\/i><sub>1<\/sub>."}, {"type": "p", "html": "The certainty equivalent of a lottery under CARA is:<span class=\"math\">(3)CElottery=log(1−ρ∗EUlottery)/−ρ\\begin{document}$$\\displaystyle CE_{lottery} = log(1 - \\rho^* EU_{lottery}) / - \\rho$$\\end{document}<\/span>"}, {"type": "p", "html": "For <i>⍴<\/i> ≠ 0."}, {"type": "p", "html": "Following an econometric method (<span class=\"cite\">von Gaudecker et al., 2011<\/span>), we estimated <i>⍴<\/i> by fitting a probit regression with a cumulative Gaussian link function <i>Φ<\/i> to choices obtained in the <i>Solo<\/i> and <i>Social<\/i> conditions of each participant:<span class=\"math\">ϕ=0.5∗(1+erf((CE−VS)/(2∗σ)));\\begin{document}$$\\displaystyle \\phi = 0.5^* (1 + erf((CE - VS) / ({\\sqrt{2}}^* \\sigma)));$$\\end{document}<\/span>"}, {"type": "p", "html": "where <i>CE<\/i> is the certainty equivalent of the lottery, <i>VS<\/i> the value of the safe alternative option, <i>σ<\/i> is Fechner noise and erf is the error function. The regression was fitted using non-linear least-squares implemented in Matlab’s nlinfit.m. In both studies, these <i>⍴<\/i> values were compared between <i>Solo<\/i> and <i>Social<\/i> conditions using paired <i>t<\/i>-tests."}]}}]}}]}}, {"type": "sec", "sec": {"id": "s4-8", "title": "Momentary happiness", "depth": 2, "blocks": [{"type": "sec", "sec": {"id": "s4-8-1", "title": "Computational models of happiness variations", "depth": 3, "blocks": [{"type": "p", "html": "Following previous work (<span class=\"cite\">Rutledge et al., 2014<\/span>; <span class=\"cite\">Rutledge et al., 2016<\/span>), we modelled the variations in momentary well-being (happiness ratings) using computational models that considered the influence of recent reward expectations, prediction errors resulting from those expectations, and differences in rewards obtained by the game partners. All models contained separate terms for certain rewards, expected value for lotteries and reward prediction errors, with influences that decayed exponentially over trials. We ran five models: (1) a ‘Basic’ model (Equation 4; the winning model in <span class=\"cite\">Rutledge et al., 2014<\/span> in which there was no <i>Social<\/i> condition) with certain rewards (<i>CR<\/i>), expected value of chosen lotteries (<i>EV<\/i>), participant’s reward prediction errors (<i>sRPE<\/i>, where s stands for ‘self’) and a forgetting factor that makes events in more recent trials more influential than those in earlier trials (gamma); (2) an ‘Inequality’ model, in which one regressor modelled both disadvantageous and advantageous inequality (Equation 5); (3) a ‘Guilt-envy’ model, the winning model in the social task in <span class=\"cite\">Rutledge et al., 2016<\/span>, which contains separate additional regressors for disadvantageous and advantageous inequality (Equation 6); (4) a ‘Responsibility’ model in which in addition to the participant’s reward prediction errors (<i>sRPE<\/i>) we also modelled the partner’s reward prediction errors (<i>pRPE<\/i>, where p stands for partner), with a distinction between <i>pRPE<\/i>s resulting from participant choices (<i>social_pRPE<\/i>) and partner choices (<i>partner_pRPE<\/i>) (Equation 7); and (5) a ‘Responsibility Redux’ model identical to the precedent except for the absence of <i>partner_pRPE<\/i>s, as we realized that this regressor explained little variance (Equation 8). The Basic, Inequality and Guilt-envy models are identical to those used in <span class=\"cite\">Rutledge et al., 2016<\/span>."}, {"type": "p", "html": "The equations of these models were as follows."}, {"type": "p", "html": "The equation for the Basic model was:<span class=\"math\">(4)Happiness(t)=w1∑j=1tγt−jCRj+w2∑j=1tγt−jEVj+w3∑j=1tγt−jsRPEj\\begin{document}$$\\displaystyle  Happiness\\left (t\\right)=w_{1}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}CR_{j}+w_{2}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}EV_{j}+w_{3}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}sRPE_{j}$$\\end{document}<\/span>"}, {"type": "p", "html": "where <i>t<\/i> is trial number, <i>γ<\/i> is a forgetting factor (0 ≤ <i>γ<\/i> ≤ 1) that weighs events in more recent trials more heavily than events in earlier trials (exponential decay over time), and weights <i>w<\/i><sub>1<\/sub> to <i>w<\/i><sub>3<\/sub> capture the influence of the following different event types: <i>CR<sub>j<\/sub><\/i> is the certain reward received when the safe option was chosen instead of the lottery on trial <i>j<\/i>, <i>EV<sub>j<\/sub><\/i> is the average reward for the lottery if chosen on trial <i>j<\/i> and <i>sRPE<sub>j<\/sub><\/i> is the participant’s reward prediction error on trial <i>j<\/i> obtained as a result of choosing the lottery. Terms for unchosen options were set to zero. No constant term was used as ratings were <i>Z<\/i>-scored, resulting in a mean of the data of 0."}, {"type": "p", "html": "As described above, we complemented the Basic model by adding terms representing additional influences on variations in participant happiness. Two models included regressors accounting for inequality, and two models included regressors accounting for partner reward prediction errors. The equation for the first of the inequality models, the ‘Inequality’ model, was as follows:<span class=\"math\">(5)Happiness(t)=w1∑j=1tγt−jCRj+w2∑j=1tγt−jEVj+w3∑j=1tγt−jsRPEj+w4∑j=1tγt−jmax(|Sj−Pj|,0)j\\begin{document}$$\\displaystyle \\begin{array}{ll} Happiness\\left (t\\right)&=w_{1}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}CR_{j}+w_{2}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}EV_{j}+w_{3}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}sRPE_{j} \\\\ &+w_{4}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}\\mathrm{m}\\mathrm{a}\\mathrm{x} \\left (|S_{j}-P_{j}|, 0\\right)_{j}\\end{array}$$\\end{document}<\/span>"}, {"type": "p", "html": "Here, <i>S<sub>j<\/sub><\/i> and <i>P<sub>j<\/sub><\/i> are the rewards received by the participant and by their experiment partner, respectively, and thus <i>w<\/i><sub>4<\/sub> relates to the influence of inequality of any kind on the variation in happiness. The equation of the ‘Guilt-envy’ model was as follows:<span class=\"math\">(6)Happiness(t)=w1∑j=1tγt−jCRj+w2∑j=1tγt−jEVj+w3∑j=1tγt−jsRPEj+w4∑j=1tγt−jmax(Sj−Pj,0)j+w5∑j=1tγt−jmax(Pj−Sj,0)j\\begin{document}$$\\displaystyle \\begin{array}{ll} Happiness\\left (t\\right) &=w_{1}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}CR_{j}+w_{2}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}EV_{j}+w_{3}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}sRPE_{j} \\\\ &+w_{4}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}\\mathrm{m}\\mathrm{a}\\mathrm{x} \\left (S_{j}-P_{j}, 0\\right)_{j}+w_{5}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}\\mathrm{m}\\mathrm{a}\\mathrm{x} \\left (P_{j}-S_{j}, 0\\right)_{j}\\end{array}$$\\end{document}<\/span>"}, {"type": "p", "html": "Here, <i>w<\/i><sub>4<\/sub> relates to advantageous inequality and <i>w<\/i><sub>5<\/sub> relates to disadvantageous inequality, modelled separately. The next two models included terms relating to the partner’s RPE."}, {"type": "p", "html": "The equation for the ‘Responsibility’ model was:<span class=\"math\">(7)Happiness(t)=w1∑j=1tγt−jCRj+w2∑j=1tγt−jEVj+w3∑j=1tγt−jsRPEj+w4∑j=1tγt−jsocial_pRPEj+w5∑j=1tγt−jpartner_pRPEj\\begin{document}$$\\displaystyle \\begin{array}{ll} Happiness\\left (t\\right) &=w_{1}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}CR_{j}+w_{2}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}EV_{j}+w_{3}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}sRPE_{j} \\\\ &+w_{4}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}social\\_ pRPE_{j}+ w_{5}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}partner\\_ pRPE_{j}\\end{array}$$\\end{document}<\/span>"}, {"type": "p", "html": "In this model, the influence of the partner’s RPE resulting from participant choices in the <i>Social<\/i> condition (<i>social_pRPE<\/i>) is modelled separately from the influence of the partner’s RPE resulting from partner choices, in the <i>Partner<\/i> condition (<i>partner_pRPE<\/i>). The equation for the last model, ‘Responsibility Redux’, was the same as for the Responsibility model (Equation 7), except that we omitted the regressor coding partner’s RPE resulting from partner choices, as they had a smaller impact on participant happiness. This led to the following equation:<span class=\"math\">(8)Happiness(t)=w1∑j=1tγt−jCRj+w2∑j=1tγt−jEVj+w3∑j=1tγt−jsRPEj+w4∑j=1tγt−jsocial_pRPEj\\begin{document}$$\\displaystyle \\begin{array}{ll} Happiness\\left (t\\right)&=w_{1}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}CR_{j}+w_{2}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}EV_{j}+w_{3}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}sRPE_{j}\\\\&+w_{4}\\sum \\limits_{j=1}^{t}\\gamma ^{t-j}social\\_ pRPE_{j}\\end{array}$$\\end{document}<\/span>"}]}}]}}, {"type": "sec", "sec": {"id": "s4-9", "title": "Likelihood ratio test", "depth": 2, "blocks": [{"type": "p", "html": "To formally assess which of our models fitted the data best, we supplemented the AIC, BIC, <i>R<\/i><sup>2<\/sup> and adjusted <i>R<\/i><sup>2<\/sup> values reported in Table 1 with a series of <i>likelihood ratio tests<\/i>: we compared pair-wise the likelihoods of the <i>Responsibility<\/i> model given the data to the likelihoods of all the other models. The equation for this test was the following:<span class=\"math\">LR=2∗log(L0/L1);\\begin{document}$$\\displaystyle LR =2^* {\\rm log} (L_0/L_1);$$\\end{document}<\/span>"}, {"type": "p", "html": "where <i>L<\/i><sub>0<\/sub> and <i>L<\/i><sub>1<\/sub> are, respectively, the likelihoods of the simpler and more complex model. The likelihood ratio follows a Chi-square distribution, with degrees of freedom equal to the number of extra parameters in the more complex model. The equation simplifies to:<span class=\"math\">(9)LR=−2∗(log(L1)−log(L0))\\begin{document}$$\\displaystyle LR = -2^* ({\\rm log} (L_1)-{\\rm log} (L_0))$$\\end{document}<\/span>"}]}}, {"type": "sec", "sec": {"id": "s4-10", "title": "Parameter recovery", "depth": 2, "blocks": [{"type": "p", "html": "Stability of the estimated parameters of these models was evaluated by attempting to recover parameters from synthetic data created using each participant’s real estimated parameters. After fitting each participant’s momentary happiness data (see above), we synthesized new momentary happiness data based on each participant’s estimated parameters, added 1SD of noise to the happiness data, fitted the model to these synthetic data, and repeated this procedure 10 times, for both studies. We then compared these new estimated parameters to the actual parameters from which the synthetic data were generated, as follows: For each parameter, we calculated the mean of each participant’s recovered parameters and regressed these means on the participants’ actual parameters (see <a class=\"xref\" href=\"#fig3s1\">Figure 3—figure supplement 1<\/a>). The results show that the estimated parameters could be reliably recovered from noisy synthetic data."}, {"type": "sec", "sec": {"id": "s4-10-1", "title": "LMM regressions of happiness variations", "depth": 3, "blocks": [{"type": "p", "html": "To better understand the impact of responsibility for outcomes of risky social choices on happiness, we focused on the happiness reported after outcomes of lottery choices in <i>Social<\/i> and <i>Partner<\/i> trials and evaluated the impact of who chose the lottery. We performed this analysis using a mixed-effects linear regression analysis with residual ε<i><sub>ij<\/sub><\/i> ∼ <i>N<\/i>(0, <i>σε<\/i><sup>2<\/sup>) and subject-specific random intercepts <i>uj<\/i> ∼ <i>N<\/i>(0, <i>σu<\/i><sup>2<\/sup>). Specifically, we regressed <i>Z<\/i>-scored momentary happiness ratings reported after these outcomes on dummy variables representing occurrences (coded as 1 if event present, 0 otherwise) of the participant receiving the high lottery outcome, the partner receiving the high lottery outcome, the participant having chosen the lottery, and interactions between these terms.<span class=\"math\">(10)Happiness(t)=1+β1sHighij+β2pHighij+β3sDecij+β4sHigh∗pHighij+β5sHigh∗sDecij+β6pHigh∗sDecij+uj+εij.\\begin{document}$$\\displaystyle \\begin{array}{ll}{\\rm Happiness(t)}&=1 + \\beta_1sHigh_{ij} + \\beta_2pHigh_{ij} + \\beta_3sDec_{ij} + \\beta_4sHigh^*pHigh_{ij} + \\beta_5sHigh^*sDec_{ij} \\\\ & \\qquad + \\beta_6pHigh^*sDec_{ij} +uj + \\varepsilon ij.\\end{array}$$\\end{document}<\/span>"}, {"type": "p", "html": "<i>sHigh<\/i> and <i>pHigh<\/i> had a value of 1 if the participant or the partner (respectively) received the high lottery outcome and 0 otherwise, <i>sDec<\/i> had a value of 1 if the participant chose the lottery. All models were estimated for Studies 1 and 2 separately, using the <i>lme4 package in R<\/i>. In both studies, the model reported in Equation 10 fitted the data significantly better (p < 2e−5) than the simpler models without interactions (higher total and adjusted <i>R<\/i><sup>2<\/sup>, see Appendix 1—table 2), but not significantly worse than the model with all interactions (p > 0.5; tested with the ANOVA function in R). The regressors of the different models tested and their relative effects are reported in Appendix 1—table 2."}]}}]}}, {"type": "sec", "sec": {"id": "s4-11", "title": "fMRI data acquisition and pre-processing", "depth": 2, "blocks": [{"type": "p", "html": "Imaging data were collected on a 3T Siemens TRIO MRI system (Siemens AG, Erlangen, Germany) with a Siemens 32-channel head coil. Functional data were acquired using a T2* echo-planar imaging (EPI) BOLD sequence, with a repetition time (TR) of 2500 ms, an echo time (TE) of 30 ms, 37 slices with voxel sizes of 2 × 2 × 3 mm, a flip angle of 90°, a field of view of 192 mm and PAT two acceleration. To exclude participants with apparent brain pathologies and facilitate normalization of the functional data, a high-resolution T1-weighted structural image was acquired, with a TR of 1660 ms, a TE of 2540 ms, 208 slices with voxel sizes of 0.8 × 0.8 × 0.8 mm and a field of view of 256 mm. Data were then pre-processed and analysed as in previous studies (e.g., <span class=\"cite\">Schultz et al., 2019<\/span>) using standard procedures in SPM12. The first five volumes of each functional time series were discarded to allow for T1 signal equilibration. The structural image of each participant was coregistered with the mean functional image of that participant. Functional images were corrected for head movement between scans by a 6-parameter affine realignment to the first image of the time-series and then re-realigned to the mean of all images. The structural scan of each participant was spatially normalized to the current Montreal Neurological Institute template (MNI305) by segmentation and non-linear warping to reference tissue probability maps in MNI space, and the resulting normalization parameters were applied to all functional images which were then resampled at 2 × 2 × 2 mm voxel size, then smoothed using an 8 mm full width at half maximum Gaussian kernel. Time series were de-trended by the application of a high-pass filter (cut-off period, 128 s)."}]}}, {"type": "sec", "sec": {"id": "s4-12", "title": "fMRI data analysis", "depth": 2, "blocks": [{"type": "p", "html": "The pre-processed functional data were analysed using a standard two-stage approach based on the general linear model (GLM) implemented in SPM12 running in MATLAB, with corrections for multiple comparisons. Individual participants’ data were modelled with fixed effects models, and their summary data were entered in random effects models for group statistics and inferences at the population level."}, {"type": "sec", "sec": {"id": "s4-12-1", "title": "Fixed-effects models", "depth": 3, "blocks": [{"type": "p", "html": "The fixed effects models implemented a mass univariate analysis applied to the pre-processed data. The first GLM (GLM1) included the following event types for each session: presentation of choice options, safe choice, risky choice (=lottery), receipt of outcome of safe option, all modelled separately for the <i>Social<\/i>, <i>Partner<\/i>, and <i>Solo<\/i> conditions; then receipt of high lottery outcome by the partner, separately coded for the <i>Social<\/i> and <i>Partner<\/i> conditions, and receipt of high lottery outcome by the participant; then receipt of low lottery outcome by the partner, separately coded for the <i>Social<\/i> and <i>Partner<\/i> conditions, and receipt of low lottery outcome by the participant; a final regressor modelled the button presses that occurred when reporting momentary happiness. All events were modelled as stick functions at the time of occurrence and convolved by SPM using the canonical haemodynamic function. In addition, we created another GLM (GLM2) with regressors designed to identify brain regions whose activation reflected the variables of the best-fitting computational model (see above). This model contained regressors coding the receipt of certain rewards (<i>CR<\/i>), the expected value of the chosen option (<i>EV<\/i>), the participant’s reward prediction error (<i>sRPE<\/i>), the partner RPE resulting from decisions made by the participant (<i>social_pRPE<\/i>) and the partner RPE resulting from decisions made by the partner (<i>partner_pRPE<\/i>). Those regressors were applied as follows to each experimental session of each participant: (1) fitting the computational model to the momentary happiness data; (2) creation of a series of stick functions representing the time of occurrence of the modelled events during the scan, with stick magnitude determined by the fitted value calculated by the model; and (3) convolution of the series of stick functions with the canonical BOLD function (as implemented in SPM). The 5 computational regressors were entered as covariates into each participant’s model, which also contained one regressor modelling the button presses that occurred when reporting momentary happiness. All GLMs contained six motion-correction parameters included as regressors of no-interest to account for motion-related artefacts. Regression coefficients (parameter estimates) were estimated for each regressor in each voxel of each participant’s brain."}]}}, {"type": "sec", "sec": {"id": "s4-12-2", "title": "PPI analysis", "depth": 3, "blocks": [{"type": "p", "html": "We used the gPPI toolbox (<span class=\"cite\">McLaren et al., 2012<\/span>) for SPM to run seed-to-voxel functional connectivity analyses. We ran two models for each participant, both based on GLM1, with the following seeds: the left insula cluster more sensitive to the outcomes of <i>Risky<\/i> vs<i>. Safe<\/i> choices, yielding GLM3 (see <a class=\"xref\" href=\"#fig4\">Figure 4D, E<\/a>), and the left STS cluster responding more to <i>social_pRPE<\/i> than <i>partner_pRPE<\/i>, yielding GLM4 (<a class=\"xref\" href=\"#fig4\">Figure 4H<\/a>). Seeds were identical for all participants. PPI models thus contained the same regressors as GLM1, plus the interaction between the first eigenvariate of the signal in the seed region and the regressors coding the experimental conditions of interest: <i>Safe<\/i> and <i>Risky<\/i> choice in <i>Social<\/i>, <i>Partner<\/i> and <i>Solo<\/i> conditions."}]}}, {"type": "sec", "sec": {"id": "s4-12-3", "title": "Random-effects models", "depth": 3, "blocks": [{"type": "p", "html": "Individual parameter estimate maps of the responses to the experimental conditions were assessed in random-effects tests to evaluate effects at the level of the group of participants. These tests were second-level models based on individual parameter estimate maps. We tested six models: a full factorial model to investigate the response during decisions [factors <i>Choice<\/i> (<i>Safe<\/i> or <i>Risky<\/i>) and <i>Condition<\/i> (<i>Social<\/i> or <i>Solo<\/i>), based on GLM1 estimate maps]; a full factorial model to investigate the response during the receipt of outcomes [factors <i>Outcome<\/i> (<i>Safe<\/i>, <i>HighOutcome<\/i>, or <i>LowOutcome<\/i>) and <i>Condition<\/i> (<i>Social<\/i>, <i>Partner<\/i>, or <i>Solo<\/i>), based on GLM1 estimate maps]; a paired <i>t<\/i>-test contrasting negative lottery outcomes for the partner resulting from participant or partner choices (based on GLM1 estimate maps); a model to investigate the response to the computational regressors (<i>CR<\/i>, <i>EV<\/i>, <i>sRPE<\/i>, <i>social_pRPE<\/i>, and <i>social_pRPE<\/i>, based on GLM2 estimate maps); and two full factorial models to investigate functional connectivity during decisions [factors <i>Choice<\/i> (<i>Safe<\/i> or <i>Risky<\/i>) and <i>Condition<\/i> (<i>Social<\/i> or <i>Solo<\/i>), based on estimate maps of GLM3 and GLM4]."}]}}, {"type": "sec", "sec": {"id": "s4-12-4", "title": "Linear mixed models", "depth": 3, "blocks": [{"type": "p", "html": "Similar to the behavioural data, we analysed GLM1 parameter estimates from voxels of specific regions of interest (see Results) using mixed-effects linear regressions with residual ε<i><sub>ij<\/sub><\/i> ∼ <i>N<\/i>(0, <i>σε<\/i><sup>2<\/sup>) and subject-specific random effects <i>uj<\/i> ∼ <i>N<\/i>(0, <i>σu<\/i><sup>2<\/sup>). These models were implemented in Matlab and fitted with the fitlme.m function using restricted maximum likelihood estimation. We regressed parameter estimates on dummy variables representing variables of interest. For responses during the decision phase of the experiment, our models included factors <i>Choice<\/i> (<i>Safe<\/i> or <i>Risky<\/i>), <i>Condition<\/i> (<i>Social<\/i>, <i>Partner<\/i>, or <i>Solo<\/i>), <i>Run<\/i> (run one or two), and <i>ROI<\/i>, with all interactions. For responses during the outcome phase, our models included the factors <i>Social<\/i> (value of 1 for the <i>Social<\/i> condition and 0 for the <i>Partner<\/i> condition), <i>LowOutcome<\/i> (value of 1 for <i>Low lottery outcome<\/i> and 0 for <i>High lottery outcome)<\/i>, <i>Run<\/i>, with all interactions. Models without the factor <i>Run<\/i> were tested as well, and the best-fitting models were tested further. In all models, <i>Subject<\/i> was the only random factor (random intercept). To better understand significant interaction effects, we ran subsequent analyses on contrasts of parameter estimates (see Results and Appendix 1)."}]}}, {"type": "sec", "sec": {"id": "s4-12-5", "title": "Thresholding", "depth": 3, "blocks": [{"type": "p", "html": "All clusters reported survive a significance threshold of p < 0.05 with family-wise error correction for multiple comparisons across the whole brain or a smaller volume when explicitly mentioned, based on an uncorrected voxel-wise (cluster-forming) threshold of <i>p<\/i> < 0.001."}]}}]}}]}], "figures": [{"id": "fig1", "num": "1", "label": "Figure 1", "title": "Experimental design.", "caption": "In every trial, participants were presented with pairs of monetary options (a safe and a risky option; the risky option was a lottery with equally probable high and low outcomes). There were three conditions: a non-social ‘Solo’ condition, in which the participant’s choice led to an outcome just for themselves (left panel); and two conditions in which choices were made by the participant (‘Social’ condition) or by their partner (‘Partner’ condition) and led to outcomes affecting both players (right panel). Importantly, selecting the risky option in the social or partner conditions led to the lottery being played out independently for both players; that is, participant and partner could receive the high or low outcome independently from each other (coloured boxes). Selecting the safe option led to both players receiving an equal outcome.", "src": "https://iiif.elifesciences.org/lax/105391%2Felife-105391-fig1-v1.tif/full/1100,/0/default.jpg", "claims": []}, {"id": "fig2", "num": "2", "label": "Figure 2", "title": "Participant choices in Studies 1 (outside fMRI, N = 40) and 2 (inside fMRI, N = 44).", "caption": "(<b>A, D<\/b>) The probability of choosing the risky option (lottery) in both Solo and Social conditions is well explained by the difference in expected value of the risky and safe choice options (EV<sub>risky<\/sub> – <i>V<\/i><sub>safe<\/sub>). Participants chose the risky option slightly more often in the Solo condition than in the Social condition in Study 1 (<b>A<\/b>) but not in Study 2 (<b>D<\/b>). Lines are predicted values of a logit linear mixed regression model fitted to the choice data (see Results). Error areas indicate 95% pointwise confidence intervals for the predicted values. Triangles indicate individual average choice proportions binned by EV<sub>risky<\/sub> – <i>V<\/i><sub>safe<\/sub> value; size of triangle reflects the number of participants contributing to a datapoint. Blue upward-pointing and red downward-pointing triangles are data from the Solo and Social conditions, respectively. (<b>B, E<\/b>) Risk premiums did not differ between Solo and Social conditions. (<b>C, F<\/b>) Values of the risk aversion parameter ρ in the Solo and Social conditions were broadly consistent with Risk premium values, but showed that participants were slightly more risk averse in the Social than in the Solo condition in Study 1 only (see Results). In panels B, C, E and F, grey lines and markers show individual data, red lines show means with 95% confidence intervals about the means, and grey areas are kernel density plots representing the distribution of the data.", "src": "https://iiif.elifesciences.org/lax/105391%2Felife-105391-fig2-v1.tif/full/1100,/0/default.jpg", "claims": [{"slug": "lottery-choice-increases-with-ev", "letters": ["A", "D"]}, {"slug": "solo-vs-social-choice-difference", "letters": ["A", "D"]}, {"slug": "risk-premiums-null-social-solo", "letters": ["B", "E"]}]}, {"id": "fig3", "num": "3", "label": "Figure 3", "title": "Participant momentary happiness in Studies 1 (A–D) and 2 (E–H).", "caption": "Happiness varied with rewards received by the participant (<b>A, E<\/b>) and by the partner (<b>B, F<\/b>). Each dot is one trial; data are pooled across participants. Lines are fitted regression lines. A computational model taking into account expected, previous and current rewards, reward prediction errors for both participant and partner, and decision-maker (Responsibility Redux model, see Results) predicted the variations in participants’ momentary happiness well (<b>C, G<\/b>, and Table 1). Changes in momentary happiness after lottery choices in Social and Partner conditions varied with lottery outcome and decision-maker (<b>D, H<\/b>). Data were binned according to outcome for each participant and decision-maker (Social = participant chose the lottery, Partner = partner chose the lottery). Crucially, responsibility for low lottery outcomes for the partner decreased participant happiness more than the same outcomes following partner choices (see Results), which fits the definition of interpersonal guilt. In D and H, dots are individual datapoints, the bar indicates the mean, the error bars are 95% confidence intervals about the mean, and the stars indicate the significance of the ‘guilt effect’ (see text): ***p < 0.001; **p < 0.01.", "src": "https://iiif.elifesciences.org/lax/105391%2Felife-105391-fig3-v1.tif/full/1100,/0/default.jpg", "claims": [{"slug": "happiness-correlates-partner-reward", "letters": ["A", "B", "E", "F"]}, {"slug": "social-prpe-weight-positive", "letters": ["C", "G"]}, {"slug": "guilt-effect-independent-of-own-outcome", "letters": ["D", "H"]}, {"slug": "guilt-reduces-happiness-after-partner-loss", "letters": ["D", "H"]}, {"slug": "agency-reduces-happiness", "letters": []}, {"slug": "responsibility-modulates-guilt-computational", "letters": []}]}, {"id": "fig4", "num": "4", "label": "Figure 4", "title": "BOLD responses.", "caption": "(<b>A<\/b>) Regions showing a greater response when participants chose the risky (lottery) rather than the safe option, irrespective of Social or Solo condition. (<b>B<\/b>) Regions showing a greater response when participants chose for both themselves and their partner rather than just for themselves (Social > Solo). (<b>C<\/b>) Coefficients of linear mixed models (LMMs) indicate that two of these regions, precuneus and TPJ, were most active when participants chose the lottery in the Social condition. R–S indicates results of LMMs based on the Risky–Safe response difference. All coefficients and differences reported are significantly different from 0 (see Appendix 1—table 4). (<b>D<\/b>) Brain regions more active during receipt of the outcomes of lotteries than safe choices (all conditions). (<b>E<\/b>) Coefficients of LMMs indicated that insula ROIs (see D) mirrored the guilt effect observed in our behavioural data: voxels here responded more to low lottery outcomes (L) for the partner when these resulted from participant’s rather than the partner’s choices, even when responses to high outcomes were subtracted (L–H). All coefficients and differences reported are significantly different from 0 (see Appendix 1—table 6). (<b>F<\/b>) A mass-univariate, voxel-wise analysis showed a compatible result: A cluster of voxels within the left insula ROI showed higher responses to low lottery outcomes for the partner if these resulted from participant rather than partner choices. (<b>G<\/b>) Activation in bilateral ventral striatum explained by a computational model-based regressor coding participant rewards. (<b>H<\/b>) Within brain regions sensitive to outcomes of risky choices, one cluster in the left superior temporal sulcus region showed a higher response to partner reward prediction errors resulting from participant rather than partner choices. (<b>I<\/b>) Response in this cluster to the computational-model-based regressors coding participant reward prediction resulting from participant and partner choices, for both sessions of the experiment. All results shown survive thresholding at p < 0.05 corrected for multiple comparisons at the cluster level, based on a voxel-wise uncorrected threshold of p < 0.001. Colours in panels A–I indicate T values. In C and E, bars indicate the estimated coefficients. In C, E, and I, error bars are 95% confidence intervals.", "src": "https://iiif.elifesciences.org/lax/105391%2Felife-105391-fig4-v1.tif/full/1100,/0/default.jpg", "claims": [{"slug": "ventral-striatum-tracks-risky-choices", "letters": ["A"]}, {"slug": "precuneus-tpj-mpfc-social-decisions", "letters": ["B"]}, {"slug": "insula-tracks-guilt-effect", "letters": ["E", "F"]}, {"slug": "ventral-striatum-tracks-computational-reward", "letters": ["G"]}, {"slug": "sts-tracks-partner-reward-prediction-errors", "letters": ["H"]}, {"slug": "guilt-signature-no-individual-difference", "letters": []}, {"slug": "insula-guilt-replicates-yu-koban-signature", "letters": []}, {"slug": "interprets-yu-koban-guilt-signature", "letters": []}]}, {"id": "fig5", "num": "5", "label": "Figure 5", "title": "Changes in functional conn idates", "label": "Validated by", "from": "insula-guilt-replicates-yu-koban-signature"}, {"rel": "confirms", "label": "Confirmed by", "from": "insula-tracks-guilt-effect"}, {"rel": "validates", "label": "Validated by", "from": "lottery-choice-increases-with-ev"}, {"rel": "derived-from", "label": "Basis for", "from": "prediction-behavioral-guilt-effect"}, {"rel": "derived-from", "label": "Basis for", "from": "prediction-insula-tracks-guilt"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/hypothesis-insula-tracks-interpersonal-guilt/"}, {"slug": "hypothesis-responsibility-weights-partner-rpes", "uuid": "88edff87-3bea-4030-bdf5-fb172865c445", "number": "H2", "kind": "Hypothesis", "role": "hypothesis", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "Happiness weighs a partner's reward surprises by how responsible you are for them.", "short": "Happiness weights partner reward prediction errors by the subject's responsibility.", "full": "Momentary happiness in social decision contexts is governed by a computational rule in which partner reward prediction errors that arise from the participant's own choices (social_pRPEs) carry an independent, non-zero weight, distinct from the weight on partner RPEs that arise without participant agency. Responsibility modulates how partner outcomes enter the happiness computation: participants internalize partner losses as affective costs specifically when those losses can be attributed to their own decision.", "panel": "hypothesis", "panels": [], "method": "hypothesis stated in introduction and modelling section", "dataset": null, "analysis": null, "check": null, "out": [{"rel": "entails", "label": "Leads to the prediction", "to": "prediction-responsibility-model-wins-comparison"}, {"rel": "entails", "label": "Leads to the prediction", "to": "prediction-behavioral-guilt-effect"}], "in": [{"rel": "confirms", "label": "Confirmed by", "from": "guilt-reduces-happiness-after-partner-loss"}, {"rel": "derived-from", "label": "Basis for", "from": "prediction-behavioral-guilt-effect"}, {"rel": "derived-from", "label": "Basis for", "from": "prediction-responsibility-model-wins-comparison"}, {"rel": "confirms", "label": "Confirmed by", "from": "responsibility-modulates-guilt-computational"}, {"rel": "tests", "label": "Tested by", "from": "social-prpe-weight-positive"}, {"rel": "confirms", "label": "Confirmed by", "from": "social-prpe-weight-positive"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/hypothesis-responsibility-weights-partner-rpes/"}, {"slug": "hypothesis-sts-mentalizes-partner-state-under-responsibility", "uuid": "01faee80-e511-4f08-9a93-225e869637ee", "number": "H3", "kind": "Hypothesis", "role": "hypothesis", "stance": "asserts", "status": "na", "statusLabel": "", "plain": "The superior temporal sulcus tracks the partner's experience only when you were responsible for it.", "short": "STS tracks the partner's RPEs only when the subject is responsible for the outcome.", "full": "Superior temporal sulcus (STS) — a core mentalizing-network region — represents the partner's affective experience specifically when the participant is responsible for the partner's outcome. The mentalizing computation is conditioned on agency: STS does not track partner reward prediction errors uniformly, but rather engages selectively when the participant's own choice produced the partner's outcome, consistent with self-attributed responsibility recruiting other-modeling.", "panel": "hypothesis", "panels": [], "method": "hypothesis stated in introduction and discussion", "dataset": null, "analysis": null, "check": null, "out": [{"rel": "entails", "label": "Leads to the prediction", "to": "prediction-sts-tracks-partner-rpe-under-responsibility"}], "in": [{"rel": "derived-from", "label": "Basis for", "from": "prediction-sts-tracks-partner-rpe-under-responsibility"}, {"rel": "confirms", "label": "Confirmed by", "from": "sts-tracks-partner-reward-prediction-errors"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/hypothesis-sts-mentalizes-partner-state-under-responsibility/"}, {"slug": "insula-guilt-replicates-yu-koban-signature", "uuid": "7808e12b-12e9-4340-997a-f4eeb2da40d7", "number": "I1", "kind": "Interpretation", "role": "interpretation", "stance": "asserts", "status": "matches", "statusLabel": "Re-run matches", "plain": "The insula response matches a previously published brain signature of guilt.", "short": "The insula guilt effect matches the published Yu & Koban guilt signature.", "full": "The anterior insula guilt effect is consistent with a previously published neural guilt signature map (Yu & Koban), providing convergent validity for the insula as a guilt-tracking region.", "panel": "fig4 (supplement)", "panels": [["4", ""]], "method": "spatial correlation with published neural mask", "dataset": "https://openneuro.org/datasets/ds005588", "analysis": "f_apply_YuKoban_guilt_signature_map.m", "check": {"paper": "sign test p<0.05", "reproduced": "nibabel not installed", "date": null, "how": null}, "out": [{"rel": "validates", "label": "Validates", "to": "hypothesis-insula-tracks-interpersonal-guilt"}, {"rel": "interprets", "label": "Interprets", "to": "insula-tracks-guilt-effect"}, {"rel": "interprets", "label": "Interprets", "to": "interprets-yu-koban-guilt-signature"}], "in": [{"rel": "scopes", "label": "Qualified by", "from": "partner-algorithm-deception-assumption"}, {"rel": "scopes", "label": "Qualified by", "from": "scope-two-study-design"}], "url": "https://zmainen.github.io/elife-claim-trees/papers/gadeke-2026-guilt-insula/insula-guilt-replicates-yu-koban-signature/"}, {"slug": "insula-ifg-connectivity-guilt", "uuid": "8f7f9f33-a142-4962-b4cd-f161de239f2e", "number": "E1", "kind": "Finding", "role": "empirical", "stance": "asserts", "status": "matches", "statusLabel": "Re-run matches", "plain": "Coupling between the anterior insula and
