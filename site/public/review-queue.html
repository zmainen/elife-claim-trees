<title>Claims Awaiting You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:#fdfdfb; --surface:#f5f5f2; --surface-2:#ecedea; --ink:#1c1e1f; --ink-2:#4b5054; --ink-3:#7a8085;
    --rule:#e3e5e2; --rule-firm:#c9ccc8;
    --claim:#0f6e7a; --claim-ink:#0b5660; --claim-wash:rgba(15,110,122,.08); --claim-line:rgba(15,110,122,.5);
    --yes:#2f7d4f; --yes-bg:#e6f1ea; --no:#a83a2b; --no-bg:#f6e3df; --edit:#a86f12; --edit-bg:#f6ecd8;
    --shadow:0 1px 2px rgba(20,30,32,.06), 0 8px 24px rgba(20,30,32,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#141617; --surface:#1b1e20; --surface-2:#23272a; --ink:#e6e8e6; --ink-2:#b4b9b8; --ink-3:#828887;
      --rule:#2c3134; --rule-firm:#454b4f;
      --claim:#6cc3cd; --claim-ink:#8fd3db; --claim-wash:rgba(108,195,205,.10); --claim-line:rgba(108,195,205,.55);
      --yes:#74bf92; --yes-bg:#1c2c22; --no:#e08b74; --no-bg:#2f1e19; --edit:#d8ab52; --edit-bg:#2e2618;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground:#141617; --surface:#1b1e20; --surface-2:#23272a; --ink:#e6e8e6; --ink-2:#b4b9b8; --ink-3:#828887;
    --rule:#2c3134; --rule-firm:#454b4f;
    --claim:#6cc3cd; --claim-ink:#8fd3db; --claim-wash:rgba(108,195,205,.10); --claim-line:rgba(108,195,205,.55);
    --yes:#74bf92; --yes-bg:#1c2c22; --no:#e08b74; --no-bg:#2f1e19; --edit:#d8ab52; --edit-bg:#2e2618;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:"Source Sans 3", system-ui, sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--claim); outline-offset:2px; }
  input, textarea { font:inherit; color:inherit; }

  /* ── header ──────────────────────────────────────────── */
  .top { position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--rule); }
  .top-in { max-width:940px; margin:0 auto; padding:12px 24px 0; }
  .top-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .title { font-weight:600; font-size:15px; margin:0; }
  .who { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-3); }
  .who input { width:11em; background:transparent; border:0; border-bottom:1px solid var(--rule-firm); padding:2px 0; font-size:13px; color:var(--ink); }
  .who input:focus { border-color:var(--claim); }
  .count { font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .bar { display:flex; gap:3px; margin:11px 0 0; padding-bottom:11px; }
  .pip { flex:1; height:4px; border-radius:2px; background:var(--surface-2); transition:background .15s; }
  .pip.accept, .pip.edit { background:var(--yes); }
  .pip.reject { background:var(--no); }
  .pip.at { background:var(--claim); }

  /* ── the card ────────────────────────────────────────── */
  main { max-width:940px; margin:0 auto; padding:28px 24px 140px; }
  .lede { color:var(--ink-2); font-size:15px; max-width:62ch; margin:0 0 26px; }
  .lede b { color:var(--ink); font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--rule); border-radius:8px; box-shadow:var(--shadow); overflow:hidden; }
  .card-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:14px 22px; border-bottom:1px solid var(--rule); background:var(--surface-2); }
  .paper { font-size:13px; color:var(--ink-2); font-weight:500; }
  .where { font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-3); letter-spacing:.03em; }
  .role { margin-left:auto; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--claim); font-weight:600; }
  .card-body { padding:22px; }
  .k { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:0 0 8px; }
  .says { font-family:"Source Serif 4", Georgia, serif; font-size:17px; line-height:1.55; color:var(--ink); margin:0 0 6px; border-left:2px solid var(--rule-firm); padding-left:16px; }
  .ctx { font-family:"Source Serif 4", Georgia, serif; font-size:14.5px; line-height:1.5; color:var(--ink-3); margin:0 0 4px; padding-left:16px; border-left:2px solid var(--rule); }
  .split { display:grid; grid-template-columns:1fr; gap:22px; margin-top:22px; }
  .split.has-fig { grid-template-columns:1fr 280px; }
  @media (max-width:780px){ .split.has-fig { grid-template-columns:1fr; } }
  .proposed { background:var(--claim-wash); border:1px solid var(--claim-line); border-radius:6px; padding:16px 18px; }
  .proposed .k { color:var(--claim); }
  .claim-text { font-family:"Source Serif 4", Georgia, serif; font-size:16.5px; line-height:1.5; color:var(--ink); margin:0; }
  .slug { font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-3); margin:10px 0 0; word-break:break-all; }
  .why { font-size:14px; color:var(--ink-2); line-height:1.5; margin:14px 0 0; }
  .why b { color:var(--ink); font-weight:600; }
  figure { margin:0; }
  figure img { width:100%; height:auto; display:block; border:1px solid var(--rule); border-radius:4px; background:#fff; cursor:zoom-in; }
  figcaption { font-size:12px; color:var(--ink-3); margin-top:7px; }
  .edit-wrap { margin-top:14px; display:none; }
  .edit-wrap.on { display:block; }
  .edit-wrap textarea { width:100%; min-height:104px; resize:vertical; background:var(--ground); border:1px solid var(--claim-line); border-radius:5px; padding:11px 13px; font-family:"Source Serif 4", Georgia, serif; font-size:16px; line-height:1.5; }
  .note-wrap { margin-top:12px; }
  .note-wrap input { width:100%; background:var(--ground); border:1px solid var(--rule-firm); border-radius:5px; padding:9px 12px; font-size:14px; }
  .note-wrap input::placeholder { color:var(--ink-3); }

  /* ── actions ─────────────────────────────────────────── */
  .actions { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--ground); border-top:1px solid var(--rule); }
  .actions-in { max-width:940px; margin:0 auto; padding:13px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--rule-firm); border-radius:6px; padding:9px 16px; font-size:14.5px; font-weight:500; display:inline-flex; align-items:center; gap:9px; background:var(--surface); transition:background .12s, border-color .12s; }
  .btn:hover { border-color:var(--ink-3); }
  .btn kbd { font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--ink-3); border:1px solid var(--rule-firm); border-radius:3px; padding:1px 5px; }
  .btn.yes { color:var(--yes); border-color:var(--yes); background:var(--yes-bg); }
  .btn.no { color:var(--no); border-color:var(--no); background:var(--no-bg); }
  .btn.ed { color:var(--edit); border-color:var(--edit); background:var(--edit-bg); }
  .nav { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink-3); }
  .nav button { border:1px solid var(--rule-firm); border-radius:5px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; }
  .nav button:hover { border-color:var(--ink-3); }
  .saved { font-size:12.5px; color:var(--ink-3); }
  .decided-note { display:none; align-items:center; gap:10px; font-size:14px; }
  .decided-note.on { display:flex; }
  .decided-note .tag { font-weight:600; padding:3px 10px; border-radius:4px; font-size:13px; }
  .tag.accept, .tag.edit { background:var(--yes-bg); color:var(--yes); }
  .tag.reject { background:var(--no-bg); color:var(--no); }
  .decided-note button { text-decoration:underline; color:var(--ink-3); }

  /* ── done ────────────────────────────────────────────── */
  .done { display:none; }
  .done.on { display:block; }
  .done h2 { font-family:"Source Serif 4", Georgia, serif; font-size:24px; margin:0 0 10px; }
  .tally { display:flex; gap:26px; margin:20px 0 24px; flex-wrap:wrap; }
  .tally div { font-size:13px; color:var(--ink-3); }
  .tally b { display:block; font-size:26px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2; }
  .review-list { border-top:1px solid var(--rule); }
  .review-row { display:grid; grid-template-columns:5.5em 1fr auto; gap:0 14px; align-items:baseline; width:100%; text-align:left; padding:10px 0; border-bottom:1px solid var(--rule); font-size:14px; }
  .review-row:hover { color:var(--claim-ink); }
  .review-row .rtag { font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
  .rtag.accept, .rtag.edit { color:var(--yes); } .rtag.reject { color:var(--no); } .rtag.none { color:var(--ink-3); }
  .hint { font-size:13px; color:var(--ink-3); margin-top:22px; }
  .offline { display:none; background:var(--edit-bg); color:var(--edit); border:1px solid var(--edit); border-radius:6px; padding:10px 14px; font-size:13.5px; margin:0 0 20px; }
  .offline.on { display:block; }
</style>

<header class="top">
  <div class="top-in">
    <div class="top-row">
      <p class="title">Claims awaiting you</p>
      <span class="count" id="count"></span>
      <span class="who">reviewing as <input id="who" placeholder="your name" autocomplete="name"></span>
    </div>
    <div class="bar" id="bar"></div>
  </div>
</header>

<main>
  <div class="offline" id="offline">Decisions are being kept in this browser only. Reopen this page from the same device to continue.</div>

  <p class="lede" id="lede"></p>

  <div id="queue">
    <div class="card" id="card"></div>
  </div>

  <section class="done" id="done"></section>
</main>

<div class="actions" id="actions">
  <div class="actions-in">
    <div id="undecided" style="display:flex; gap:10px; flex-wrap:wrap">
      <button class="btn yes" data-act="accept">Add this claim <kbd>A</kbd></button>
      <button class="btn ed" data-act="edit">Reword <kbd>E</kbd></button>
      <button class="btn no" data-act="reject">Not a claim <kbd>R</kbd></button>
    </div>
    <div class="decided-note" id="decided">
      <span class="tag" id="decided-tag"></span>
      <span id="decided-text"></span>
      <button data-act="undo">change</button>
    </div>
    <div class="nav">
      <span class="saved" id="saved"></span>
      <button data-act="prev" aria-label="Previous">←</button>
      <button data-act="next" aria-label="Next">→</button>
    </div>
  </div>
</div>

  }
  function loadCache() {
    try { Object.assign(decisions, JSON.parse(localStorage.getItem('decisions') || '{}')); } catch (e) {}
  }
  async function save(it, rec) {
    decisions[key(it)] = rec;
    cacheAll();
    render();
    if (!db) return;
    try {
      await db.doc('decisions/' + key(it)).set(rec);
      $('saved').textContent = 'saved';
      setTimeout(() => { if ($('saved').textContent === 'saved') $('saved').textContent = ''; }, 1400);
    } catch (e) {
      $('saved').textContent = 'not saved — kept in this browser';
    }
  }

  // ── the card ───────────────────────────────────────────
  function fig(it) {
    if (!it.figure) return '';
    return `<figure><a href="${esc(it.figure)}" target="_blank" rel="noopener">
      <img src="${esc(it.figure)}" alt="${esc(it.panel || 'figure')}" loading="lazy"></a>
      <figcaption>${esc(it.figureLabel || '')}${it.panel ? ' · panel ' + esc(it.panel) : ''}</figcaption></figure>`;
  }
  function render() {
    const n = ITEMS.length;
    const done = Object.keys(decisions).filter(k => ITEMS.some(i => key(i) === k)).length;
    $('count').textContent = `${done} of ${n} decided`;
    $('bar').innerHTML = ITEMS.map((it, i) => {
      const d = decisions[key(it)];
      return `<span class="pip ${d ? d.decision : ''} ${i === at && !$('done').classList.contains('on') ? 'at' : ''}"></span>`;
    }).join('');

    if (at >= n) return finish();
    $('done').classList.remove('on');
    $('queue').style.display = '';
    $('actions').style.display = '';

    const it = ITEMS[at];
    const d = decisions[key(it)];
    $('lede').innerHTML = `A model read this paper, found ${esc(String(it.paperGaps))} results the claim tree does not carry, and drafted the claims that would close them. <b>Nothing enters the corpus until you say so.</b> The paper's own sentence is the evidence; the proposal is ours.`;

    $('card').innerHTML = `
      <div class="card-head">
        <span class="paper">${esc(it.paperTitle)}</span>
        <span class="where">${esc(it.uid)}${it.panel ? ' · ' + esc(it.panel) : ''}</span>
        <span class="role">${esc(it.role)}</span>
      </div>
      <div class="card-body">
        <p class="k">What the paper says</p>
        ${it.before ? `<p class="ctx">${esc(it.before)}</p>` : ''}
        <p class="says">${esc(it.span)}</p>
        ${it.after ? `<p class="ctx">${esc(it.after)}</p>` : ''}
        <div class="split ${it.figure ? 'has-fig' : ''}">
          <div>
            <div class="proposed">
              <p class="k">The claim this would add</p>
              <p class="claim-text" id="claim-text">${esc(d && d.claim ? d.claim : it.claim)}</p>
              <p class="slug">${esc(d && d.slug ? d.slug : it.slug)}</p>
              <div class="edit-wrap" id="edit-wrap">
                <textarea id="edit-box">${esc(d && d.claim ? d.claim : it.claim)}</textarea>
              </div>
            </div>
            <p class="why"><b>Why it is proposed.</b> ${esc(it.why)}</p>
            ${it.whyGap ? `<p class="why"><b>Why nothing covers it.</b> ${esc(it.whyGap)}</p>` : ''}
            <div class="note-wrap"><input id="note" placeholder="A note on your decision, if it needs one" value="${esc(d && d.note ? d.note : '')}"></div>
          </div>
          ${fig(it)}
        </div>
      </div>`;

    editing = false;
    $('undecided').style.display = d ? 'none' : 'flex';
    $('decided').classList.toggle('on', !!d);
    if (d) {
      $('decided-tag').textContent = d.decision === 'reject' ? 'Not a claim' : d.decision === 'edit' ? 'Added, reworded' : 'Added';
      $('decided-tag').className = 'tag ' + d.decision;
      $('decided-text').textContent = d.note || '';
    }
  }

  function finish() {
    $('queue').style.display = 'none';
    $('actions').style.display = 'none';
    $('lede').textContent = '';
    const mine = ITEMS.map(it => ({ it, d: decisions[key(it)] }));
    const n = k => mine.filter(x => x.d && x.d.decision === k).length;
    $('done').classList.add('on');
    $('done').innerHTML = `
      <h2>That is the queue.</h2>
      <p class="lede">These decisions are yours and they are recorded. Tell Claude you are done and it will write the accepted claims into the corpus, record the approval in your name, and let the coverage that found these gaps go stale so it is measured again.</p>
      <div class="tally">
        <div><b>${n('accept') + n('edit')}</b>claims to add</div>
        <div><b>${n('edit')}</b>you reworded</div>
        <div><b>${n('reject')}</b>turned down</div>
        <div><b>${mine.filter(x => !x.d).length}</b>left undecided</div>
      </div>
      <div class="review-list">
        ${mine.map((x, i) => `
          <button class="review-row" data-goto="${i}">
            <span class="rtag ${x.d ? x.d.decision : 'none'}">${x.d ? (x.d.decision === 'reject' ? 'no' : x.d.decision === 'edit' ? 'reworded' : 'added') : 'skipped'}</span>
            <span>${esc(x.d && x.d.claim ? x.d.claim : x.it.claim)}</span>
            <span class="where">${esc(x.it.uid)}</span>
          </button>`).join('')}
      </div>
      <p class="hint">Click any line to go back to it.</p>`;
  }

  // ── acting ─────────────────────────────────────────────
  function decide(decision) {
    const it = ITEMS[at];
    const box = $('edit-box'), note = $('note');
    const claim = (editing && box ? box.value : it.claim).trim();
    const rec = {
      paper: it.paper, uid: it.uid, slug: it.slug,
      decision: decision === 'accept' && editing && claim !== it.claim ? 'edit' : decision,
      claim, note: note ? note.value.trim() : '',
      by: whoEl.value.trim() || 'unnamed', decided_at: new Date().toISOString(),
    };
    save(it, rec);
    setTimeout(() => { at = Math.min(at + 1, ITEMS.length); render(); }, 120);
  }
  function startEdit() {
    editing = true;
    $('edit-wrap').classList.add('on');
    $('claim-text').style.display = 'none';
    const box = $('edit-box');
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act], [data-goto]');
    if (!t) return;
    if (t.dataset.goto !== undefined) { at = Number(t.dataset.goto); return render(); }
    const a = t.dataset.act;
    if (a === 'accept') return decide('accept');
    if (a === 'reject') return decide('reject');
    if (a === 'edit') return editing ? decide('accept') : startEdit();
    if (a === 'undo') { delete decisions[key(ITEMS[at])]; cacheAll(); if (db) db.doc('decisions/' + key(ITEMS[at])).delete().catch(() => {}); return render(); }
    if (a === 'prev') { at = Math.max(0, at - 1); return render(); }
    if (a === 'next') { at = Math.min(at + 1, ITEMS.length); return render(); }
  });

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if (typing && !(e.key === 'Enter' && e.metaKey)) {
      if (e.key === 'Escape') { editing = false; render(); }
      return;
    }
    if (e.key === 'Enter' && e.metaKey) return decide('accept');
    const k = e.key.toLowerCase();
    if (k === 'a') decide('accept');
    else if (k === 'r') decide('reject');
    else if (k === 'e') editing ? decide('accept') : startEdit();
    else if (e.key === 'ArrowLeft') { at = Math.max(0, at - 1); render(); }
    else if (e.key === 'ArrowRight') { at = Math.min(at + 1, ITEMS.length); render(); }
  });

  // ── boot ───────────────────────────────────────────────
  loadCache();
  render();
  claude.use('db').then(async d => {
    if (!d) { $('offline').classList.add('on'); return; }
    db = d;
    try {
      const snap = await db.collection('decisions').get();
      snap.docs.forEach(doc => {
        const v = doc.data();
        if (v && v.uid) decisions[v.paper + '__' + v.uid] = v;
      });
      cacheAll();
      render();
    } catch (e) { $('offline').classList.add('on'); }
  });
})();
</script>
