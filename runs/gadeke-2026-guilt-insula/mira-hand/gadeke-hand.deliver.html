nt's outcome, the partner's outcome, who chose, and their interactions; the guilt effect is the partner-outcome × decision-maker interaction.", "anchor": "we analysed happiness values reported after outcomes of lottery choices in the Social and Partner conditions using conventional linear mixed models"}, {"id": "P8", "type": "Protocol", "text": "fMRI acquisition, GLMs and region-of-interest mixed models", "description": "3T EPI BOLD; a conventional GLM of the trial events (GLM1) and a model-based GLM with the Responsibility model's variables as regressors (GLM2); regions of interest from the lottery-versus-safe outcome contrast analysed with linear mixed models.", "anchor": "We analysed the BOLD responses of brain regions engaged during decision-making and at the time of receiving the outcomes of the choice using conventional as well as computational model-based analyses"}, {"id": "P9", "type": "Protocol", "text": "Seed-to-voxel psychophysiological interaction from left insula and left STS", "description": "Whole-brain connectivity during the choice phase from two seeds, looking for a Condition × Choice interaction.", "anchor": "we used the left insula and left STS as seed regions for whole-brain seed-to-voxel psychophysiological interaction analyses"}, {"id": "P10", "type": "Protocol", "text": "Comparison with the published guilt-related brain signature", "description": "Each participant's guilt-related activation map was projected onto Yu et al.'s multivariate guilt signature; a positive dot product means resemblance.", "anchor": "we compared this brain signature to the neural responses obtained in our task"}, {"id": "D1", "type": "SourceDocument", "text": "Gädeke et al. (2026), Contributions of insula and superior temporal sulcus to interpersonal guilt and responsibility in social decisions, eLife 105391 v2", "description": "The paper this graph is extracted from.", "anchor": "Contributions of insula and superior temporal sulcus to interpersonal guilt and responsibility in social decisions", "doi": "https://doi.org/10.7554/eLife.105391.2"}, {"id": "C1", "type": "SourceDocument", "text": "Rutledge RB, de Berker AO, Espenhahn S, Dayan P, Dolan RJ (2016). The social contingency of momentary subjective well-being. Nature Communications 7:11825.", "description": "The paper whose happiness-modelling method this study adopts and extends to a social setting.", "anchor": "Following Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors", "doi": "10.1038/ncomms11825", "url": "https://doi.org/10.1038/ncomms11825", "authors": ["Rutledge RB", "de Berker AO", "Espenhahn S", "Dayan P", "Dolan RJ"], "year": 2016, "journal": "Nature Communications", "volume": "7", "pages": "11825", "title": "The social contingency of momentary subjective well-being"}, {"id": "E1", "type": "Evidence", "text": "Changes in momentary happiness during a probabilistic reward task are explained by recent reward expectations and the prediction errors arising from them.", "description": "Earlier work had shown that happiness in a gambling task follows recent rewards and surprises.", "anchor": "Following Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors", "subtype": "Cited", "sourceDocument": "C1", "panel": "cited: Rutledge et al. (2016)"}, {"id": "C2", "type": "SourceDocument", "text": "Edelson MG, Polania R, Ruff CC, Fehr E, Hare TA (2018). Computational and neurobiological foundations of leadership decisions. Science 361:eaat0036.", "description": "The leadership study this paper compares its agency effect and its connectivity results with.", "anchor": "most participants displayed responsibility aversion, and this effect could not be explained by guilt, suggesting people associate a psychological cost with assuming responsibility for others’ outcomes", "doi": "10.1126/science.aat0036", "url": "https://doi.org/10.1126/science.aat0036", "authors": ["Edelson MG", "Polania R", "Ruff CC", "Fehr E", "Hare TA"], "year": 2018, "journal": "Science", "volume": "361", "pages": "eaat0036", "title": "Computational and neurobiological foundations of leadership decisions"}, {"id": "E2", "type": "Evidence", "text": "Most participants show responsibility aversion — a psychological cost of deciding for others — that guilt does not explain.", "description": "Earlier work had found that people dislike being responsible for others' outcomes, independently of guilt.", "anchor": "most participants displayed responsibility aversion, and this effect could not be explained by guilt, suggesting people associate a psychological cost with assuming responsibility for others’ outcomes", "subtype": "Cited", "sourceDocument": "C2", "panel": "cited: Edelson et al. (2018)"}, {"id": "C3", "type": "SourceDocument", "text": "Yu H, Hu J, Hu L, Zhou X (2014). The voice of conscience: neural bases of interpersonal guilt and compensation. Social Cognitive and Affective Neuroscience 9:1150–1158.", "description": "The guilt paradigm that motivates the insula hypothesis.", "anchor": "The level of pain taken, indicative of guilt, and activations in anterior middle cingulate cortex and aIns were higher when the pain followed errors made only by the participant rather than by both players", "doi": "10.1093/scan/nst090", "url": "https://doi.org/10.1093/scan/nst090", "authors": ["Yu H", "Hu J", "Hu L", "Zhou X"], "year": 2014, "journal": "Social Cognitive and Affective Neuroscience", "volume": "9", "pages": "1150–1158", "title": "The voice of conscience: neural bases of interpersonal guilt and compensation"}, {"id": "E3", "type": "Evidence", "text": "Anterior insula and anterior middle cingulate activity were higher when a partner's pain followed the participant's own errors.", "description": "Earlier work had found the anterior insula more active when a partner's pain followed the participant's own mistakes.", "anchor": "The level of pain taken, indicative of guilt, and activations in anterior middle cingulate cortex and aIns were higher when the pain followed errors made only by the participant rather than by both players", "subtype": "Cited", "sourceDocument": "C3", "panel": "cited: Yu et al. (2014)"}, {"id": "C4", "type": "SourceDocument", "text": "Yu H, Koban L, Chang LJ, Wagner U, Krishnan A, Vuilleumier P, Zhou X, Wager TD (2020). A generalizable multivariate brain pattern for interpersonal guilt. Cerebral Cortex 30:3558–3572.", "description": "The source of the guilt-related brain signature this paper uses as an external yardstick.", "anchor": "A multivariate reanalysis of these two datasets revealed a neural signature for guilt (Yu et al., 2020)", "doi": "10.1093/cercor/bhz326", "url": "https://doi.org/10.1093/cercor/bhz326", "authors": ["Yu H", "Koban L", "Chang LJ", "Wagner U", "Krishnan A", "Vuilleumier P", "Zhou X", "Wager TD"], "year": 2020, "journal": "Cerebral Cortex", "volume": "30", "pages": "3558–3572", "title": "A generalizable multivariate brain pattern for interpersonal guilt"}, {"id": "E4", "type": "Evidence", "text": "A multivariate reanalysis of two guilt studies yields a distributed guilt-related brain signature spanning anterior midcingulate, insula, IFG, inferior temporal cortex, thalamus and cerebellum.", "description": "Earlier work had derived a brain-wide signature of guilt from two studies.", "anchor": "A multivariate reanalysis of these two datasets revealed a neural signature for guilt (Yu et al., 2020)", "subtype": "Cited", "sourceDocument": "C4", "panel": "cited: Yu et al. (2020)"}, {"id": "H1", "type": "Claim", "text": "Responsibility for a social choice that yields a low outcome for a partner produces interpersonal guilt, felt as a larger decrease in momentary happiness than when the partner made the same choice.", "description": "Being the one who chose, when the choice turns out badly for a partner, should hurt more than the same bad luck under the partner's own choice.", "anchor": "choosing a risky option in such a case may evoke guilt when the outcome for others is negative", "subtype": "Hypothesis"}, {"id": "H2", "type": "Claim", "text": "The anterior insula is the neural substrate of that guilt, responding more when the participant is responsible for a low outcome affecting the partner.", "description": "The anterior insula, already linked to guilt, should respond more when the participant is responsible for the partner's bad outcome.", "anchor": "Given the documented association between anterior insula and guilt (see Introduction)", "subtype": "Hypothesis"}, {"id": "H3", "type": "Claim", "text": "Connectivity between the guilt- and responsibility-related regions and prefrontal cortex changes with who decides and with the type of choice.", "description": "How the insula and STS couple with prefrontal cortex during a choice should depend on whether the choice is risky and whether it affects the partner.", "anchor": "We hypothesized that connectivity with regions that showed guilt- and responsibility-related responses during the outcome phase (see previous paragraph) might change depending on whether participants made decisions for themselves only or for themselves and their partner", "subtype": "Hypothesis"}, {"id": "H4", "type": "Claim", "text": "A neural substrate tracks the participant's responsibility for the partner's outcomes, representing the partner's reward prediction errors more strongly when they arise from the participant's own choice.", "description": "Some brain region should track the partner's surprises more strongly when the participant, not the partner, caused them.", "anchor": "search for networks sensitive to reward prediction errors resulting from participant or partner choices", "subtype": "Hypothesis"}, {"id": "F1", "type": "Claim", "text": "Responsibility for a partner's bad lottery outcomes decreases participant happiness more than the same outcomes following partner choices, consistent with interpersonal guilt.", "description": "The same bad outcome for the partner lowered happiness more when the participant had made the choice, in both studies.", "anchor": "When the partner received the low lottery outcome, participant happiness was lower when they rather than the partner had chosen the lottery", "anchors": ["Crucially, happiness decreases following low outcomes for the partner were larger when the participant rather than their partner had made the choice, which fits an operational definition of guilt"], "notes": "The authors call this 'simple guilt' (Battigalli & Dufwenberg 2007)."}, {"id": "F2", "type": "Claim", "text": "Computational models incorporating partner reward prediction errors differentiated by decision-maker (participant vs partner) best explain momentary happiness variations.", "description": "Among five models of what drives happiness, the one that separates out the partner's surprises caused by the participant's own choice fitted best, and that term mattered.", "anchor": "the Responsibility model fitted better than all the other models, including the Responsibility Redux model", "anchors": ["Variations in happiness were well explained by computational models based on participant’s and partner’s rewards and reward prediction errors"]}, {"id": "F3", "type": "Claim", "text": "The participant's own reward prediction errors influenced happiness more than the partner's.", "description": "A participant's own surprises affected their happiness more than the partner's did.", "anchor": "Participants’ reward prediction errors (sRPE) influenced happiness more than partner’s reward prediction errors"}, {"id": "F4", "type": "Claim", "text": "Momentary happiness tracked the rewards both the participant and the partner received on the current trial.", "description": "Happiness rose and fell with the rewards both players had just received.", "anchor": "participant momentary happiness correlated with rewards obtained in the current trial by the participant and by the partner", "anchors": ["participant happiness decreased following both low lottery outcomes for themselves and for the partner"]}, {"id": "F5", "type": "Claim", "text": "Being the decision-maker lowered happiness, independent of the outcome.", "description": "Simply being the one who decided made participants slightly less happy, whatever the outcome.", "anchor": "found happiness to be lower when the participant chose, independent of the outcome", "notes": "A separate finding from the guilt effect, not an alternative to it; read by the authors as the 'weight of responsibility' (Edelson et al. 2018)."}, {"id": "F6", "type": "Claim", "text": "Responsibility did not change happiness after good outcomes for the partner.", "description": "When the partner's outcome was good, it made no difference who had chosen.", "anchor": "Responsibility for choices did not influence happiness following positive lottery outcomes for the partner"}, {"id": "F7", "type": "Claim", "text": "Participants show similar risk preferences when deciding for themselves versus for themselves and a partner, with a tendency toward higher risk aversion in the Social condition only in Study 1.", "description": "Participants were about as willing to take risks for themselves and a partner as for themselves alone.", "anchor": "participants showed very similar risk preferences when making decisions affecting only themselves (Solo condition) or themselves and their partner (Social condition)"}, {"id": "F8", "type": "Claim", "text": "The guilt effect is associated with increased BOLD signal in the left anterior insula.", "description": "Insula activity rose more for the partner's bad outcomes when the participant had made the choice, mirroring the behavioural guilt effect.", "anchor": "activation in our insula ROIs increased in situations during which participants experienced guilt for low outcomes impacting their partner", "anchors": ["This guilt effect was associated with BOLD signal increase in the left anterior insula"]}, {"id": "F9", "type": "Claim", "text": "Functional connectivity between the left anterior insula and the right inferior frontal gyrus varies with choice and condition: highest for risky choices for oneself and safe choices for both players.", "description": "How strongly the insula and the right inferior frontal gyrus were coupled depended on what was chosen and for whom.", "anchor": "a cluster in the right inferior frontal gyrus (IFG) whose connectivity to the insula (the seed region) was highest when participants made Risky choices for themselves and Safe choices for both players", "anchors": ["Connectivity between this region and the right inferior frontal gyrus varied depending on choice and experimental condition"], "notes": "The authors suggest the right IFG is sensitive to guilt-related information during social choice."}, {"id": "F10", "type": "Claim", "text": "The right inferior frontal gyrus is sensitive to guilt-related information during social choices.", "description": "The authors suggest this prefrontal region handles guilt-related information while a social choice is being made.", "anchor": "suggesting that this part of prefrontal cortex is sensitive to guilt-related information during social choices"}, {"id": "F11", "type": "Claim", "text": "Connectivity between the left STS and left inferior frontal gyrus showed the opposite pattern, but did not survive correction.", "description": "A weaker, uncorrected result suggested the STS and the left inferior frontal gyrus couple in the opposite pattern.", "anchor": "connectivity with the left STS (the seed region) showed the opposite pattern", "notes": "Uncorrected; the authors call it anecdotal and read it as information relayed from STS to IFG."}, {"id": "F12", "type": "Claim", "text": "The left superior temporal sulcus tracks partner reward prediction errors specifically when they result from the participant's choices.", "description": "A region of the left superior temporal sulcus tracked the partner's surprises more when the participant had caused them.", "anchor": "We found this effect in one cluster within the left STS", "anchors": ["A model-based analysis revealed a left superior temporal sulcus cluster that tracked partner reward prediction errors that followed participant choices"], "notes": "Read by the authors as monitoring the consequences of one's decisions for others."}, {"id": "F13", "type": "Claim", "text": "Choosing for both oneself and the partner, rather than for oneself alone, engaged the precuneus, left temporo-parietal junction and medial prefrontal cortex.", "description": "Choosing for two people engaged regions associated with thinking about others: precuneus, temporo-parietal junction and medial prefrontal cortex.", "anchor": "Three significant clusters of voxels were identified (Figure 4B and Supplementary Table 3), in the precuneus"}, {"id": "F14", "type": "Claim", "text": "Receiving lottery outcomes, compared with safe outcomes, engaged bilateral anterior insula, dorsomedial prefrontal cortex, right STS, ventral striatum, right dorsolateral prefrontal cortex and inferior parietal lobe.", "description": "Receiving a lottery outcome engaged a set of regions associated with risk, including the anterior insula and ventral striatum.", "anchor": "Cluster of voxels more active during receipt of lottery outcomes than outcomes of safe choices were identified in the bilateral anterior insula", "notes": "These regions define the regions of interest for the guilt analyses."}, {"id": "F15", "type": "Claim", "text": "The guilt-related activation patterns resembled the published guilt-related brain signature.", "description": "Brain activity during the guilt effect resembled a published brain signature of guilt from other studies.", "anchor": "The “neurometrics” analysis of our guilt-related activation maps showed a significant similarity to a published guilt-related brain signature", "notes": "The match did not track individual differences in the behavioural effect (e_grbs_indiv)."}, {"id": "A1", "type": "Claim", "text": "The larger drop in happiness after the partner's low outcome is disappointment at the participant's own outcome, not guilt about the partner's.", "description": "Perhaps participants were just disappointed about their own outcome, not the partner's.", "anchor": "The “guilt effect” occurred whether the participant received the high lottery outcome", "subtype": "Alternative", "notes": "Rival to the guilt reading; argued against by the own-outcome split."}, {"id": "A2", "type": "Claim", "text": "Being responsible simply amplifies the participant's reaction to all of the partner's outcomes, good or bad.", "description": "Perhaps being responsible simply makes every outcome for the partner matter more, good or bad.", "anchor": "Responsibility for choices did not influence happiness following positive lottery outcomes for the partner", "subtype": "Alternative", "notes": "Rival to the guilt reading; argued against by the null after good outcomes."}, {"id": "A3", "type": "Claim", "text": "Choosing for two people changes how much risk participants take, so the differences between conditions reflect different choices rather than guilt.", "description": "Perhaps people take different risks when choosing for two, and the differences between conditions follow from that rather than from guilt.", "anchor": "To better assess whether people’s risk preferences varied between the Solo and the Social condition", "subtype": "Alternative", "notes": "Handled by measuring risk attitudes directly; one Study 1 result gives it weak support, which is drawn as `supports`. The authors conclude they have no strong evidence of a difference."}, {"id": "A4", "type": "Claim", "text": "Happiness tracks the inequality between the participant's and the partner's rewards; responsibility for the partner's surprises adds nothing.", "description": "Perhaps happiness just tracks the gap between what the two players got, with no role for who was responsible.", "anchor": "we assessed the fit of an ‘Inequality’ model that included one term modelling the difference between the participant and partner outcomes", "subtype": "Alternative", "notes": "Built into the model comparison as the Inequality and Guilt-envy models; argued against by the likelihood-ratio tests."}, {"id": "A5", "type": "Claim", "text": "What participants felt was empathy for the partner, a sense of failure or bad luck, or some emotion other than guilt.", "description": "Perhaps what participants felt was empathy, or a sense of failure or bad luck, rather than guilt.", "anchor": "we cannot exclude the possibility that they have instead or in addition felt empathy for their partner, a feeling of failure or bad luck, or some other emotion", "subtype": "Alternative", "notes": "Raised by the authors. Left open on the behavioural measure ('we cannot exclude'); argued against on the neural one by the signature match ('we thus believe that our participants did experience guilt')."}, {"id": "A6", "type": "Claim", "text": "Because the partner's choices were really an algorithm, participants were emotionally detached from the partner's outcomes and the effects do not reflect a social interaction.", "description": "Perhaps, because the partner was really an algorithm, participants were not emotionally engaged with the partner's outcomes at all.", "anchor": "The first limitation is that the partner’s decisions were in fact taken by an algorithm", "subtype": "Alternative", "notes": "A limitation the authors raise and answer with the partner-reward effect."}, {"id": "K1", "type": "Evidence", "text": "In Study 1, the probability of choosing the lottery rose with the lottery's expected-value advantage over the safe option (t(4796) = 9.26, p < 3.1e-20, β = 0.074).", "description": "Participants took the lottery more often the better it was, showing their choices were sensible.", "anchor": "participants’ probability of choosing the risky option (lottery) increased with the difference between the expected value of the lottery and the value of the safe option", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2A", "study": "S1", "figure": {"label": "Figure 2A", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}, "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "K2", "type": "Evidence", "text": "In Study 2, the probability of choosing the lottery rose with its expected-value advantage (t(3829) = 10.62, p < 5.3e-26, β = 0.093).", "description": "The same held in the scanner study.", "anchor": "Study 2: Figure 2D, t(3829) = 10.62, p < 5.3e-26, β = 0.093", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2D", "study": "S2", "figure": {"label": "Figure 2D", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}, "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E5", "type": "Evidence", "text": "In Study 1, participants chose the lottery more often in the Solo than the Social condition (t(4796) = 2.54, p = 0.011, β = 0.164).", "description": "In the first study, participants chose the lottery a little more often when choosing for themselves alone.", "anchor": "Participants chose the lottery more often in the Solo condition than in the Social condition in Study 1 (t(4796) = 2.54, p = 0.011, β = 0.164", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2A", "study": "S1", "figure": {"label": "Figure 2A", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}}, {"id": "E6", "type": "Evidence", "text": "In Study 2, lottery choice did not differ between Solo and Social (t(3829) = 0.23, p = 0.82, β = 0.015).", "description": "In the scanner study, choosing for two made no difference to how often the lottery was chosen.", "anchor": "this difference was not found in Study 2 (t(3829) = 0.23, p = 0.82, β = 0.015", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2D", "study": "S2", "figure": {"label": "Figure 2D", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}}, {"id": "E7", "type": "Evidence", "text": "The expected-value effect on choice did not interact with condition in either study (p > 0.52).", "description": "How much the lottery's value swayed choices was the same whether choosing for one or for two.", "anchor": "There was no significant interaction between the difference in expected values and experimental conditions in either study (p > 0.52)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2A, 2D", "study": "S1", "figure": {"label": "Figure 2A, 2D", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}}, {"id": "E8", "type": "Evidence", "text": "In Study 1, risk premiums did not differ between Social and Solo (t(39) = 1.53, p = 0.134, d = 0.24, BF10 = 0.49).", "description": "The premium participants demanded for taking a risk was the same whether choosing for one or for two.", "anchor": "Risk premiums did not differ between Social and Solo conditions (Study 1: Figure 2B, t(39) = 1.53, p = 0.134, Cohen’s d = 0.24, BF10 = 0.49", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2B", "study": "S1", "figure": {"label": "Figure 2B", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}}, {"id": "E9", "type": "Evidence", "text": "In Study 2, risk premiums did not differ between Social and Solo (t(43) = -0.21, p = 0.84, d = -0.03, BF10 = 0.17).", "description": "The same held in the scanner study.", "anchor": "Study 2: Figure 2E, t(43) = -0.21, p = 0.84, d = -0.03, BF10 = 0.17", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2E", "study": "S2", "figure": {"label": "Figure 2E", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}}, {"id": "K3", "type": "Evidence", "text": "The risk-aversion parameter ρ did not differ between gain and loss trials in either study (Study 1: t(17) = 0.21, p = 0.84; Study 2: t(15) = -0.61, p = 0.55), justifying pooling.", "description": "Risk attitude was the same for gains and losses, so the two could be pooled.", "anchor": "As ρ did not vary between gain and loss trials (Study 1: t(17) = 0.21, p = 0.84, d = 0.05; Study 2: t(15) = - 0.61, p = 0.55, d = 0.15; paired t-test)", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Methods", "study": "S1", "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E10", "type": "Evidence", "text": "In Study 1, ρ was slightly higher in the Social than the Solo condition (t(39) = 2.27, p = 0.03, d = 0.36, BF10 = 1.69).", "description": "By one measure, participants in the first study were slightly more cautious when choosing for two.", "anchor": "participants were slightly more risk averse in the Social than in the Solo condition in Study 1 (Figure 2C, t(39) = 2.27, p = 0.03, d = 0.36, BF10 = 1.69)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2C", "study": "S1", "figure": {"label": "Figure 2C", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}, "notes": "ρ could be estimated in only 18 of 40 participants; the authors judge the result unreliable."}, {"id": "E11", "type": "Evidence", "text": "In Study 2, ρ did not differ between Social and Solo (t(43) = 1.40, p = 0.17, d = 0.21, BF10 = 0.41).", "description": "By the same measure, participants in the scanner study were not more cautious when choosing for two.", "anchor": "but not in Study 2 (Figure 2F, t(43) = 1.40, p = 0.17, d = 0.21, BF10 = 0.41)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2F", "study": "S2", "figure": {"label": "Figure 2F", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}}, {"id": "K4", "type": "Evidence", "text": "Risk premium and ρ were highly consistent across participants in both conditions and both studies (all F > 42, p < 0.001, R² 0.55–0.65).", "description": "The two ways of measuring risk attitude agreed closely.", "anchor": "Risk premium and ρ were highly consistent with each other across participants in both conditions for both studies", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 2", "study": "S1", "figure": {"label": "Figure 2", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig2"}, "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E12", "type": "Evidence", "text": "In Study 1, happiness correlated with the participant's reward (F(1,3598) = 691.5, R² = 0.16) and the partner's reward (F(1,2426) = 128.6, R² = 0.05) on the current trial.", "description": "In the first study, happiness tracked the rewards both the participant and the partner had just received.", "anchor": "Correlations with participant reward, Study 1: F(1,3598) = 691.5, p < 0.001, R2 = 0.16; partner reward, Study 1: F(1,2426) = 128.6, p < 0.001, R2 = 0.05", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 3A, 3B", "study": "S1", "figure": {"label": "Figure 3A, 3B", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig3"}}, {"id": "E13", "type": "Evidence", "text": "In Study 2, happiness correlated with the participant's reward (F(1,2630) = 650.8, R² = 0.20) and the partner's reward (F(1,1735) = 111.8, R² = 0.06).", "description": "The same held in the scanner study.", "anchor": "participant reward, Study 2: F(1,2630) = 650.8, p < 0.001, R2 = 0.20; partner reward, Study 2: F(1,1735) = 111.8, p < 0.001, R2 = 0.06", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 3E, 3F", "study": "S2", "figure": {"label": "Figure 3E, 3F", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig3"}}, {"id": "E14", "type": "Evidence", "text": "In Study 1, the Responsibility model fitted better than every other model by likelihood-ratio test (all LR ≥ 47.36, p < 0.0001).", "description": "In the first study, the responsibility model fitted the happiness data better than every other model.", "anchor": "Study 1: all LR ≥ 47.36, p < 0.0001", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Table 1", "study": "S1", "figure": {"label": "Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#tbl1"}}, {"id": "E15", "type": "Evidence", "text": "In Study 2, the Responsibility model fitted better than every other model by likelihood-ratio test (all LR ≥ 77.83, p < 0.0001).", "description": "The same held in the scanner study.", "anchor": "Study 2: all LR ≥ 77.83, p < 0.0001", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Table 1", "study": "S2", "figure": {"label": "Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#tbl1"}}, {"id": "E16", "type": "Evidence", "text": "In Study 1 the Responsibility and Responsibility Redux models had the highest R² and adjusted R² and lowest AIC/BIC of the five models.", "description": "The two responsibility models explained the first study's happiness data best by every fit measure.", "anchor": "the Responsibility and Responsibility Redux (Figure 3C and 3G) models explained the data best (highest R2 / adjusted R2 or lowest AIC / BIC)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 3C, Table 1", "study": "S1", "figure": {"label": "Figure 3C, Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig3"}}, {"id": "E17", "type": "Evidence", "text": "In Study 2 the Responsibility and Responsibility Redux models likewise explained the happiness data best.", "description": "The same held in the scanner study.", "anchor": "All models explained variations in happiness reasonably well (Table 1 and Supplementary Materials)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 3G, Table 1", "study": "S2", "figure": {"label": "Figure 3G, Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig3"}}, {"id": "E18", "type": "Evidence", "text": "In Study 1 the weight on the partner's prediction errors from the participant's own choices was above zero (Responsibility model Z = 2.85, p = 0.004; Redux Z = 2.93, p = 0.003).", "description": "In the first study, the partner's surprises caused by the participant's own choice carried a reliable weight in happiness.", "anchor": "Responsibility model: Study 1: Z = 2.85, p = 0.004, Study 2: Z = 3.26, p = 0.001", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Table 1", "study": "S1", "figure": {"label": "Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#tbl1"}}, {"id": "E19", "type": "Evidence", "text": "In Study 2 that weight was above zero (Responsibility model Z = 3.26, p = 0.001; Redux Z = 3.30, p = 0.001), and tended to exceed the weight on partner-caused errors.", "description": "The same held in the scanner study, where that weight also tended to exceed the weight on surprises the partner caused.", "anchor": "ResponsibilityRedux model: Study 1: Z = 2.93, p = 0.003, Study 2: Z = 3.30, p = 0.001", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Table 1", "study": "S2", "figure": {"label": "Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#tbl1"}}, {"id": "E20", "type": "Evidence", "text": "Weights on the participant's own prediction errors exceeded those on the partner's in both studies (Study 1: all Z > 6.0, p < 0.001; Study 2: all Z > 3.7, p < 0.003).", "description": "A participant's own surprises weighed more on happiness than the partner's, in both studies.", "anchor": "weights for sRPE were higher than for social_pRPE or partner_pRPE (Study 1: all Z > 6.0, p < 0.001; Study 2: all Z > 3.7, p < 0.003)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Table 1", "study": "S1", "figure": {"label": "Table 1", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_tbl1.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#tbl1"}}, {"id": "K5", "type": "Evidence", "text": "A parameter-recovery procedure on synthetic data recovered the happiness-model parameters reliably.", "description": "The model's parameters could be recovered from simulated data, so the fits are stable.", "anchor": "The stability of these estimated parameters was verified using a parameter recovery procedure", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Supplementary Materials", "study": "S1", "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E21", "type": "Evidence", "text": "In Study 1, happiness was lower when the participant chose, independent of outcome (t(3600) = -3.92, p < 0.0001, β = -0.14).", "description": "In the first study, participants were less happy after trials in which they had been the one to choose, regardless of outcome.", "anchor": "Study 1: t(3600) = -3.92, p < 0.0001, β = -0.14", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Methods / Results", "study": "S1"}, {"id": "E22", "type": "Evidence", "text": "In Study 2, happiness was lower when the participant chose, independent of outcome (t(2870) = -6.07, p < 0.0001, β = -0.24).", "description": "The same held in the scanner study.", "anchor": "Study 2: t(2870) = -6.07, p < 0.0001, β = -0.24", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Methods / Results", "study": "S2"}, {"id": "K6", "type": "Evidence", "text": "Across several linear mixed models, lottery outcomes and the identity of the decision-maker both influenced happiness.", "description": "Across several statistical models, both the outcome and who chose affected happiness.", "anchor": "Fitting several models revealed that lottery outcomes influenced happiness, and that the identity of the decision-maker played a role", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Supplementary Table 2", "study": "S1", "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E23", "type": "Evidence", "text": "In Study 1, the partner-outcome × decision-maker interaction on happiness was significant (t(1180) = 3.52, p = 0.0004, β = 0.37).", "description": "In the first study, the partner's outcome and who had chosen interacted: a bad outcome hurt more after the participant's own choice.", "anchor": "Study 1: t(1180) = 3.52, p = 0.0004, β = 0.37", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 3D", "study": "S1", "figure": {"label": "Figure 3D", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig3"}}, {"id": "E24", "type": "Evidence", "text": "In Study 2, the partner-outcome × decision-maker interaction on happiness was significant (t(937) = 2.85, p = 0.0045, β = 0.33).", "description": "The same interaction held in the scanner study.", "anchor": "Study 2: t(937) = 2.85, p = 0.0045, β = 0.33", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 3H", "study": "S2", "figure": {"label": "Figure 3H", ys.org/mira/105391#fig3"}}, {"id": "E27", "type": "Evidence", "text": "After good outcomes for the partner, responsibility did not affect happiness in either study (all |t| < 1.3, p > 0.2, BF10 < 0.2).", "description": "After a good outcome for the partner, who had chosen made no difference to happiness.", "anchor": "both studies, all |t| < 1.3, p > 0.2, BF10 < 0.2", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Results", "study": "S1"}, {"id": "K7", "type": "Evidence", "text": "Bilateral ventral striatum responded more when participants chose the lottery than the safe option (d = 0.72 left, 0.85 right), replicating earlier work.", "description": "The ventral striatum responded more to risky than safe choices, as it has in earlier studies.", "anchor": "found such responses in the bilateral ventral striatum (Cohen’s d = 0.72 and 0.85 in the left and right clusters, respectively", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4A", "study": "S2", "figure": {"label": "Figure 4A", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E28", "type": "Evidence", "text": "Social versus Solo decisions engaged the precuneus (d = 0.79), left TPJ (d = 0.59) and medial prefrontal cortex (d = 0.54).", "description": "Choosing for both players engaged the precuneus, left temporo-parietal junction and medial prefrontal cortex.", "anchor": "in the precuneus (d = 0.79), the left temporo-parietal junction (TPJ; d = 0.59) and the medial prefrontal cortex (mPFC; d = 0.54)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4B", "study": "S2", "figure": {"label": "Figure 4B", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}}, {"id": "E29", "type": "Evidence", "text": "Only precuneus and TPJ showed a larger risky-minus-safe response in Social than in both Solo and Partner conditions.", "description": "The precuneus and temporo-parietal junction were most active for risky choices made on behalf of both players.", "anchor": "Only Precuneus and TPJ showed positive differences in both comparisons (Figure 4C)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4C", "study": "S2", "figure": {"label": "Figure 4C", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}}, {"id": "E30", "type": "Evidence", "text": "Lottery outcomes versus safe outcomes engaged bilateral anterior insula, dmPFC, right STS, ventral striatum, right dlPFC and inferior parietal lobe.", "description": "Receiving a lottery outcome engaged the anterior insula, ventral striatum and several other regions more than receiving a safe outcome.", "anchor": "bilateral anterior insula, dorsal mPFC (dmPFC), right superior temporal sulcus (STS), bilateral ventral striatum, right dorsolateral prefrontal cortex, and bilateral inferior parietal lobe (Figure 4D", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4D", "study": "S2", "figure": {"label": "Figure 4D", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}}, {"id": "E31", "type": "Evidence", "text": "Insula ROIs responded more to the partner's low outcomes in the Social than the Partner condition, also after subtracting responses to high outcomes.", "description": "Insula regions responded more to the partner's bad outcomes when the participant had chosen, even after discounting responses to good outcomes.", "anchor": "the insulae showed the sought-after effect (see Supplementary Table 6 and Figure 4E)", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4E", "study": "S2", "figure": {"label": "Figure 4E", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}}, {"id": "E32", "type": "Evidence", "text": "A voxel-wise analysis found a small left anterior insula cluster responding more to the partner's low outcomes after participant than partner choices (peak T = 3.95, d = 0.59, 22 voxels), surviving small-volume correction (p = 0.024).", "description": "A small cluster in the left anterior insula showed the same guilt-related response in a voxel-by-voxel analysis.", "anchor": "We found a weak response in a small cluster within the left anterior insula (peak T = 3.95, d = 0.59, 22 voxels", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4F", "study": "S2", "figure": {"label": "Figure 4F", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}}, {"id": "K8", "type": "Evidence", "text": "Ventral striatum activation increased with expected certain rewards and the expected values of chosen lotteries under the model-based regressor (left pFWE = 0.002, T = 5.63; right pFWE = 0.005, T = 5.46).", "description": "The ventral striatum tracked the model's expected rewards, confirming the model-based analysis works.", "anchor": "activation in bilateral ventral striatum indeed increased with the amount of expected certain rewards and the expected values of chosen lotteries", "subtype": "Check", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4G", "study": "S2", "figure": {"label": "Figure 4G", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "notes": "Check: a result that defends a finding or a method rather than arguing for a hypothesis."}, {"id": "E33", "type": "Evidence", "text": "One left STS cluster responded more to the partner's reward prediction errors from participant than partner choices (pFWE = 0.022, T = 4.70, d = 0.53, 100 voxels, peak MNI [-52 -32 0]).", "description": "A cluster in the left superior temporal sulcus responded more to the partner's surprises when the participant had caused them.", "anchor": "We found this effect in one cluster within the left STS (pFWE = 0.022, T = 4.70, d = 0.53, Z = 4.57, 100 voxels", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 4H", "study": "S2", "figure": {"label": "Figure 4H", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}}, {"id": "E34", "type": "Evidence", "text": "The STS cluster's responses to tatistical correction.", "anchor": "A smaller cluster in the left IFG showed the same effect but did not survive correction for multiple tests", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Figure 5", "study": "S2", "figure": {"label": "Figure 5", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig5.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig5.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig5"}}, {"id": "E37", "type": "Evidence", "text": "Left IFG connectivity with the left STS seed showed the opposite pattern — highest for safe choices for oneself and risky choices for both — uncorrected (p = 0.001, T = 4.44, 35 voxels).", "description": "Coupling between the STS and the left inferior frontal gyrus showed the opposite pattern, but did not survive correction.", "anchor": "connectivity was highest when participants made Safe choices for themselves and Risky choices for both players (puncorrected = 0.001, T = 4.44, Z = 4.30, 35 voxels", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Supplementary Figure 2", "study": "S2"}, {"id": "E38", "type": "Evidence", "text": "Dot products between individual guilt-related maps and the published guilt signature were overall positive (mean 5.22, median 6.97, sign test p = 0.017, Cliff's delta 0.4).", "description": "Participants' guilt-related brain maps resembled a published guilt signature more often than not.", "anchor": "overall these values were positive (mean = 5.22; median = 6.97; sign test: p = 0.017; Cliff’s Delta = 0.4 = medium effect size", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Results (neurometrics)", "study": "S2"}, {"id": "E39", "type": "Evidence", "text": "The signature match did not correlate with individual behavioural guilt effects (Spearman's ρ = -0.058, p = 0.725).", "description": "How closely a participant's map resembled the signature did not predict the size of their behavioural guilt effect.", "anchor": "did not find a significant association [Spearman’s Rho = -0.058, p = 0.725]", "sourceDocument": "https://doi.org/10.7554/eLife.105391.2", "panel": "Results (neurometrics)", "study": "S2", "notes": "A null that qualifies the convergent-validity reading of f_grbs."}, {"id": "R1", "type": "Request", "text": "Ask participants directly which emotions they felt at each stage of the task, to link subjective experience to the analytical measures of guilt.", "description": "Ask participants what they felt, to connect the measures of guilt to their own experience.", "anchor": "asking participants directly about which emotions they have felt during the different stages of this task would allow us to link subjective experience with our analytical measures"}, {"id": "R2", "type": "Request", "text": "Test more participants to assess how personality traits shape the experience and the behavioural and neural correlates of guilt and responsibility.", "description": "Study more people, to see how personality shapes guilt and responsibility and their brain correlates.", "anchor": "Testing more participants would allow us to assess the impact of inter-individual variations in personality traits"}, {"id": "R3", "type": "Request", "text": "Run more trials so risk preferences can be modelled separately for gains and losses per condition, and to test whether happiness changes affect later choices.", "description": "Collect more trials, so risk preferences can be modelled separately for gains and losses in each condition.", "anchor": "Using more trials in the experiment would allow separate modelling of risk preferences in gain and loss trials in each experimental condition"}, {"id": "R4", "type": "Request", "text": "Vary the partner's identity — friend, stranger, artificial agent — to measure social discounting of guilt and responsibility.", "description": "Vary who the partner is, from friend to stranger to machine, to see how closeness changes guilt and responsibility.", "anchor": "Varying partner identities (friends, stranger, artificial agent) could reveal the impact of social discounting on guilt and responsibility"}, {"id": "R5", "type": "Request", "text": "Run the connectivity analyses on the outcome (feedback) phase of the task.", "description": "Analyse connectivity during the moment outcomes are revealed, not only during the choice.", "anchor": "Functional connectivity analyses could also be performed for the data obtained in the feedback part of the paradigm"}, {"id": "R6", "type": "Request", "text": "Run experiments that isolate the specific computations the left STS/TPJ and anterior insula perform, to explain how guilt and responsibility shape social decisions.", "description": "Design experiments that isolate what the STS and anterior insula each compute during social decisions.", "anchor": "More experiments investigating specific computations in which these regions are involved"}], "edges": [{"relation": "follows", "subject": "S1", "object": "P1"}, {"relation": "follows", "subject": "S1", "object": "P2"}, {"relation": "follows", "subject": "S1", "object": "P3"}, {"relation": "follows", "subject": "S1", "object": "P4"}, {"relation": "follows", "subject": "S1", "object": "P5"}, {"relation": "follows", "subject": "S1", "object": "P6"}, {"relation": "follows", "subject": "S1", "object": "P7"}, {"relation": "follows", "subject": "S2", "object": "P1"}, {"relation": "follows", "subject": "S2", "object": "P2"}, {"relation": "follows", "subject": "S2", "object": "P3"}, {"relation": "follows", "subject": "S2", "object": "P4"}, {"relation": "follows", "subject": "S2", "object": "P5"}, {"relation": "follows", "subject": "S2", "object": "P6"}, {"relation": "follows", "subject": "S2", "object": "P7"}, {"relation": "follows", "subject": "S2", "object": "P8"}, {"relation": "follows", "subject": "S2", "object": "P9"}, {"relation": "follows" ences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4B": {"label": "Figure 4B", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4C": {"label": "Figure 4C", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4D": {"label": "Figure 4D", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4E": {"label": "Figure 4E", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4F": {"label": "Figure 4F", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4G": {"label": "Figure 4G", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4H": {"label": "Figure 4H", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 4I": {"label": "Figure 4I", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig4"}, "Figure 5": {"label": "Figure 5", "image": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig5.tif/full/max,/0/default.jpg", "thumbnail": "https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig5.tif/full/480,/0/default.jpg", "page": "https://epp.elifepathways.org/mira/105391#fig5"}, "Supplementary Figure 2": null}, "fields": {"description": "plain summary, one or two sentences", "anchor": "verbatim passage of the Reviewed Preprint text the node docks to", "anchors": "further verbatim passages", "subtype": "declared subclass: Hypothesis / Alternative (Claim), Check / Cited (Evidence)", "panel": "figure panel, table or section the evidence comes from", "study": "the Study node that grounds the evidence", "figure": "IIIF image, thumbnail and page link for the panel", "notes": "editorial remarks kept out of the summary", "sourceDocument": "DOI of the paper, or the id of the cited SourceDocument for Cited evidence"}}, "text": "Contributions of insula and superior temporal sulcus to interpersonal guilt and responsibility in social decisions\n\nThis study investigated the neural mechanisms involved in feelings of interpersonal guilt and responsibility evoked by social decisions. In two studies (one during fMRI), participants repeatedly chose between safe and risky monetary outcomes in social contexts. Across conditions, each participant chose for both themselves and a partner (Social condition), or the partner chose for both themselves and the participant (Partner condition), or the participant chose just for themselves (Solo condition, control). If the risky option was chosen in the Social or Partner condition, participant and partner could each receive either the high or the low outcome of a lottery with 50% probability, independently of each other. Participants were shown the outcomes for themselves and for their partner on each trial, and reported their momentary happiness every few trials. As expected, participant happiness decreased following both low lottery outcomes for themselves and for the partner. Crucially, happiness decreases following low outcomes for the partner were larger when the participant rather than their partner had made the choice, which fits an operational definition of guilt. This guilt effect was associated with BOLD signal increase in the left anterior insula. Connectivity between this region and the right inferior frontal gyrus varied depending on choice and experimental condition, suggesting that this part of prefrontal cortex is sensitive to guilt-related information during social choices. Variations in happiness were well explained by computational models based on participant’s and partner’s rewards and reward prediction errors. A model-based analysis revealed a left superior temporal sulcus cluster that tracked partner reward prediction errors that followed participant choices. Our findings identify neural mechanisms of guilt and social responsibility during social decisions under risk.\n\n## Introduction\n\nImagine that you go out to dinner with a friend and it is your turn to choose the restaurant. You can choose between two restaurants: one that you both know well, with very predictable food of good quality, and a new restaurant that neither you nor your friend has eaten in before. You decide to try the new one. Unfortunately, while your dish is nice, your friend’s turns out to be worse than the known restaurant’s dishes. How would you feel? Would you feel differently if it had been your friend’s turn to choose the restaurant?\n\nBeing responsible for such suboptimal outcomes for others can induce a feeling of interpersonal guilt, formally described as a negative emotional response to harming someone with whom one has a positive social bond (Baumeister, 1998; Baumeister et al., 1994; Berndsen et al., 2004; Tangney et al., 2007; Zeelenberg & Breugelmans, 2008). Guilt influences decisions (e.g., Charness & Dufwenberg, 2006), and abnormal sensitivity to guilt is associated with severe social dysfunctions ranging from psychopathy to depression and anxiety, depending on whether sensitivity to guilt is respectively reduced or increased (Tangney et al., 2007).\n\nSeveral brain regions have been associated with the feeling of guilt: the anterior insula (aIns) (Bastin et al., 2016; Lamm & Singer, 2010; Piretti et al., 2023), the dorsal cingulate cortex (Bastin et al., 2016; Gifuni et al., 2017) and the left temporo-parietal junction (Bastin et al., 2016; Piretti et al., 2023), the ventromedial prefrontal cortex (Krajbich et al., 2009), and with various other regions and networks involved depending on the method used to induce guilt (Bastin et al., 2016; Gifuni et al., 2017). However, we are interested in the mechanisms involved in a specific, as yet understudied aspect of guilt: the kind that can result from everyday choices that expose others to an uncertain outcome. To study this, we built on findings from experimental social decision-making tasks.\n\nSeveral studies have used games from behavioural economics or perceptual tasks linked to punishment of a partner. For example, participants behaving in accord with an economic definition of guilt aversion during a trust game showed activation in insula, supplementary motor area, dorsolateral prefrontal cortex (dlPFC), and temporal parietal junction (Chang et al., 2011). In another study, partners received painful stimuli when participants made errors during a difficult perception task. These errors evoked activations in the left aIns and dlPFC in the participants (Koban et al., 2013). In a variation of this task, participants could decide to bear a proportion of their partner’s pain (Yu et al., 2014). The level of pain taken, indicative of guilt, and activations in anterior middle cingulate cortex and aIns were higher when the pain followed errors made only by the participant rather than by both players. A multivariate reanalysis of these two datasets revealed a neural signature for guilt (Yu et al., 2020), with key regions including the anterior medial cingulate cortex, insula, inferior frontal gyrus, inferior temporal cortex, thalamus and cerebellum.\n\nOne recent study paired the aforementioned perception-and-pain paradigm with dictator game decisions that allowed the participant to compensate for the partner’s outcome (Gao et al., 2018). The guilt context increased advantageous-inequity aversion and decreased disadvantageous-inequity aversion, and affected the neural correlates of these inequities (respectively: mentalizing-related, and emotion- and conflict-related regions). Finally, another study contrasted guilt and shame: confederates either experienced economic loss due to bad participant advice (participants experienced guilt), or experienced no loss when participants’ bad advice was correctly refused by the confederate (participants experienced shame) (Zhu et al., 2019). Guilt relative to shame activated supramarginal gyrus and temporo-parietal junction as well as orbitofrontal cortex, ventrolateral and dorsolateral prefrontal cortex. Multivariate analyses revealed that guilt could be distinguished from shame based on activation in ventral anterior cingulate cortex and dorsomedial prefrontal cortex.\n\nOne landmark study reported on the mechanisms involved in seeking or avoiding responsibility in decisions affecting a group of individuals, and reported involvement of medial prefrontal cortex, aIns and temporo-parietal junction (Edelson et al., 2018). In this elegant study, participants could delegate their choice between a risky and a safe option to a group or decide themselves; in separate conditions, the choice affected payoff either only for the participant or for all group members. Interestingly, most participants displayed responsibility aversion, and this effect could not be explained by guilt, suggesting people associate a psychological cost with assuming responsibility for others’ outcomes. However, in many situations one does not have the possibility to delegate a decision to others, and choosing a risky option in such a case may evoke guilt when the outcome for others is negative. The neural mechanisms underlying guilt evoked during such situations of social responsibility are still unknown. These questions are subject of the present study. Similarly to Edelson et al.’s and more recent studies (Arioli et al., 2023; Fareri et al., 2022), our paradigm leveraged a risky choice task with social conditions.\n\nIn our experiment, participants were paired with a partner and played an “ice-breaker” game that created a positive social bond between them, increasing the likelihood of feeling empathy and guilt for each other (Baumeister, 1998; Julle-Danière et al., 2020; Loewenstein et al., 1989). Participants or their partner then chose between risky and safe monetary options in three conditions (Figure 1). In the Social condition, the outcome of choices affected both participant and partner; participants were and felt responsible for these outcomes because they had agency over their decisions and knew that they could have chosen otherwise (Frith, 2014). We contrasted this condition with similar choices made by a simple expected-value-maximizing algorithm posing for the partner (Partner condition), and participant choices only affecting the participant themselves (Solo condition, acting as control). Importantly, we assessed the emotional impact of the outcomes of these choices by monitoring participants’ happiness every two trials (Rutledge et al., 2014, 2016). This allowed to fit computational models to happiness data and search for networks sensitive to reward prediction errors resulting from participant or partner choices. We ran two experiments, Study 1 outside the MRI scanner and Study 2 during fMRI, with separate groups of participants.\n\n[Figure 1:] \n\n## Experimental design.\n\nIn every trial, participants were presented with pairs of monetary options (a safe and a risky option; the risky option was a lottery with equally probable high and low outcomes). There were three conditions: a non-social ‘Solo’ condition, in which the participant’s choice led to an outcome just for themselves (left panel); and two conditions in which choices were made by the participant (‘Social’ condition) or by their partner (‘Partner’ condition) and lead to outcomes affecting both players (right panel). Importantly, selecting the risky option in the social or partner conditions lead to the lottery being played out independently for both players; i.e., participant and partner could receive the high or low outcome independently from each other (coloured boxes). Selecting the safe option led to both players receiving an equal outcome.\n\nWe analysed our behavioural data using several complementary methods: choices were modelled with mixed-effects regressions serving as manipulation checks; risk preferences expressed in choices were assessed using a comprehensive expected utility model as well as with a simpler, more robust “risk premium” approach; and happiness data were fitted, in addition to the computational models, with several linear mixed models to assess the impact of both the participant’s and their partner’s rewards, the impact of agency and their interactions. Inspired by findings reported in previous neuroimaging of social emotions, we also used several methods to analyse our fMRI data, including conventional methods (both region-of-interest and mass univariate); mixed-effects regression models; computational model-based analyses (inspired by e.g. Konovalov et al., 2021; Rutledge et al., 2014); and functional connectivity (e.g. Edelson et al., 2018; Konovalov et al., 2021). The behavioural modelling is thus complemented by neuroimaging analyses that offer insight about both the activity in regions associated with guilt as well as their place in a wider network, providing an in-depth comprehensive analysis of the mechanisms behind guilt evoked by social responsibility.\n\n## Results\n\n## Behaviour\n\n## Overview\n\nWe first verified that participants’ choices were reasonable in the Solo and Social conditions, then assessed whether these choices and the risk preferences they revealed changed depending on whether participants chose just for themselves (solo) or for themselves and the interaction partner (social). Next, we assessed whether momentary happiness varied with decision outcomes and whether responsibility influenced this relationship. Lastly, we fitted computational models to the happiness data. While Study 1 (behaviour only) was run before Study 2 (fMRI), we will report the results of both studies together as their results were highly consistent.\n\n## Choices: manipulation check\n\nAs expected, participants’ probability of choosing the risky option (lottery) increased with the difference between the expected value of the lottery and the value of the safe option (Study 1: Figure 2A, t(4796) = 9.26, p < 3.1e-20, β = 0.074, 95% CI = [0.059 0.090]; Study 2: Figure 2D, t(3829) = 10.62, p < 5.3e-26, β = 0.093, 95% CI = [0.075 0.110]; mixed-effects regressions, see Equation 1, detailed results are reported in Supplementary Table 1). Participants chose the lottery more often in the Solo condition than in the Social condition in Study 1 (t(4796) = 2.54, p = 0.011, β = 0.164, 95% CI = [0.038 0.291]), but this difference was not found in Study 2 (t(3829) = 0.23, p = 0.82, β = 0.015, 95% CI = [-0.109 0.138]). There was no significant interaction between the difference in expected values and experimental conditions in either study (p > 0.52).\n\n[Figure 2:] \n\n## Participant choices in Studies 1 (outside fMRI, N = 40) and 2 (inside fMRI, N = 44).\n\nA and D. The probability of choosing the risky option (lottery) in both Solo and Social conditions is well explained by the difference in expected value of the risky and safe choice options (EVrisky – Vsafe). Participants chose the risky option slightly more often in the Solo condition than in the Social condition in Study 1 (A) but not in Study 2 (D). Lines are predicted values of a logit linear mixed regression model fitted to the choice data (see Results). Error areas indicate 95% pointwise confidence intervals for the predicted values. Triangles indicate individual average choice proportions binned by EVrisky – Vsafe value; size of triangle reflects the number of participants contributing to a datapoint. Blue upwards-pointing and red downwards-pointing triangles are data from the Solo and Social conditions, respectively. B and E. Risk premiums did not differ between Solo and Social conditions. C and F. Values of the risk aversion parameter ρ in the Solo and Social conditions were broadly consistent with Risk premium values, but showed that participants were slightly more risk averse in the Social than in the Solo condition in Study 1 only (see Results). In panels B, C, E and F, grey lines and markers show individual data, red lines show means with 95% confidence intervals about the means, and grey areas are kernel density plots representing the distribution of the data.\n\n## Choices: risk preferences\n\nTo better assess whether people’s risk preferences varied between the Solo and the Social condition, we evaluated two additional measures. First, we calculated for each participant a “risk premium”, defined as the difference between the expected value of a lottery and its certainty equivalent (See Equation 2 in Methods; positive risk premiums indicate risk aversion).\n\nSecond, we used an expected utility theory (EUT) approach to calculate a parameter ρ that describes a decision-maker’s risk attitude under the assumption of constant absolute risk aversion (see Equation 3 in Methods). We used two measures because fitting the EUT model, the more comprehensive measure that takes into account all choices of a participant, requires many trials to be fitted reliably, a condition that was not satisfied in many participants of both studies; in contrast, the risk premium’s single-point measure of risk aversion could be estimated in all participants. Risk premiums did not differ between Social and Solo conditions (Study 1: Figure 2B, t(39) = 1.53, p = 0.134, Cohen’s d = 0.24, BF10 = 0.49; Study 2: Figure 2E, t(43) = -0.21, p = 0.84, d = -0.03, BF10 = 0.17). Turning to the EUT approach, as differences in risk attitudes for gains and losses are well known (Kahneman & Tversky, 1979), we first estimated ρ separately for gain and loss trials. As the number of these types of trials varied across participants, we only obtained reliable estimates for both types of trials in some participants (Study 1: 18 of 40; Study 2: 16 of 44). As ρ did not vary between gain and loss trials (Study 1: t(17) = 0.21, p = 0.84, d = 0.05; Study 2: t(15) = - 0.61, p = 0.55, d = 0.15; paired t-test), we then pooled across gain and loss trials, then estimated and compared ρ for the Solo and Social conditions using paired t-tests. We found that participants were slightly more risk averse in the Social than in the Solo condition in Study 1 (Figure 2C, t(39) = 2.27, p = 0.03, d = 0.36, BF10 = 1.69) but not in Study 2 (Figure 2F, t(43) = 1.40, p = 0.17, d = 0.21, BF10 = 0.41). Risk premium and ρ were highly consistent with each other across participants in both conditions for both studies (Study 1: Solo condition: F(1,38) = 69.9, p < 0.001, R2 = 0.65; Social condition: F(1,38) = 42.0, p < 0.001, R2 = 0.55; Study 2: Solo condition: F(1,41) = 57.9, p < 0.001, R2 = 0.59; Social condition: F(1,41) = 74.2, p < 0.001, R2 = 0.64; these and all subsequent regressions are robust).\n\nIn sum, participants showed very similar risk preferences when making decisions affecting only themselves (Solo condition) or themselves and their partner (Social condition), with a tendency towards higher risk aversion in the Social condition in Study 1.\n\n## Momentary happiness: links to reward\n\nMomentary happiness was assessed every two trials in a similar manner to previous studies by Rutledge and colleagues (Rutledge et al., 2014, 2016). Across all trials, in both studies, participant momentary happiness correlated with rewards obtained in the current trial by the participant and by the partner (Correlations with participant reward, Study 1: F(1,3598) = 691.5, p < 0.001, R2 = 0.16; partner reward, Study 1: F(1,2426) = 128.6, p < 0.001, R2 = 0.05; participant reward, Study 2: F(1,2630) = 650.8, p < 0.001, R2 = 0.20; partner reward, Study 2: F(1,1735) = 111.8, p < 0.001, R2 = 0.06; Figure 3A, 3B, 3E and 3F). Based on previous findings (Rutledge et al., 2016), we reasoned that participants’ momentary happiness would be influenced not only by rewards obtained in the current trial, but also by expected rewards, reward prediction errors, rewards received in previous trials, and differences between rewards obtained by the participant and the partner. Crucial for our research question, we aimed to assess whether responsibility for these rewards, i.e., taking into account whether the rewards occurred following choices made by the participant or the partner, would also influence variations in happiness.\n\n[Figure 3:] \n\n## Participant momentary happiness in Studies 1(A-D) and 2 (E-H).\n\nHappiness varied with rewards received by the participant (A and E) and by the partner (B and F). Each dot is one trial; data are pooled across participants. Lines are fitted regression lines. A computational model taking into account expected, previous and current rewards, reward prediction errors for both participant and partner, and decision-maker (Responsibility Redux model, see Results) predicted the variations in participants’ momentary happiness well (C and G, and Table 1). Changes in momentary happiness after lottery choices in Social and Partner conditions varied with lottery outcome and decision-maker (D and H). Data were binned according to outcome for each participant and decision-maker (Social = participant chose the lottery, Partner = partner chose the lottery). Crucially, responsibility for low lottery outcomes for the partner decreased participant happiness more than the same outcomes following partner choices (see Results), which fits the definition of interpersonal guilt. In D and H, dots are individual datapoints, the bar indicates the mean, the error bars are 95% confidence intervals about the mean, and the stars indicate the significance of the “guilt effect” (see text): *** p<0.001; ** p<0.01.\n\nFollowing Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors arising from those expectations, we fitted computational models to each participant’s happiness data. In these models, certain rewards, the expected value of chosen lotteries, reward prediction errors and additional outcome parameters are modelled separately with influences that decay exponentially with time (see Methods for equations and details). We first fitted a ‘Basic’ model (Equation 4) containing reg
