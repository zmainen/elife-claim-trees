laim-graphs:gadeke-mira-v1.0.3\",\n   \"created\": \"2026-10-28T00:00:00.000Z\",\n   \"modified\": \"2026-10-28T00:00:00.000Z\"\n  },\n  {\n   \"@id\": \"cg:rel/request_target/def\",\n   \"@type\": \"RelationDef\",\n   \"domain\": \"cg:type/Request\",\n   \"range\": \"cg:type/Claim\",\n   \"subClassOf\": [\n    \"cg:rel/request_target\",\n    \"dgb:RelationInstance\"\n   ],\n   \"label\": \"request_target\",\n   \"creator\": \"urn:claim-graphs:gadeke-mira-v1.0.3\",\n   \"created\": \"2026-10-28T00:00:00.000Z\",\n   \"modified\": \"2026-10-28T00:00:00.000Z\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:Q1\",\n   \"@type\": [\n    \"cg:type/Question\",\n    \"Question\"\n   ],\n   \"title\": \"How does being responsible for a risky choice that affects a partner change how the decision-maker feels?\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Does it feel different to have caused a bad outcome for someone than to have watched them cause it themselves? — Anchor: “The neural mechanisms underlying guilt evoked during such situations of social responsibility are still unknown.”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:Q2\",\n   \"@type\": [\n    \"cg:type/Question\",\n    \"Question\"\n   ],\n   \"title\": \"Which brain regions carry guilt and responsibility for a partner's outcomes, and how do they interact with prefrontal cortex?\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Which parts of the brain respond to guilt and to being responsible for a partner, and how do they communicate with the prefrontal cortex? — Anchor: “Next we sought to uncover the neural mechanisms associated with our guilt effect”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:S1\",\n   \"@type\": [\n    \"cg:type/Study\",\n    \"Study\"\n   ],\n   \"title\": \"Study 1: behavioural experiment, 40 participants, three sessions outside the scanner\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Participants chose between safe and risky options for themselves (Solo), for themselves and a partner (Social), or watched the partner choose (Partner), rating happiness every two trials. The partner was another participant. — Anchor: “40 healthy participants (14 male, mean age 26.1, range 22 to 31) participated in Study 1 (behaviour only study)”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:S2\",\n   \"@type\": [\n    \"cg:type/Study\",\n    \"Study\"\n   ],\n   \"title\": \"Study 2: fMRI experiment, 44 participants, two sessions in the scanner\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The same task inside a 3T scanner, with longer and variable intervals between events; the partner was an experimenter. All brain results come from this study. — Anchor: “44 healthy participants (19 male, mean (SD) age = 30.6 (6.5), range 23 to 50) participated in Study 2 (fMRI study)”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P1\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Lottery choice task with Solo, Social and Partner conditions\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"On each trial a safe amount against a lottery with two equiprobable outcomes. Solo: the choice affects only the participant. Social: the participant chooses for both. Partner: the partner chooses for both. In Social and Partner, each player's lottery is drawn independently. — Anchor: “participants were presented with pairs of monetary options (a safe and a risky option; the risky option was a lottery with equally probable high and low outcomes)”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P2\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Partner choices simulated by an expected-value-maximising algorithm\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"To keep the partner's behaviour identical across participants, the partner's choices were made by an algorithm that always picked the higher expected value. Participants were not told. — Anchor: “We contrasted this condition with similar choices made by a simple expected-value-maximizing algorithm posing for the partner”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P3\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Icebreaker game to create a social bond before the task\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Participant and partner met for about fifteen minutes and played a cooperative game, so that the partner's outcomes would matter emotionally. — Anchor: “participants were paired with a partner and played an “ice-breaker” game that created a positive social bond between them”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P4\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Momentary happiness probe every two trials\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"After every second outcome, participants rated how happy they felt on a continuous scale; the ratings are the dependent measure for the behavioural analyses. — Anchor: “Momentary happiness was assessed every two trials in a similar manner to previous studies by Rutledge and colleagues”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P5\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Risk-attitude estimation: risk premium and CARA expected utility\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Two measures of how risk-averse each participant was in each condition: a risk premium from a fitted logistic regression, and a constant-absolute-risk-aversion parameter ρ from expected utility theory. — Anchor: “we calculated for each participant a “risk premium”, defined as the difference between the expected value of a lottery and its certainty equivalent”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P6\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Five computational models of momentary happiness\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Basic, Inequality, Guilt-envy, Responsibility and Responsibility Redux: exponentially decaying influences of certain rewards, expected values and reward prediction errors, with the Responsibility models adding the partner's prediction errors split by who chose. Compared by AIC, BIC, R² and likelihood-ratio tests; parameter recovery on synthetic data. — Anchor: “we fitted computational models to each participant’s happiness data”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P7\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Linear mixed models of happiness after lottery outcomes\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Happiness after Social and Partner lottery outcomes modelled with the participant's outcome, the partner's outcome, who chose, and their interactions; the guilt effect is the partner-outcome × decision-maker interaction. — Anchor: “we analysed happiness values reported after outcomes of lottery choices in the Social and Partner conditions using conventional linear mixed models”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P8\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"fMRI acquisition, GLMs and region-of-interest mixed models\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"3T EPI BOLD; a conventional GLM of the trial events (GLM1) and a model-based GLM with the Responsibility model's variables as regressors (GLM2); regions of interest from the lottery-versus-safe outcome contrast analysed with linear mixed models. — Anchor: “We analysed the BOLD responses of brain regions engaged during decision-making and at the time of receiving the outcomes of the choice using conventional as well as computational model-based analyses”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P9\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Seed-to-voxel psychophysiological interaction from left insula and left STS\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Whole-brain connectivity during the choice phase from two seeds, looking for a Condition × Choice interaction. — Anchor: “we used the left insula and left STS as seed regions for whole-brain seed-to-voxel psychophysiological interaction analyses”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P10\",\n   \"@type\": [\n    \"cg:type/Protocol\",\n    \"Protocol\"\n   ],\n   \"title\": \"Comparison with the published guilt-related brain signature\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Each participant's guilt-related activation map was projected onto Yu et al.'s multivariate guilt signature; a positive dot product means resemblance. — Anchor: “we compared this brain signature to the neural responses obtained in our task”\"\n   }\n  },\n  {\n   \"@id\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"@type\": [\n    \"cg:type/SourceDocument\",\n    \"SourceDocument\"\n   ],\n   \"title\": \"Gädeke et al. (2026), Contributions of insula and superior temporal sulcus to interpersonal guilt and responsibility in social decisions, eLife 105391 v2\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The paper this graph is extracted from. — Anchor: “Contributions of insula and superior temporal sulcus to interpersonal guilt and responsibility in social decisions”\"\n   }\n  },\n  {\n   \"@id\": \"https://doi.org/10.1038/ncomms11825\",\n   \"@type\": [\n    \"cg:type/SourceDocument\",\n    \"SourceDocument\"\n   ],\n   \"title\": \"Rutledge RB, de Berker AO, Espenhahn S, Dayan P, Dolan RJ (2016). The social contingency of momentary subjective well-being. Nature Communications 7:11825.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The paper whose happiness-modelling method this study adopts and extends to a social setting. — Anchor: “Following Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E1\",\n   \"@type\": [\n    \"cg:type/Cited\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Changes in momentary happiness during a probabilistic reward task are explained by recent reward expectations and the prediction errors arising from them.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Earlier work had shown that happiness in a gambling task follows recent rewards and surprises. — Anchor: “Following Rutledge and colleagues’ methodology, which considers that changes in momentary happiness in response to outcomes of a probabilistic reward task are explained by the combined influence of recent reward expectations and prediction errors”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.1038/ncomms11825\"\n  },\n  {\n   \"@id\": \"https://doi.org/10.1126/science.aat0036\",\n   \"@type\": [\n    \"cg:type/SourceDocument\",\n    \"SourceDocument\"\n   ],\n   \"title\": \"Edelson MG, Polania R, Ruff CC, Fehr E, Hare TA (2018). Computational and neurobiological foundations of leadership decisions. Science 361:eaat0036.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The leadership study this paper compares its agency effect and its connectivity results with. — Anchor: “most participants displayed responsibility aversion, and this effect could not be explained by guilt, suggesting people associate a psychological cost with assuming responsibility for others’ outcomes”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E2\",\n   \"@type\": [\n    \"cg:type/Cited\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Most participants show responsibility aversion — a psychological cost of deciding for others — that guilt does not explain.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Earlier work had found that people dislike being responsible for others' outcomes, independently of guilt. — Anchor: “most participants displayed responsibility aversion, and this effect could not be explained by guilt, suggesting people associate a psychological cost with assuming responsibility for others’ outcomes”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.1126/science.aat0036\"\n  },\n  {\n   \"@id\": \"https://doi.org/10.1093/scan/nst090\",\n   \"@type\": [\n    \"cg:type/SourceDocument\",\n    \"SourceDocument\"\n   ],\n   \"title\": \"Yu H, Hu J, Hu L, Zhou X (2014). The voice of conscience: neural bases of interpersonal guilt and compensation. Social Cognitive and Affective Neuroscience 9:1150–1158.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The guilt paradigm that motivates the insula hypothesis. — Anchor: “The level of pain taken, indicative of guilt, and activations in anterior middle cingulate cortex and aIns were higher when the pain followed errors made only by the participant rather than by both players”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E3\",\n   \"@type\": [\n    \"cg:type/Cited\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Anterior insula and anterior middle cingulate activity were higher when a partner's pain followed the participant's own errors.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Earlier work had found the anterior insula more active when a partner's pain followed the participant's own mistakes. — Anchor: “The level of pain taken, indicative of guilt, and activations in anterior middle cingulate cortex and aIns were higher when the pain followed errors made only by the participant rather than by both players”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.1093/scan/nst090\"\n  },\n  {\n   \"@id\": \"https://doi.org/10.1093/cercor/bhz326\",\n   \"@type\": [\n    \"cg:type/SourceDocument\",\n    \"SourceDocument\"\n   ],\n   \"title\": \"Yu H, Koban L, Chang LJ, Wagner U, Krishnan A, Vuilleumier P, Zhou X, Wager TD (2020). A generalizable multivariate brain pattern for interpersonal guilt. Cerebral Cortex 30:3558–3572.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The source of the guilt-related brain signature this paper uses as an external yardstick. — Anchor: “A multivariate reanalysis of these two datasets revealed a neural signature for guilt (Yu et al., 2020)”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E4\",\n   \"@type\": [\n    \"cg:type/Cited\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"A multivariate reanalysis of two guilt studies yields a distributed guilt-related brain signature spanning anterior midcingulate, insula, IFG, inferior temporal cortex, thalamus and cerebellum.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Earlier work had derived a brain-wide signature of guilt from two studies. — Anchor: “A multivariate reanalysis of these two datasets revealed a neural signature for guilt (Yu et al., 2020)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.1093/cercor/bhz326\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:H1\",\n   \"@type\": [\n    \"cg:type/Hypothesis\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Responsibility for a social choice that yields a low outcome for a partner produces interpersonal guilt, felt as a larger decrease in momentary happiness than when the partner made the same choice.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Being the one who chose, when the choice turns out badly for a partner, should hurt more than the same bad luck under the partner's own choice. — Anchor: “choosing a risky option in such a case may evoke guilt when the outcome for others is negative”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:H2\",\n   \"@type\": [\n    \"cg:type/Hypothesis\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The anterior insula is the neural substrate of that guilt, responding more when the participant is responsible for a low outcome affecting the partner.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The anterior insula, already linked to guilt, should respond more when the participant is responsible for the partner's bad outcome. — Anchor: “Given the documented association between anterior insula and guilt (see Introduction)”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:H3\",\n   \"@type\": [\n    \"cg:type/Hypothesis\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Connectivity between the guilt- and responsibility-related regions and prefrontal cortex changes with who decides and with the type of choice.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"How the insula and STS couple with prefrontal cortex during a choice should depend on whether the choice is risky and whether it affects the partner. — Anchor: “We hypothesized that connectivity with regions that showed guilt- and responsibility-related responses during the outcome phase (see previous paragraph) might change depending on whether participants made decisions for themselves only or for themselves and their partner”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:H4\",\n   \"@type\": [\n    \"cg:type/Hypothesis\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"A neural substrate tracks the participant's responsibility for the partner's outcomes, representing the partner's reward prediction errors more strongly when they arise from the participant's own choice.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Some brain region should track the partner's surprises more strongly when the participant, not the partner, caused them. — Anchor: “search for networks sensitive to reward prediction errors resulting from participant or partner choices”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F1\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Responsibility for a partner's bad lottery outcomes decreases participant happiness more than the same outcomes following partner choices, consistent with interpersonal guilt.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The same bad outcome for the partner lowered happiness more when the participant had made the choice, in both studies. — Anchor: “When the partner received the low lottery outcome, participant happiness was lower when they rather than the partner had chosen the lottery”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F2\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Computational models incorporating partner reward prediction errors differentiated by decision-maker (participant vs partner) best explain momentary happiness variations.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Among five models of what drives happiness, the one that separates out the partner's surprises caused by the participant's own choice fitted best, and that term mattered. — Anchor: “the Responsibility model fitted better than all the other models, including the Responsibility Redux model”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F3\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The participant's own reward prediction errors influenced happiness more than the partner's.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"A participant's own surprises affected their happiness more than the partner's did. — Anchor: “Participants’ reward prediction errors (sRPE) influenced happiness more than partner’s reward prediction errors”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F4\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Momentary happiness tracked the rewards both the participant and the partner received on the current trial.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Happiness rose and fell with the rewards both players had just received. — Anchor: “participant momentary happiness correlated with rewards obtained in the current trial by the participant and by the partner”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F5\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Being the decision-maker lowered happiness, independent of the outcome.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Simply being the one who decided made participants slightly less happy, whatever the outcome. — Anchor: “found happiness to be lower when the participant chose, independent of the outcome”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F6\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Responsibility did not change happiness after good outcomes for the partner.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"When the partner's outcome was good, it made no difference who had chosen. — Anchor: “Responsibility for choices did not influence happiness following positive lottery outcomes for the partner”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F7\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Participants show similar risk preferences when deciding for themselves versus for themselves and a partner, with a tendency toward higher risk aversion in the Social condition only in Study 1.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Participants were about as willing to take risks for themselves and a partner as for themselves alone. — Anchor: “participants showed very similar risk preferences when making decisions affecting only themselves (Solo condition) or themselves and their partner (Social condition)”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F8\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The guilt effect is associated with increased BOLD signal in the left anterior insula.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Insula activity rose more for the partner's bad outcomes when the participant had made the choice, mirroring the behavioural guilt effect. — Anchor: “activation in our insula ROIs increased in situations during which participants experienced guilt for low outcomes impacting their partner”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F9\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Functional connectivity between the left anterior insula and the right inferior frontal gyrus varies with choice and condition: highest for risky choices for oneself and safe choices for both players.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"How strongly the insula and the right inferior frontal gyrus were coupled depended on what was chosen and for whom. — Anchor: “a cluster in the right inferior frontal gyrus (IFG) whose connectivity to the insula (the seed region) was highest when participants made Risky choices for themselves and Safe choices for both players”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F10\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The right inferior frontal gyrus is sensitive to guilt-related information during social choices.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The authors suggest this prefrontal region handles guilt-related information while a social choice is being made. — Anchor: “suggesting that this part of prefrontal cortex is sensitive to guilt-related information during social choices”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F11\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Connectivity between the left STS and left inferior frontal gyrus showed the opposite pattern, but did not survive correction.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"A weaker, uncorrected result suggested the STS and the left inferior frontal gyrus couple in the opposite pattern. — Anchor: “connectivity with the left STS (the seed region) showed the opposite pattern”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F12\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The left superior temporal sulcus tracks partner reward prediction errors specifically when they result from the participant's choices.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"A region of the left superior temporal sulcus tracked the partner's surprises more when the participant had caused them. — Anchor: “We found this effect in one cluster within the left STS”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F13\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Choosing for both oneself and the partner, rather than for oneself alone, engaged the precuneus, left temporo-parietal junction and medial prefrontal cortex.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Choosing for two people engaged regions associated with thinking about others: precuneus, temporo-parietal junction and medial prefrontal cortex. — Anchor: “Three significant clusters of voxels were identified (Figure 4B and Supplementary Table 3), in the precuneus”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F14\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Receiving lottery outcomes, compared with safe outcomes, engaged bilateral anterior insula, dorsomedial prefrontal cortex, right STS, ventral striatum, right dorsolateral prefrontal cortex and inferior parietal lobe.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Receiving a lottery outcome engaged a set of regions associated with risk, including the anterior insula and ventral striatum. — Anchor: “Cluster of voxels more active during receipt of lottery outcomes than outcomes of safe choices were identified in the bilateral anterior insula”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:F15\",\n   \"@type\": [\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The guilt-related activation patterns resembled the published guilt-related brain signature.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Brain activity during the guilt effect resembled a published brain signature of guilt from other studies. — Anchor: “The “neurometrics” analysis of our guilt-related activation maps showed a significant similarity to a published guilt-related brain signature”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:A1\",\n   \"@type\": [\n    \"cg:type/Alternative\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"The larger drop in happiness after the partner's low outcome is disappointment at the participant's own outcome, not guilt about the partner's.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Perhaps participants were just disappointed about their own outcome, not the partner's. — Anchor: “The “guilt effect” occurred whether the participant received the high lottery outcome”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:A2\",\n   \"@type\": [\n    \"cg:type/Alternative\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Being responsible simply amplifies the participant's reaction to all of the partner's outcomes, good or bad.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Perhaps being responsible simply makes every outcome for the partner matter more, good or bad. — Anchor: “Responsibility for choices did not influence happiness following positive lottery outcomes for the partner”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:A3\",\n   \"@type\": [\n    \"cg:type/Alternative\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Choosing for two people changes how much risk participants take, so the differences between conditions reflect different choices rather than guilt.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Perhaps people take different risks when choosing for two, and the differences between conditions follow from that rather than from guilt. — Anchor: “To better assess whether people’s risk preferences varied between the Solo and the Social condition”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:A4\",\n   \"@type\": [\n    \"cg:type/Alternative\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Happiness tracks the inequality between the participant's and the partner's rewards; responsibility for the partner's surprises adds nothing.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Perhaps happiness just tracks the gap between what the two players got, with no role for who was responsible. — Anchor: “we assessed the fit of an ‘Inequality’ model that included one term modelling the difference between the participant and partner outcomes”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:A5\",\n   \"@type\": [\n    \"cg:type/Alternative\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"What participants felt was empathy for the partner, a sense of failure or bad luck, or some emotion other than guilt.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Perhaps what participants felt was empathy, or a sense of failure or bad luck, rather than guilt. — Anchor: “we cannot exclude the possibility that they have instead or in addition felt empathy for their partner, a feeling of failure or bad luck, or some other emotion”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:A6\",\n   \"@type\": [\n    \"cg:type/Alternative\",\n    \"cg:type/Claim\",\n    \"Claim\"\n   ],\n   \"title\": \"Because the partner's choices were really an algorithm, participants were emotionally detached from the partner's outcomes and the effects do not reflect a social interaction.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Perhaps, because the partner was really an algorithm, participants were not emotionally engaged with the partner's outcomes at all. — Anchor: “The first limitation is that the partner’s decisions were in fact taken by an algorithm”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:K1\",\n   \"@type\": [\n    \"cg:type/Check\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 1, the probability of choosing the lottery rose with the lottery's expected-value advantage over the safe option (t(4796) = 9.26, p < 3.1e-20, β = 0.074).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Participants took the lottery more often the better it was, showing their choices were sensible. — Anchor: “participants’ probability of choosing the risky option (lottery) increased with the difference between the expected value of the lottery and the value of the safe option”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:K2\",\n   \"@type\": [\n    \"cg:type/Check\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 2, the probability of choosing the lottery rose with its expected-value advantage (t(3829) = 10.62, p < 5.3e-26, β = 0.093).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The same held in the scanner study. — Anchor: “Study 2: Figure 2D, t(3829) = 10.62, p < 5.3e-26, β = 0.093”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E5\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 1, participants chose the lottery more often in the Solo than the Social condition (t(4796) = 2.54, p = 0.011, β = 0.164).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"In the first study, participants chose the lottery a little more often when choosing for themselves alone. — Anchor: “Participants chose the lottery more often in the Solo condition than in the Social condition in Study 1 (t(4796) = 2.54, p = 0.011, β = 0.164”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E6\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 2, lottery choice did not differ between Solo and Social (t(3829) = 0.23, p = 0.82, β = 0.015).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"In the scanner study, choosing for two made no difference to how often the lottery was chosen. — Anchor: “this difference was not found in Study 2 (t(3829) = 0.23, p = 0.82, β = 0.015”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E7\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"The expected-value effect on choice did not interact with condition in either study (p > 0.52).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"How much the lottery's value swayed choices was the same whether choosing for one or for two. — Anchor: “There was no significant interaction between the difference in expected values and experimental conditions in either study (p > 0.52)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E8\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 1, risk premiums did not differ between Social and Solo (t(39) = 1.53, p = 0.134, d = 0.24, BF10 = 0.49).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The premium participants demanded for taking a risk was the same whether choosing for one or for two. — Anchor: “Risk premiums did not differ between Social and Solo conditions (Study 1: Figure 2B, t(39) = 1.53, p = 0.134, Cohen’s d = 0.24, BF10 = 0.49”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E9\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 2, risk premiums did not differ between Social and Solo (t(43) = -0.21, p = 0.84, d = -0.03, BF10 = 0.17).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The same held in the scanner study. — Anchor: “Study 2: Figure 2E, t(43) = -0.21, p = 0.84, d = -0.03, BF10 = 0.17”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:K3\",\n   \"@type\": [\n    \"cg:type/Check\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"The risk-aversion parameter ρ did not differ between gain and loss trials in either study (Study 1: t(17) = 0.21, p = 0.84; Study 2: t(15) = -0.61, p = 0.55), justifying pooling.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Risk attitude was the same for gains and losses, so the two could be pooled. — Anchor: “As ρ did not vary between gain and loss trials (Study 1: t(17) = 0.21, p = 0.84, d = 0.05; Study 2: t(15) = - 0.61, p = 0.55, d = 0.15; paired t-test)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E10\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 1, ρ was slightly higher in the Social than the Solo condition (t(39) = 2.27, p = 0.03, d = 0.36, BF10 = 1.69).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"By one measure, participants in the first study were slightly more cautious when choosing for two. — Anchor: “participants were slightly more risk averse in the Social than in the Solo condition in Study 1 (Figure 2C, t(39) = 2.27, p = 0.03, d = 0.36, BF10 = 1.69)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E11\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 2, ρ did not differ between Social and Solo (t(43) = 1.40, p = 0.17, d = 0.21, BF10 = 0.41).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"By the same measure, participants in the scanner study were not more cautious when choosing for two. — Anchor: “but not in Study 2 (Figure 2F, t(43) = 1.40, p = 0.17, d = 0.21, BF10 = 0.41)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:K4\",\n   \"@type\": [\n    \"cg:type/Check\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Risk premium and ρ were highly consistent across participants in both conditions and both studies (all F > 42, p < 0.001, R² 0.55–0.65).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The two ways of measuring risk attitude agreed closely. — Anchor: “Risk premium and ρ were highly consistent with each other across participants in both conditions for both studies”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig2.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E12\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 1, happiness correlated with the participant's reward (F(1,3598) = 691.5, R² = 0.16) and the partner's reward (F(1,2426) = 128.6, R² = 0.05) on the current trial.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"In the first study, happiness tracked the rewards both the participant and the partner had just received. — Anchor: “Correlations with participant reward, Study 1: F(1,3598) = 691.5, p < 0.001, R2 = 0.16; partner reward, Study 1: F(1,2426) = 128.6, p < 0.001, R2 = 0.05”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E13\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"In Study 2, happiness correlated with the participant's reward (F(1,2630) = 650.8, R² = 0.20) and the partner's reward (F(1,1735) = 111.8, R² = 0.06).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The same held in the scanner study. — 91.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E25\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"The guilt effect held when the participant's own outcome was high (Study 1: t(39) = -3.58, p < 0.001, d = 0.56, BF10 = 32; Study 2: t(43) = -2.68, p = 0.01, d = 0.4, BF10 = 3.8).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The guilt effect was present when the participant's own outcome was good. — Anchor: “Study 1: t(39) = -3.58, p < 0.001, d = 0.56, BF10 = 32; Study 2: t(43) = -2.68, p = 0.01, d = 0.4, BF10 = 3.8”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E26\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"The guilt effect held when the participant's own outcome was low (Study 1: t(39) = -3.39, p = 0.002, d = 0.54, BF10 = 19; Study 2: t(43) = -3.58, p < 0.001, d = 0.54, BF10 = 33.5).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The guilt effect was present when the participant's own outcome was bad. — Anchor: “Study 1: t(39) = -3.39, p = 0.002, d = 0.54, BF10 = 19; Study 2: t(43) = -3.58, p < 0.001, d = 0.54, BF10 = 33.5”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig3.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E27\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n  0.54)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E29\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Only precuneus and TPJ showed a larger risky-minus-safe response in Social than in both Solo and Partner conditions.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The precuneus and temporo-parietal junction were most active for risky choices made on behalf of both players. — Anchor: “Only Precuneus and TPJ showed positive differences in both comparisons (Figure 4C)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E30\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Lottery outcomes versus safe outcomes engaged bilateral anterior insula, dmPFC, right STS, ventral striatum, right dlPFC and inferior parietal lobe.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Receiving a lottery outcome engaged the anterior insula, ventral striatum and several other regions more than receiving a safe outcome. — Anchor: “bilateral anterior insula, dorsal mPFC (dmPFC), right superior temporal sulcus (STS), bilateral ventral striatum, right dorsolateral prefrontal cortex, and bilateral inferior parietal lobe (Figure 4D”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E31\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Insula ROIs responded more to the partner's low outcomes in the Social than the Partner condition, also after subtracting responses to high outcomes.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Insula regions responded more to the partner's bad outcomes when the participant had chosen, even after discounting responses to good outcomes. — Anchor: “the insulae showed the sought-after effect (see Supplementary Table 6 and Figure 4E)”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E32\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"A voxel-wise analysis found a small left anterior insula cluster responding more to the partner's low outcomes after participant than partner choices (peak T = 3.95, d = 0.59, 22 voxels), surviving small-volume correction (p = 0.024).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"A small cluster in the left anterior insula showed the same guilt-related response in a voxel-by-voxel analysis. — Anchor: “We found a weak response in a small cluster within the left anterior insula (peak T = 3.95, d = 0.59, 22 voxels”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:K8\",\n   \"@type\": [\n    \"cg:type/Check\",\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Ventral striatum activation increased with expected certain rewards and the expected values of chosen lotteries under the model-based regressor (left pFWE = 0.002, T = 5.63; right pFWE = 0.005, T = 5.46).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"The ventral striatum tracked the model's expected rewards, confirming the model-based analysis works. — Anchor: “activation in bilateral ventral striatum indeed increased with the amount of expected certain rewards and the expected values of chosen lotteries”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E33\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"One left STS cluster responded more to the partner's reward prediction errors from participant than partner choices (pFWE = 0.022, T = 4.70, d = 0.53, 100 voxels, peak MNI [-52 -32 0]).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"A cluster in the left superior temporal sulcus responded more to the partner's surprises when the participant had caused them. — Anchor: “We found this effect in one cluster within the left STS (pFWE = 0.022, T = 4.70, d = 0.53, Z = 4.57, 100 voxels”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E34\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"The STS cluster's responses to partner prediction errors from participant and partner choices are shown for both sessions.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"That cluster's responses are shown separately for the two scanning sessions. — Anchor: “Responses to the computational-model-based regressors coding for partner reward prediction errors resulting from participant and from partner choices in this cluster are shown in Figure 4I”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig4.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E35\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Right IFG connectivity with the left insula seed was highest for risky choices for oneself and safe choices for both players (pFWE = 0.020, T = 4.34, d = 0.80, 115 voxels).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Coupling between the insula and the right inferior frontal gyrus was strongest for risky choices for oneself and safe choices for both. — Anchor: “pFWE = 0.020, T = 4.34, d = 0.80, Z = 4.21, 115 voxels, peak at MNI [46 16 22]; Figure 5”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig5.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E36\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"A smaller left IFG cluster showed the same connectivity pattern with the insula seed but did not survive correction (puncorrected = 0.001, T = 4.08, 38 voxels).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"A smaller cluster on the left showed the same pattern but did not survive statistical correction. — Anchor: “A smaller cluster in the left IFG showed the same effect but did not survive correction for multiple tests”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\",\n   \"observationBase\": \"https://iiif.elifesciences.org/epp/105391%2Fv2%2Fcontent%2F107300v6_fig5.tif/full/max,/0/default.jpg\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E37\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Left IFG connectivity with the left STS seed showed the opposite pattern — highest for safe choices for oneself and risky choices for both — uncorrected (p = 0.001, T = 4.44, 35 voxels).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Coupling between the STS and the left inferior frontal gyrus showed the opposite pattern, but did not survive correction. — Anchor: “connectivity was highest when participants made Safe choices for themselves and Risky choices for both players (puncorrected = 0.001, T = 4.44, Z = 4.30, 35 voxels”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E38\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"Dot products between individual guilt-related maps and the published guilt signature were overall positive (mean 5.22, median 6.97, sign test p = 0.017, Cliff's delta 0.4).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Participants' guilt-related brain maps resembled a published guilt signature more often than not. — Anchor: “overall these values were positive (mean = 5.22; median = 6.97; sign test: p = 0.017; Cliff’s Delta = 0.4 = medium effect size”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:E39\",\n   \"@type\": [\n    \"cg:type/Evidence\",\n    \"Evidence\"\n   ],\n   \"title\": \"The signature match did not correlate with individual behavioural guilt effects (Spearman's ρ = -0.058, p = 0.725).\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"How closely a participant's map resembled the signature did not predict the size of their behavioural guilt effect. — Anchor: “did not find a significant association [Spearman’s Rho = -0.058, p = 0.725]”\"\n   },\n   \"sourceDocument\": \"https://doi.org/10.7554/eLife.105391.2\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:R1\",\n   \"@type\": [\n    \"cg:type/Request\",\n    \"Request\"\n   ],\n   \"title\": \"Ask participants directly which emotions they felt at each stage of the task, to link subjective experience to the analytical measures of guilt.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Ask participants what they felt, to connect the measures of guilt to their own experience. — Anchor: “asking participants directly about which emotions they have felt during the different stages of this task would allow us to link subjective experience with our analytical measures”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:R2\",\n   \"@type\": [\n    \"cg:type/Request\",\n    \"Request\"\n   ],\n   \"title\": \"Test more participants to assess how personality traits shape the experience and the behavioural and neural correlates of guilt and responsibility.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Study more people, to see how personality shapes guilt and responsibility and their brain correlates. — Anchor: “Testing more participants would allow us to assess the impact of inter-individual variations in personality traits”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:R3\",\n   \"@type\": [\n    \"cg:type/Request\",\n    \"Request\"\n   ],\n   \"title\": \"Run more trials so risk preferences can be modelled separately for gains and losses per condition, and to test whether happiness changes affect later choices.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Collect more trials, so risk preferences can be modelled separately for gains and losses in each condition. — Anchor: “Using more trials in the experiment would allow separate modelling of risk preferences in gain and loss trials in each experimental condition”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:R4\",\n   \"@type\": [\n    \"cg:type/Request\",\n    \"Request\"\n   ],\n   \"title\": \"Vary the partner's identity — friend, stranger, artificial agent — to measure social discounting of guilt and responsibility.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Vary who the partner is, from friend to stranger to machine, to see how closeness changes guilt and responsibility. — Anchor: “Varying partner identities (friends, stranger, artificial agent) could reveal the impact of social discounting on guilt and responsibility”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:R5\",\n   \"@type\": [\n    \"cg:type/Request\",\n    \"Request\"\n   ],\n   \"title\": \"Run the connectivity analyses on the outcome (feedback) phase of the task.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Analyse connectivity during the moment outcomes are revealed, not only during the choice. — Anchor: “Functional connectivity analyses could also be performed for the data obtained in the feedback part of the paradigm”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:R6\",\n   \"@type\": [\n    \"cg:type/Request\",\n    \"Request\"\n   ],\n   \"title\": \"Run experiments that isolate the specific computations the left STS/TPJ and anterior insula perform, to explain how guilt and responsibility shape social decisions.\",\n   \"description\": {\n    \"@type\": \"Item\",\n    \"format\": \"text/plain\",\n    \"content\": \"Design experiments that isolate what the STS and anterior insula each compute during social decisions. — Anchor: “More experiments investigating specific computations in which these regions are involved”\"\n   }\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:edge/1\",\n   \"@type\": [\n    \"cg:rel/follows\",\n    \"follows\"\n   ],\n   \"source\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:S1\",\n   \"destination\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P1\",\n   \"title\": \"[[S1]] -follows-> [[P1]]\",\n   \"creator\": \"urn:claim-graphs:gadeke-mira-v1.0.3\",\n   \"created\": \"2026-10-28T00:00:00.000Z\",\n   \"modified\": \"2026-10-28T00:00:00.000Z\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:edge/2\",\n   \"@type\": [\n    \"cg:rel/follows\",\n    \"follows\"\n   ],\n   \"source\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:S1\",\n   \"destination\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P2\",\n   \"title\": \"[[S1]] -follows-> [[P2]]\",\n   \"creator\": \"urn:claim-graphs:gadeke-mira-v1.0.3\",\n   \"created\": \"2026-10-28T00:00:00.000Z\",\n   \"modified\": \"2026-10-28T00:00:00.000Z\"\n  },\n  {\n   \"@id\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:edge/3\",\n   \"@type\": [\n    \"cg:rel/follows\",\n    \"follows\"\n   ],\n   \"source\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:S1\",\n   \"destination\": \"urn:claim-graphs:gadeke-2026-guilt-insula:hand:P3\",\n   \"title\": \"[[S1]] -follows-> [[P3]]\",\n   \"creator\": \"urn:claim-graphs:gadeke-mira-v1.0.3\",\n   \"created\": \"2026-10-28T00:00:00.000Z\",\n   \"modified\": \"2026-10-28T00:00:00.000Z\"\n  },\n  {\n <script>
const D=JSON.parse(document.getElementById('data').textContent);const G=D.graph,T=D.text,V=D.verification,C=D.compare;

const thumb=u=>D.thumbs?.[u]?.data||u;const thumbAlt=u=>D.thumbs?.[u]?.file||'';const IMG=(u,alt,cls='')=>`<img ${cls?`class="${cls}" `:''}src="${thumb(u)}" data-alt="${thumbAlt(u)}" onerror="if(this.dataset.alt&&!this.dataset.tried){this.dataset.tried=1;this.src=this.dataset.alt}" alt="${alt}">`;const TN=C?Object.fromEntries(C.graph.nodes.map(n=>[n.id,n])):{};const O2T=C?C.align.ours_to_theirs:null;
const prov=n=>!C?'':O2T[n.id]?`<span class="prov" title="${esc(C.label)}: ${esc(O2T[n.id].map(t=>TN[t].text).join('\n'))}">= ${O2T[n.id].join(', ')}</span>`:['Evidence','SourceDocument'].includes(n.type)?'':`<span class="prov new">new</span>`;

const tab=name=>{document.querySelectorAll('.tabs [data-tab]').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===name));document.querySelectorAll('main').forEach(m=>m.classList.toggle('on',m.id===name));document.getElementById('article').classList.toggle('on',name==='article')};

document.getElementById('collapse').onclick=()=>{document.querySelectorAll('.drawer').forEach(d=>d.remove());document.querySelectorAll('.row.open,.row.cur').forEach(r=>r.classList.remove('open','cur'));document.querySelectorAll('mark.anc.on').forEach(m=>m.classList.remove('on'))};
const narrow=()=>matchMedia('(max-width:900px)').matches;
const HV=document.getElementById('hover');document.body.addEventListener('mouseover',e=>{const c=e.target.closest('.id[data-go]');if(!c||!N[c.dataset.go]){HV.hidden=true;return}const n=N[c.dataset.go];HV.innerHTML=`${chip(n)}${esc(n.text)}`;HV.hidden=false;const r=c.getBoundingClientRect();HV.style.left=Math.min(r.left,innerWidth-HV.offsetWidth-12)+'px';HV.style.top=(r.bottom+6+HV.offsetHeight>innerHeight?r.top-HV.offsetHeight-6:r.bottom+6)+'px'});document.body.addEventListener('mouseout',e=>{if(e.target.closest('.id[data-go]'))HV.hidden=true});
// ── article: mark anchors; margin shows chip + summary ──────────────────────────────────
const anchored=G.nodes.filter(n=>n.type!=='SourceDocument').flatMap(n=>[n.anchor,...(n.anchors||[])].filter(a=>a&&T.includes(a)).map(a=>({n,a}))).sort((x,y)=>y.a.length-x.a.length);
let segs=[{t:T}];
for(const {n,a} of anchored){const out=[];for(const s of segs){if(s.n){out.push(s);continue}let i=s.t.indexOf(a);if(i<0){out.push(s);continue}out.push({t:s.t.slice(0,i)});out.push({t:a,n});out.push({t:s.t.slice(i+a.length)})}segs=out.filter(s=>s.t.length)}
const html=[];let para=[];const flush=()=>{if(!para.length)return;const h=para.join('');const ids=[...new Set([...h.matchAll(/data-id="([^"]+)"/g)].map(m=>m[1]))];
 const fm=h.match(/^\[(Figure \d+)[:.]?\]/);const fg=fm&&Object.values(G.figures||{}).find(f=>new RegExp('^'+fm[1]+'[A-Z]?$').test(f.label));
 const body=h.startsWith('## ')?`<h2>${h.slice(3)}</h2>`:fg?`<figure class="fig"><a href="${esc(fg.page)}" target="_blank">${IMG(fg.thumbnail,esc(fm[1]))}</a><figcaption>${esc(fm[1])} · <a href="${esc(fg.page)}" target="_blank">on eLife ↗</a></figcaption></figure>`:h.startsWith('[Figure')||h.startsWith('[Table')?`<p class="fig">${h}</p>`:`<p>${h}</p>`;
 html.push(body);para=[]};
for(const s of segs){const parts=s.t.split('\n\n');parts.forEach((p,i)=>{if(i>0){flush()}const t=p.replace(/\n/g,' ');if(!t)return;para.push(s.n?`<mark class="anc" data-id="${s.n.id}">${esc(t)}</mark><span class="id ${pre(s.n)}" data-id="${s.n.id}">${s.n.id}</span>`:esc(t))})}
flush();document.getElementById('text').innerHTML=html.join('');
const P=G.paper||{};document.getElementById('meta').innerHTML=`${P.authors?`<span><b>${esc(P.authors.map(a=>a.name).join(', '))}</b></span>`:''}${P.doi?`<span><a href="https://doi.org/${esc(P.doi)}" target="_blank">doi:${esc(P.doi)}</a></span>`:''}<span>${G.nodes.length} nodes · ${G.edges.length} edges</span>${G.version?`<span>graph v${esc(G.version)} · ${esc(G.date||'')}</span>`:''}`;

heads.forEach((h,i)=>{h.id='sec'+i;toc.add(new Option(h.textContent,h.id))});toc.onchange=()=>{const h=document.getElementById(toc.value);narrow()?h.scrollIntoView({block:'start'}):paneScroll(document.getElementById('article'),h,.04)};
const majors=heads.filter(h=>MAJOR.test(h.textContent.trim()));const sec=document.getElementById('sections');
const SHORT={checks:'Verification',compare:'Compared with prototype',json:'JSON',jsonld:'JSON-LD (MIRA)',about:'About this graph'};const VIEWS=D.deliver?['about','json','jsonld']:['checks','compare','json','jsonld','about'];
sec.innerHTML=majors.map(h=>`<a href="#${h.id}" data-sec="${h.id}">${esc(h.textContent)}</a>`).join('')+`<div class="tools"><button data-tool="tree" aria-selected="true">Claims</button><button id="collapse2" class="quiet">collapse all</button><details class="internal" ${D.deliver?'open':''}><summary>${D.deliver?'data':'internal'}</summary>${VIEWS.map(t=>`<button data-tool="${t}" ${(t==='compare'&&!C)||(t==='jsonld'&&!D.jsonld)?'hidden':''} aria-selected="false">${SHORT[t]}</button>`).join('')}</details></div>
${(()=>{const S=G.stats||{},n=(t,sub)=>G.nodes.filter(x=>x.type===t&&(sub===undefined||(x.subtype||null)===sub)).length;
 const rows=[['Q','questions',n('Question')],[null,'claims',n('Claim')],['H','hypotheses',n('Claim','Hypothesis'),1],['F','findings',n('Claim',null),1],['A','alternatives',n('Claim','Alternative'),1],
  [null,'evidence',n('Evidence')],['E','results',n('Evidence',null),1],['K','checks',n('Evidence','Check'),1],['E cited','from cited work',n('Evidence','Cited'),1],['C','cited works',G.nodes.filter(isCitedDoc).length],['R','requests',n('Request')]];
 return `<div class="key"><div class="kh">Contents</div>${rows.map(([c,w,k,sub])=>`<div class="${sub?'sub':''}">${c?`<span class="id ${c}">${c.split(' ')[0]}</span>`:'<span></span>'}<span>${w}</span><b>${k}</b></div>`).join('')}<div class="kf">${n('Study')} studies · ${n('Protocol')} protocols · ${S.edges||G.edges.length} edges</div></div>`})()}`;
sec.querySelectorAll('a[data-sec]').forEach(a=>a.onclick=e=>{e.preventDefault();const h=document.getElementById(a.dataset.sec);narrow()?h.scrollIntoView({block:'start'}):paneScroll(document.getElementById('article'),h,.02)});
sec.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tab(b.dataset.tool);sec.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-selected',x===b))});

const artPane=document.getElementById('article');artPane.addEventListener('scroll',()=>{const top=artPane.getBoundingClientRect().top+80;let cur=majors[0];for(const h of majors){if(h.getBoundingClientRect().top<=top)cur=h}sec.querySelectorAll('a[data-sec]').forEach(a=>a.classList.toggle('cur',a.dataset.sec===cur?.id))},{passive:true});
function verifyBadges(id){const bad=Object.entries(V.nodes?.[id]||{}).filter(([,r])=>!r.ok);return bad.length?`<div class="verify">${bad.map(([c,r])=>`<span class="bad" title="${esc(r.note)}">${c} ✗ ${esc(r.note)}</span>`).join('')}</div>`:''}
function detail(n){const rel=(list,dir)=>(list||[]).filter(e=>['supports','opposes','addresses','observationStatement','request_target','grounds','follows'].includes(e.relation)).filter(e=>!(dir==='in'&&n.type==='Claim'&&['supports','opposes','request_target'].includes(e.relation))&&!(dir==='out'&&n.type==='Study'&&e.relation==='follows')&&!(dir==='out'&&n.type==='Request'&&e.relation==='request_target')&&!(n.type==='SourceDocument')&&!(e.relation==='describesActivity')&&!(dir==='out'&&n.type==='Claim'&&e.relation==='supports'&&N[e.object].type==='Claim'&&!N[e.object].subtype)).map(e=>{const a=N[e.subject],b=N[e.object],o=dir==='out'?b:a;return `<li>${chip(a,true)} <span class="rel">${e.relation}</span> ${chip(b,true)}</li>`}).join('');
 return `<div class="m">${chip(n,true)}${n.study?` · ${esc(studyOf(n))}`:''}${n.panel?` · ${esc(n.panel)}`:''}${prov(n)}</div>${n.type==='SourceDocument'?`<p class="sum">${esc(n.description)}</p>`:`<h3>${esc(n.text)}</h3>`}${n.notes?`<p class="q">${esc(n.notes)}</p>`:''}
 <div class="figrow"><div>${n.text.includes(n.anchor)?'':`<p class="q">“${esc(n.anchor)}”</p>`}<p class="m">${n.doi?`<a href="${n.doi.startsWith("http")?esc(n.doi):"https://doi.org/"+esc(n.doi)}" target="_blank">doi:${esc(n.doi.replace(/^https?:\/\/doi\.org\//,""))} ↗</a>`:''}${n.figure?`${n.doi?' · ':''}<a href="${esc(n.figure.page)}" target="_blank">${esc(n.panel)} ↗</a>`:''}</p></div>${n.figure?`<a href="${esc(n.figure.page)}" target="_blank">${IMG(n.figure.thumbnail,esc(n.panel))}</a>`:''}</div>${verifyBadges(n.id)}<ul>${rel(outs[n.id],'out')}${rel(ins[n.id],'in')}</ul>`}
function closeDrawer(d){const r=d.previousElementSibling;r?.classList.remove('open');d.remove()}

const evidenceFor=c=>(ins[c.id]||[]).filter(e=>N[e.subject]?.type==='Evidence').map(e=>({e:N[e.subject],rel:e.relation}));
const children=c=>{const grp=(label,xs)=>xs.length?`<div class="grp">${label}</div>${xs.map(e=>row(e,0)).join('')}`:'';
 if(c.type==='Study'){const ps=(outs[c.id]||[]).filter(e=>e.relation==='follows').map(e=>N[e.object]);const ne=(outs[c.id]||[]).filter(e=>e.relation==='grounds').length;return grp('protocols',ps)+`<p class="m">grounds ${ne} pieces of evidence, listed under the claims they bear on</p>`}

 if(c.type!=='Claim')return'';const interp=c.subtype?[]:(outs[c.id]||[]).filter(e=>e.relation==='supports'&&N[e.object].type==='Claim'&&!N[e.object].subtype).map(e=>N[e.object]);const ev=evidenceFor(c);const own=x=>!['Check','Cited'].includes(x.e.subtype);const sup=ev.filter(x=>x.rel==='supports'&&own(x)),opp=ev.filter(x=>x.rel==='opposes'&&own(x)),chk=ev.filter(x=>x.e.subtype==='Check'),cit=ev.filter(x=>x.e.subtype==='Cited');

let tree='';for(const q of G.nodes.filter(n=>n.type==='Question')){
 const addr=(ins[q.id]||[]).filter(e=>e.relation==='addresses').map(e=>N[e.subject]);

const reqs=G.nodes.filter(n=>n.type==='Request');if(reqs.length)tree+=`<section class="qb"><h2>What the authors call for next</h2>${reqs.map(r=>row(r,1)).join('')}</section>`;

const badEdges=(V.edges||[]).filter(e=>!e.ok);
document.getElementById('checks').innerHTML=`<p><b>${S.passed??'?'} of ${S.nodes??'?'} nodes pass every check</b> · ${S.edges??'?'} edges${badEdges.length?`, <span style="color:var(--A)">${badEdges.length} illegal</span>`:', all legal'} · anchors checked against ${(S.text_chars||0).toLocaleString()} characters of the article as eLife Pathways serves it.</p>
<p class="s">Checks: <b>shape</b> (id, type, text) · <b>summary</b> (questions, claims and requests: one or two plain sentences) · <b>anchor</b> (verbatim in the text) · <b>evidence</b> (grounded in a study or a cited source, names its panel) · <b>figure</b> (a figure panel links to its figure) · <b>structure</b> (every claim reaches a question; every piece of evidence argues something).</p>
${rows?`<table><thead><tr><th>node</th><th>text</th><th>failing</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>No node fails a check.</p>'}`;

document.getElementById('about').innerHTML=`<div class="about"><h2>About this graph</h2>
<p>A MIRA claims graph of <i>${esc(G.paper?.title||'')}</i> (eLife ${esc(G.paper?.doi||'')}, Reviewed Preprint version 2). Version ${esc(G.version||'')}, ${esc(G.date||'')}. Built with Claude (Anthropic) and reviewed by Zachary F. Mainen, Champalimaud Research.</p>
<h3>What is in it</h3>
<ul><li>Questions, claims, evidence, studies, protocols, requests and source documents, using MIRA's node types and relations.</li>
<li>Every node is anchored to a verbatim passage of the article text. The main findings are also anchored in the abstract.</li>
<li>Every question, claim and request has a summary of one or two sentences.</li>
<li>Evidence names its study and its figure panel, table or section. Every panel of Figures 1–5, Table 1 and Supplementary Figure 2 is covered.</li>
<li>Cited findings carry the reference and DOI of the work they come from.</li></ul>
<h3>What is new</h3>
<p>Four subclasses, declared with MIRA's <code>NodeSchema</code> mechanism so that other MIRA tools read them as ordinary claims and evidence:</p>
<ul><li><b>Hypothesis</b> — a claim the authors set out to test.</li>
<li><b>Alternative</b> — a rival explanation the paper raises; the evidence that argues against it is attached.</li>
<li><b>Check</b> — evidence that defends the method: a manipulation check, positive control or assumption test.</li>
<li><b>Cited</b> — a finding taken from another publication.</li></ul>
<h3>Checks</h3>
<p>All anchors are verbatim in the article text. All edges use MIRA relations between legal endpoint types. Every claim reaches a question; every piece of evidence supports or opposes a claim. The JSON-LD validates against MIRA's shapes, apart from two shape issues reported upstream.</p>
<h3>Files</h3>
<p><b>JSON</b>: the working-graph form the Pathways prototype loads. <b>JSON-LD</b>: the MIRA form, with the subclass declarations.</p></div>`;
