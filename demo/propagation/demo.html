<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Change Propagation — Headley et al. 2026</title>
<style>

    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e8eaf0;
    --muted: #8892a4;
    --accent: #4f8ef7;

    --col-direct: #e5534b;
    --col-transitive: #e58a7a;
    --col-unaffected: #3a3f52;
    --col-assessment: #5b6e9e;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;

    padding: 14px 24px;

    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  header .sub {
    font-size: 12px;
    color: var(--muted);
  }

  header a {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    margin-left: auto;
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── GRAPH ─── */
  #graph-panel {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg#graph {
    width: 100%;
    height: 100%;
  }

  .node circle {
    stroke-width: 2;
    cursor: pointer;
    transition: r 0.15s, stroke-width 0.15s;
  }
  .node circle:hover { stroke-width: 3; }
  .node.selected circle { stroke-width: 3.5; }

  .node text {
    font-size: 10px;
    fill: var(--text);
    pointer-events: none;
    dominant-baseline: middle;
  }

  .link {
    stroke: #3a3f52;
    stroke-opacity: 0.7;
    stroke-width: 1.5;
    fill: none;
    marker-end: url(#arrow);
  }

  .link.requires { stroke: #4a5068; }
  .link.supports  { stroke: #3a6068; stroke-dasharray: 5,3; }
  .link.extends   { stroke: #3a6068; stroke-dasharray: 2,2; }

  #sidebar {
    width: 340px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-section {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-section h2 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* Blast radius meter */
  .blast-meter {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .blast-number {
    font-size: 32px;
    font-weight: 700;
    color: var(--col-direct);
    line-height: 1;
  }

  .blast-label {
    font-size: 12px;
    color: var(--muted);
  }

  .blast-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }

  .blast-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .stat-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .stat-chip {
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;

  .chip-direct   { background: rgba(229,83,75,0.18); color: var(--col-direct); }
  .chip-transit  { background: rgba(229,138,122,0.18); color: var(--col-transitive); }
  .chip-changed  { background: rgba(245,166,35,0.18); color: var(--col-changed); }
  .chip-ok       { background: rgba(58,63,82,0.5); color: var(--muted); }

  /* Claim selector */

    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 10px;

    outline: none;
    margin-top: 2px;

  /* Claim list */

    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

    padding: 8px 20px;
    border-left: 3px solid transparent;

    transition: background 0.1s;

  .claim-item:hover { background: rgba(255,255,255,0.03); }
  .claim-item.active { background: rgba(255,255,255,0.04); }

  .claim-item.state-direct   { border-left-color: var(--col-direct); }
  .claim-item.state-transitive { border-left-color: var(--col-transitive); }

// ─── DATA ───────────────────────────────────────────────────────────────────

const CLAIMS = {

    panel: "fig4, fig5",
    belongings: [
      { relation: "requires", target: "l5-model-single-cell-scope" },
      { relation: "requires", target: "naturalistic-drive-parameterization" },

  "perisomatic-inhib-subtractive-divisive": {

    epistemic: "moderate",
    proposition: "Perisomatic inhibition reduces the gain (divisive) in addition to shifting the threshold (subtractive) of the input–output relationship.",
    panel: "fig5, fig6",

      { relation: "supports", target: "beta-bidirectional-dendritic-control" },

    panel: "fig6",

    panel: "fig10 (synthesis)",
    belongings: [
      { relation: "requires", target: "beta-optimal-distal-dendritic-entrainment" },
      { relation: "requires", target: "gamma-optimal-perisomatic-ap-modulation" },

    ]

};

const TOTAL = Object.keys(CLAIMS).length;

// ─── PROPAGATION LOGIC ───────────────────────────────────────────────────────

function buildForwardDAG(claims) {
  const forward = {};
  for (const slug of Object.keys(claims)) forward[slug] = new Set();

  for (const [slug, meta] of Object.entries(claims)) {
    for (const b of meta.belongings) {
      if (b.relation === "requires" || b.relation === "extends") {
        if (claims[b.target]) forward[b.target].add(slug);
      } else if (b.relation === "supports") {
        if (claims[b.target]) forward[slug].add(b.target);
      }
    }
  }
  return forward;
}

function bfsPropagate(changedSlug, forward) {
  const direct = new Set(forward[changedSlug] || []);
  const visited = new Set([changedSlug, ...direct]);
  const queue = [...direct];
  const transitive = new Set();

  while (queue.length) {
    const node = queue.shift();
    for (const neighbor of (forward[node] || [])) {
      if (!visited.has(neighbor)) {
        visited.add(neighbor);
        transitive.add(neighbor);
        queue.push(neighbor);
      }
    }
  }
  return { direct, transitive };
}

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
// Layered layout: assessment → empirical → interpretive
// Within each layer, order by slug for determinism

function computeLayout(claims, svgW, svgH) {
  const layers = {
    assessment: [],
    empirical: [],
    interpretive: [],
    synthesis: []
  };

  for (const [slug, meta] of Object.entries(claims)) {
    const t = meta.type;
    if (t === "assessment") layers.assessment.push(slug);
    else if (t === "interpretive" || t === "synthesis") layers.interpretive.push(slug);
    else layers.empirical.push(slug);
  }

  // Merge interpretive+synthesis
  const allLayers = [
    layers.assessment,
    layers.empirical,
    [...layers.interpretive, ...layers.synthesis]
  ].filter(l => l.length);

  const positions = {};
  const padX = 60, padY = 60;
  const usableH = svgH - 2 * padY;

  allLayers.forEach((layer, li) => {
    const x = padX + (li / (allLayers.length - 1 || 1)) * (svgW - 2 * padX);
    layer.sort();
    layer.forEach((slug, i) => {
      const y = padY + (layer.length === 1 ? usableH / 2 : (i / (layer.length - 1)) * usableH);
      positions[slug] = { x, y };
    });
  });

  return positions;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

const forward = buildForwardDAG(CLAIMS);
let currentChanged = "l5-model-single-cell-scope";
let currentState = {}; // slug → 'changed'|'direct'|'transitive'|'unaffected'

function computeState(changedSlug) {
  const { direct, transitive } = bfsPropagate(changedSlug, forward);
  const state = {};
  for (const slug of Object.keys(CLAIMS)) {
    if (slug === changedSlug) state[slug] = "changed";
    else if (direct.has(slug)) state[slug] = "direct";
    else if (transitive.has(slug)) state[slug] = "transitive";
    else state[slug] = "unaffected";
  }
  return { state, direct, transitive };
}

function nodeColor(s) {
  if (s === "changed")    return "var(--col-changed)";
  if (s === "direct")     return "var(--col-direct)";
  if (s === "transitive") return "var(--col-transitive)";
  return "var(--col-unaffected)";
}

function nodeStroke(slug, state) {
  const t = CLAIMS[slug].type;
  if (t === "assessment") return "#8899cc";
  if (state === "changed") return "#f5c842";
  if (state === "direct") return "#ff6b63";
  if (state === "transitive") return "#e59080";
  return "#555870";
}

let positions = {};
let svgW = 0, svgH = 0;

function initGraph() {
  const svg = document.getElementById("graph");
  svgW = svg.clientWidth || 900;
  svgH = svg.clientHeight || 600;
  positions = computeLayout(CLAIMS, svgW, svgH);
  renderGraph();
}

function renderGraph() {
  const svg = document.getElementById("graph");
  svg.innerHTML = `
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#3a3f52"/>
      </marker>
    </defs>`;

  const { state } = computeState(currentChanged);
  currentState = state;

  // Draw edges first (behind nodes)
  const edgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
  edgeGroup.setAttribute("class", "edges");

  const drawn = new Set();
  for (const [slug, meta] of Object.entries(CLAIMS)) {
    for (const b of meta.belongings) {
      const key = `${slug}→${b.target}`;
      if (drawn.has(key) || !positions[b.target]) continue;
      drawn.add(key);

      const src = positions[slug];
      const tgt = positions[b.target];

      // Curved path to avoid overlap
      const dx = tgt.x - src.x;
      const dy = tgt.y - src.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const r = 9; // node radius
      // Offset start/end by node radius along the direction
      const ux = dx / len, uy = dy / len;
      const x1 = src.x + ux * (r + 2);
      const y1 = src.y + uy * (r + 2);
      const x2 = tgt.x - ux * (r + 6);
      const y2 = tgt.y - uy * (r + 6);
      // Gentle curve
      const cx = (x1 + x2) / 2 - uy * 20;
      const cy = (y1 + y2) / 2 + ux * 20;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`);
      path.setAttribute("class", `link ${b.relation}`);
      path.setAttribute("marker-end", "url(#arrow)");

      // Highlight edge if it's in the blast path
      const srcState = state[slug];
      const tgtState = state[b.target];
      if ((srcState === "changed" || srcState === "direct" || srcState === "transitive") &&
          (tgtState === "direct" || tgtState === "transitive")) {
        path.setAttribute("stroke", "rgba(229,83,75,0.5)");
        path.setAttribute("stroke-opacity", "0.9");
        path.setAttribute("stroke-width", "2");
      }

      edgeGroup.appendChild(path);
    }
  }
  svg.appendChild(edgeGroup);

  // Draw nodes
  const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
  nodeGroup.setAttribute("class", "nodes");

  for (const [slug, meta] of Object.entries(CLAIMS)) {
    const pos = positions[slug];
    const s = state[slug];

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "node" + (slug === currentChanged ? " selected" : ""));
    g.setAttribute("transform", `translate(${pos.x},${pos.y})`);
    g.setAttribute("data-slug", slug);

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("r", slug === currentChanged ? 12 : 9);
    circle.setAttribute("fill", nodeColor(s));
    circle.setAttribute("stroke", nodeStroke(slug, s));
    circle.setAttribute("stroke-width", "2");
    g.appendChild(circle);

    // Label (abbreviated slug)
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    const words = slug.split("-");
    const abbr = words.slice(0, 2).join("-");
    label.textContent = abbr;
    label.setAttribute("x", "14");
    label.setAttribute("y", "0");
    label.setAttribute("font-size", "9");
    label.setAttribute("fill", s === "unaffected" ? "#555870" : "#c8cfe0");
    label.setAttribute("dominant-baseline", "middle");
    g.appendChild(label);

    // Events
    g.addEventListener("mouseenter", (e) => showTooltip(e, slug));
    g.addEventListener("mouseleave", hideTooltip);
    g.addEventListener("click", () => {
      currentChanged = slug;
      document.getElementById("claim-select").value = slug;
      updateAll();
    });

    nodeGroup.appendChild(g);
  }
  svg.appendChild(nodeGroup);
}

function showTooltip(e, slug) {
  const tt = document.getElementById("tooltip");
  const meta = CLAIMS[slug];
  tt.innerHTML = `
    <div class="tt-slug">${slug}</div>
    <div class="tt-prop">${meta.proposition.slice(0, 160)}${meta.proposition.length > 160 ? "…" : ""}</div>
    <div style="margin-top:5px;font-size:10px;color:var(--muted)">${meta.type} · ${meta.epistemic} · ${meta.panel}</div>
  `;
  tt.style.display = "block";
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById("tooltip");
  const panel = document.getElementById("graph-panel").getBoundingClientRect();
  let x = e.clientX - panel.left + 14;
  let y = e.clientY - panel.top - 10;
  if (x + 290 > panel.width) x = e.clientX - panel.left - 290;
  tt.style.left = x + "px";
  tt.style.top  = y + "px";
}

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
}

document.getElementById("graph-panel").addEventListener("mousemove", (e) => {
  if (document.getElementById("tooltip").style.display !== "none") moveTooltip(e);
});

// ─── SIDEBAR ──────────────────────────────────────────────────────────────────

function initSelect() {
  const sel = document.getElementById("claim-select");
  const groups = {
    "Assessment (model scope)": [],
    "Empirical results": [],
    "Interpretive / conclusion": []
  };
  for (const [slug, meta] of Object.entries(CLAIMS)) {
    if (meta.type === "assessment") groups["Assessment (model scope)"].push(slug);
    else if (meta.type === "interpretive" || meta.type === "synthesis") groups["Interpretive / conclusion"].push(slug);
    else groups["Empirical results"].push(slug);
  }
  for (const [label, slugs] of Object.entries(groups)) {
    if (!slugs.length) continue;
    const og = document.createElement("optgroup");
    og.label = label;
    slugs.sort().forEach(slug => {
      const opt = document.createElement("option");
      opt.value = slug;
      opt.textContent = slug;
      if (slug === currentChanged) opt.selected = true;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  }
  sel.addEventListener("change", () => {
    currentChanged = sel.value;
    updateAll();
  });
}

function updateStats(direct, transitive) {
  const n = direct.size + transitive.size;
  document.getElementById("stat-n").textContent = n;
  document.getElementById("stat-total").textContent = TOTAL;
  document.getElementById("stat-direct").textContent = `${direct.size} direct`;
  document.getElementById("stat-transit").textContent = `${transitive.size} transitive`;
  document.getElementById("blast-fill").style.width = `${(n / TOTAL) * 100}%`;

  // Alert if interpretive/conclusion claims affected
  const hasHigh = [...direct, ...transitive].some(slug =>
    CLAIMS[slug] && (CLAIMS[slug].type === "interpretive" || CLAIMS[slug].type === "synthesis")
  );
  document.getElementById("conclusion-alert").classList.toggle("visible", hasHigh);
}

function badgeHTML(type, epistemic) {
  return `<span class="badge badge-type-${type}">${type}</span><span class="badge badge-ep-${epistemic}">${epistemic}</span>`;
}

function updateClaimList(state) {
  const list = document.getElementById("claim-list");
  list.innerHTML = "";

  const order = ["changed", "direct", "transitive", "unaffected"];
  const groups = { changed: [], direct: [], transitive: [], unaffected: [] };
  for (const [slug, s] of Object.entries(state)) groups[s].push(slug);

  for (const grp of order) {
    groups[grp].sort().forEach(slug => {
      const meta = CLAIMS[slug];
      const item = document.createElement("div");
      item.className = `claim-item state-${grp}`;
      item.dataset.slug = slug;
      item.innerHTML = `
        <div class="claim-slug">${slug}</div>
        <div class="claim-prop">${meta.proposition}</div>
        <div class="claim-badges">${badgeHTML(meta.type, meta.epistemic)}</div>
      `;
      item.addEventListener("click", () => {
        currentChanged = slug;
        document.getElementById("claim-select").value = slug;
        updateAll();
      });
      list.appendChild(item);
    });
  }
}

function updateAll() {
  const { state, direct, transitive } = computeState(currentChanged);
  currentState = state;
  renderGraph();
  updateStats(direct, transitive);
  updateClaimList(state);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

window.addEventListener("load", () => {
  initSelect();
  initGraph();
  updateAll();
});

window.addEventListener("resize", () => {
  initGraph();
  updateAll();
});
</script>
</body>
</html>
