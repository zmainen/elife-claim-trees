name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd site && npm ci
      # Regenerates every data file, then builds. Previously this ran build-data.js twice —
      # once with CORPUS=elife, then again inside `npm run build`, which has no CORPUS set
      # and so discarded the first run's filter. It happened to be harmless because `elife`
      # is also build-data.js's default, but the env var was doing nothing.
      #
      # More seriously, no step here ever ran the Python generators. corpus-facts.json,
      # agents.json, review.json and mira-validation.json were whatever someone last
      # committed by hand, and the published site could describe a corpus that had moved on.
      - name: Build
        run: make build CORPUS=elife
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
