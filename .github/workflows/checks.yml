# What a pull request has to satisfy.
#
# The repository had one workflow — deploy — and it built the site from data files that were
# generated by hand and committed. Nothing regenerated them and nothing checked them, so the
# published numbers could drift from the corpus they describe with no signal anywhere.
#
# `make fresh` closes that: it regenerates everything and fails if the committed output
# changed. Verified to fail, not just to pass — flipping one claim's `epistemic` value and
# re-running exits 2 and names the files.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  data-freshness:
    name: Generated data matches the corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The generators are standard library only, by design — nothing to install for them.
      - run: cd site && npm ci
      - run: make fresh

  relations:
    name: Relations mean what they say
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make check

  mira:
    name: MIRA exports validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyshacl
      # Exits non-zero only for violations attributable to our encoding; the known upstream
      # generator bug is classified separately and does not fail the build.
      - run: make validate

  # Standing measurements of the corpus, not a gate. These are non-zero on main today —
  # 16 verification records assert more than their run supports — and that is a corpus
  # problem, not something a pull request should be blocked by. Surfaced so the numbers
  # are visible on every change rather than only when someone remembers to look.
  corpus-report:
    name: Corpus report (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make report
