# What a pull request has to satisfy.
#
# The repository had one workflow — deploy — and it built the site from data files that were
# generated by hand and committed. Nothing regenerated them and nothing checked them, so the
# published numbers could drift from the corpus they describe with no signal anywhere.
#
# `make fresh` closes that: it regenerates everything and fails if the committed output
# changed. Verified to fail, not just to pass — flipping one claim's `epistemic` value and
# re-running exits 2 and names the files.
#
# LAYOUT. The machinery lives in zmainen/claim-graphs, so every job checks out two
# repositories: this one into `elife-claim-trees/` and the machinery into `claim-graphs/`
# beside it. That is deliberately the same shape the Makefile documents as its default
# (`CLAIM_GRAPHS ?= ../claim-graphs`), so CI exercises the default rather than an override
# nobody else uses. It also means the machinery is checked out at the SHA in
# `.claim-graphs-sha`, and `make machinery-check` therefore tests the pin end to end: if the
# pin names a commit that does not exist, the checkout fails; if it names one that does, the
# gate that compares them cannot pass by accident.
#
# The four jobs are one matrix because they differed only in the target they run. The names
# are the sentences they always were.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # `report` is not a gate. It is non-zero on main today — 72 of 197 reproduction records do
    # not meet check_reproductions' strict gate — and that is a corpus problem, not something a
    # pull request should be blocked by. Surfaced so the numbers are visible on every change
    # rather than only when someone remembers to look. (An earlier version of this comment
    # blamed 16 records asserting more than their run supports; audit_verifications reports 0
    # of those now.)
    continue-on-error: ${{ matrix.soft || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Generated data matches the corpus
            target: fresh
            node: true
          - name: Relations mean what they say
            target: check
          # Exits non-zero only for violations attributable to our encoding; the known
          # upstream generator bug is classified separately and does not fail the build.
          - name: MIRA exports validate
            target: validate
          - name: Corpus report (informational)
            target: report
            soft: true
    defaults:
      run:
        working-directory: elife-claim-trees
    steps:
      - uses: actions/checkout@v4
        with:
          path: elife-claim-trees

      - name: Read the machinery pin
        id: pin
        run: echo "sha=$(cat .claim-graphs-sha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: zmainen/claim-graphs
          ref: ${{ steps.pin.outputs.sha }}
          path: claim-graphs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only `fresh` builds site data, and only that needs node. The Makefile's own
      # `$(SITE)/node_modules` rule runs `npm ci`, so there is no install step here — which
      # also means CI tests that rule instead of working around it.
      - uses: actions/setup-node@v4
        if: matrix.node
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elife-claim-trees/site/package-lock.json

      # Both lists. This corpus's scripts import machinery modules (corpus_facts reaches
      # claim_graphs.verdicts, export_mira and relations; article_json reaches
      # claim_graphs.sources), so the machinery's dependencies are this corpus's dependencies
      # too — but they are declared where the machinery is, not copied here.
      - run: pip install -r requirements.txt -r ../claim-graphs/requirements.txt

      - run: make ${{ matrix.target }}
