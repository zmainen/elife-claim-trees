# Scientopia: the research → publishing → funding loop as one process over one schema, with
# players. Teams write papers, funders select proposals, journals decide what to publish, and
# the library — which every team reads — grows with every publication. Every artifact is a
# claim set; every player is a file (its persona) plus whatever answers its requests: a
# person, a model, a team of both. The run records who.
#
# Steps with a command are run by the referee. Every other step waits for its player.
# Nothing here implements research, review or funding of substance; the shape is the point.

name: scientopia
subjects:
  library: {singleton: true}
  team:
    ids:
      juniper: {name: Juniper Lab, persona: personas/juniper.md}
      larch:   {name: Larch Group, persona: personas/larch.md}
  funder:
    ids:
      aurora:  {name: Aurora Foundation, persona: personas/aurora.md}
  journal:
    ids:
      meridian: {name: Meridian, persona: personas/meridian.md}
  process: {singleton: true}

steps:
  # ── the library: what everyone reads, and where publications go ──────────
  - id: import
    subject: library
    question: What does the field already hold?
    inputs: [seed/]
    command: python3 -m chain.agents.seed

  - id: catalogue
    subject: library
    question: What is there to read — imported work and every journal's publications?
    inputs: [import, journal:*:published]
    command: python3 -m chain.agents.compose sections "Seed corpus=import;Published=journal:*:published"

  # ── teams ─────────────────────────────────────────────────────────────────
  - id: question
    subject: team
    question: What is this team asking, having read the library?
    inputs: [library:import, journal:*:published]        # the library's holdings: what a team may cite
    instructions: instructions/question.md
    emits: [question, scope]

  - id: hypotheses
    subject: team
    question: What answers does the team bet on, and what would each predict?
    inputs: [question]
    instructions: instructions/hypotheses.md
    emits: [hypothesis, prediction]

  - id: design
    subject: team
    question: What would be measured, how, and within what limits?
    inputs: [question, hypotheses]
    instructions: instructions/design.md
    emits: [method, scope]

  - id: proposal
    subject: team
    question: "The proposal, composed."
    inputs: [question, hypotheses, design]
    command: python3 -m chain.agents.compose sections "Question=question;Hypotheses and predictions=hypotheses;Design=design"

  - id: award
    subject: team
    question: What did the funders decide about this team's proposal?
    inputs: [funder:*:select]
    command: python3 -m chain.agents.compose about-me "Decisions=funder:*:select"

  - id: study
    subject: team
    question: What was found, and what does it mean for the predictions?
    inputs: [award, hypotheses, design]
    instructions: instructions/study.md
    emits: [result, interpretation, scope]

  - id: paper
    subject: team
    question: "The paper, composed."
    inputs: [question, hypotheses, design, study]
    command: python3 -m chain.agents.compose sections "Introduction=question,hypotheses;Methods=design;Results=study"

  # ── funders ───────────────────────────────────────────────────────────────
  - id: call
    subject: funder
    question: What does this funder want to see proposed?
    inputs: [library:import, journal:*:published]
    instructions: instructions/call.md
    emits: [scope]

  - id: select
    subject: funder
    question: Which proposals are funded?
    judges: team:*:proposal
    inputs: [call, team:*:question, team:*:hypotheses, team:*:design]
    instructions: instructions/select.md
    verdicts: [fund, decline]

  # ── journals ──────────────────────────────────────────────────────────────
  - id: submissions
    subject: journal
    question: Which papers have been submitted?
    inputs: [team:*:paper]
    command: python3 -m chain.agents.compose sections "Submitted=team:*:paper"

  - id: review
    subject: journal
    question: Does the evidence support each claim each paper makes?
    judges: team:*:paper
    inputs: [submissions, team:*:question, team:*:hypotheses, team:*:design, team:*:study]
    instructions: instructions/review.md
    verdicts: [supported, weak, unsupported]

  - id: decision
    subject: journal
    question: Which papers are published?
    judges: team:*:paper
    inputs: [review]
    instructions: instructions/decision.md
    verdicts: [accept, reject]

  - id: published
    subject: journal
    question: "The published record: each accepted article with its reviews and decision."
    inputs: [decision, review, submissions, team:*:paper]
    command: python3 -m chain.agents.compose accepted decision review submissions

  # ── the process itself ────────────────────────────────────────────────────
  - id: scheme
    subject: process
    question: Should each of these steps exist, and is this what it should do?
    judges: process
    instructions: instructions/scheme.md
    verdicts: [accept, reject]
