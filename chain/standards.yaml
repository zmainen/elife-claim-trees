# Mappings from the core's vocabulary to standards, kept from step zero and exported with every
# artifact (`chain export`). Where a standard does not fit, the mapping says so rather than
# forcing it. Revise here, not in code: export.py reads this file.

contexts:
  prov: http://www.w3.org/ns/prov#
  schema: https://schema.org/
  cito: http://purl.org/spar/cito/
  mira: https://w3id.org/mira/           # eLife's model of research assertions (draft namespace)
  dg: https://discoursegraphs.com/ns#    # Discourse Graphs Q/C/E/S
  np: http://www.nanopub.org/nschema#
  intoto: https://in-toto.io/Statement/v1
  docmaps: https://w3id.org/docmaps/context.jsonld

# ── the process and its records ─────────────────────────────────────────────
process:
  bpmn: Process. A step with a command → serviceTask; a step a player answers → userTask or a serviceTask with an agent implementation, depending on who plays. BPMN has no notion of content-hashed inputs.
  cwl: Workflow, for command steps only — CWL has no task that waits for a player and no notion of a pending answer.
  docmaps: a DocMap is a manifest of steps with inputs, actions and outputs; our process is the template and a subject's ledger is one DocMap.
step:
  bpmn: task
  cwl: CommandLineTool (command steps)
  docmaps: step (with `inputs`, `actions`, `assertions`)
run:
  prov: Activity — `prov:used` each input, `prov:generated` the version, `prov:wasAssociatedWith` the answerer
  intoto: Link / Statement — materials = `in`, products = `out`, functionary = `by`; unsigned here
  docmaps: action, with the answerer as participant
version:
  prov: Entity, `prov:wasRevisionOf` the previous version, `prov:wasDerivedFrom` each input
  ro-crate: a Dataset; the version directory can carry ro-crate-metadata.json as-is
  docmaps: output
answerer:
  prov: a command → SoftwareAgent; a player → Agent, refined to Person or SoftwareAgent by what the run's `by` names
  bpmn: serviceTask / userTask
  credit: a person's role can carry a CRediT term (Investigation, Supervision, …) in `by`

# ── the claim schema ────────────────────────────────────────────────────────
types:
  question:       {dg: Question, mira: ResearchQuestion, schema: Question}
  hypothesis:     {dg: Claim, mira: Hypothesis, schema: Claim}
  prediction:     {dg: Claim, mira: Prediction, note: "DG has no prediction; it is a Claim entailed by another"}
  method:         {mira: Method, schema: HowTo, note: "DG has no method node; methods are attributes of Evidence"}
  result:         {dg: Evidence, mira: Result, schema: Observation}
  interpretation: {dg: Claim, mira: Interpretation, schema: Claim}
  scope:          {mira: Scope, note: "DG and schema.org have no scope node; exported as a Claim with a scope flag"}
  assessment:     {schema: Review, mira: Assessment, docmaps: assertion, np: Assertion about an assertion}
  decision:       {docmaps: assertion (status), schema: "Review/reviewRating for editorial; Grant/funder for funding", note: "no standard node for a decision as such; the verdict travels as a status"}
  step:           {docmaps: step, note: "only appears in a ruling on the process"}
relations:
  answers:      {mira: answers, dg: "Claim → Question (implicit)"}
  derived-from: {cito: derives, mira: entails (inverse), dg: "Claim → Claim"}
  tests:        {mira: tests, cito: "none — tests is neutral; do not map to supports"}
  supports:     {cito: supports, dg: supports, mira: supports}
  contradicts:  {cito: disputes, dg: opposedBy, mira: opposes}
  part-of:      {schema: isPartOf, mira: partOf}
  replicates:   {cito: confirms, mira: replicates, note: "cito:confirms is the nearest; it overstates"}
  cites:        {cito: cites, schema: citation}
  assesses:     {cito: reviews, schema: itemReviewed (inverse), docmaps: "assertion about an output"}
  decides:      {docmaps: "assertion status", note: "no CiTO term; exported as schema:about on the decision"}
compositions:
  proposal: {schema: Grant (proposed), note: "no widely used proposal document schema; JATS and OXA carry the text"}
  paper:    {oxa: Article, jats: article, schema: ScholarlyArticle, mira: "the claim graph, via export_mira"}
  review:   {schema: Review, docmaps: "review action output", prc: "eLife assessment vocabulary for verdict terms"}
  decision: {docmaps: "step assertion", schema: "Review with reviewRating, or Grant"}
