# The pipeline, declared.
#
# A layer is a node in a versioned processing graph: it runs against a paper (or across the
# corpus), consumes declared inputs, and produces a new version of something. This file is the
# only place the graph is written down. Everything else — the state matrix, the site's
# navigation, staleness, propagation — is computed from it.
#
# Design note: docs/design/2026-09-11-layers-as-pipeline.html
#
# FIELDS
#   id          stable identifier, used in paths and the ledger
#   group       optional parent; a group is a layer with children, not a display convention
#   kind        step | candidate | judgement | feature | question
#   scope       paper | corpus
#   question    what this layer asks. Not a description of what it does — the question is what
#               makes a layer worth being a layer.
#   needs       layer ids this depends on. Staleness flows along these edges.
#   reads       paths that are inputs but not other layers' outputs: scripts, prompts, schema.
#               Hashed like any input, so changing a prompt makes every run that used it stale.
#   produces    paths this writes. `{paper}` is substituted per paper.
#   views       how a version of this layer can be looked at
#   command     what runs it. `{paper}` and `{doi}` substituted. Absent means no runner exists.
#   by_from     a key in the first produced file holding who answered — the model, for a layer
#               a model answers. The runner reads it into the ledger's `by`, because from
#               outside the command all it could otherwise record is that it invoked something.
#   added       when this layer entered the corpus. A layer is a revision as much as a step.
#   found       what it found, corpus-wide. `{{token}}` is filled from corpus-facts.json at
#               build, and an unknown token fails the build — the same convention docs/method.md
#               uses, and for the same reason: every stale number this site shipped was one
#               somebody typed into a page.
#
# KINDS
#   step        mechanical, re-runnable from declared inputs
#   candidate   one of several parallel outputs, kept rather than collapsed
#   judgement   a decision by a person or an agent, stored because recomputing destroys it
#   feature     a capability that revises existing artifacts; runs once, then it is the schema
#   question    a decision about meaning, then a propagation of it
#
# APPROVAL IS NOT A KIND
#   Review is not a layer. It is an operation on a *version*: a person reads what a layer
#   produced and approves that version, and the approval names the version it was given to.
#   When the layer runs again the approval does not follow — it was granted to text that no
#   longer exists. Approvals live in runs/<paper>/approvals.jsonl, apply to any layer, and are
#   empty for every cell in this corpus, which is what "no human has checked this" is when it
#   is a fact about the data rather than a sentence in a preface.
#
#   `scripts/pipeline.py approve <paper> <layer> --by NAME` is what writes one. Until it
#   existed the file had no writer at all, and the CLI's `--review-mode interactive` gate ran
#   before the write — so what a curator approved was a draft table, while the version that
#   reached the corpus was whatever the write step then made of it, which nobody had seen.

version: 1

groups:
  induction:
    title: Induction
    question: What did the readers find, and what survived reconciliation?
  interchange:
    title: Interchange
    question: What survives when a claim tree leaves this format?

layers:

  # ── corpus scope ───────────────────────────────────────────────────────────
  # These have edges into almost everything below, which is why a schema decision is
  # never a small change.

  - id: claim-format
    kind: feature
    scope: corpus
    title: Claim format
    question: What is a claim, and what may be said about one?
    reads: [docs/claim-format.md]
    views: [document]

  - id: relation-vocab
    kind: question
    scope: corpus
    title: Relation semantics
    question: What does each relation assert, and which are oppositions?
    needs: [claim-format]
    reads: [scripts/relations.py, scripts/check_relations.py, exports/claim-relations.ttl]
    views: [table, comparison]
    issue: 19
    open: true                 # no decision yet; everything downstream is provisional

  - id: epistemic-vocab
    kind: question
    scope: corpus
    title: Epistemic vocabulary
    question: Does `epistemic` record support strength, or restate the role?
    needs: [claim-format]
    views: [table]
    issue: 20
    open: true

  # Declared `proposed`: the question is open, the rule that answers it mechanically exists
  # and runs, and nothing has been accepted. That is a different state from `relation-vocab`'s
  # `open: true`, which says a decision is outstanding but carries no machinery to evaluate —
  # here the rule's behaviour across the whole corpus is the thing to be reviewed.
  - id: prediction-outcome
    kind: question
    scope: corpus
    status: proposed
    title: Prediction outcomes
    question: Did the paper's predictions come out, and does the tree say so?
    needs: [claim-format, relation-vocab]
    reads: [scripts/prediction_outcome.py]
    produces: [review/prediction-outcome.json]
    views: [table]
    issue: 28
    open: true
    added: "2026-09-11"
    found: >
      `tests` is neutral by design, so a tree can record that a prediction was tested and never
      whether it was met. Of {{prediction_outcome_total}} predictions, {{prediction_outcome_unrecorded}} carry a `tests` edge
      and no outcome at all. Three wiring conventions are in use and they split by paper, not by
      case. And the vocabulary is asymmetric: `confirms` exists, nothing means "the result came
      out against this", so a failed prediction cannot be written down.
    command: "python3 scripts/prediction_outcome.py --write"

  # ── induction ──────────────────────────────────────────────────────────────
  # Fans in: three readers given different slices, reconciled to one draft. The three are
  # `candidate` rather than `step` because keeping them apart is the point — agreement
  # between them is the informative case, and collapsing them loses it.

  # What the readers read. A layer because otherwise their only declared input is a prompt,
  # and the paper itself — which eLife revises — would not be hashed by anything. The fetch
  # is cached, so running this per reader costs one file read.
  - id: prepare
    group: induction
    kind: step
    scope: paper
    title: Prepared paper
    question: What text did the readers actually read?
    reads: [extract/elife_extract/prepare.py]
    produces: ["runs/{paper}/prepared.json"]
    views: [document]
    command: "cd extract && python3 -m elife_extract.cli prepare --paper {paper} --doi {doi}"

  - id: results-reader
    group: induction
    kind: candidate
    scope: paper
    title: Results reader
    question: What does the Results section assert?
    needs: [prepare]
    reads: [extract/prompts/results-reader.md]
    produces: ["runs/{paper}/results-reader.output.json"]
    views: [list, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli results-reader --paper {paper}"

  - id: caption-reader
    group: induction
    kind: candidate
    scope: paper
    title: Caption reader
    question: What do the figure captions assert?
    needs: [prepare]
    reads: [extract/prompts/caption-reader.md]
    produces: ["runs/{paper}/caption-reader.output.json"]
    views: [list, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli caption-reader --paper {paper}"

  - id: structure-reader
    group: induction
    kind: candidate
    scope: paper
    title: Structure reader
    question: What is the paper's argument structure?
    needs: [prepare]
    reads: [extract/prompts/structure-reader.md]
    produces: ["runs/{paper}/structure-reader.output.json"]
    views: [list, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli structure-reader --paper {paper}"

  - id: reconcile
    group: induction
    kind: step
    scope: paper
    title: Reconciliation
    question: Which candidates survive, and which readers agreed?
    needs: [results-reader, caption-reader, structure-reader]
    reads: [extract/prompts/reconciler.md]
    produces: ["runs/{paper}/reconciler.output.json"]
    views: [table, overlap]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli reconcile --paper {paper}"

  # Was `--review-mode external`, a flag. It is not review in this file's sense: it changes
  # the artifact, and it runs before the version it would have approved exists. It is a step
  # that took the name of the curator's seat in the eight-step methodology. Declared, it
  # earns what the flag could not — edit the reviewer prompt and every tree built on it is
  # stale, computed rather than remembered.
  - id: external-review
    group: induction
    kind: step
    scope: paper
    title: External review
    question: What structure did the three readers systematically miss?
    added: "2026-09-11"
    needs: [reconcile]
    reads: [extract/prompts/external-reviewer.md]
    produces: ["runs/{paper}/external-review.output.json"]
    views: [table, comparison]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli external-review --paper {paper}"

  - id: edge-inference
    group: induction
    kind: step
    scope: paper
    title: Edge inference
    question: Which claims depend on which?
    needs: [reconcile, relation-vocab]
    reads: [extract/prompts/edge-inference.md]
    produces: ["runs/{paper}/edge-inference.output.json"]
    views: [graph, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli edge-inference --paper {paper}"

  # ── the tree, and what revises it ──────────────────────────────────────────

  - id: claim-tree
    kind: step
    scope: paper
    title: Claim tree
    question: What does this paper assert, and how do its assertions depend on each other?
    added: "2026-03"
    found: >
      Across {{papers}} papers the corpus holds {{claims}} claims and {{relations}} typed relations, using {{relation_types_used}} of the {{relation_types_defined}} defined relation types. The commonest role is `{{largest_role}}` at {{largest_role_n}} claims.
    needs: [reconcile, external-review, edge-inference, claim-format]
    produces: ["claims/{paper}/*.md"]
    views: [graph, list, table]
    command: "cd extract && python3 -m elife_extract.cli write --paper {paper}"

  - id: stance
    kind: feature
    scope: paper
    title: Alternatives and stance
    question: What does this paper rule out, and what does it merely entertain?
    added: "2026-09-10"
    found: >
      A missing node does not only lose information, it misdirects the edges that would have pointed at it. Five eliminative relations were found aiming at claims their own paper asserts. {{dangling_rules_out}} eliminative edges still name prose that resolves to no claim.
    needs: [claim-tree, claim-format]
    produces: ["claims/{paper}/alt-*.md"]
    views: [graph, list]

  # Resolves the literature-context claims against CrossRef and writes the DOIs it confirms
  # back into the claim files. A `feature` for the same reason `stance` is one: it revises
  # artifacts that already exist rather than producing a new kind of thing.
  #
  # It also closes a gap. Two implementations of this existed — scripts/verify-references.py,
  # which wrote docs/reference-verification.json, and the CLI's verify_refs, which printed to
  # the terminal and kept nothing. The count the site quoted came from the first; the second
  # is what anyone actually ran. Both edited the same claim files. Both are gone, along with
  # that report — it described 13 papers of a corpus of 10 and recorded a fuzzy title match
  # as a confirmed DOI. The layer produces the record now, and the report is a version.
  #
  # The confirmed DOIs still land in the claim files — that is what the layer is for — but the
  # report is what it `produces`. Declaring the claim files too would make this cell read
  # `unrecorded` for every paper before it had ever run, because the files are already there.
  - id: reference-check
    kind: feature
    scope: paper
    title: Reference check
    question: Do the cited references resolve, and to what?
    added: "2026-09-11"
    needs: [claim-tree]
    reads: [extract/elife_extract/verify_refs.py]
    produces: ["runs/{paper}/reference-check.output.json"]
    views: [table]
    command: "cd extract && python3 -m elife_extract.cli verify-refs --paper {paper}"

  - id: abstract-map
    kind: step
    scope: paper
    title: Abstract ↔ claims
    question: Which claims does the abstract carry, and which does it drop?
    needs: [claim-tree]
    produces: ["site/src/data/abstract-mapping/{paper}.json"]
    views: [document, comparison]

  # ── measures ───────────────────────────────────────────────────────────────

  - id: verification
    kind: step
    scope: paper
    title: Verification
    question: Did anyone check, and what did they find?
    added: "2026-09-06"
    found: >
      {{eligible_with_record}} of {{eligible_claims}} claims that a re-run could settle carry a reproduction record, and their outcomes are not uniform. Observing the runs from outside also showed that most records were reached by reading a deposit rather than by running the paper's own script.
    needs: [claim-tree]
    reads: ["verification/{paper}/verify.py"]
    produces: ["verification/{paper}/provenance.json"]
    views: [graph, table, comparison]
    command: "python3 verification/audit_run.py {paper}"

  # The only layer that reads the paper again after induction, which is why it is the one
  # that can find what everything else missed.
  - id: coverage
    kind: step
    scope: paper
    title: Coverage
    question: What does the paper assert that no claim represents?
    added: "2026-09-10"
    found: >
      Gädeke first. The paper cut into spans and each adjudicated against the claim tree, which is how a tree is measured against its paper rather than against another tree. The mechanical match left 36 spans unaccounted for; 22 were the matcher being wrong and 14 were real.
    needs: [claim-tree, prepare]
    produces: ["coverage/{paper}.json"]
    views: [document, table]
    command: "cd extract && python3 -m elife_extract.cli coverage --paper {paper} --json ../coverage/{paper}.json"

  - id: adjudication
    kind: judgement
    scope: paper
    title: Coverage adjudication
    question: Of the spans the matcher could not resolve, which are real gaps?
    needs: [coverage]
    reads: [extract/prompts/coverage-adjudicator.md]
    produces: ["mappings/{paper}.json"]
    views: [table]
    reviews: coverage

  - id: marks
    kind: step
    scope: paper
    title: Marked paper
    question: Where, in the document itself, is each claim and each gap?
    needs: [adjudication, claim-tree, prepare]
    produces: ["marked/{paper}.marked.md"]
    views: [document]
    command: "cd extract && python3 -m elife_extract.cli mark --paper {paper} --mapping ../mappings/{paper}.json -o ../marked/{paper}.marked.md"

  # Distinct from verification, which re-runs the authors' own deposited code against their
  # own data. Replication asks whether an independent study found the same thing — a different
  # question, with a different kind of evidence, and one this corpus has never asked. The
  # `replicates` relation is defined in the schema and used zero times. Declared so that the
  # gap is a column rather than an omission.
  - id: replication
    kind: step
    scope: paper
    title: Replication
    question: Has an independent study found the same thing?
    needs: [claim-tree]
    views: [table, comparison]

  # ── interchange ────────────────────────────────────────────────────────────
  # Fans out: one tree into three encodings that never rejoin.

  - id: mira-export
    group: interchange
    kind: step
    scope: paper
    title: MIRA export
    question: What does the schema eLife reads carry, and what does it drop?
    added: "2026-09-09"
    found: >
      {{mira_carried}} of {{mira_relations}} relations reach the export, with {{mira_our_violations}} validation violations attributable to the encoding. The gaps that remain are specific: {{mira_lost}} paper-level scope relations the schema has no node for, and {{mira_verification_records}} verification records for which no interchange format has a node type at all.
    needs: [claim-tree, stance, relation-vocab]
    reads: [scripts/export_mira.py]
    produces:
      - exports/{paper}.mira.jsonld
      - exports/{paper}.mira-extended.jsonld
      - exports/{paper}.gap-report.md
    views: [graph, table]
    command: "python3 scripts/export_mira.py {paper}"

  - id: oxa-export
    group: interchange
    kind: step
    scope: paper
    title: OXA export
    question: What does the open document architecture carry?
    needs: [claim-tree, stance]
    reads: [extract/scripts/migrate_to_oxa.py]
    produces: ["exports/{paper}.oxa.json"]
    views: [table]
    command: "cd extract && python3 scripts/migrate_to_oxa.py ../claims/{paper} --output-dir ../exports"

  - id: dg-export
    group: interchange
    kind: step
    scope: paper
    title: Discourse Graphs export
    question: What does the Q/C/E/S ontology carry?
    needs: [oxa-export]
    reads: [extract/scripts/export_discourse_graphs.py]
    produces: ["exports/{paper}.dg.jsonld"]
    views: [graph, table]
    command: "cd extract && python3 scripts/export_discourse_graphs.py ../exports/{paper}.oxa.json --output ../exports/{paper}.dg.jsonld"

  - id: formats-report
    group: interchange
    kind: step
    scope: paper
    title: Formats comparison
    question: Measured from the exports, what did each conversion cost?
    needs: [mira-export, oxa-export, dg-export]
    reads: [scripts/formats_report.py]
    produces:
      - exports/{paper}.formats.md
      - exports/{paper}.formats.json
    views: [table, comparison]
    command: "python3 scripts/formats_report.py {paper}"
