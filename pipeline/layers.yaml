# The pipeline, declared.
#
# A layer is a node in a versioned processing graph: it runs against a paper (or across the
# corpus), consumes declared inputs, and produces a new version of something. This file is the
# only place the graph is written down. Everything else — the state matrix, the site's
# navigation, staleness, propagation — is computed from it.
#
# Design note: docs/design/2026-09-11-layers-as-pipeline.html
#
# FIELDS
#   id          stable identifier, used in paths and the ledger
#   group       optional parent; a group is a layer with children, not a display convention
#   kind        step | candidate | judgement | feature | question
#   scope       paper | corpus
#   question    what this layer asks. Not a description of what it does — the question is what
#               makes a layer worth being a layer.
#   needs       layer ids this depends on. Staleness flows along these edges.
#   reads       paths that are inputs but not other layers' outputs: scripts, prompts, schema.
#               Hashed like any input, so changing a prompt makes every run that used it stale.
#   produces    paths this writes. `{paper}` is substituted per paper.
#   views       how a version of this layer can be looked at. `list` and `table` are rendered
#               generically from whatever the layer produced; the rest name a view that lives
#               somewhere specific, and the layer page says where. A view named here and built
#               nowhere is reported as such rather than printed as a word.
#   how         how it works, in prose: what it is given, what it returns, and what it gets
#               wrong. `question` says why the layer exists; this says how it answers. Rendered
#               on the layer page above what it found. `{{token}}` is filled as in `found`.
#   doc         where the narrative documentation for this layer is, deep-linked to its
#               section. The layer page links it; it does not restate it.
#   command     what runs it. `{paper}` and `{doi}` substituted. Absent means no runner exists.
#   by_from     a key in the first produced file holding who answered — the model, for a layer
#               a model answers. The runner reads it into the ledger's `by`, because from
#               outside the command all it could otherwise record is that it invoked something.
#   added       when this layer entered the corpus. A layer is a revision as much as a step.
#   found       what it found, corpus-wide. `{{token}}` is filled from corpus-facts.json at
#               build, and an unknown token fails the build — the same convention docs/method.md
#               uses, and for the same reason: every stale number this site shipped was one
#               somebody typed into a page.
#
# KINDS
#   step        mechanical, re-runnable from declared inputs
#   candidate   one of several parallel outputs, kept rather than collapsed
#   judgement   a decision by a person or an agent, stored because recomputing destroys it
#   feature     a capability that revises existing artifacts; runs once, then it is the schema
#   question    a decision about meaning, then a propagation of it
#
# APPROVAL IS NOT A KIND
#   Review is not a layer. It is an operation on a *version*: a person reads what a layer
#   produced and approves that version, and the approval names the version it was given to.
#   When the layer runs again the approval does not follow — it was granted to text that no
#   longer exists. Approvals live in runs/<paper>/approvals.jsonl, apply to any layer, and are
#   empty for every cell in this corpus, which is what "no human has checked this" is when it
#   is a fact about the data rather than a sentence in a preface.
#
#   `scripts/pipeline.py approve <paper> <layer> --by NAME` is what writes one. Until it
#   existed the file had no writer at all, and the CLI's `--review-mode interactive` gate ran
#   before the write — so what a curator approved was a draft table, while the version that
#   reached the corpus was whatever the write step then made of it, which nobody had seen.

version: 1

groups:
  induction:
    title: Induction
    question: What did the readers find, and what survived reconciliation?
  interchange:
    title: Interchange
    question: What survives when a claim tree leaves this format?

layers:

  # ── corpus scope ───────────────────────────────────────────────────────────
  # These have edges into almost everything below, which is why a schema decision is
  # never a small change.

  - id: claim-format
    kind: feature
    scope: corpus
    title: Claim format
    question: What is a claim, and what may be said about one?
    doc: /pipeline/vocabulary/
    how: >
      One file per claim: a YAML frontmatter block over a markdown body, carrying a uuid, a slug,
      the claim sentence, a `claim-type` and a `role`, the concepts it touches, an `epistemic` mark,
      and an `assertions` list naming the paper that asserts it and with what stance. Relations are
      frontmatter keys whose values are other claims' slugs, so the graph lives in the same files as
      the claims and there is no separate edge store to fall out of step with them.

      Almost everything below reads or writes this, which is why a change here is never small. The
      document is a declared input of `relation-vocab` and `claim-tree` both, so editing it marks
      every tree in the corpus stale.
    reads: [docs/claim-format.md]
    views: [document]

  - id: relation-vocab
    kind: question
    scope: corpus
    title: Relation semantics
    question: What does each relation assert, and which are oppositions?
    doc: /pipeline/vocabulary/
    how: >
      `scripts/relations.py` holds the vocabulary once — which relations exist, what each asserts,
      which pairs are oppositions — after four scripts each kept their own copy of the list and the
      four disagreed. `check_relations.py` runs that vocabulary over the corpus and is the gate
      `make check` enforces.

      What is undecided is not the implementation but the semantics: whether `supports` and
      `consistent-with` assert different things, and whether opposition is one relation or several.
      Until issue #19 closes, every count and every export downstream is provisional in the precise
      sense that it would change if the answer did.
    needs: [claim-format]
    reads: [scripts/relations.py, scripts/check_relations.py, docs/schema-mapping/claim-relations.ttl]
    views: [table, comparison]
    issue: 19
    open: true                 # no decision yet; everything downstream is provisional

  - id: epistemic-vocab
    kind: question
    scope: corpus
    title: Epistemic vocabulary
    question: Does `epistemic` record support strength, or restate the role?
    how: >
      `epistemic:` appears in every claim file and means two things at once. On some claims it
      records how strongly the evidence supports the proposition. On others it restates the claim's
      role — a hypothesis marked `weak` because hypotheses are hypotheses, not because anything
      about the evidence was measured.

      Nothing runs here. There is no script and no output, which is what an open question looks like
      before anyone has built the machinery to evaluate it.
    needs: [claim-format]
    views: [table]
    issue: 20
    open: true

  # Declared `proposed`: the question is open, the rule that answers it mechanically exists
  # and runs, and nothing has been accepted. That is a different state from `relation-vocab`'s
  # `open: true`, which says a decision is outstanding but carries no machinery to evaluate —
  # here the rule's behaviour across the whole corpus is the thing to be reviewed.
  - id: prediction-outcome
    kind: question
    scope: corpus
    status: proposed
    title: Prediction outcomes
    question: Did the paper's predictions come out, and does the tree say so?
    how: >
      The rule is mechanical. For each `role: prediction` claim it looks at the edges pointing in
      and out, and sorts the prediction by the shape of that wiring: a `tests` edge with a
      `confirms` beside it, a `tests` edge alone, a conjunction of several. It reads the graph and
      nothing else — not the paper, and not whether the prediction was in fact met.

      That limit is the point of running it. Three wiring conventions are in use across the corpus
      and they split by paper rather than by case, so the buckets measure how the trees were written
      as much as what the papers found. Accepting the rule would mean accepting that reading, which
      is why the declaration is `proposed` and not accepted.
    needs: [claim-format, relation-vocab]
    reads: [scripts/prediction_outcome.py]
    produces: [review/prediction-outcome.json]
    views: [table]
    issue: 28
    open: true
    added: "2026-09-11"
    found: >
      `tests` is neutral by design, so a tree can record that a prediction was tested and never
      whether it was met. Of {{prediction_outcome_total}} predictions, {{prediction_outcome_unrecorded}} carry a `tests` edge
      and no outcome at all. Three wiring conventions are in use and they split by paper, not by
      case. And the vocabulary is asymmetric: `confirms` exists, nothing means "the result came
      out against this", so a failed prediction cannot be written down.
    command: "python3 scripts/prediction_outcome.py --write"

  # ── induction ──────────────────────────────────────────────────────────────
  # Fans in: three readers given different slices, reconciled to one draft. The three are
  # `candidate` rather than `step` because keeping them apart is the point — agreement
  # between them is the informative case, and collapsing them loses it.

  # What the readers read. A layer because otherwise their only declared input is a prompt,
  # and the paper itself — which eLife revises — would not be hashed by anything. The fetch
  # is cached, so running this per reader costs one file read.
  - id: prepare
    group: induction
    kind: step
    scope: paper
    title: Prepared paper
    question: What text did the readers actually read?
    doc: /docs/layers/#prepare--the-paper-the-readers-read
    how: >
      Fetches the paper and cuts it into the slices the three readers each get: the abstract, the
      Introduction, the Results, the Discussion, the figure and table captions, the methods and the
      appendices. It also builds a panel inventory — one line per figure and table, its panel ids
      and the head of its caption — and numbers the whole paper into the spans coverage segments,
      so a reader can cite the id in front of a sentence. For an eLife DOI that is JATS XML from the
      CDN, which gives labelled sections, typed figures and caption text; for anything else it is
      pdfplumber with regex section detection. Which path was taken is recorded in the output,
      because it constrains what the readers can possibly extract. The fetch is cached, so every
      later layer on the same paper runs offline and free.

      Check the slice sizes when a paper extracts badly. A short `results` almost always means
      section detection failed, and then all three readers read the wrong text and every claim below
      them is wrong for the same single reason.
    reads: [extract/elife_extract/prepare.py]
    produces: ["runs/{paper}/prepared.json"]
    views: [document]
    command: "cd extract && python3 -m elife_extract.cli prepare --paper {paper} --doi {doi}"

  # The paper as a document, rather than as four strings.
  #
  # `prepare` keeps what the three readers need — abstract, results, captions, methods — and
  # flattens everything else out: `results_text` is one string with the section headings glued
  # to the sentences that follow them. That is correct for a reader that is a model and useless
  # for a reader that is a person, and it is why the site has never shown the paper.
  #
  # It is declared beside `prepare` rather than folded into it because folding it in would edit
  # prepare.py, and every paper's `prepare` cell — and everything downstream of it — would go
  # stale for a change that affects no claim. It reads the same cached XML, calls no model, and
  # stamps no date, so it is free to re-run and byte-stable when it is.
  - id: article
    group: induction
    kind: step
    scope: paper
    title: Article
    question: What does the paper itself say, section by section?
    how: >
      Parses the cached JATS into the structure a page needs: the section tree with its
      headings, each paragraph with its inline markup and its cross-references, each figure with
      its caption and the image eLife serves, each table with its rows. The abstract is split
      into sentences here; the body's sentences are not, because those come from the marked
      paper, and splitting them twice by two rules would give the site two sentences to
      reconcile where the claim assignments are.

      Sub-articles are excluded. eLife's JATS carries the editor assessment, the referee reports
      and the author response inside the same document, each with a `<body>` of its own, and a
      search that reaches into them renders the reviews as part of the paper.
    added: "2026-09-11"
    needs: [prepare]
    reads: [scripts/article_json.py]
    produces: ["site/src/data/article/{paper}.json"]
    views: [document]
    command: "python3 scripts/article_json.py {paper}"

  - id: results-reader
    group: induction
    kind: candidate
    scope: paper
    title: Results reader
    question: What does the Results section assert?
    doc: /docs/layers/#the-three-readers
    how: >
      Given the abstract, the Introduction, the Results and the Discussion — preceded by a panel
      inventory, each sentence numbered by its span id, and nothing else: no captions, no methods,
      no figures — it returns candidate claims, each with a role, a claim type, the panel the
      inventory names, the span its evidence was quoted from, and the verbatim sentence it rests on.

      The partition is what makes it worth running separately. It is the only reader positioned to
      see the paper's argument as an argument, so it is the one asked for hypotheses, predictions
      and synthesis rather than for numbers — and the Introduction and Discussion are where the
      organising hypothesis and the literature-context premises are actually stated. It is also the
      reader most prone to flattening exactly that: where a paper derives a prediction from a
      hypothesis and then tests it, the easy output is one empirical claim, and the longest section
      of the prompt below exists to stop that.
    needs: [prepare]
    # A prompt is a task file and the contract: the vocabulary of roles, types, relations and
    # confidence, and the output schema, both generated from the code that defines them
    # (`elife-extract contract --write`). Every model layer lists what its runner composes,
    # and a test holds the two lists equal — so a definition cannot change without every run
    # that read the old one going stale.
    reads: [extract/prompts/results-reader.md, extract/prompts/contract/vocabulary.md, extract/prompts/contract/schema-candidate.md]
    produces: ["runs/{paper}/results-reader.output.json"]
    views: [list, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli results-reader --paper {paper}"

  - id: caption-reader
    group: induction
    kind: candidate
    scope: paper
    title: Caption reader
    question: What do the figure captions assert?
    doc: /docs/layers/#the-three-readers
    how: >
      Given the figure and table captions, panel by panel, it returns the quantitative claims
      anchored to the panel that shows them. It does not see the results prose, so it cannot lift a
      number out of a sentence that summarises one, and it does not see the methods, so it cannot
      invent how a measurement was made.

      Panel assignment is where the three readers most often disagree, and it is the standing
      failure the evaluation harness measures.
    needs: [prepare]
    reads: [extract/prompts/caption-reader.md, extract/prompts/contract/vocabulary.md, extract/prompts/contract/schema-candidate.md]
    produces: ["runs/{paper}/caption-reader.output.json"]
    views: [list, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli caption-reader --paper {paper}"

  - id: structure-reader
    group: induction
    kind: candidate
    scope: paper
    title: Structure reader
    question: What is the paper's argument structure?
    doc: /docs/layers/#the-three-readers
    how: >
      Given the methods, the supplements and the section structure, it returns what the paper frames
      as its own conclusions, together with the methodological capabilities and the scope conditions
      the other two readers have no text for. Scope claims — what a study does and does not cover —
      appear almost nowhere else in a paper, so a pipeline without this reader does not under-report
      them, it loses them.
    needs: [prepare]
    reads: [extract/prompts/structure-reader.md, extract/prompts/contract/vocabulary.md, extract/prompts/contract/schema-candidate.md]
    produces: ["runs/{paper}/structure-reader.output.json"]
    views: [list, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli structure-reader --paper {paper}"

  - id: reconcile
    group: induction
    kind: step
    scope: paper
    title: Reconciliation
    question: Which candidates survive, and which readers agreed?
    doc: /docs/layers/#reconcile--which-candidates-survive
    how: >
      Reads the three readers' outputs from disk and aligns them into one draft table. Each
      surviving claim carries which readers proposed it and the evidence each quoted, and a
      confidence that is a fact about agreement rather than about the world: `high` where more than
      one reader surfaced it, `contested` where they surfaced it differently, `single-source` where
      one did.

      This is the whole reason the readers run separately rather than as one pass over the paper.
      Agreement between three partitions is evidence; one agent reading everything produces a longer
      list and no way to tell which of it is load-bearing.
    needs: [results-reader, caption-reader, structure-reader]
    reads: [extract/prompts/reconciler.md, extract/prompts/contract/vocabulary.md, extract/prompts/contract/schema-draft.md]
    produces: ["runs/{paper}/reconciler.output.json"]
    views: [table, overlap]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli reconcile --paper {paper}"

  # Was `--review-mode external`, a flag. It is not review in this file's sense: it changes
  # the artifact, and it runs before the version it would have approved exists. It is a step
  # that took the name of the curator's seat in the eight-step methodology. Declared, it
  # earns what the flag could not — edit the reviewer prompt and every tree built on it is
  # stale, computed rather than remembered.
  - id: external-review
    group: induction
    kind: step
    scope: paper
    title: External review
    question: What structure did the three readers systematically miss?
    doc: /docs/layers/#external-review--what-the-readers-systematically-miss
    how: >
      One Opus pass over the reconciled draft with the paper beside it, recovering what prose-level
      extraction systematically under-covers: the `prediction` and `hypothesis` roles, and multi-
      panel claims collapsed onto a single panel. Roughly two dollars and three minutes a paper, and
      it moved role agreement on the Headley round-trip from about 65% to about 96%.

      It is not review in this file's sense — it is a second model, not a person, and it changes the
      artifact rather than approving a version of one. Running it is optional: `claim-tree` builds
      on this output where it exists and on the reconciled draft where it does not.
    added: "2026-09-11"
    needs: [reconcile]
    reads: [extract/prompts/external-reviewer.md, extract/prompts/contract/vocabulary.md, extract/prompts/contract/schema-draft.md]
    produces: ["runs/{paper}/external-review.output.json"]
    views: [table, comparison]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli external-review --paper {paper}"

  - id: edge-inference
    group: induction
    kind: step
    scope: paper
    title: Edge inference
    question: Which claims depend on which?
    doc: /docs/layers/#edge-inference--which-claims-depend-on-which
    how: >
      Given the draft's claims, numbered, it returns typed relations between them — the deductive
      spine, `entails` from a hypothesis to its predictions and `tests` back from the empirical
      result. Edges naming an unknown slug, or pointing at themselves, are dropped: an invented
      target is worse than a missing edge.

      `--dump-prompt` writes the exact request and exits, so that an analyst or a different model
      answers the question this layer would have asked rather than a paraphrase written from memory,
      and `--edges-json` feeds that answer back through the same validation. Edges are the part of a
      tree most easily lost to one failed call — every other stage can succeed and leave a paper
      with claims and no structure at all.
    needs: [reconcile, relation-vocab]
    reads: [extract/prompts/edge-inference.md]
    produces: ["runs/{paper}/edge-inference.output.json"]
    views: [graph, table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli edge-inference --paper {paper}"

  # ── the tree, and what revises it ──────────────────────────────────────────

  - id: claim-tree
    kind: step
    scope: paper
    title: Claim tree
    question: What does this paper assert, and how do its assertions depend on each other?
    doc: /docs/layers/#write--the-claim-tree
    how: >
      Assigns each surviving claim a slug and a UUID, attaches the edges `edge-inference` produced,
      and writes one markdown file per claim into `claims/<paper>/` with the paper's `index.md`
      beside them. It calls no model and needs no credentials — the reasoning already happened
      upstream — but it does need those edges. Run it without them and the claims are written with
      no structure, and it says so.

      It refuses to overwrite a non-empty paper directory. The claim files are edited afterwards by
      hand and by later layers, and a silent overwrite would discard work no ledger records. A run
      of this layer is by definition a new version, so the command passes `--replace`: it moves the
      current tree to runs/<paper>/claim-tree.v<N>/ — keeping every version's bytes addressable —
      then writes the new one and carries forward the `alt-` claims, `rules-out` edges and
      reproduction records the induction chain does not itself produce.
    added: "2026-03"
    found: >
      Across {{papers}} papers the corpus holds {{claims}} claims and {{parts}} parts, carrying {{relations}} typed relations, using {{relation_types_used}} of the {{relation_types_defined}} defined relation types. The commonest role is `{{largest_role}}` at {{largest_role_n}} claims.
    needs: [reconcile, external-review, edge-inference, claim-format]
    produces: ["claims/{paper}/*.md"]
    views: [graph, list, table]
    # `--replace`: a run of the layer is a new version, so it archives the current tree and
    # carries the other layers' content forward rather than refusing a non-empty directory.
    command: "cd extract && python3 -m elife_extract.cli write --paper {paper} --replace"

  - id: stance
    kind: feature
    scope: paper
    title: Alternatives and stance
    question: What does this paper rule out, and what does it merely entertain?
    how: >
      Adds the claims a paper argues against. Each is an ordinary claim file — prefixed `alt-` —
      whose `assertions` entry carries `stance: rejects` rather than `asserts`, so an alternative
      the paper rules out is a node in the graph like any other and an eliminative edge has
      something correct to point at.

      Before these existed, a rejected alternative lived only as prose inside the claim that
      dismissed it, and an edge that should have pointed at it pointed at whatever claim was
      nearest.
    added: "2026-09-10"
    found: >
      A missing node does not only lose information, it misdirects the edges that would have pointed at it. Five eliminative relations were found aiming at claims their own paper asserts. {{dangling_rules_out}} eliminative edges still name prose that resolves to no claim.
    needs: [claim-tree, claim-format]
    produces: ["claims/{paper}/alt-*.md"]
    views: [graph, list]

  # A question is not a claim — a claim is a declarative sentence — so it lives on the paper,
  # in `index.md`'s frontmatter, and each hypothesis and rejected alternative names the one it
  # answers with `addresses`. `write.py` records this at extraction time for a fresh tree; this
  # layer is the retrofit for the papers whose trees predate the field. A `feature` for the
  # reason `stance` is: it revises artifacts that already exist rather than making a new kind.
  - id: questions
    kind: feature
    scope: paper
    title: Research questions
    question: What did this paper set out to answer, and which claim answers each question?
    how: >
      Given the abstract (and the Introduction where the prepared paper carries it) and the
      paper's existing hypothesis and `alt-` claims — slug and sentence — it returns the
      questions the paper states and which claim answers which. A hypothesis is the answer the
      paper commits to; the alternatives it rules out are the other answers to the same
      question. It then writes `questions:` onto the paper's `index.md` and `addresses:` onto
      the named claim files, editing their frontmatter in place.

      `--dump-prompt` writes the exact request and exits, and `--answer` feeds a reply back
      through the same validation — an invented slug or a question no claim addresses is
      dropped rather than written — so a model that has no backend here can still answer it.
    added: "2026-09-11"
    needs: [claim-tree, prepare]
    reads: [extract/prompts/questions.md, extract/prompts/contract/vocabulary.md]
    produces: ["runs/{paper}/questions.output.json"]
    views: [table]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli questions --paper {paper}"

  # A claim tree has two grains. The coarse grain is the argument a reader follows; the fine
  # grain is every comparison, condition, measure and study the prose states on the way. A
  # `part-of` edge says one claim is a component of another — the whole is weakened but not
  # falsified by the part alone — and the page shows wholes by default with parts folded
  # beneath. `write.py` records this at reconciliation for a fresh tree; this layer is the
  # retrofit for trees induced before `part-of` existed. A `feature`, like `questions` and
  # `stance`: it revises a tree rather than making a new kind of thing.
  - id: parts
    kind: feature
    scope: paper
    title: Parts
    question: Which claims are components of other claims, and which whole does each belong to?
    how: >
      Reads the tree, not the paper — each claim's slug, role, panel, sentence and existing edges
      — and returns the `part-of` edges it holds: every claim that states one comparison,
      condition, measure or study of a proposition another claim states whole. The graph
      half-says composition already, since a part usually carries a `supports` or `tests` edge
      into its whole, but support is evidence and composition is not, so the definition decides,
      not the edge. It then writes `part-of:` into each part's claim file, editing the frontmatter
      in place.

      `--dump-prompt` writes the exact request and exits, and `--answer` feeds a reply back
      through the same validation — an unknown slug, a self-edge, a second whole for one part, or
      an edge that would close a cycle is dropped rather than written — so a model with no backend
      here can still answer it.
    added: "2026-09-11"
    needs: [claim-tree, relation-vocab]
    reads: [extract/prompts/parts.md, extract/prompts/contract/vocabulary.md]
    produces: ["runs/{paper}/parts.output.json"]
    views: [table, graph]
    by_from: model
    command: "cd extract && python3 -m elife_extract.cli parts --paper {paper}"

  # Resolves the literature-context claims against CrossRef and writes the DOIs it confirms
  # back into the claim files. A `feature` for the same reason `stance` is one: it revises
  # artifacts that already exist rather than producing a new kind of thing.
  #
  # It also closes a gap. Two implementations of this existed — scripts/verify-references.py,
  # which wrote docs/reference-verification.json, and the CLI's verify_refs, which printed to
  # the terminal and kept nothing. The count the site quoted came from the first; the second
  # is what anyone actually ran. Both edited the same claim files. Both are gone, along with
  # that report — it described 13 papers of a corpus of 10 and recorded a fuzzy title match
  # as a confirmed DOI. The layer produces the record now, and the report is a version.
  #
  # The confirmed DOIs still land in the claim files — that is what the layer is for — but the
  # report is what it `produces`. Declaring the claim files too would make this cell read
  # `unrecorded` for every paper before it had ever run, because the files are already there.
  - id: reference-check
    kind: feature
    scope: paper
    title: Reference check
    question: Do the cited references resolve, and to what?
    doc: /docs/layers/#verify-refs--the-reference-check
    how: >
      Two different operations under one name, and the difference is the whole of what this layer is
      worth. Where a `role: literature-context` claim already carries a top-level `doi:`, the layer
      confirms with CrossRef that it resolves to a real paper: that is the anti-hallucination check.
      Where there is no DOI, it extracts hints from the claim text and slug, queries CrossRef, and
      writes back the highest-scoring match above a threshold — a search, which can return a
      confident match to the wrong paper.

      The report is what the layer produces; the confirmed DOIs land in the claim files themselves.
      Two earlier implementations both edited those files and disagreed about the result, and one of
      them recorded a fuzzy title match as a confirmed DOI.
    added: "2026-09-11"
    needs: [claim-tree]
    reads: [extract/elife_extract/verify_refs.py]
    produces: ["runs/{paper}/reference-check.output.json"]
    views: [table]
    command: "cd extract && python3 -m elife_extract.cli verify-refs --paper {paper}"

  - id: abstract-map
    kind: step
    scope: paper
    title: Abstract ↔ claims
    question: Which claims does the abstract carry, and which does it drop?
    how: >
      Cuts the abstract into sentences and asks of each which claims carry it, and of each claim
      whether any sentence of the abstract does. The output holds both directions, and the
      interesting column is the empty one: claims the tree holds that the abstract drops, and
      abstract sentences no claim accounts for.

      An abstract is the paper's own summary of itself, so the difference between the two lists is
      the difference between what a paper found and what it advertises.
    needs: [claim-tree]
    produces: ["site/src/data/abstract-mapping/{paper}.json"]
    views: [document, comparison]

  # ── measures ───────────────────────────────────────────────────────────────

  # The paper's argument, restated from the graph alone and then held against its abstract.
  #
  # Declared late, and the lateness is the point. The artifact has existed for twelve papers
  # since the v3 run and no layer accounted for it, so it had a tab on the paper page and no
  # version, no ledger entry, and no way to go stale when the tree beneath it changed. An
  # output nothing declares is exactly the gap this pipeline exists to close, and it was open
  # here. It reports `unrecorded` until a run is logged: the files predate the ledger.
  - id: synthesis
    kind: step
    scope: paper
    title: Argument from graph
    question: Restated from the claim graph alone, what does this paper argue — and where does that part from its abstract?
    how: >
      Restates the paper's argument from the claim graph alone — no abstract, no prose — and then
      holds that restatement against the abstract the authors wrote. Every sentence of the
      restatement carries the claims and edges it was built from, so any of it can be followed back
      to the nodes that produced it.

      It is the closest thing in the pipeline to a test of whether the graph was worth building: if
      the tree carries the argument, a restatement from it should be recognisable as the same paper.
    added: "2026-09-11"
    needs: [claim-tree, abstract-map]
    produces: ["site/src/data/synthesis-v3/{paper}.json"]
    views: [document, comparison]

  # The paper in three paragraphs, written from its claim graph. It is the block at the top
  # of every paper page and probably the most-read thing the corpus produces, and no layer
  # declared it — the third undeclared output found by asking what the methodology described
  # that the pipeline did not.
  #
  # `produces` names one file for all papers rather than one per paper, which is how the
  # summaries are actually stored. The consequence is real and worth seeing: editing any
  # paper's summary changes the artifact every paper's cell reads, so they go stale together.
  - id: summaries
    kind: step
    scope: paper
    title: Paper summary
    question: What does this paper argue, in three paragraphs?
    needs: [claim-tree]
    produces: ["site/src/data/paper-summaries.json"]
    views: [document]

  # The wording a reader meets first.
  #
  # A claim is recorded in the authors' words, which is right — a paraphrase is not evidence of
  # anything. But those words lead with the statistics, and a page listing thirty of them has
  # told a non-specialist nothing. `shortClaim` was meant to be this and is filled for
  # hypotheses and predictions only; every empirical claim on the site falls back to the full
  # sentence, statistics first.
  #
  # It is a layer rather than a field somebody edits because it is model-written prose that a
  # reader will take for the paper's own. That is exactly the kind of text that needs a version,
  # a recorded run, an input hash that goes stale when the claim it restates changes, and a seat
  # for a person to approve it — none of which a field in a markdown file has.
  - id: plain-claim
    kind: step
    scope: paper
    title: Plain wording
    question: What does each claim say, in one sentence a non-specialist can read?
    how: >
      One call per paper: every claim of that paper — its role, its stance, its panel and the
      authors' wording — and back one sentence each, under about 130 characters, carrying no
      statistics. The terms of art the claim is *about* are kept, because a reader who does not
      know what the anterior insula is still learns the claim is about a brain region; the jargon
      that is about the analysis rather than the finding is translated.

      A validator gates the write: every slug answered and no slug invented, one sentence each,
      and none of the eight shapes a statistic takes. Nothing is written until it passes, so the
      artifact cannot hold a wording that quietly failed the rule the prompt states.

      `--dump-prompt` and `--answer` are the pair every layer a model answers carries, and the
      corpus's own wordings came through them: written by a model that is not the one wired in,
      fed back through the same validator, and recorded as `supplied:` rather than as a call
      that never happened.
    added: "2026-09-11"
    needs: [claim-tree]
    reads: [scripts/plain_claims.py, extract/prompts/plain-claim.md]
    produces: ["site/src/data/plain-claims/{paper}.json"]
    views: [list, table]
    by_from: model
    command: "python3 scripts/plain_claims.py {paper}"

  - id: verification
    kind: step
    scope: paper
    title: Verification
    question: Did anyone check, and what did they find?
    how: >
      Runs the paper's own deposited script under observation and records what it actually did —
      every path it opened, every value it computed — rather than what its output said it did.
      Nothing is taken from the script's own account of itself, because that is precisely what
      failed: the first script audited had a claim recorded `verified` while the function named in
      its record raised a shape-mismatch error, and a reproduction record naming a file the code
      never opened.

      This is not replication. It re-runs the authors' code on the authors' data, so it can catch a
      record that does not match its own run and it cannot tell you whether the finding is true.
    added: "2026-09-06"
    found: >
      {{eligible_with_record}} of {{eligible_claims}} claims that a re-run could settle carry a reproduction record, and their outcomes are not uniform. Observing the runs from outside also showed that most records were reached by reading a deposit rather than by running the paper's own script.
    needs: [claim-tree]
    reads: ["verification/{paper}/verify.py"]
    produces: ["verification/{paper}/provenance.json"]
    views: [graph, table, comparison]
    command: "python3 verification/audit_run.py {paper}"

  # The only layer that reads the paper again after induction, which is why it is the one
  # that can find what everything else missed.
  - id: coverage
    kind: step
    scope: paper
    title: Coverage
    question: What does the paper assert that no claim represents?
    doc: /docs/layers/#coverage-and-mark
    how: >
      Takes its denominator from the paper rather than from the claim set. It builds the paper's own
      inventories — every panel, every table, every reported statistic — cuts the whole text into
      one-sentence spans, and asks of each span whether any claim accounts for it. Comparing two
      claim sets cannot see what this sees: two trees can agree perfectly over a third of a paper.

      It calls no model, so it is free and fast enough to run corpus-wide. What it cannot do is tell
      a real gap from a string match that failed, which is what `adjudication` is for.
    added: "2026-09-10"
    found: >
      Gädeke first. The paper cut into spans and each adjudicated against the claim tree, which is how a tree is measured against its paper rather than against another tree. The mechanical match left 36 spans unaccounted for; 22 were the matcher being wrong and 14 were real.
    needs: [claim-tree, prepare]
    produces: ["coverage/{paper}.json"]
    views: [document, table]
    command: "cd extract && python3 -m elife_extract.cli coverage --paper {paper} --json ../coverage/{paper}.json"

  - id: adjudication
    kind: judgement
    scope: paper
    title: Coverage adjudication
    question: Of the spans the matcher could not resolve, which are real gaps?
    doc: /docs/layers/#coverage-and-mark
    how: >
      Reads the spans the mechanical match could not resolve and returns a verdict for each: the
      span is covered by a claim after all, it states a result no claim carries, or it asserts
      nothing at all. The verdicts are stored rather than recomputed — a verdict is a judgement
      about meaning, and re-running it would quietly produce a different one.

      On Gädeke the matcher left 36 spans unaccounted for. Adjudication found that 22 were the
      matcher being wrong and 14 were real.
    needs: [coverage]
    reads: [extract/prompts/coverage-adjudicator.md, scripts/adjudicate.py]
    produces: ["mappings/{paper}.json"]
    views: [table]
    reviews: coverage
    by_from: by
    # A judgement has no backend call to declare: `--dump-prompt` writes the question and
    # `--answer` takes the verdicts back, validated — every span judged and none invented, a
    # `covered` verdict naming a claim this paper actually holds, and each verdict stamped
    # with the fingerprint of the sentence it was made about. The command is the second half,
    # because the first half is somebody answering.
    command: "python3 scripts/adjudicate.py {paper} --answer runs/{paper}/adjudication.answer.json"

  - id: marks
    kind: step
    scope: paper
    title: Marked paper
    question: Where, in the document itself, is each claim and each gap?
    doc: /docs/layers/#coverage-and-mark
    how: >
      Writes the adjudicated verdicts into the document itself, as marks carrying each claim's UUID,
      so a gap is something a reader sees in the paper rather than a number in a report. A span that
      states no result says so; a span carrying a result no claim states is marked as a gap.

      The marks are read straight back after writing and checked against the assignments they were
      written from. A marked document that cannot reproduce them is not a record of anything.
    needs: [adjudication, claim-tree, prepare]
    produces: ["marked/{paper}.marked.md"]
    views: [document]
    command: "cd extract && python3 -m elife_extract.cli mark --paper {paper} --mapping ../mappings/{paper}.json -o ../marked/{paper}.marked.md"

  # Distinct from verification, which re-runs the authors' own deposited code against their
  # own data. Replication asks whether an independent study found the same thing — a different
  # question, with a different kind of evidence, and one this corpus has never asked. The
  # `replicates` relation is defined in the schema and used zero times. Declared so that the
  # gap is a column rather than an omission.
  - id: gap-claim
    kind: candidate
    question: What claim would close each gap?
    needs: [adjudication, claim-tree, claim-format]
    reads: [extract/prompts/gap-claim.md, scripts/gap_claims.py]
    produces: ["runs/{paper}/gap-claim.output.json"]
    by_from: model
    views: [table]
    command: "python3 scripts/gap_claims.py {paper} --answer runs/{paper}/gap-claim.answer.json"
    doc: >
      The edge back. Everything upstream of `marks` asks what this paper claims; `coverage` and
      `adjudication` then ask what it asserts that no claim represents, and until this layer
      existed the answer went into the marked document and stopped. The graph ended at the
      measurement, so a gap was something the corpus could report about itself and not
      something it could act on.

      Note what that cost, because it is the argument for this layer in one line:
      `external-review` asks "what structure did the three readers systematically miss?" — the
      same question — but it needs only `reconcile`, so it runs before the claim tree exists
      and answers from the candidates alone. The question was asked where it could only be
      guessed at, and not asked where it had been measured.

      This layer drafts the claim each gap needs and writes it as a candidate. It never writes
      to `claims/`: promoting a draft is a judgement about what a paper asserts, and this
      corpus already carries the warning that no person has checked any of it. A layer that
      wrote claim files would put a model's drafting inside the artifact that warning is
      about. `--dump-prompt` and `--answer` are the pair every model-answered layer carries.

      Promoting a draft makes the verdict that recorded the gap stale on its own: a `gap`
      verdict carries the fingerprint of which claims existed when it was judged, and the
      ledger notices a claim file that appeared. Neither was true before; between them they
      turn a report into a loop.

  - id: replication
    kind: step
    scope: paper
    title: Replication
    question: Has an independent study found the same thing?
    how: >
      Nothing runs here, and the layer is declared so that the absence is a column rather than an
      omission. The `replicates` relation is defined in the schema and used zero times: no claim in
      this corpus has been checked against an independent study.

      It is a different question from `verification`, answered by different evidence. Verification
      re-runs the authors' own code on their own data and can tell you the record matches the run.
      Only replication can tell you the finding holds.
    needs: [claim-tree]
    views: [table, comparison]

  # ── interchange ────────────────────────────────────────────────────────────
  # Fans out: one tree into three encodings that never rejoin.

  - id: mira-export
    group: interchange
    kind: step
    scope: paper
    title: MIRA export
    question: What does the schema eLife reads carry, and what does it drop?
    how: >
      Writes two files and a gap report. `<paper>.mira.jsonld` is strict MIRA core, safe to hand to
      any MIRA reader; `<paper>.mira-extended.jsonld` is the same graph plus a `haak:` namespace
      carrying the structure MIRA has no vocabulary for; the gap report says what the strict file
      dropped, and why.

      The split is the design rather than a compromise in it. MIRA can express roughly half of what
      a claim tree holds, and a single converted file either loses the other half quietly or emits
      something a strict reader rejects.
    added: "2026-09-09"
    found: >
      {{mira_carried}} of {{mira_relations}} relations reach the export, with {{mira_our_violations}} validation violations attributable to the encoding. The gaps that remain are specific: {{mira_lost}} paper-level scope relations the schema has no node for, and {{mira_verification_records}} verification records for which no interchange format has a node type at all.
    needs: [claim-tree, stance, relation-vocab]
    reads: [scripts/export_mira.py]
    produces:
      - exports/{paper}.mira.jsonld
      - exports/{paper}.mira-extended.jsonld
      - exports/{paper}.gap-report.md
    views: [graph, table]
    command: "python3 scripts/export_mira.py {paper}"

  - id: oxa-export
    group: interchange
    kind: step
    scope: paper
    title: OXA export
    question: What does the open document architecture carry?
    how: >
      Reads the claim files and writes the paper as one OXA Article JSON with a Claim node per
      claim. OXA is document-shaped rather than graph-shaped, so it keeps the text and the
      sectioning of a paper well and carries relations as properties of the nodes they leave.

      It is also the input to the Discourse Graphs export, so anything lost here is lost there too,
      one conversion further along.
    needs: [claim-tree, stance]
    reads: [extract/scripts/migrate_to_oxa.py]
    produces: ["exports/{paper}.oxa.json"]
    views: [table]
    command: "cd extract && python3 scripts/migrate_to_oxa.py ../claims/{paper} --output-dir ../exports"

  - id: dg-export
    group: interchange
    kind: step
    scope: paper
    title: Discourse Graphs export
    question: What does the Q/C/E/S ontology carry?
    how: >
      Maps the OXA nodes onto the Discourse Graphs Q/C/E/S ontology: hypothesis, prediction,
      synthesis and interpretation become `dg:Claim`; empirical and control become `dg:Evidence`;
      literature-context becomes `dg:Source`. A relation becomes `dg:supports` or `dg:opposedBy`
      where one of those fits, and carries its CiTO IRI as a typed annotation where neither does.

      Four node types for nine roles: the mapping is lossy by construction, and `formats-report` is
      where the amount is measured rather than asserted.
    needs: [oxa-export]
    reads: [extract/scripts/export_discourse_graphs.py]
    produces: ["exports/{paper}.dg.jsonld"]
    views: [graph, table]
    command: "cd extract && python3 scripts/export_discourse_graphs.py ../exports/{paper}.oxa.json --output ../exports/{paper}.dg.jsonld"

  - id: formats-report
    group: interchange
    kind: step
    scope: paper
    title: Formats comparison
    question: Measured from the exports, what did each conversion cost?
    how: >
      Measures each conversion from the generated files rather than from the mapping tables. A
      mapping table says what a converter intends; the export says what it did, and those two came
      apart once already — the Discourse Graphs exporter looked for claims one level above where
      they sit and wrote a file with a single node, in valid JSON-LD that nothing would have
      flagged.

      The markdown report is the artifact and the site renders it, so a figure on the page cannot
      disagree with the export it describes.
    needs: [mira-export, oxa-export, dg-export]
    reads: [scripts/formats_report.py]
    produces:
      - exports/{paper}.formats.md
      - exports/{paper}.formats.json
    views: [table, comparison]
    command: "python3 scripts/formats_report.py {paper}"
